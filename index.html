<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NILEFRONT</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87CEEB;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #hud{position:absolute;top:10px;left:10px;color:#fff;text-shadow:0 1px 2px #000;font-size:14px;z-index:2}
  #crosshair{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border-radius:50%;z-index:2;box-shadow:0 0 3px #000}
  #stats{position:absolute;top:8px;right:14px;color:#fff;text-shadow:0 1px 3px #000;font-size:20px;font-weight:700;z-index:2;letter-spacing:0.5px}
  #ammoBig{position:absolute;bottom:34px;right:28px;color:#fff;text-shadow:0 2px 6px #000;font-size:46px;font-weight:800;z-index:3;text-align:right;letter-spacing:1px}
  #ammoBig .max{font-size:22px;font-weight:700;opacity:0.75}
  #ammoBig.empty{color:#ff5a5a}
  #ammoBig.reloading{color:#ffd453;font-size:28px}
  #hpbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:420px;height:34px;background:rgba(0,0,0,0.55);border:3px solid rgba(255,255,255,0.85);border-radius:6px;z-index:3;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.6)}
  #hpfill{position:absolute;left:0;top:0;height:100%;width:100%;background:linear-gradient(#5be06a,#37b34a);transition:width 0.12s linear}
  #hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;text-shadow:0 1px 3px #000;z-index:1}
  #bossbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:620px;z-index:3;opacity:0;transition:opacity 0.3s;text-align:center}
  #bosslabel{color:#ff5566;font-size:22px;font-weight:800;text-shadow:0 1px 4px #000;margin-bottom:3px;letter-spacing:2px}
  #bosstrack{width:100%;height:24px;background:rgba(0,0,0,0.55);border:3px solid #ff5566;border-radius:5px;overflow:hidden}
  #bossfill{height:100%;width:100%;background:linear-gradient(#ff7a4d,#d61f2b);transition:width 0.15s linear}
  #hitmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff5555;font-size:26px;font-weight:bold;z-index:3;opacity:0;transition:opacity 0.05s;text-shadow:0 0 3px #000;pointer-events:none}
  #dmg{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity 0.25s;box-shadow:inset 0 0 220px 40px rgba(200,0,0,0.85)}
  #banner{position:absolute;top:42%;left:0;width:100%;text-align:center;color:#fff;font-size:40px;font-weight:800;z-index:3;opacity:0;transition:opacity 0.2s;text-shadow:0 2px 8px #000;pointer-events:none}
  #lock{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 140% at 50% 30%, rgba(22,49,80,0.78) 0%, rgba(10,26,44,0.82) 55%, rgba(6,15,26,0.85) 100%);color:#fff;z-index:4}
  #title{font-size:74px;font-weight:900;letter-spacing:6px;color:#ffd54a;font-family:Georgia,'Times New Roman',serif;
    text-shadow:0 4px 0 #0e2942,0 8px 22px rgba(0,0,0,0.8),0 0 34px rgba(70,170,210,0.55);line-height:1}
  #title span{color:#3ec6d9}
  #startbtn{margin-top:28px;padding:16px 54px;font-size:26px;font-weight:900;letter-spacing:2px;color:#0d1f2e;
    background:linear-gradient(#ffd54a,#c99a1e);border:3px solid #1a4a68;border-radius:4px;cursor:pointer;
    box-shadow:0 5px 0 #1a4a68,0 8px 18px rgba(0,0,0,0.5);transition:transform 0.08s,box-shadow 0.08s;font-family:sans-serif}
  #startbtn:hover{filter:brightness(1.08)}
  #startbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #7a0f16,0 3px 8px rgba(0,0,0,0.5)}
  /* hide all in-game UI until the game starts (title screen shows only logo + START + background) */
  body:not(.playing) #hud,
  body:not(.playing) #stats,
  body:not(.playing) #hpbar,
  body:not(.playing) #ammoBig,
  body:not(.playing) #crosshair,
  body:not(.playing) #hitmark,
  body:not(.playing) #dmg,
  body:not(.playing) #banner,
  body:not(.playing) #bossbar,
  body:not(.playing) #mobile{ display:none !important; }
  #mobile{display:none;position:absolute;inset:0;z-index:5;pointer-events:none;touch-action:none}
  #mobile.on{display:block}
  #stick{position:absolute;left:26px;bottom:26px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.4);pointer-events:auto}
  #knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.8)}
  #firebtn{position:absolute;right:30px;bottom:40px;width:120px;height:120px;border-radius:50%;background:rgba(220,40,40,0.55);border:3px solid rgba(255,255,255,0.85);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
  #firebtn:active{background:rgba(255,80,80,0.8)}
  #wbtns{position:absolute;right:36px;bottom:180px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
  .wbtn{width:52px;height:52px;border-radius:10px;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.6);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none}
  .wbtn.sel{background:rgba(80,150,255,0.7);border-color:#fff}
  #pausebtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:8px;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.7);color:#fff;font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;justify-content:center;z-index:6;cursor:pointer;user-select:none}
  #pausebtn:hover{background:rgba(0,0,0,0.65)}
  body:not(.playing) #pausebtn, body.paused #pausebtn{ display:none !important; }
  #pauseoverlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,12,0.72);color:#fff}
  body.paused #pauseoverlay{ display:flex; }
  #pausetitle{font-size:52px;font-weight:900;letter-spacing:4px;color:#eaf2f8;text-shadow:0 4px 0 #1c2a33,0 6px 14px rgba(0,0,0,0.7)}
  #resumebtn{margin-top:26px;padding:14px 46px;font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;
    background:linear-gradient(#4fb0ff,#1f6fd6);border:3px solid #fff;border-radius:12px;cursor:pointer;
    box-shadow:0 5px 0 #0f3a7a,0 8px 18px rgba(0,0,0,0.5);transition:transform 0.08s,box-shadow 0.08s;font-family:sans-serif}
  #resumebtn:active{transform:translateY(4px);box-shadow:0 1px 0 #0f3a7a,0 3px 8px rgba(0,0,0,0.5)}
  #pausehint{margin-top:14px;font-size:15px;color:#cfe0ea;opacity:0.8}
  #scopeoverlay{position:absolute;inset:0;z-index:7;display:none;pointer-events:none;
    background:radial-gradient(circle at center, transparent 0 27%, #000 30%);}
  body.scoped #scopeoverlay{display:block}
  body.scoped #crosshair{display:none}
  #scopeoverlay::before,#scopeoverlay::after{content:'';position:absolute;top:50%;left:50%;background:rgba(20,20,20,0.85)}
  #scopeoverlay::before{width:2px;height:100%;transform:translate(-50%,-50%)}
  #scopeoverlay::after{width:100%;height:2px;transform:translate(-50%,-50%)}
  #scopering{position:absolute;top:50%;left:50%;width:29vmin;height:29vmin;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(20,20,20,0.85);box-sizing:border-box}
  #adsbtn{position:absolute;right:30px;bottom:172px;width:74px;height:74px;border-radius:50%;background:rgba(40,90,150,0.55);border:3px solid rgba(255,255,255,0.85);color:#fff;font-weight:800;font-size:12px;display:none;align-items:center;justify-content:center;pointer-events:auto;user-select:none;text-align:center}
  #adsbtn.show{display:flex}
  #adsbtn.active{background:rgba(80,160,255,0.85)}
</style>
</head>
<body>
<div id="hud">WASD move · mouse look · click to lock · [1-4 or wheel] switch weapon · [Z] Zahra Gun · [F] reload · right-click or hold [Shift] to scope (sniper) · [R] unstick</div>
<div id="pausebtn" title="Pause">❚❚ PAUSE</div>
<div id="pauseoverlay"><div id="pausetitle">PAUSED</div><button id="resumebtn">RESUME</button><div id="pausehint">Press P or Esc to resume</div></div>
<div id="stats">🔫 <span id="weap">Rifle</span> &nbsp; ⭐ <span id="score">0</span> &nbsp; 🌊 Wave <span id="wave">1</span> &nbsp; 👾 <span id="enemies">0</span></div>
<div id="ammoBig"></div>
<div id="bossbar"><div id="bosslabel">☠ BOSS</div><div id="bosstrack"><div id="bossfill"></div></div></div>
<div id="crosshair"></div>
<div id="hitmark">✕</div>
<div id="dmg"></div>
<div id="banner"></div>
<div id="hpbar"><div id="hpfill"></div><div id="hptext">100</div></div>
<div id="scopeoverlay"><div id="scopering"></div></div>
<div id="lock"><div id="title">NILE<span>FRONT</span></div><button id="startbtn">START</button></div>
<div id="mobile">
  <div id="stick"><div id="knob"></div></div>
  <div id="wbtns"><div class="wbtn" data-w="0">1</div><div class="wbtn sel" data-w="1">2</div><div class="wbtn" data-w="2">3</div><div class="wbtn" data-w="3">4</div></div>
  <div id="adsbtn">SCOPE</div>
  <div id="firebtn">FIRE</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd6f2);
scene.fog = new THREE.Fog(0x9fdcf0, 40, 220);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 1.7, 10);

const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5)); // retina displays were rendering 4x the pixels — this was the #1 cause of choppy look/movement
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
// Declared here, immediately after renderer exists, specifically so every texture-building helper below —
// several of which run at module top-level, not inside a function — can safely reference it. See the note
// on _finish() for what this actually fixes: mipmapping alone doesn't hold detail on a surface minified
// unevenly across its two axes (a floor at eye height, a wall seen edge-on), which is most surfaces in an
// FPS; anisotropic filtering samples along the view direction instead of picking one blurry mip level.
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x55603f, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
sun.position.set(38, 60, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); // lighter shadow map — 2048 was costly for marginal visual gain
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -45;
sun.shadow.bias = -0.0004;
scene.add(sun);
// ---- collision registry (top-down AABB rectangles; buildings/props are full-height blockers) ----
const colliders = [];            // original overworld colliders
const pyramidColliders = [];     // pyramid overworld colliders (waves 1-3)
const dungeonColliders = [];     // original boss dungeon colliders (Boss II)
const pyramidDungeonColliders = []; // pyramid boss dungeon colliders (Boss I)
const greekColliders = [];       // Greek/Ptolemaic overworld colliders (waves 4-6)
const greekDungeonColliders = []; // Greek boss dungeon colliders (Boss II — the Ammit Companion)
const romanColliders = [];       // Roman overworld colliders (map built, not yet wired into wave/era progression)
const hydraColliders = [];       // Greek boss arena colliders (Boss II — the Hydra; an open-air marsh arena, not a dungeon)
const colosseumColliders = [];   // Roman boss arena colliders (Boss III — the Colosseum Champion; a full arena)
const ifritColliders = [];       // Islamic boss arena colliders (Boss IV — the Ifrit King; the Citadel courtyard)
const islamicColliders = [];     // Islamic/Mamluk Cairo overworld colliders (waves 10-12)
let addTarget = colliders;       // where addBox pushes during world build
let activeColliders = colliders; // which set physics currently uses
function addBox(cx,cz,w,d,roofY){ addTarget.push({x1:cx-w/2, z1:cz-d/2, x2:cx+w/2, z2:cz+d/2, roofY}); }
let pyramidPhase = true; // waves 1-3 + Boss I use the pyramid map/loadout; reverts to the original after Boss I
// height zones let the player climb onto rooftops via ramps (bots stay ground-level, unaffected)
const heightZonesOriginal = [];
const heightZonesPyramid = [];
const heightZonesGreek = [];
const heightZonesRoman = [];
const heightZonesIslamic = [];
let heightZoneTarget = heightZonesOriginal;   // where sniperTower()/plaza() push during world build
let activeHeightZones = heightZonesPyramid;   // which set getTerrainHeight() reads at runtime (pyramid phase starts active)
function getTerrainHeight(x,z,curH){
  let h=0;
  for(const zn of activeHeightZones){
    if(x<zn.x1||x>zn.x2||z<zn.z1||z>zn.z2) continue;
    let zh;
    if(zn.type==='plateau'){ zh=zn.y; }
    else if(zn.axisX){ const t=Math.max(0,Math.min(1,(x-zn.x1)/Math.max(0.001,(zn.x2-zn.x1)))); zh=zn.y1+(zn.y2-zn.y1)*t; }
    else { const t=Math.max(0,Math.min(1,(z-zn.z1)/Math.max(0.001,(zn.z2-zn.z1)))); zh=zn.y1+(zn.y2-zn.y1)*t; }
    // a rooftop/ramp zone is just a flat XZ rectangle with no real 3D "under vs. on top of" distinction, so
    // only let it count if you're already close to that height (i.e. you actually climbed up to this point).
    // This has to apply to plateaus too, not just ramps — a tower roof's footprint is the same rectangle as
    // its own walls, so without this check, resolveCollision's roof-skip logic (below) would treat anyone
    // standing outside at ground level as "already on the roof" and let them walk straight through the wall.
    if(curH!==undefined && Math.abs(zh-curH) > 1.5) continue;
    h=Math.max(h,zh);
  }
  return h;
}
function resolveCollision(px,pz,R,curH){
  for(const c of activeColliders){
    const nx=Math.max(c.x1,Math.min(px,c.x2));
    const nz=Math.max(c.z1,Math.min(pz,c.z2));
    // Skip this wall only if the terrain height AT THE WALL ITSELF (the nearest point the player's
    // radius actually touches) already matches its own roof — not a global "am I elevated" check,
    // which could let you phase through an unrelated building while easing down from a different roof.
    // Passing curH through means this only fires once you've actually climbed to that height (see the
    // continuity check in getTerrainHeight) — otherwise ground-level players could walk straight through
    // a tower's wall since the roof's height-zone rectangle shares the same footprint as the wall itself.
    if(c.roofY!=null && getTerrainHeight(nx,nz,curH) >= c.roofY-0.4) continue;
    const dx=px-nx, dz=pz-nz; const d2=dx*dx+dz*dz;
    if(d2 < R*R){
      if(d2>1e-6){ const d=Math.sqrt(d2); px=nx+dx/d*R; pz=nz+dz/d*R; }
      else { const l=px-c.x1,r=c.x2-px,t=pz-c.z1,b=c.z2-pz,m=Math.min(l,r,t,b);
        if(m===l)px=c.x1-R; else if(m===r)px=c.x2+R; else if(m===t)pz=c.z1-R; else pz=c.z2+R; }
    }
  }
  return [px,pz];
}
// move an actor along (dirx,dirz); returns true if it was blocked by a collider/arena edge
function moveActor(mesh, dirx, dirz, dist, radius){
  const len=Math.hypot(dirx,dirz)||1; dirx/=len; dirz/=len;
  let nx=mesh.position.x+dirx*dist, nz=mesh.position.z+dirz*dist;
  const cx=Math.max(-28,Math.min(28,nx)), cz=Math.max(-28,Math.min(28,nz));
  const [rx,rz]=resolveCollision(cx,cz,radius,0);
  const blocked = Math.abs(rx-nx)>0.0015 || Math.abs(rz-nz)>0.0015;
  mesh.position.x=rx; mesh.position.z=rz;
  return blocked;
}

// soft fill from the opposite side so shadowed faces aren't pure black
const fill = new THREE.DirectionalLight(0xaecbe0, 0.25);
fill.position.set(-30, 25, -20);
scene.add(fill);

// ---- cloud skydome (canvas cloud texture on a big inverted sphere, Pixel-Gun-style bright sky) ----
function cloudSkyTexture(size=512){
  const c = document.createElement('canvas');
  c.width = size; c.height = size/2;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,c.height);
  grad.addColorStop(0, '#3f9fd8');
  grad.addColorStop(0.55, '#7cc9ee');
  // The horizon stop used to be #d7f3fa, i.e. very nearly white. Anything pale and distant — the limestone
  // pyramids, the far skyline towers — sat against it with almost no contrast and simply disappeared.
  // Holding a real blue at the horizon line gives distant geometry something to read against.
  grad.addColorStop(0.88, '#aadcf0');
  grad.addColorStop(1, '#c8e4ee');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,c.width,c.height);
  for (let i=0;i<70;i++){
    const cx = Math.random()*c.width, cy = Math.random()*c.height*0.6;
    const cw = 30+Math.random()*70, ch = 10+Math.random()*16;
    // fade clouds out toward the horizon rather than stamping them at full white all the way down —
    // solid white blobs sitting on the skyline were a big part of what flattened the far distance
    ctx.fillStyle = 'rgba(255,255,255,' + (0.9 - 0.55*(cy/(c.height*0.6))).toFixed(3) + ')';
    for (let b=0;b<5;b++){
      ctx.fillRect(cx + Math.random()*cw - cw/2, cy + Math.random()*ch - ch/2, 18+Math.random()*22, 10+Math.random()*10);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.anisotropy = maxAniso;
  return tex;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 16, 12),
  new THREE.MeshBasicMaterial({map: cloudSkyTexture(), side: THREE.BackSide, fog:false})
);
scene.add(sky);
// One shared skydome serves every outdoor area, and a MeshBasicMaterial multiplies its `color` into the
// map — so tinting it is how an era gets its own sky without a second texture. Before this, the Hydra's
// overcast marsh and the Ifrit's fire-lit dusk both set a moody scene.fog/background and were then
// completely overruled by this dome rendering cheerful midday blue over the top of them.
function skyTint(hex){ sky.material.color.set(hex); }

// ---- distant blocky skyline silhouette beyond the walls, fades into fog for depth ----
function skylineTower(x,z,w,h,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,w), new THREE.MeshLambertMaterial({color, fog:true}));
  m.position.set(x,h/2,z);
  scene.add(m);
}
(function buildSkyline(){
  // far, low, hazy skyline that sits on the horizon (behind the walls) — not an overhead ring
  const ring = 120;
  const colors = [0xafc0cc, 0xbccad4, 0xa4b6c0, 0xc6d2da];
  for (let i=0;i<44;i++){
    const angle = (i/44)*Math.PI*2;
    const dist = ring + Math.random()*45;
    const x = Math.sin(angle)*dist, z = Math.cos(angle)*dist;
    const w = 5+Math.random()*7;
    const h = 8+Math.random()*16;
    skylineTower(x,z,w,h,colors[i%colors.length]);
  }
})();

// ---- distant ground backing: every map's real ground is a finite slab (~60 wide), way smaller than the
// fog draw distance (up to 220), so standing at its edge exposed the slab's bare side face against open sky
// — read as "standing on a floating island". This huge, cheap plane sits tucked just under every map's real
// ground (all of them top out at y=0), invisible under the detailed geometry, and only shows past its edges,
// giving the horizon something to fade into instead of nothing.
//
// It is tinted to match each era's GROUND, not its fog — see setDistantGround(). Colouring it fog-blue (what
// it did at first) meant the plane read as another band of sky sitting at ground level, so the map's finite
// slab still looked like it was floating; and because fog doesn't start until ~40 units, the stretch of plane
// nearest the player got no atmospheric blending either and rendered as a flat sheet butted against textured
// ground. Painted as terrain and left to the scene fog, it reads as the ground simply running to the horizon.
function distantGroundTexture(size=256){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,size,size);
  // near-white base with only light/dark mottling, so the per-era tint below sets the actual hue rather
  // than fighting a baked-in grey
  for(let i=0;i<700;i++){
    const x=Math.random()*size, y=Math.random()*size, r=6+Math.random()*14;
    const shade=228+((Math.random()-0.5)*46)|0;
    ctx.fillStyle=`rgba(${shade},${shade},${shade-6},0.55)`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.anisotropy=maxAniso;
  // ~7 units per tile (1400/200), close to the real ground textures' scale. At 70 it was 20 units a tile,
  // visibly coarser than the ground it was supposed to be continuing.
  tex.repeat.set(200,200);
  return tex;
}
const distantGroundDefaultTex = distantGroundTexture();
const distantGround = new THREE.Mesh(
  new THREE.PlaneGeometry(1400,1400),
  new THREE.MeshLambertMaterial({map:distantGroundDefaultTex})
);
distantGround.rotation.x = -Math.PI/2;
// Just under every map's ground top (y=0) — close enough that the step is invisible at eye level, far enough
// that the two surfaces don't z-fight across the whole overlap.
distantGround.position.y = -0.04;
// NOT scene.add()ed here on purpose. Each map group is built by sweeping everything currently parented to the
// scene into a new Group (six such sweeps below), so anything added at this point gets swallowed by the first
// one — `overworld` — which is removed from the scene and never re-added. That silently detached this plane
// from the graph on every map. It is added to the scene after the last sweep instead.

// ---- horizon haze band. Even with the backing plane carrying the ground out to 700 units, the plane's far
// edge and the sky still meet on a hard line, because the fully-fogged ground and the sky's horizon colour
// are never exactly equal. This is an open-ended cylinder standing around the world with a soft vertical
// gradient — densest right at eye level, fading out above and below — so the two dissolve into each other.
// Tinted per era alongside the ground plane. depthWrite off and fog off: it IS the atmosphere, it must not
// be fogged by it, and it must never occlude anything in the depth buffer.
function horizonHazeTexture(){

  g.addColorStop(0.50,'rgba(255,255,255,0.88)');
  g.addColorStop(0.70,'rgba(255,255,255,0.55)');

function tileTexture(size=512, cell=8){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grass = [0x6ba368, 0x74ad70, 0x5e9a5c, 0x82b878];
  const dirt = [0x8a7355, 0x93805f, 0x7a6248];
  const stone = [0x9b968c, 0x8f8a80, 0xa7a297];
  const sand = [0xd8c98f, 0xcfc086];
  const flower = [0xd94f70, 0xe0c23e, 0xffffff];
  // patch map: low-freq noise decides big regions (grass/dirt/sand), path is separate
  function bigNoise(x,y){ return Math.abs(Math.sin(x*0.017)*Math.cos(y*0.021)*Math.sin((x+y)*0.009)); }
  for (let y=0;y<size;y+=cell){
    for (let x=0;x<size;x+=cell){
      const n = Math.abs(Math.sin(x*12.9898+y*78.233)*43758.5453 % 1);
      const region = bigNoise(x,y);
      let palette = grass;
      if (region > 0.55) palette = dirt;
      if (region > 0.72) palette = stone;
      if (region < 0.08) palette = sand;
      let base = new THREE.Color(palette[Math.floor(n*97)%palette.length]);
      // sparse flower speckles on grass
      if (palette === grass && n > 0.965) base = new THREE.Color(flower[Math.floor(n*331)%flower.length]);
      const jitter = (n-0.5)*22;
      const r = Math.min(255,Math.max(0, base.r*255+jitter))|0;
      const g = Math.min(255,Math.max(0, base.g*255+jitter))|0;
      const b = Math.min(255,Math.max(0, base.b*255+jitter))|0;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.strokeRect(x+0.5,y+0.5,cell-1,cell-1);
    }
  }
  // stone paths crossing the arena (with individual flagstone seams)
  function paveStrip(px,py,pw,ph){
    ctx.fillStyle = 'rgba(160,155,145,0.92)';
    ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle = 'rgba(90,85,75,0.5)';

  }

  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso; // this is a ground texture — the case anisotropy matters most for
  tex.repeat.set(4,4);
  return tex;
}

    x.beginPath(); x.moveTo(0,y0); x.lineTo(P, y0+(Math.abs(Math.cos(k*7.7)*91%1)-0.5)*10); x.stroke();
  }

// Painted stucco — Greek public architecture was NOT bare white stone, it was painted: ochre, Greek blue
// and oxblood over lime plaster. This is the map's actual colour source, and the one material here allowed
// to be loud. Used on entablatures, pediments and trim, never whole walls — the mistake Cairo's first pass
// made was paving everything in bright tile, which read as a giant loud quilt.
function paintedStuccoTex(){ const P=32,c=_mkCanvas(P),x=c.getContext('2d');
  x.fillStyle='#efe8d6'; x.fillRect(0,0,P,P);              // lime plaster ground
  const bands=[['#c8892c',6],['#2f5f8a',5],['#8f2f26',5]]; // ochre / Greek blue / oxblood
  let y=6;
  for(const [col,h] of bands){ x.fillStyle=col; x.fillRect(0,y,P,h); y+=h+4; }
  for(let j=0;j<P;j++)for(let i=0;i<P;i++){
    const n=Math.abs(Math.sin(i*7.1+j*3.9)*4375.5%1);
    if(n>0.86){ x.fillStyle='rgba(0,0,0,0.10)'; x.fillRect(i,j,1,1); }   // plaster grain / wear
  }
  return c; }

// Terracotta pan-and-cover roof tiling. Seen almost entirely edge-on from a player's eye height, so what
// has to read is the ridged profile — a flat orange field reads as nothing at all from down on the street.
function greekRoofTileTex(){ const P=32,c=_mkCanvas(P),x=c.getContext('2d');
  x.fillStyle='#a8552c'; x.fillRect(0,0,P,P);
  for(let col=0;col<P;col+=8){
    x.fillStyle='#b96234'; x.fillRect(col,0,6,P);            // pan tile
    x.fillStyle='#8c4423'; x.fillRect(col+6,0,2,P);          // cover tile — the raised ridge
    x.fillStyle='rgba(0,0,0,0.18)'; x.fillRect(col+5,0,1,P); // shadow line down the ridge's side
  }
  for(let row=0;row<P;row+=11){ x.fillStyle='rgba(0,0,0,0.14)'; x.fillRect(0,row,P,1); } // course laps
  return c; }

// Worn quay flagstones for the waterfront and agora paving — large dressed slabs, deliberately a different
// grain from gravelTex's loose chips so paved ground reads as built rather than merely trodden.
function harbourFlagstoneTex(){ const P=32,c=_mkCanvas(P),x=c.getContext('2d');
  x.fillStyle='#8f8b80'; x.fillRect(0,0,P,P);              // joint colour, showing between the slabs
  const slab=16;
  for(let by=0;by<P;by+=slab)for(let bx=0;bx<P;bx+=slab){
    const n=Math.abs(Math.sin(bx*4.1+by*9.3)*137%1);       // per-slab tone, deterministic
    const v=(150+n*28)|0;
    x.fillStyle=`rgb(${v},${v-3},${v-11})`;
    x.fillRect(bx+1,by+1,slab-2,slab-2);                   // 1px inset all round = the recessed joint
  }
  // wear: scattered dark pits and a few lighter scuffs, so a slab doesn't read as a flat panel
  for(let j=0;j<P;j++)for(let i=0;i<P;i++){
    const n=Math.abs(Math.sin(i*6.7+j*2.3)*4375.5%1);
    if(n>0.93){ x.fillStyle='rgba(60,58,52,0.22)'; x.fillRect(i,j,1,1); }
    else if(n<0.04){ x.fillStyle='rgba(255,252,240,0.16)'; x.fillRect(i,j,1,1); }
  }
  return c; }

function citadelStoneTex(){ const P=16,c=_mkCanvas(P),x=c.getContext('2d');
  // large sandstone ashlar block coursing, same offset-brick technique romanBrickTex uses, just scaled and
  // colored for big fortress stonework. voxMat()'s plain noise texture is designed for small individual
  // elements (columns, merlons) — stretched unrepeated across a 16-unit-wide wall face it reads as a
  // near-invisible blur, which is why the Citadel's podium wall looked like a giant flat blank slab.
  const base='#c9a876', mortar='#a8875c', hi='#ddc294';
  x.fillStyle=mortar; x.fillRect(0,0,P,P);

// ---- true voxel brick wall: a grid of small individual cubes instead of one big textured slab ----
function brickWall(w,h,thickness,color,x,y,z,rotY=0,voxelSize=0.45,noise=30){
  const cols = Math.max(1, Math.round(w/voxelSize));
  const rows = Math.max(1, Math.round(h/voxelSize));
  const cw = w/cols, ch = h/rows;
  const geo = new THREE.BoxGeometry(cw*0.94, ch*0.94, thickness);
  const mat = voxMat(color,{noise, size:16, cell:4}); // shared textured material — actual per-instance vertex color isn't reliably supported on this three.js build
  const mesh = new THREE.InstancedMesh(geo, mat, cols*rows);
  const dummy = new THREE.Object3D();
  let i=0;
  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      dummy.position.set(-w/2+cw/2+c*cw, -h/2+ch/2+r*ch, 0);
      dummy.rotation.set(0,0,0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      i++;
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  const group = new THREE.Group();
  group.add(mesh);
  group.position.set(x,y,z);
  group.rotation.y = rotY;
  scene.add(group);
  return group;
}

// ---- shingle roof texture: horizontal overlapping rows of tiles ----
function shingleMat(color){
  const c = document.createElement('canvas'); c.width=c.height=48;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(color);
  for (let row=0; row<8; row++){
    for (let col=0; col<8; col++){
      const n = Math.abs(Math.sin(col*12.9+row*78.2)*43758.5%1);
      const d = (n-0.5)*40/255;
      const r=Math.min(1,Math.max(0,base.r+d)), g=Math.min(1,Math.max(0,base.g+d)), b=Math.min(1,Math.max(0,base.b+d));
      ctx.fillStyle=`rgb(${r*255|0},${g*255|0},${b*255|0})`;
      const off = (row%2)*3;
      ctx.fillRect(col*6+off, row*6, 6, 6);
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.fillRect(col*6+off, row*6, 6, 1);
    }
  }
  // This never went through _finish()/makeVoxelTexture() — this file's other two texture builders, both
  // already fixed — so it kept the raw THREE.Texture defaults: no anisotropy at all. Roof slabs are mounted
  // at a steep angle specifically to look like a sloped roof (see the caller), which is close to the worst
  // case there is for needing anisotropic filtering. This is what was showing up as a shimmering plaid grid
  // filling the screen near any angled roof.
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); t.anisotropy=maxAniso;
  return new THREE.MeshLambertMaterial({map:t});
}

// ---- framed window: outer frame + recessed glass pane + mullion cross ----
function framedWindow(x,y,z,w,h,rotY,frameColor){
  const g = new THREE.Group();

  const frame = new THREE.Mesh(new THREE.BoxGeometry(w,h,0.12), fm);
  g.add(frame);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w*0.8,h*0.8,0.16),
    new THREE.MeshPhongMaterial({color:0x8fc4e8, shininess:90, specular:0x99ccff, emissive:0x1a3348}));
  g.add(glass);
  const barV = new THREE.Mesh(new THREE.BoxGeometry(0.05,h*0.8,0.2), fm); g.add(barV);
  const barH = new THREE.Mesh(new THREE.BoxGeometry(w*0.8,0.05,0.2), fm); g.add(barH);
  g.position.set(x,y,z); g.rotation.y = rotY;
  scene.add(g);
}

// ---- cottage: brick walls, framed windows + glass, a real door, shingle roof, chimney ----
function cottage(x,z,w,d,floors,wallColor,roofColor){
  const h = floors*3;
  addBox(x,z,w,d);
  const frameColor = new THREE.Color(wallColor).multiplyScalar(1.25).getHex();
  brickWall(w,h,0.4,wallColor,x,h/2,z-d/2,0);
  brickWall(d,h,0.4,wallColor,x-w/2,h/2,z,Math.PI/2);
  brickWall(d,h,0.4,wallColor,x+w/2,h/2,z,Math.PI/2);
  brickWall(w*0.32,h,0.4,wallColor,x-w*0.34,h/2,z+d/2,0);
  brickWall(w*0.32,h,0.4,wallColor,x+w*0.34,h/2,z+d/2,0);
  block(w*0.36,0.6,0.5,wallColor,x,h-0.3,z+d/2,{noise:16});
  // real door filling the ground-floor doorway
  door(x, 1.15, z+d/2+0.02, w*0.34, 2.3, 0, 0x5a3d28);
  // framed windows: ground floor on the two side walls + each upper floor all around
  for (let f=0; f<floors; f++){
    const wy = f*3 + 1.5;
    framedWindow(x-w/2-0.02, wy, z-d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x-w/2-0.02, wy, z+d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x+w/2+0.02, wy, z-d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x+w/2+0.02, wy, z+d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x, wy, z-d/2-0.02, 1.0, 1.1, 0, frameColor);
    if (f>0){ // front-facing windows on upper floors (ground front is the doorway)
      framedWindow(x-w*0.34, wy, z+d/2+0.02, 0.9, 1.0, 0, frameColor);
      framedWindow(x+w*0.34, wy, z+d/2+0.02, 0.9, 1.0, 0, frameColor);
    }
  }
  for (let f=1; f<floors; f++){
    block(w*0.9,0.3,d*0.9,0x6b5d4d,x,f*3,z,{noise:12});
  }
  // shingle roof: two angled slabs meeting at a ridge
  const smat = shingleMat(roofColor);
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(w*0.78,0.3,d*0.7), smat);
  roofL.position.set(x-w*0.2,h+0.95,z); roofL.rotation.z=0.42; scene.add(roofL);
  const roofR = new THREE.Mesh(new THREE.BoxGeometry(w*0.78,0.3,d*0.7), smat);
  roofR.position.set(x+w*0.2,h+0.95,z); roofR.rotation.z=-0.42; scene.add(roofR);
  block(0.45,0.45,d*0.72,0x3a3128,x,h+1.55,z,{noise:8}); // ridge beam
  // gable end fills (triangular-ish caps)
  block(w*0.5,1.1,0.35,wallColor,x,h+0.6,z-d/2,{noise:16});
  block(w*0.5,1.1,0.35,wallColor,x,h+0.6,z+d/2,{noise:16});
  chimney(x+w*0.28, h+1.0, z-d*0.28);
}

// ---- sniper towers: climbable rooftops reached by an exterior wooden staircase ----
function sniperTower(x,z,size,height,wallColor,rampDir){
  const half=size/2;
  function wallCollider(cx,cz,w,d){ addBox(cx,cz,w,d,height); }
  brickWall(size,height,0.4,wallColor,x,height/2,z-half,0); wallCollider(x,z-half,size,0.6);
  brickWall(size,height,0.4,wallColor,x,height/2,z+half,0); wallCollider(x,z+half,size,0.6);
  brickWall(size,height,0.4,wallColor,x-half,height/2,z,Math.PI/2); wallCollider(x-half,z,0.6,size);
  brickWall(size,height,0.4,wallColor,x+half,height/2,z,Math.PI/2); wallCollider(x+half,z,0.6,size);
  block(size,0.3,size,wallColor,x,height,z,{noise:16,pattern:'plate'}); // roof cap
  // low cosmetic parapet around the roof edge for cover while sniping
  const pMat={noise:14};
  block(size,0.5,0.25,wallColor,x,height+0.35,z-half,pMat); block(size,0.5,0.25,wallColor,x,height+0.35,z+half,pMat);
  block(0.25,0.5,size,wallColor,x-half,height+0.35,z,pMat); block(0.25,0.5,size,wallColor,x+half,height+0.35,z,pMat);
  heightZoneTarget.push({type:'plateau', x1:x-half,z1:z-half,x2:x+half,z2:z+half, y:height});
  // exterior wooden staircase up one side (dir: 'n'|'s'|'e'|'w' — which face it climbs)
  const steps=Math.max(6,Math.round(height/0.45));
  const rampWidth=2.8, rampLen=height*1.7; // wide margin so a fast/diagonal step can't drift off the walkable corridor
  const woodMat={noise:14,pattern:'plate'};
  for(let i=0;i<=steps;i++){

  sconceSpots.forEach(([x,z,o],i)=>{

  // Sobek guardian statues flanking the entrance corridor (player enters from +Z) — crocodile-headed, foreshadowing Ammit

    const g=new THREE.Group(); g.position.set(x,3.35,z); g.rotation.y=facing; greekDungeon.add(g);

// ===== HYDRA ARENA (Boss II) — an OPEN-AIR marsh arena (not a dungeon): a raised marble battle platform
// ringed by murky Lernaean swamp water, broken Greek columns, open sky. Replaces the old Ammit dungeon. =====
const hydraArena = new THREE.Group();
addTarget = hydraColliders;
(function buildHydraArena(){
  const marbleFloorMat = new THREE.MeshLambertMaterial({map:_finish(marbleFloorTex(),14)});
  const marbleWallMat = new THREE.MeshLambertMaterial({map:marbleBrickTex()});
  const stoneMat = voxMat(0x8a8f86,{noise:12});
  const mossMat = voxMat(0x415536,{noise:16});
  function hblock(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; hydraArena.add(m); return m; }
  const R=22;
  // murky marsh water everywhere (visual only — no isWater mechanic, this is dry-footing combat on the platform)
  const waterMat = new THREE.MeshPhongMaterial({color:0x2f4526, shininess:50, specular:0x5a7a48, transparent:true, opacity:0.92, emissive:0x0a1a0c});
  const water = new THREE.Mesh(new THREE.BoxGeometry(320,1,320), waterMat); water.position.set(0,-0.7,0); hydraArena.add(water);
  // raised square marble platform (Box, not Circle — avoids the radial-UV tile distortion)
  hblock(R*2,0.6,R*2, marbleFloorMat, 0,-0.05,0);
  hblock(R*2+1.2,0.4,R*2+1.2, stoneMat, 0,-0.35,0); // a slightly wider stone lip below the marble
  // low perimeter kerb on all four sides + colliders so you can't walk off into the marsh
  [[0,-R,R*2,1],[0,R,R*2,1],[-R,0,1,R*2],[R,0,1,R*2]].forEach(([x,z,w,d])=>{
    hblock(w||1.2,0.8,d||1.2, stoneMat, x,0.4,z); addBox(x,z,(w||1.2),(d||1.2));
  });
  // broken Greek columns around the rim (cover + Lerna ruins flavour)
  function brokenColumn(x,z,h){
    for(let s=0;s<3;s++){ const drum=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,h/3,10), marbleWallMat); drum.position.set(x,(s+0.5)*(h/3),z); drum.rotation.y=s*0.3; hydraArena.add(drum); }
    const cap=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.4,1.5), stoneMat); cap.position.set(x,h+0.2,z); hydraArena.add(cap);
    addBox(x,z,1.3,1.3);
  }
  brokenColumn(-16,-14,5); brokenColumn(15,-15,3.4); brokenColumn(-18,7,4.4); brokenColumn(18,6,5.6); brokenColumn(-9,17,3); brokenColumn(11,17,4.6);
  // ---- hiding spots: tall ruined temple walls in the mid-arena that fully break line of sight from the
  // Hydra (its heads fire from up high, so these are ~3 tall). Placed off the centre line, clear of the
  // boss spawn (0,-8) and the player's entry (0,17). ----
  function ruinedWall(x,z,rot){
    const wall=new THREE.Group(); wall.position.set(x,0,z); wall.rotation.y=rot||0; hydraArena.add(wall);
    // a long panel + a short return, L-shaped, full sight-blocking height
    const p1=new THREE.Mesh(new THREE.BoxGeometry(3.4,3.0,0.5), marbleWallMat); p1.position.set(0,1.5,0); wall.add(p1);
    const p2=new THREE.Mesh(new THREE.BoxGeometry(0.5,2.6,2.2), marbleWallMat); p2.position.set(1.7,1.3,1.15); wall.add(p2);
    // a broken crenellated top row so it reads as a ruin, not a clean slab. p1's own top is at y=3.0
    // (position 1.5 + half its 3.0 height); each cap's height is randomised but was placed at a FIXED
    // y=3.1 regardless, so depending on the roll (0.4-0.7 tall) its bottom face landed anywhere from 0.1
    // to 0.35 units BELOW that top — sunk into the wall, coplanar with its side faces across the overlap.
    // That's what was reading as the caps' texture glitching/overlapping with the wall. Each cap's position
    // is now derived from its own height so it sits flush on the wall's real top with a hairline clearance.
    for(let i=0;i<4;i++){ if(i===2) continue;
      const capH=0.4+Math.random()*0.3;
      const cap=new THREE.Mesh(new THREE.BoxGeometry(0.7,capH,0.5), stoneMat); cap.position.set(-1.3+i*0.85,3.0+capH/2+0.02,0); wall.add(cap);
    }
    // colliders in world space (account for the group rotation on the two panels)
    const c=Math.cos(rot||0), s=Math.sin(rot||0);
    const add=(lx,lz,w,d)=>{ addBox(x+lx*c - lz*s, z + lx*s + lz*c, w, d); };
    add(0,0,3.4,0.5); add(1.7,1.15,0.5,2.2);
  }
  ruinedWall(-11,2,0);  ruinedWall(10,-1,Math.PI);
  ruinedWall(-5,11,-0.6); ruinedWall(8,11,0.6);
  // a couple of big toppled marble blocks to crouch behind (waist-to-shoulder cover)
  function fallenBlock(x,z){
    const b1=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.4,1.6), marbleWallMat); b1.position.set(x,0.7,z); b1.rotation.y=Math.random()*0.5; hydraArena.add(b1);
    const b2=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.9,1.2), stoneMat); b2.position.set(x+1.3,0.45,z+0.4); hydraArena.add(b2);
    addBox(x,z,2.3,1.7); addBox(x+1.3,z+0.4,1.5,1.3);
  }
  fallenBlock(-15,-3); fallenBlock(13,-5);
  // reed/moss clumps out in the marsh (decorative, no collider)
  for(let i=0;i<18;i++){ const a=Math.random()*Math.PI*2, r=R+3+Math.random()*26;
    const reed=new THREE.Mesh(new THREE.BoxGeometry(0.28,1.3+Math.random()*1.2,0.28), mossMat); reed.position.set(Math.cos(a)*r, 0.3, Math.sin(a)*r); hydraArena.add(reed); }
  hydraArena.add(new THREE.AmbientLight(0x9fb890, 0.55));
})();

// ===== COLOSSEUM ARENA (Boss III) — a real gladiator PIT: a round sand floor down in the middle, a tall
// barrier wall containing it, and a full circle of rising banked seating tiers all around you, split by
// aisle stairways, with imperial banners and gladiator gates. Open sky. =====
const colosseumArena = new THREE.Group();
addTarget = colosseumColliders;
(function buildColosseumArena(){
  const sandMat = new THREE.MeshLambertMaterial({map:_finish(terracottaTex(),18)});
  const stoneMat = voxMat(0xb8a888,{noise:12,pattern:'plate'});
  const stoneDark = voxMat(0x8a7a5c,{noise:12});
  const brickMat = new THREE.MeshLambertMaterial({map:_finish(romanBrickTex(),3)});
  const R=22, segs=32, tiers=6;
  // the pit floor — sand, reaching just past the barrier wall
  const floor = new THREE.Mesh(new THREE.BoxGeometry(R*2.1,0.4,R*2.1), sandMat); floor.position.set(0,-0.1,0); colosseumArena.add(floor);
  const aisles = [0, Math.PI/2, Math.PI, Math.PI*1.5]; // 4 stairway aisles cutting through the seats
  const aisleHalf = 0.16; // half-width of each aisle gap, radians
  // The wall/seats used to be built from ~28 individually rotated, deliberately-OVERSIZED boxes per ring
  // (oversized so neighbours would overlap and hide the seam). That overlap is real geometric
  // interpenetration, not just a coplanar-face flicker — two boxes at a ~13° angle to each other, both
  // 6-8% too wide, cross THROUGH each other along a diagonal line, which is exactly the diagonal crack
  // pattern visible in-game. A Y-epsilon only fixes coincident flat top faces; it can't fix crossing side
  // faces. Real fix: build each ring as ONE continuous revolved mesh (LatheGeometry) instead of N
  // overlapping boxes — there is no seam to glitch because there's no second overlapping mesh at all.
  const wallProfile = [ new THREE.Vector2(R-0.8,0), new THREE.Vector2(R-0.8,4.2), new THREE.Vector2(R+0.8,4.2), new THREE.Vector2(R+0.8,0) ];
  const wallMesh = new THREE.Mesh(new THREE.LatheGeometry(wallProfile, segs), stoneMat); colosseumArena.add(wallMesh);
  const railProfile = [ new THREE.Vector2(R-0.85,4.2), new THREE.Vector2(R-0.85,4.5), new THREE.Vector2(R+0.85,4.5), new THREE.Vector2(R+0.85,4.2) ];
  const railMesh = new THREE.Mesh(new THREE.LatheGeometry(railProfile, segs), stoneDark); colosseumArena.add(railMesh);
  // colliders still come from a per-segment box ring — that's collision math, not rendering, so it was
  // never the source of the glitch and stays as-is
  for(let i=0;i<segs;i++){ const a=i/segs*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a); addBox(ca*R,sa*R, 2*Math.PI*R/segs*1.08, 1.8); }
  // rising banked seating — each tier is 4 continuous revolved arcs (one per gap between aisles), not 28
  // overlapping boxes. Alternating stone/brick tiers read as seating; the arcs simply stop at the aisles,
  // a real gap, not two meshes touching.
  for(let t=0;t<tiers;t++){
    const rad = R + 2.2 + t*2.1, yTop = 4.6 + t*1.5, h = 2.6, halfD = 1.0;
    const mat = t%2 ? stoneMat : brickMat;
    const seatProfile = [ new THREE.Vector2(rad-halfD,yTop-h), new THREE.Vector2(rad-halfD,yTop), new THREE.Vector2(rad+halfD,yTop), new THREE.Vector2(rad+halfD,yTop-h) ];
    for(let k=0;k<4;k++){
      const startA = aisles[k] + aisleHalf;
      const endA = (k<3 ? aisles[k+1] : Math.PI*2) - aisleHalf;
      const phiLen = endA - startA;
      const arcSegs = Math.max(3, Math.round(phiLen/(Math.PI*2)*segs));
      const seatArc = new THREE.Mesh(new THREE.LatheGeometry(seatProfile, arcSegs, startA, phiLen), mat);
      colosseumArena.add(seatArc);
    }
    aisles.forEach(al=>{ const ca=Math.cos(al), sa=Math.sin(al);
      const step=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.5,2.1), stoneDark); step.position.set(ca*rad,yTop-2.35,sa*rad); step.rotation.y=-al; colosseumArena.add(step); });
  }
  // top cornice cap ring crowning the stands
  const outR = R + 2.2 + tiers*2.1;
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(outR+1.2,outR+0.8,1.4,segs,1,true), stoneDark); cap.position.set(0, 4.6+(tiers-1)*1.5+0.7, 0); colosseumArena.add(cap);
  // imperial purple-and-gold banners draped over the barrier at the cardinal points
  [0.4,Math.PI-0.4,Math.PI+0.4,Math.PI*2-0.4].forEach(a=>{
    const ca=Math.cos(a), sa=Math.sin(a);

// copy they drifted: switchToGreekWorld() set no lighting at all and handed Alexandria Giza's desert sky,
// and exitNileWave() handed Giza back Alexandria's.
function applyGizaDaylight(){

  // limestone toward the same white, which was a real part of why the map read as washed out.
  scene.background.set(0x8fd6f2); scene.fog.color.set(0xcbb388); scene.fog.near=48; scene.fog.far=210;

  sun.intensity=1.15; fill.intensity=0.2; fill.color.set(0xffd9a0);

}
function applyGreekDaylight(){

  // Fog is deliberately short here. With far=265 you could see clean ground running a couple of hundred
  // units past the map in every direction, which is what made the place feel enormous and empty — and made
  // the invisible clamp at +/-29 feel arbitrary, since there was obviously walkable ground beyond it.
  // Ending the visible world ~90 units out closes it off instead, and the distant scenery was moved in to
  // match so it still sits inside the draw distance.

  }
  [-2.5,0,2.5].forEach(z=>{ oar(-1,z); oar(1,z); });
  // a real steering oar off the stern (Nile boats steered this way, not with a hung rudder)
  const steerGrp=new THREE.Group(); steerGrp.position.set(1.6,0.5,-4.7); steerGrp.rotation.x=0.5; steerGrp.rotation.z=-0.15; nileWorld.add(steerGrp);
  const steerShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,2.6,6), woodDark); steerShaft.position.set(0,-1.3,0); steerGrp.add(steerShaft);
  const steerBlade=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.8,0.06), voxMat(0x5a3f26,{noise:12})); steerBlade.position.set(0,-2.5,0); steerGrp.add(steerBlade);
  // deck clutter for character: barrels, crates, coiled rope
  function barrel(x,z){ nblock(0.5,0.7,0.5,0x445544,x,0.4,z,{noise:22,pattern:'plate'}); }
  barrel(-1.6,2.2); barrel(1.7,-2.6); barrel(-1.4,-3.2);
  function crate(x,z){ nblock(0.6,0.6,0.6,0xa87c4f,x,0.4,z,{noise:20,pattern:'plate'}); }
  crate(1.6,2.4); crate(-1.7,-2.7);
  const rope = new THREE.Mesh(new THREE.TorusGeometry(0.35,0.05,5,10), voxMat(0xd9c9a0,{noise:10}));
  rope.rotation.x=Math.PI/2; rope.position.set(1.7,0.25,3.4); nileWorld.add(rope);
  // distant desert shoreline all around the horizon — low, wide, rounded dune mounds (not tall thin "buildings")
  function duneMound(x,z,i){
    const w=16+Math.random()*20, d=w*0.75;
    // Heights are stepped deterministically per mound rather than purely random. Two things were fighting
    // here: within a mound the cap sat at a FIXED top of 5.5 while the layer beneath it varied across
    // 4.65-5.65, so they regularly coincided; and neighbouring mounds on this ring overlap each other, so
    // random base heights collided too. Each layer's top is now derived from the one below it.
    const h1=2.6+((i*0.83)%3.2), h2=2.2+((i*0.53)%2.4), h3=1.5+((i*0.31)%1.1);
    const t1=h1, t2=t1+0.9, t3=t2+0.8;
    nblock(w,      h1, d,       0xd8b982, x, t1-h1/2, z, {noise:18});
    nblock(w*0.6,  h2, d*0.6,   0xe0c48f, x, t2-h2/2, z, {noise:16});
    nblock(w*0.3,  h3, d*0.35,  0xcfa96a, x, t3-h3/2, z, {noise:14});
  }
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2 + Math.random()*0.15, dist=100+Math.random()*50;
    duneMound(Math.sin(a)*dist, Math.cos(a)*dist, i);
  }

  // enterNileWave()) — so that shoreline was already fading into fog or invisible, leaving nothing but open
  // water in every direction the player could actually see. Much closer sandbank/reed-bed terrain, well clear
  // of the boat and the crocodile/hippo spawn ring (which only goes out to ~19 units), fixes that directly.
  function riverBank(x,z,w){
    nblock(w,0.6,w*0.7,0xcbb27a,x,-0.05,z,{noise:16}); // low mud-flat, mostly at water level
    nblock(w*0.55,0.9,w*0.4,0xd8c088,x,0.25,z,{noise:14}); // a slightly raised drier hump
  }
  function bankReeds(x,z,n){
    const stemMat=voxMat(0x4a7a4a,{noise:12});
    for(let i=0;i<n;i++){
      const ox=(Math.random()-0.5)*3.4, oz=(Math.random()-0.5)*3.4, h=1.2+Math.random()*0.7;
      const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.045,h,5), stemMat); stem.position.set(x+ox,h/2-0.1,z+oz); nileWorld.add(stem);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,6,4), stemMat); head.scale.set(1,0.4,1); head.position.set(x+ox,h-0.1,z+oz); nileWorld.add(head);
    }
  }
  function bankPalm(x,z){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.2,3,6), voxMat(0x8a6a3a,{noise:16})); trunk.position.set(x,1.5,z); trunk.rotation.z=0.06; nileWorld.add(trunk);
    const frondMat=voxMat(0x4a7a3a,{noise:14});
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2;
      const frond=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.07,0.3),frondMat);
      frond.position.set(x+Math.cos(a)*0.6,3.1,z+Math.sin(a)*0.6); frond.rotation.y=a; frond.rotation.z=-0.35; nileWorld.add(frond);
    }
  }
  // one continuous bank on each side, running along Z (the same axis the boat's bow/stern already point
  // along), so the boat sits pointing WITH the current between the two banks instead of broadside to it —
  // rebuilding the boat itself would mean redoing its tested hull/rail/collider geometry from scratch, but
  // the current only needs to flow the direction the boat is already facing, so it's the banks that rotate.
  // Each bank is a big continuous backing slab (not just a thin near-edge strip) that runs the full length
  // of the river and well past the fog draw distance (140), so there's no gap or "back edge" visible from
  // any angle — plus the near-edge mud-flat/reed detail, now much closer to the boat than the first pass.
  function bankStrip(nearX, dir){
    const backSpan = 130;
    nblock(backSpan, 3, 260, 0xb9a978, nearX+dir*(backSpan/2), 0.5, 0, {noise:16});
    for(let i=0;i<6;i++){
      const z=-50+i*20, xj=(Math.random()-0.5)*3;
      // depth 20, matching the 20-unit step below — at 26 each slab overlapped both neighbours by 6 units
      // at an identical top height, and the whole bank shimmered along those seams
      nblock(14+Math.random()*4, 0.6, 20, 0xcbb27a, nearX+dir*7+xj, -0.05, z, {noise:16}); // low mud-flat at the waterline
      nblock(8+Math.random()*3, 0.9, 15, 0xd8c088, nearX+dir*4+xj, 0.25, z, {noise:14}); // drier raised hump, closer to the water than before
    }
  }
  bankStrip(20,1); bankStrip(-20,-1);
  for(let i=0;i<12;i++) bankReeds(20-4-Math.random()*3, -50+i*9+(Math.random()-0.5)*4, 5);
  for(let i=0;i<12;i++) bankReeds(-20+4+Math.random()*3, -50+i*9+(Math.random()-0.5)*4, 5);
  for(let i=0;i<5;i++) bankPalm(17, -40+i*20);
  for(let i=0;i<5;i++) bankPalm(-17, -40+i*20);
})();

// a visible chomped-out chunk of hull, left behind wherever a croc/hippo finishes gnawing through it
function spawnBoatHole(x,z){
  // a real bite-shaped tear, not a neat little dark circle: several overlapping irregular missing-chunk
  // slabs (so the gap reads jagged, not a clean hole) surrounded by big splintered wood shards jutting out
  // at broken angles, like something with real jaws actually tore into the hull. Plus a flash/light burst
  // at the moment of impact so it reads clearly even if you weren't looking right at it.
  const dark = new THREE.MeshBasicMaterial({color:0x0a0602, fog:false});
  const splinterMat = new THREE.MeshBasicMaterial({color:0xe0c9a0, fog:false});
  const splinterMat2 = new THREE.MeshBasicMaterial({color:0xb08858, fog:false});
  const grp = new THREE.Group(); grp.position.set(x, 0.3, z); nileWorld.add(grp);
  const biteChunks = [ {s:0.55,ox:0,oz:0}, {s:0.4,ox:0.28,oz:0.18}, {s:0.36,ox:-0.24,oz:0.22}, {s:0.32,ox:0.08,oz:-0.3} ];
  biteChunks.forEach(c=>{
    const chunk=new THREE.Mesh(new THREE.BoxGeometry(c.s,0.16,c.s), dark);
    chunk.position.set(c.ox,-0.02,c.oz); chunk.rotation.y=Math.random()*Math.PI;
    grp.add(chunk);
  });
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2 + Math.random()*0.3;
    const len=0.26+Math.random()*0.36, dist=0.36+Math.random()*0.3;
    const splinter=new THREE.Mesh(new THREE.BoxGeometry(0.07+Math.random()*0.05, len, 0.06), i%2?splinterMat:splinterMat2);
    splinter.position.set(Math.cos(a)*dist, len*0.32, Math.sin(a)*dist);
    splinter.rotation.z = (Math.random()-0.5)*0.9;
    splinter.rotation.x = (Math.random()-0.5)*0.9;
    splinter.rotation.y = a;
    grp.add(splinter);
  }
  boatHoleMeshes.push(grp);
  const fMat = new THREE.MeshBasicMaterial({color:0xffd9a0, transparent:true, opacity:0.95, fog:false});
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.3,8,6), fMat);
  flash.position.set(x,0.5,z); scene.add(flash);
  const light = new THREE.PointLight(0xffb347, 3.0, 10); light.position.set(x,0.6,z); scene.add(light);
  explosions.push({mesh:flash, light, t:0, dur:0.5});
}

function pool(x,z,w,d,bridgeGapZ){
  block(w+0.8,0.5,d+0.8,0x9b968c,x,0.0,z,{noise:16,pattern:'plate'}); // rim/base

    const half=fullD/2, g=bridgeGapZ/2;

    if(southD>0.05) addBox(x, z-half+southD/2, fullW, southD);

  // reads against the sand instead of being another tan strip like the old sandFloorTex crossroads
  const basaltMat = new THREE.MeshLambertMaterial({map:_finish(basaltTex(),10), polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2});
  const sandPathMat = new THREE.MeshLambertMaterial({map:_finish(sandFloorTex(),8), polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2});
  function basaltPath(x,z,w,d){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.14,d),basaltMat); m.position.set(x,0.07,z); m.receiveShadow=true; scene.add(m); }
  function sandPath(x,z,w,d){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.14,d),sandPathMat); m.position.set(x,0.07,z); m.receiveShadow=true; scene.add(m); }
  basaltPath(0,0,9,60);
  sandPath(-17.25,0,25.5,9);
  sandPath(17.25,0,25.5,9);

  // ---- pyramid landmark. `solid` false = it stands out beyond the temenos wall on the distant-ground plane,
  // where the player can never reach it (they're clamped to +/-29), so it takes no collider and can be built
  // at something like real scale. That's the fix for the old map's core failure: a single 10-wide pyramid
  // parked off-axis at (10,-8) meant the opening view down the avenue was bare sand to the horizon, and the
  // one pyramid you did have was the same tan value as the ground it stood on. ----
  function stepPyramid(x,z,baseSize,solid){
    if(solid!==false) addBox(x,z,baseSize,baseSize);
    const half=baseSize/2;
    // real Giza slope (~51.8°): height ≈ 1.27x the half-base — one smooth 4-sided body, not stacked tiers,
    // for an actual triangular silhouette instead of a ziggurat
    const bodyH=half*1.27;
    // a plain voxMat (NearestFilter, no mipmaps, hard-edged 'plate' pattern) causes bad shimmer/flicker at a
    // cone's apex, where every side face's UVs converge to a single degenerate point — use a mipmapped,
    // pattern-free texture instead, which is what a cone actually needs
    const bodyTex = limestoneCasingTex_mip();
    const body=new THREE.Mesh(new THREE.ConeGeometry(half*Math.SQRT2,bodyH,4), new THREE.MeshLambertMaterial({map:bodyTex}));
    body.rotation.y=Math.PI/4; body.position.set(x,bodyH/2,z); scene.add(body);
    // small gilded pyramidion capping the tip (electrum-clad capstones are historically attested)
    const capH=bodyH*0.07;
    const cap=new THREE.Mesh(new THREE.ConeGeometry(half*Math.SQRT2*0.05,capH,4), metalMatP(0xe0b040,85,0xfff2c8));
    cap.rotation.y=Math.PI/4; cap.position.set(x,bodyH-capH*0.25,z); scene.add(cap);
    // dark recessed entrance archway low on the north face (the real Giza entrances face north)
    block(baseSize*0.1, bodyH*0.1, 0.25, 0x241c10, x, bodyH*0.16, z+half*0.72, {noise:8});
    // a low dark bedrock apron the cone sits on, so it meets the sand on a shadow line instead of a hard
    // seam. Kept deliberately thin and dark — an earlier stepped-casing skirt here caught full sun on its
    // top faces and read as pale plates floating across the pyramid's base.
    block(baseSize*1.02, 0.7, baseSize*1.02, 0x7d6942, x, 0.35, z, {noise:18,pattern:'plate'});
  }
  // The classic Giza diagonal, standing out on the desert plain beyond the temenos gate. Khafre sits dead
  // centre on the spawn sightline (it's the one that still wears its casing cap), Khufu larger off to the
  // east, little Menkaure west — so looking down the avenue from spawn you get the actual postcard.
  // Placement is constrained by the temenos wall at z=-30: a cone of side S centred at z has an axis-aligned
  // footprint reaching z+S/2, so each of these needs z + S/2 < -31 to stay outside the compound. They were at
  // (0,-40,S34) and (31,-47,S40), which reach z=-23 and z=-27 — both punched through the wall and stood
  // inside the play area, filling the screen with a wall of limestone from anywhere near the gate. Sizes are
  // up a little to keep them reading as large from the spawn sightline now that they sit further back.
  // Sized up as well as pushed back. The temenos wall is 8 tall and only 40 units from the spawn point, so
  // it occludes everything below ~9 degrees; a pyramid that clears the wall by only a little reads as a small
  // triangle poking over it. These are scaled so a good half of each still stands above the wall line from
  // spawn, while their footprints stay well clear of it (nearest reach is -45, the wall is at -30).
  stepPyramid(-40,-48, 22, false); // Menkaure -> x -51..-29, z -59..-37
  stepPyramid( -2,-60, 46, false); // Khafre   -> x -25..21,  z -83..-37, centred on the spawn sightline
  stepPyramid( 52,-68, 54, false); // Khufu    -> x  25..79,  z -95..-41, largest, off to the east

  // 3 climbable pyramid-tier towers — same proven positions/mechanic as the original sniper towers, sandstone-reskinned.
  // Ramps used to have flanking colliders walling off sideways entry (to stop a jarring height-zone "fling" —
  // see the rate-capped playerHeight easing in animate() now instead), but that also blocked the player and
  // bots from ever walking under/around the towers at all. Removed; the rate cap handles the fling risk instead.
  sniperTower(24,-4, 4.5, 6, 0xc9a671, 'w');
  sniperTower(18,20, 4.5, 7, 0xb99a63, 'w');
  sniperTower(-8,-22, 4, 5.5, 0xa4854f, 's');

  // obelisks (landmark cover)
  function obelisk(x,z,h){
    block(1.1,h,1.1,0xb99a63,x,h/2,z,{noise:20});
    const cap=new THREE.Mesh(new THREE.BoxGeometry(0.6,1,0.6), metalMatP(0xe0b040,85,0xfff2c8)); // shiny gold cap
    cap.position.set(x,h+0.5,z); scene.add(cap);

  }
  // paired obelisks flanking the head of the processional way, well clear of the Sphinx enclosure — the
  // third used to stand at (6,-16), right alongside the statue, where it cut straight through its profile
  obelisk(-7.5,6,7); obelisk(7.5,6,7); obelisk(-16,-4,6);

  // pottery jars + rubble piles (cover, standing in for the original's crates/barrels)
  function potteryJar(x,z){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,0.9,8), voxMat(0xb5502c,{noise:18,pattern:'plate'}));
    m.position.set(x,0.45,z); scene.add(m); addBox(x,z,0.8,0.8);
  }
  function rubble(x,z){
    // stepped sizes, not four independent random draws: these overlap each other, and each block's height
    // comes from its own size, so two similar draws put two top faces on the same plane
    for(let i=0;i<4;i++){ const s=0.30+i*0.09;
      block(s,s,s,0xa4854f,x+(Math.random()-0.5)*0.8,s/2,z+(Math.random()-0.5)*0.8,{noise:20}); }
    addBox(x,z,1.3,1.3);
  }
  potteryJar(4.5,4.6); potteryJar(-19,3.2); potteryJar(19.4,7.6);
  rubble(-6,-3); rubble(7,2); rubble(-2,7);

  // oasis pool, palm-fringed
  function oasisPool(x,z,w,d){
    block(w+0.8,0.5,d+0.8,0xa4854f,x,0.0,z,{noise:16,pattern:'plate'});
    addBox(x,z,w+0.8,d+0.8);
    const waterMat = new THREE.MeshPhongMaterial({color:0x2f9fd6, shininess:120, specular:0xbfefff, transparent:true, opacity:0.85, emissive:0x0a3a52});
    const water = new THREE.Mesh(new THREE.BoxGeometry(w,0.35,d), waterMat);
    water.position.set(x,0.22,z); water.userData.isWater=true; water.userData.baseY=0.22; scene.add(water);
    waterSurfaces.push(water);
  }
  oasisPool(-2,16, 5, 4);
  function palm(x,z){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.2,3.4,6), voxMat(0x7a5a38,{noise:14})); trunk.position.set(x,1.7,z); trunk.rotation.z=0.08; scene.add(trunk);
    const leafMat = voxMat(0x4f7a3a,{noise:14});
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2;
      const leaf=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.12,0.4),leafMat); leaf.position.set(x+Math.cos(a)*0.5,3.3,z+Math.sin(a)*0.5); leaf.rotation.y=a; leaf.rotation.z=0.25; scene.add(leaf); }
    addBox(x,z,0.6,0.6);
  }
  // fringed around the pool's kerb, not standing in the water: the collider audit caught two of these
  // (-4,17) and (-3,14.5) sitting inside the pool's own 5.8x4.8 collider box
  palm(-5.6,18.4); palm(1.9,18.6); palm(-5.4,13.6); palm(2.2,13.8);

  // ---- more hiding spots: taller, more enclosing cover than the jars/rubble/obelisks above ----
  // a broken L-shaped temple wall, tall enough to fully break line of sight
  function ruinedWall(x,z){
    // full player height (~1.8) — this one fully hides you, not just a peek-over
    block(3.2,1.8,0.4,0xa4854f,x,0.9,z,{noise:20});
    block(0.4,1.5,2.6,0xa4854f,x+1.4,0.75,z+1.3,{noise:20});
    // The main panel's top is at y=1.8 (0.9 + half its 1.8 height); these caps' height is randomised
    // (0.3-0.55) but sat at a fixed y=1.85, so they sank 0.1-0.275 units into the wall — the same bug as
    // the Hydra/Colosseum ruined-wall caps (see the note on the Hydra one). Positioned from each cap's own
    // height now, so it sits flush on the real top instead.
    for(let i=0;i<4;i++){ const capH=0.3+Math.random()*0.25; block(0.7,capH,0.4,0xa4854f,x-1.3+i*0.9,1.8+capH/2+0.02,z,{noise:22}); }
    addBox(x,z,3.2,0.4); addBox(x+1.4,z+1.3,0.4,2.6);
  }
  ruinedWall(-21,-19);
  // ---- THE GREAT SPHINX — the map's hero landmark. It used to be a 2.2-wide prop dumped at (-23,17),
  // i.e. behind the player's left shoulder at spawn, where it was never once seen. It's now ~5x the size
  // and sits dead on the spawn sightline at (0,-15) facing the player, with Khafre's pyramid rising
  // straight behind it through the gate. That pairing is the single most recognisable view in Egypt and
  // it's what you now open the game looking at. ----
  function greatSphinx(x,z){
    // Scale over the old (far too small) 2.2-wide prop. Held at 1.9 rather than pushed higher: the whole
    // compound is only 60x60, and at 2.6 the outstretched paws reached most of the way back to the spawn
    // point and the statue stopped reading as a landmark you approach.
    const S=1.9;
    // plain noise, NOT pattern:'plate' — the plate pattern draws panel seams that made the body and paws
    // read as a stack of wooden crates rather than one mass carved out of the bedrock
    const bodyMat  = voxMat(0xbf9a62,{noise:15});
    const faceMat  = voxMat(0xcaa771,{noise:12});
    const nemesMat = voxMat(0x2f5f8a,{noise:14,pattern:'plate'});   // painted blue-and-gold headcloth
    const mB=(w,h,d,mat,px,py,pz)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(px,py,pz); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; };
    // bedrock enclosure the statue is carved down into, so it sits in a hollow rather than on the sand
    mB(9.5*S/2.6, 0.5, 13*S/2.6, voxMat(0xa88f5e,{noise:18,pattern:'plate'}), x, 0.25, z);
    // Recumbent body. Read from head-on this whole mass hides behind the chest, so the silhouette has to be
    // carried by the parts that project forward — the flanks step outward as they come toward the viewer and
    // the paws run a long way out in front, which is what makes it a crouching lion rather than a bust.
    mB(2.6*S,1.25*S,4.4*S, bodyMat, x, 0.62*S+0.4, z-0.4*S);
    mB(2.9*S,0.95*S,1.6*S, bodyMat, x, 0.42*S+0.4, z-2.2*S);       // rear haunch, widest point
    mB(0.5*S,0.4*S,1.5*S, bodyMat, x+1.3*S, 0.3*S+0.4, z-2.6*S);   // tail curling along the right flank
    // outstretched forepaws — long, and set wide enough apart that the gap between them is a walkable
    // corridor leading to the stele, the way the real enclosure reads
    [-1,1].forEach(side=>{
      mB(0.7*S,0.62*S,3.4*S, bodyMat, x+side*0.85*S, 0.31*S+0.4, z+2.6*S);
      mB(0.8*S,0.34*S,0.7*S, bodyMat, x+side*0.85*S, 0.17*S+0.4, z+4.5*S); // paw knuckle
      // toes, so the paw ends in something articulated instead of a blunt box
      [-0.22,0,0.22].forEach(t=>{ mB(0.2*S,0.2*S,0.34*S, bodyMat, x+side*0.85*S+t*S, 0.1*S+0.4, z+4.8*S); });
    });
    // chest rising between the paws, then neck and head
    mB(1.7*S,1.5*S,1.3*S, bodyMat, x, 1.35*S+0.4, z+1.5*S);
    mB(0.8*S,0.85*S,0.75*S, bodyMat, x, 2.25*S+0.4, z+1.65*S);
    const head = mB(0.95*S,0.95*S,0.9*S, faceMat, x, 2.95*S+0.4, z+1.8*S);
    // nemes headcloth: crown slab + the two lappets falling either side of the face onto the chest. The
    // lappets are what give the head its distinctive flared trapezoid outline at a distance.
    mB(1.3*S,0.38*S,1.2*S, nemesMat, x, 3.58*S+0.4, z+1.75*S);
    [-1,1].forEach(side=>{ mB(0.3*S,1.25*S,0.85*S, nemesMat, x+side*0.62*S, 2.8*S+0.4, z+1.85*S); });
    // banded gold trim across the brow, the way the nemes is always painted
    // sunk to sit clear of the head's own top face — at 3.36*S its top landed within 0.03 of it
    mB(1.32*S,0.16*S,1.22*S, goldMat, x, 3.22*S+0.4, z+1.75*S);
    // uraeus (rearing cobra) on the brow — the one gold glint at eye level
    const ur=new THREE.Mesh(new THREE.BoxGeometry(0.2*S,0.34*S,0.2*S), goldMat); ur.position.set(x,3.55*S+0.4,z+2.26*S); scene.add(ur);
    // eyes + the broken-off ceremonial beard, so the face actually reads at distance
    [-1,1].forEach(side=>{ mB(0.17*S,0.14*S,0.06*S, voxMat(0x2a2118,{noise:6}), x+side*0.25*S, 3.05*S+0.4, z+2.26*S); });
    mB(0.34*S,0.44*S,0.22*S, voxMat(0xb08d58,{noise:12}), x, 2.42*S+0.4, z+2.2*S);
    // granite dream stele set between the paws (Thutmose IV's, historically) — a red accent at the focal
    // point, kept low and pushed well forward so it never sits in front of the chest and flattens the pose
    const stele=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.7,0.4), graniteMat); stele.position.set(x,1.25,z+5.2*S); scene.add(stele);
    const stTop=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.26,0.4), goldMat); stTop.position.set(x,2.22,z+5.2*S); scene.add(stTop);
    // colliders: body mass + chest, then each paw separately so the corridor between them stays walkable
    addBox(x,z-0.4*S,2.7*S,4.6*S); addBox(x,z-2.2*S,3.0*S,1.7*S); addBox(x,z+1.5*S,1.8*S,1.4*S);
    [-1,1].forEach(side=>{ addBox(x+side*0.85*S, z+2.6*S, 0.8*S, 3.6*S); });
    addBox(x,z+5.2*S,1.6,0.6);
  }
  greatSphinx(0,-17);

  // ---- density pass. The old map had ~20 objects on a 60x60 plain and read mostly as empty sand between

    const band=new THREE.Mesh(new THREE.BoxGeometry(w+0.75,0.28,d+0.75), voxMat(0x2f5f8a,{noise:12})); band.position.set(x,5.5,z); scene.add(band);
  }
  valleyTemple(12,-9);

  hut(11.5,8, 3.2,2.8, 2.2); hut(15.5,9.5, 2.8,2.6, 2.0); hut(12.5,12.5, 3.0,2.4, 2.1);
  (function breadOven(x,z){

  // mason's yard — half-dressed core blocks, a timber sledge and a mudbrick haul ramp. Pale unfinished
  // stone plus raw timber, and it explains how everything else here got built.
  (function masonsYard(x,z){
    const coreMat = voxMat(0xcbbd96,{noise:16,pattern:'plate'});
    [[0,0,1.6,1.2,1.1],[2.2,0.6,1.3,1.1,0.9],[0.7,2.4,1.5,1.3,1.0],[3.0,2.8,1.2,1.0,0.8]].forEach(([ox,oz,w,d,h])=>{

    for(let i=0;i<4;i++){ const tie=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.16,0.22), timber); tie.position.set(x-2.4,0.3,z-0.1+i*0.9); scene.add(tie); }

  })(-11,12);
  // toppled/half-buried columns, sandstone-toned

  // a bigger boulder cluster than the small rubble piles elsewhere

  // a proper 3-sided alcove (U-shaped nook), open to the south — real cover from every other direction
  function alcove(x,z){
    // full player height (~1.8) — a true duck-in nook, fully hidden from the other three sides
    block(0.4,1.8,2.2,0xa4854f,x-1.0,0.9,z,{noise:20});

  // 3. sea — shallows first, then open water out past the fog. Both were 70 wide and stopped dead at z=42,
  //    so the beach and the sea each ended in mid-air as a rectangle with bare horizon behind them.
  // Deep water is OPAQUE. At 0.9 it was effectively solid anyway, and being in the transparent pass meant it
  // had to be depth-sorted against the shallows band lying just above it — two large transparent surfaces
  // overlapping is exactly the case that sorts unstably. Opaque, it writes depth and the translucent
  // shallows simply draw on top of it.
  const harborWater = shoreBand(SHORE_W, harborZ1-harborZ0, waterRippleTex(), 2.6, 0x3a8fc0, 0.22, (harborZ0+harborZ1)/2,
                                {shininess:110, specular:0xbfefff, emissive:0x0a3a52});
  harborWater.userData.isWater=true; harborWater.userData.baseY=0.22; harborWater.userData.wavePhase=0;
  waterSurfaces.push(harborWater);
  // Shallows ride a fixed 0.05 above the deep water on the SAME wave phase, so the gap between them never

  const shallows = shoreBand(SHORE_W, 7, waterRippleTex(), 2.2, 0x7fc6dd, 0.27, harborZ0+3.2,
                             {shininess:110, specular:0xbfefff, transparent:true, opacity:0.72, emissive:0x0d4155});
  shallows.userData.baseY=0.27; shallows.userData.wavePhase=0;
  waterSurfaces.push(shallows);
  addBox(0,harborZ0+0.5,70,1); // invisible shoreline — keeps the player from wading in, not a built wall
  // an ancient Mediterranean merchant vessel, not just a plank box: tapered pointed bow with a painted eye
  // (real ancient ships were given eyes so the vessel could "see" its way), a curved raised stern with the
  // classic aphlaston flourish, painted shields along the gunwale, a steering oar, and a proper yarded sail
  // a Greek WAR galley, not a merchant trader — long and lean instead of round-bellied, a bronze ram at the
  // waterline (the single defining feature of an ancient warship), and a bank of oar-port stubs down both
  // sides. This is what actually conquered Egypt, so it should read as a warship at a glance.
  function warShip(x,z){
    const hullMat = voxMat(0x4a3a2e,{noise:14});
    const hull=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.7,6.0), hullMat); hull.position.set(x,0.5,z); scene.add(hull);
    const bow=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.6,1.0), hullMat); bow.position.set(x,0.5,z+3.4); scene.add(bow);
    const bowTip=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.5,0.5), hullMat); bowTip.position.set(x,0.5,z+3.95); scene.add(bowTip);
    const ramMat = metalMatP(0x8a6a2e,60,0xffe0a0);
    const ram=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.9,8), ramMat); ram.rotation.x=Math.PI/2; ram.position.set(x,0.32,z+4.45); scene.add(ram);
    const eye=new THREE.Mesh(new THREE.CircleGeometry(0.14,10), new THREE.MeshBasicMaterial({color:0x1a1410, fog:false}));
    eye.position.set(x+0.86,0.62,z+3.6); eye.rotation.y=Math.PI/2; scene.add(eye);
    const eyeRing=new THREE.Mesh(new THREE.RingGeometry(0.14,0.21,10), new THREE.MeshBasicMaterial({color:0xe8dcc0, fog:false}));
    eyeRing.position.set(x+0.86,0.62,z+3.6); eyeRing.rotation.y=Math.PI/2; scene.add(eyeRing);
    const stern=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.1,1.0), hullMat); stern.position.set(x,0.8,z-3.4); scene.add(stern);
    const aphlaston=new THREE.Mesh(new THREE.BoxGeometry(0.2,1.15,0.28), hullMat); aphlaston.position.set(x,1.8,z-3.8); aphlaston.rotation.x=0.55; scene.add(aphlaston);
    // oar-port stubs — the unmistakable warship signature, absent on any merchant hull
    const oarStubMat = voxMat(0x3a2c22,{noise:10});
    for(let i=0;i<7;i++){ const sz=z-2.6+i*0.9;
      [-0.9,0.9].forEach(sx=>{ const stub=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.4,5), oarStubMat); stub.rotation.z=Math.PI/2; stub.position.set(x+sx,0.4,sz); scene.add(stub); });

    for(let i=0;i<5;i++){ const sz=z-2.2+i*1.05;
      [-0.9,0.9].forEach(sx=>{ const shield=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.06,10), shieldMat); shield.rotation.z=Math.PI/2; shield.position.set(x+sx,0.9,sz); scene.add(shield); });

    const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,4,6), voxMat(0x4a3320,{noise:10})); mast.position.set(x,2.85,z); scene.add(mast);

    const sailStripe=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.28,0.07), new THREE.MeshLambertMaterial({color:0xb03a2a})); sailStripe.position.set(x,3.25,z+0.36); scene.add(sailStripe);
    const yardTop=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.8,6), voxMat(0x4a3320,{noise:10})); yardTop.rotation.x=Math.PI/2; yardTop.position.set(x,4.15,z+0.35); scene.add(yardTop);
    const yardBottom=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,1.7,6), voxMat(0x4a3320,{noise:10})); yardBottom.rotation.x=Math.PI/2; yardBottom.position.set(x,2.35,z+0.35); scene.add(yardBottom);
    const steerGrp=new THREE.Group(); steerGrp.position.set(x+0.85,0.85,z-3.9); steerGrp.rotation.x=0.45; steerGrp.rotation.z=-0.2; scene.add(steerGrp);
    const steerShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,2.4,6), voxMat(0x4a3320,{noise:10})); steerShaft.position.set(0,-1.2,0); steerGrp.add(steerShaft);
    const steerBlade=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.7,0.05), voxMat(0x3a2a18,{noise:10})); steerBlade.position.set(0,-2.3,0); steerGrp.add(steerBlade);
  }
  // the stern flourishes (aphlaston, steering oar) extend ~3.9 units back from the hull center — at the old
  // harborZ0+3 position that put them at z≈23.1-23.6, *before* the water actually starts (harborZ0=24), so
  // the stern was sitting on the beach/sand transition instead of in the water. Pushed further in so the

  warShip(-11,harborZ0+8); warShip(6,harborZ0+8);

  // obelisks, carved with hieroglyph relief — Egyptian holdover motif, tying the Ptolemaic-Greek era back to Egypt.
  // Real Egyptian temple gates always stood a matched PAIR at the entrance, so alongside the original lone one
  // (kept where it was) a second one now mirrors it, framing the crossroads like a real dromos entrance.
  function obelisk(x,z,h){

  obelisk(10,2.5,7); obelisk(-11,2.5,7);

  // ---- Egyptian pylon gate: the trapezoidal tapered-tower silhouette that fronted every real Egyptian temple,
  // straddling the main north-south path a few steps from spawn so the very first thing seen reads as Egypt,
  // not Greece — flagstaffs with pennants (real pylons flew them) and hieroglyph relief on every stone course
  function pylonGate(cx,cz){

      const flag=new THREE.Mesh(new THREE.BoxGeometry(0.02,1.1,0.65), new THREE.MeshLambertMaterial({color:0xb8382a})); flag.position.set(poleX,12.5,cz+0.65+0.32); scene.add(flag);

  // open Mediterranean dressing — takes over the wall's old framing role now that the map has no boundary:
  // olive and cypress trees, low rock outcrops, and a couple of fallen columns scattered toward the open edges
  function oliveTree(x,z){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.22,2.2,6), voxMat(0x6b6048,{noise:14})); trunk.position.set(x,1.1,z); trunk.rotation.z=0.06; scene.add(trunk);

    // Each blob gets its own radius and height. All four used to be radius 0.7 at y=2.5, so their four
    // squashed tops landed on exactly the same plane and fought across the whole canopy — on every olive
    // tree in the map. Varying both also makes the canopy look less like a mechanical rosette.
    for(let i=0;i<4;i++){ const a=i/4*Math.PI*2;
      const r=0.62+((i*0.17)%0.22);
      const leaf=new THREE.Mesh(new THREE.SphereGeometry(r,7,5),leafMat); leaf.scale.set(1,0.7,1);
      leaf.position.set(x+Math.cos(a)*0.5, 2.36+i*0.12, z+Math.sin(a)*0.5); scene.add(leaf); }

  function cypressTree(x,z){

  // date palm — the dominant tree of this era now, replacing most of the Greek cypress/olive: a leaning trunk,
  // six drooping fronds radiating from the crown, and a cluster of dates. Reads as Nile/Egypt at a glance in a

  function palmTree(x,z){
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.24,3.4,6), voxMat(0x8a6a3a,{noise:16})); trunk.position.set(x,1.7,z); trunk.rotation.z=0.05; scene.add(trunk);

  // papyrus reeds along the shoreline — no collider, thin enough to read as walk-through marsh plants
  function papyrusCluster(x,z){

    for(let i=0;i<5;i++){
      const ox=(Math.random()-0.5)*0.8, oz=(Math.random()-0.5)*0.8, h=1.1+Math.random()*0.5;

  }
  function rockOutcrop(x,z,s){

    addBox(x,z,2.8,0.8);
  }
  // palms now dominate (Nile character); a few cypress/olive remain for the Greek-fusion accent, not removed entirely
  palmTree(-27,-6); palmTree(-27,8); cypressTree(27,-18); cypressTree(27,-4);
  palmTree(-26,-22); oliveTree(-20,18); oliveTree(22,6); palmTree(-8,-27); oliveTree(15,-26);
  palmTree(13,-2.5); palmTree(-13,-18); palmTree(20,-20); palmTree(-24,20);

  // right at the shoreline, poking up out of the shallow edge of the harbor water (not stranded on dry sand,
