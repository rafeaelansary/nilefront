  return g;
}

// griffin: eagle head/wings + lion body and tail — a real four-legged beast, not a person-shaped bird.
// Dives in with a screech at range, then closes to claw/beak melee (weaponType==='javelin' hybrid mechanic).
function makeGriffin(){
  const g = new THREE.Group();
  // NOTE: this bot is turned via mesh.lookAt() in the shared AI loop (not a custom rotation.y assignment like
  // the minotaur), and Three.js's lookAt() already points a plain Object3D's local +Z at the target — so the
  // model is simply built facing +Z directly on `g`, with no extra flip wrapper needed.
  const furMat = voxMat(0xb5904a,{noise:16});  // tawny lion body
  const furMat2 = voxMat(0x8a6a34,{noise:14}); // darker lion accent — wings, chest, front legs
  const headMat = voxMat(0xffffff,{noise:4});  // white eagle head/neck — pure white, minimal noise so it actually reads as white
  const headMat2 = voxMat(0xf2f2ec,{noise:4}); // faint off-white shading accent on the head
  const beakMat = new THREE.MeshLambertMaterial({color:0xd8a030});
  const talonMat = new THREE.MeshLambertMaterial({color:0x2a2018});

  // low, long lion body, with a mane collar where the white neck feathers meet the tawny fur
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.55,1.1), furMat); torso.position.set(0,0.75,-0.1); g.add(torso);
  const chestFeathers = new THREE.Mesh(new THREE.BoxGeometry(0.56,0.5,0.42), furMat2); chestFeathers.position.set(0,0.85,0.46); g.add(chestFeathers);
  const maneMat = voxMat(0x9a7a3e,{noise:16});
  for(let i=0;i<5;i++){ const a=(i/5-0.4)*1.6;
    const tuft=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.22,0.09),maneMat); tuft.position.set(Math.sin(a)*0.2,1.1+Math.cos(a)*0.05,0.4+Math.cos(a)*0.1); tuft.rotation.x=-0.3; g.add(tuft); }
  // white eagle head + neck, plugged straight into the chest — no floating gap
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.42,0.3), headMat); neck.position.set(0,1.22,0.55); neck.rotation.x=-0.25; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.3,0.34), headMat); head.position.set(0,1.55,0.74); g.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.09,0.3,4), beakMat); beak.rotation.x=1.5708; beak.position.set(0,1.52,0.98); g.add(beak);
  [-1,1].forEach(side=>{
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.04), new THREE.MeshBasicMaterial({color:0xffd23a,fog:false})); eye.position.set(side*0.13,1.62,0.88); g.add(eye);
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.14,4), headMat2); ear.position.set(side*0.1,1.76,0.67); ear.rotation.x=-0.3; g.add(ear);
  });
  // shoulder bulk where the wings root — keeps the wing joint from floating off the torso
  [-1,1].forEach(side=>{
    const shoulder=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.3,0.4), furMat2); shoulder.position.set(side*0.34,1.0,0.05); g.add(shoulder);
  });
  // swept-back, tapering wings, tawny like the lion body — 3 layered segments instead of 2 flat slabs
  [-1,1].forEach(side=>{
    const wingRoot=new THREE.Group(); wingRoot.position.set(side*0.36,1.1,-0.05); wingRoot.rotation.z=side*-0.55; wingRoot.rotation.y=side*0.35; g.add(wingRoot);
    const w1=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.12,0.42),furMat); w1.position.set(side*0.32,0.06,0); wingRoot.add(w1);
    const w2=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.09,0.34),furMat2); w2.position.set(side*0.72,-0.05,-0.02); wingRoot.add(w2);
    const w3=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.06,0.24),furMat); w3.position.set(side*1.05,-0.14,-0.04); wingRoot.add(w3);
  });
  // front legs, eagle-taloned, overlapping the torso underside
  [-1,1].forEach(side=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.42,0.17),furMat2); leg.position.set(side*0.22,0.4,0.32); g.add(leg);
    const talon=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.09,0.26),talonMat); talon.position.set(side*0.22,0.2,0.42); g.add(talon);
  });
  // rear legs, lion-pawed
  [-1,1].forEach(side=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.42,0.2),furMat2); leg.position.set(side*0.22,0.4,-0.55); g.add(leg);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.11,0.26),furMat2); paw.position.set(side*0.22,0.22,-0.5); g.add(paw);
  });
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.55),furMat); tail.position.set(0,0.85,-0.75); tail.rotation.x=0.5; g.add(tail);
  const tuft=new THREE.Mesh(new THREE.SphereGeometry(0.11,6,5),furMat2); tuft.position.set(0,0.65,-1.05); g.add(tuft);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.9, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// medusa: serpentine coiled lower body instead of legs, snake-tendrils ringing the head
// instead of hair, glowing petrifying-gaze eyes. Heavy tank role (high HP, no special mechanic beyond that).
function makeMedusa(){
  const g = new THREE.Group();
  // NOTE: same as makeGriffin — this bot is turned via mesh.lookAt() in the shared AI loop, which already
  // points a plain Object3D's local +Z at the target, so the model is built facing +Z directly with no flip wrapper.
  const scaleMat = voxMat(0x3a5c3e,{noise:16});
  const scaleMat2 = voxMat(0x2a4a30,{noise:14});
  const bellyMat = voxMat(0x8a9a6a,{noise:10});
  const goldMat = metalMatP(0xad8730,80,0xffe9b0); // cursed-beauty jewelry accents, for material contrast against the scales
  // coiled tail, overlapping segments so nothing floats apart, with a belly-plate scored down the front
  const coilSegs = [{s:0.58,y:0.3,z:0.05},{s:0.5,y:0.28,z:-0.32},{s:0.4,y:0.32,z:-0.6},{s:0.3,y:0.42,z:-0.82},{s:0.2,y:0.55,z:-0.98}];
  coilSegs.forEach((seg,i)=>{
    const coil=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s*0.7,seg.s*1.35), i%2?scaleMat2:scaleMat); coil.position.set(0,seg.y,seg.z); coil.rotation.y=i*0.35; g.add(coil);
    const plate=new THREE.Mesh(new THREE.BoxGeometry(seg.s*0.4,seg.s*0.5,0.04), bellyMat); plate.position.set(0,seg.y-seg.s*0.05,seg.z+seg.s*0.66); g.add(plate);
  });
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.75,0.5), scaleMat); torso.position.set(0,1.05,0.15); g.add(torso);
  const belly=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.6,0.1), bellyMat); belly.position.set(0,1.0,0.39); g.add(belly);
  const goldBelt=new THREE.Mesh(new THREE.BoxGeometry(0.64,0.09,0.54), goldMat); goldBelt.position.set(0,0.68,0.15); g.add(goldBelt);
  const neck=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.2,0.3), scaleMat); neck.position.set(0,1.48,0.2); g.add(neck);
  // face: a tapered skull instead of one flat box — wider cranium, narrower jaw, a nose bridge and brow ridge
  const skinMat = voxMat(0x6a8a5e,{noise:12}); // paler scaled "skin" for the face, contrasting the darker body scales
  const cranium=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.38), skinMat); cranium.position.set(0,1.74,0.22); g.add(cranium);
  const jawBone=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.34), skinMat); jawBone.position.set(0,1.54,0.26); g.add(jawBone);
  const browRidge=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.06,0.12), voxMat(0x2e4a32,{noise:10})); browRidge.position.set(0,1.82,0.38); browRidge.rotation.x=0.3; g.add(browRidge);
  const noseBridge=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.16,0.1), skinMat); noseBridge.position.set(0,1.7,0.42); g.add(noseBridge);
  [-1,1].forEach(side=>{ const cheek=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.14,0.14), skinMat); cheek.position.set(side*0.19,1.66,0.34); g.add(cheek); });
  // slit-pupil glowing eyes, recessed in dark sockets, and a wide fanged mouth
  [-1,1].forEach(side=>{
    const socket=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.11,0.03), new THREE.MeshBasicMaterial({color:0x0d1a10,fog:false})); socket.position.set(side*0.1,1.76,0.4); g.add(socket);
    const eyeWhite=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.08,0.05), new THREE.MeshBasicMaterial({color:0x5aff6a,fog:false})); eyeWhite.position.set(side*0.1,1.76,0.43); g.add(eyeWhite);
    const pupil=new THREE.Mesh(new THREE.BoxGeometry(0.025,0.08,0.05), new THREE.MeshBasicMaterial({color:0x0a1a0a,fog:false})); pupil.position.set(side*0.1,1.76,0.46); g.add(pupil);
  });
  const fangMat=new THREE.MeshLambertMaterial({color:0xf0f0e0});
  const jaw=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.05,0.06), new THREE.MeshBasicMaterial({color:0x1c2418,fog:false})); jaw.position.set(0,1.58,0.46); g.add(jaw);
  [-1,1].forEach(side=>{ const fang=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.16,0.03),fangMat); fang.position.set(side*0.08,1.51,0.47); g.add(fang); });
  // a cobra-style hood flaring out behind the head — the single most iconic Medusa silhouette element
  [-1,1].forEach(side=>{
    const hood=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.42,0.34), scaleMat2); hood.position.set(side*0.26,1.7,0.1); hood.rotation.y=side*0.5; g.add(hood);
  });
  // a real head of snakes — longer, thicker, unevenly curled tendrils (base + curled tip) instead of straight
  // sticks, most carrying their own glowing eyes and a couple flicking a small forked tongue
  const snakeMat=voxMat(0x4a6a3a,{noise:14});
  const snakeMat2=voxMat(0x3a5a2c,{noise:12});
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2;
    const rise = 0.12+Math.sin(i*1.9)*0.09;
    const grp=new THREE.Group(); grp.position.set(Math.cos(a)*0.16,1.95+rise,Math.sin(a)*0.16+0.14); grp.rotation.y=a; g.add(grp);
    const base=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.055,0.2),snakeMat); base.position.set(0,0,0.1); base.rotation.x=-0.35; grp.add(base);
    const curl=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.045,0.16),snakeMat2); curl.position.set(0,0.11,0.28); curl.rotation.x=-0.9-((i%3)*0.3); grp.add(curl);
    if(i%2===0){ const se=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,0.02), new THREE.MeshBasicMaterial({color:0x5aff6a,fog:false}));
      se.position.set(0,0.17,0.36); grp.add(se); }
    if(i%4===0){ const tongue=new THREE.Mesh(new THREE.BoxGeometry(0.012,0.012,0.08), new THREE.MeshBasicMaterial({color:0x8a1a1a,fog:false}));
      tongue.position.set(0,0.17,0.42); grp.add(tongue); }
  }
  const armMat=voxMat(0x355234,{noise:14});
  [-1,1].forEach(side=>{
    const shoulder=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.22,0.24), scaleMat); shoulder.position.set(side*0.34,1.32,0.18); g.add(shoulder);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.55,0.2),armMat); arm.position.set(side*0.42,1.0,0.2); arm.rotation.z=side*0.2; g.add(arm);
    const bracelet=new THREE.Mesh(new THREE.BoxGeometry(0.23,0.05,0.23), goldMat); bracelet.position.set(side*0.43,0.86,0.22); g.add(bracelet);
    const claw=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.2,4),new THREE.MeshLambertMaterial({color:0xe8e4d4})); claw.position.set(side*0.46,0.7,0.32); claw.rotation.x=1.4; g.add(claw);
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.3, 0); marker.scale.set(1.05,1.05,1.05); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// war hound (single unit): a monstrous armored guard-dog, not a person in armor — low, muscular
// quadruped body, bared fangs, glowing eyes, studded bronze war-gear (collar + spine plates) instead
// of held weapons. The shared AI loop turns bots with mesh.lookAt(), which — for a plain Object3D (not
// a camera) — points local +Z at the target, so this is built facing +Z directly with no flip, same as
// griffin/medusa (minotaur is the one exception: it bypasses lookAt() and sets rotation.y directly,
// which needs the opposite convention, hence its own flip). Only ever used as a building block for the
// pack below — never spawned alone.
function makeWarHoundUnit(){
  const g = new THREE.Group();
  const body = g;
  const furMat = voxMat(0x201d19,{noise:16});
  const furMat2 = voxMat(0x4a453d,{noise:14});
  const bronzeMat = metalMatP(0xad8730,85,0xfff2c8);
  const fangMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xff3a1a,fog:false});

  const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.85), furMat); bodyBox.position.set(0,0.58,0); body.add(bodyBox);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.3,0.3), furMat2); chest.position.set(0,0.55,0.42); body.add(chest);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.28,0.32), furMat); head.position.set(0,0.78,0.62); body.add(head);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.24), furMat2); snout.position.set(0,0.68,0.85); body.add(snout);
  [-1,1].forEach(side=>{
    const fang=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.1,4), fangMat); fang.position.set(side*0.08,0.6,0.94); fang.rotation.x=Math.PI; body.add(fang);
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.2,4), furMat); ear.position.set(side*0.13,0.98,0.55); ear.rotation.z=side*0.25; body.add(ear);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.05,0.04), eyeMat); eye.position.set(side*0.1,0.82,0.78); body.add(eye);
  });
  // spiked bronze war-collar + armored spine plates — the studded military gear that reads as "Roman" at a glance
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.12,0.34), bronzeMat); collar.position.set(0,0.68,0.42); body.add(collar);
  for(let i=0;i<3;i++){ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.1,4), bronzeMat); spike.position.set(-0.12+i*0.12,0.76,0.42); body.add(spike); }
  for(let i=0;i<3;i++){ const plate=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.08,0.14), bronzeMat); plate.position.set(0,0.82,0.1-i*0.24); body.add(plate); }
  [[-0.16,0.28],[0.16,0.28],[-0.16,-0.3],[0.16,-0.3]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.4,0.14),furMat); leg.position.set(lx,0.24,lz); body.add(leg);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.1,0.18), furMat2); paw.position.set(lx,0.06,lz); body.add(paw);
  });
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.4),furMat); tail.position.set(0,0.62,-0.55); tail.rotation.x=0.5; body.add(tail);
  return g;
}
// war hound pack: 3 hound units in one formation, sharing a single hitbox/HP/AI — same "one pack entity"
// mechanic as the pyramid era's scarab swarm. Spawned once per Roman wave instead of looped into the
// regular roster (see spawnWave), so hounds read as a themed pack encounter, not filler grunts.
function makeWarHoundPack(){
  const g = new THREE.Group();
  const formation = [ {x:-0.55, z:0.18, ry:-0.3, s:1.0}, {x:0.5, z:0.05, ry:0.35, s:0.95}, {x:0.0, z:-0.4, ry:0.05, s:1.05} ];
  formation.forEach(f=>{
    const unit = makeWarHoundUnit();
    unit.position.set(f.x,0,f.z); unit.rotation.y=f.ry; unit.scale.setScalar(f.s);
    g.add(unit);
  });
  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.35, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// manticore: lion body + bat wings + a scorpion tail — the Roman era's melee monster. Distinct from the
// Greek griffin (feathered eagle head/wings) and the pyramid scorpion (ground stalker) it borrows
// silhouette ideas from — leathery bat wings instead of feathers, a lion face instead of a beak.
function makeManticore(){
  const g = new THREE.Group();
  // lookAt() points a plain Object3D's local +Z at the target, so this is built facing +Z directly,
  // same as griffin/medusa/warhound (see the note on makeWarHoundUnit for why minotaur alone differs)
  const body = g;
  const furMat = voxMat(0xc9863a,{noise:10});    // warm golden-tawny lion fur, not reptile-red
  const furMat2 = voxMat(0x9a622a,{noise:9});
  const maneMat = voxMat(0x5a3216,{noise:8});    // deep russet mane — lower noise so the cubes read clean/chunky, not fuzzy
  const chitinMat = voxMat(0x2e1c14,{noise:14}); // dark, matte chitin for the tail — reads as insect armor, not dragon scale
  const wingMat = voxMat(0x241010,{noise:12});
  const stingerMat = new THREE.MeshBasicMaterial({color:0xff5a1a,fog:false});

  // bigger lion body — a longer, heavier torso with a shoulder/chest hump at the front and a neck that
  // carries the head OUT IN FRONT of the body (before, the mane sat down inside the chest)
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.54,0.58,1.2), furMat); torso.position.set(0,0.74,-0.2); body.add(torso);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.54,0.44), furMat2); chest.position.set(0,0.82,0.3); body.add(chest);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.4,0.34), furMat2); neck.position.set(0,0.98,0.52); body.add(neck);

  // ==== manticore head: clean voxel lion from the reference portrait ====
  // Built around HY/HZ so the whole head sits FORWARD of the body on the neck, not buried in the chest.
  // Coarse and clean: one solid dark mane mass for the round frame + volume, a solid tan head, a long
  // protruding snout, and a small set of BIG feature blocks so the face reads clearly.
  const maneMatLight = voxMat(0x7a4a20,{noise:8});
  const creamMat = new THREE.MeshLambertMaterial({color:0xead9b0});
  const inkMat = new THREE.MeshLambertMaterial({color:0x14100a});
  const HY = 1.24, HZ = 0.62;   // head centre — pushed up and forward, clear of the chest

  // mane as CHUNKY big distinct cubes (the reference reads as ~8 big blocks across, not a fuzzy ball).
  // A solid dark backing mass for volume, then ONE clean ring of large cubes — no noisy double-ring.
  const maneMass = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.98,0.5), maneMat); maneMass.position.set(0,HY-0.05,HZ-0.06); body.add(maneMass);
  const maneMassW = new THREE.Mesh(new THREE.BoxGeometry(0.72,1.12,0.46), maneMat); maneMassW.position.set(0,HY-0.05,HZ-0.06); body.add(maneMassW); // taller narrow → oval
  for(let i=0;i<14;i++){ const a=(i/14)*Math.PI*2;
    const mat = i%3===0 ? maneMatLight : maneMat;
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.28,0.26), mat);   // big chunky cubes
    t.position.set(Math.sin(a)*0.5, HY-0.05+Math.cos(a)*0.58, HZ+0.04); body.add(t); }

  // BIGGER solid tan head in the middle of the mane, with a LONG protruding snout below-center
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.58,0.36), furMat); head.position.set(0,HY+0.02,HZ+0.2); body.add(head);
  // thinner but longer snout — narrower width, deeper reach forward
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.28,0.48), furMat2); snout.position.set(0,HY-0.18,HZ+0.5); body.add(snout);
  const snoutTop = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.1,0.46), furMat); snoutTop.position.set(0,HY-0.04,HZ+0.5); body.add(snoutTop);

  // BIG clear face features on the head/snout front surfaces
  const hf = HZ+0.2+0.18+0.01;   // head front surface
  const sf = HZ+0.5+0.24+0.01;   // snout front surface (thinner/longer snout → further forward)
  // eyes like the reference: bold dark eyes each in a BIG pale cream patch, spaced apart in the upper face
  [-1,1].forEach(side=>{
    const eyeWhite=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.03), creamMat); eyeWhite.position.set(side*0.15,HY+0.08,hf); body.add(eyeWhite);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.12,0.05), inkMat); eye.position.set(side*0.13,HY+0.07,hf+0.01); body.add(eye);
  });
  // clean face markings matching the reference (was a dark "M" blob before): a big pale cream muzzle patch
  // filling the lower snout front, a crisp black INVERTED-TRIANGLE nose on top of it, a thin philtrum, and
  // one subtle straight mouth line — distinct pieces with cream showing between them, not a dark cluster
  const muzzle=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.22,0.02), creamMat); muzzle.position.set(0,HY-0.18,sf); body.add(muzzle);
  const noseTop=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.06,0.04), inkMat); noseTop.position.set(0,HY-0.08,sf+0.015); body.add(noseTop);
  const noseMid=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.04,0.04), inkMat); noseMid.position.set(0,HY-0.12,sf+0.015); body.add(noseMid);
  const noseTip=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.03,0.04), inkMat); noseTip.position.set(0,HY-0.15,sf+0.015); body.add(noseTip);
  const philtrum=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.05,0.04), inkMat); philtrum.position.set(0,HY-0.19,sf+0.015); body.add(philtrum);
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.025,0.04), inkMat); mouth.position.set(0,HY-0.23,sf+0.015); body.add(mouth);
  // ears poking out the top corners of the mane
  [-1,1].forEach(side=>{
    const ear=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.15,0.12), maneMat); ear.position.set(side*0.34,HY+0.36,HZ+0.02); body.add(ear);
    const earIn=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.04), furMat2); earIn.position.set(side*0.34,HY+0.35,HZ+0.09); body.add(earIn);
  });
  // bat wings — more detail: a two-part leathery membrane, four finger-bones fanning across it, and a
  // clawed hook at the leading edge. Angled up more (steeper rotation.z + raised root) so they sweep
  // upward off the shoulders instead of sitting out flat.
  [-1,1].forEach(side=>{
    const wingRoot=new THREE.Group(); wingRoot.position.set(side*0.34,1.08,-0.1); wingRoot.rotation.z=side*0.5; wingRoot.rotation.y=side*0.35; body.add(wingRoot);
    const mem1=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.05,0.46), wingMat); mem1.position.set(side*0.28,0,-0.02); wingRoot.add(mem1);
    const mem2=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.045,0.32), wingMat); mem2.position.set(side*0.66,-0.09,-0.08); wingRoot.add(mem2);
    for(let i=0;i<4;i++){ const bone=new THREE.Mesh(new THREE.BoxGeometry(0.92,0.03,0.03), furMat2); bone.position.set(side*0.42,0.03,-0.18+i*0.11); bone.rotation.y=side*(i-1.5)*0.12; wingRoot.add(bone); }
    const wclaw=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.13,4), inkMat); wclaw.position.set(side*0.88,-0.02,-0.18); wclaw.rotation.z=side*1.2; wingRoot.add(wclaw);
  });
  // round, padded lion paws with visible toes — not clawed dragon feet — spread wider for the bigger body
  [[-0.2,0.4],[0.2,0.4],[-0.2,-0.46],[0.2,-0.46]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.5,0.22),furMat2); leg.position.set(lx,0.42,lz); body.add(leg);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.14,0.28),furMat2); paw.position.set(lx,0.18,lz); body.add(paw);
    const toe=new THREE.Mesh(new THREE.BoxGeometry(0.23,0.05,0.09), furMat); toe.position.set(lx,0.12,lz+0.13); body.add(toe);
  });
  // segmented scorpion tail in dark chitin (not the body's fur color), chain-built like the bow-limb
  // code (heldLimb) — each segment's start is the previous segment's actual end point, with a touch of
  // overlap, instead of 4 independent boxes at hand-picked coordinates that didn't line up edge to edge
  // and read as floating disconnected chunks. Arcs up from the lower back and forward over the back to a
  // glowing stinger poised to strike.
  {
    let ty=0.85, tz=-0.5, theta=-1.9;
    const overlap=0.015;
    [{s:0.16,len:0.26,dt:0.5},{s:0.14,len:0.24,dt:0.6},{s:0.12,len:0.22,dt:0.7},{s:0.1,len:0.19,dt:0.8},{s:0.08,len:0.15,dt:0.7}].forEach(seg=>{
      const thetaMid = theta + seg.dt/2;
      const dy=Math.cos(thetaMid), dz=Math.sin(thetaMid);
      const cy = ty + (seg.len/2)*dy, cz = tz + (seg.len/2)*dz;
      const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.len,seg.s), chitinMat);
      m.position.set(0,cy,cz); m.rotation.x = thetaMid; body.add(m);
      const tipY = ty+seg.len*dy, tipZ = tz+seg.len*dz;
      ty = tipY - overlap*dy; tz = tipZ - overlap*dz;
      theta += seg.dt;
    });
    const stinger = new THREE.Mesh(new THREE.ConeGeometry(0.055,0.16,4), stingerMat); stinger.position.set(0,ty,tz); stinger.rotation.x = theta; body.add(stinger);
    const glow = new THREE.PointLight(0xff5a1a,0.5,2.2); glow.position.copy(stinger.position); body.add(glow);
  }

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.85, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// basilisk: a rearing serpent-king with a flared cobra hood and a golden crest — the Roman era's ranged
// monster, redesigned for more presence (bigger raised head/hood, 4 clawed legs instead of 2, spine
// frills, fangs, a more saturated toxic-yellow-green scale color that no longer reads close to the Greek
// medusa's blue-green). Distinct from medusa (humanoid torso + arms) — no torso or arms at all, just a
// long low coiled body. Built facing +Z directly (lookAt() points a plain Object3D's +Z at the target),
// same as griffin/medusa/manticore/warhound.
function makeBasilisk(){
  const g = new THREE.Group();
  const body = g;
  const scaleMat = voxMat(0x6b7a1e,{noise:16});
  const scaleMat2 = voxMat(0x424e12,{noise:14});
  const bellyMat = voxMat(0x9a9a5a,{noise:10});
  const goldMat = metalMatP(0xad8730,80,0xffe9b0);
  const eyeMat = new THREE.MeshBasicMaterial({color:0x9aff3a,fog:false});
  const fangMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});

  const coilSegs = [{s:0.5,y:0.26,z:-0.1},{s:0.44,y:0.24,z:-0.42},{s:0.34,y:0.28,z:-0.68},{s:0.24,y:0.36,z:-0.86},{s:0.15,y:0.46,z:-0.98}];
  coilSegs.forEach((seg,i)=>{
    const coil=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s*0.7,seg.s*1.3), i%2?scaleMat2:scaleMat); coil.position.set(0,seg.y,seg.z); coil.rotation.y=i*0.3; body.add(coil);
    const plate=new THREE.Mesh(new THREE.BoxGeometry(seg.s*0.4,seg.s*0.45,0.04), bellyMat); plate.position.set(0,seg.y-seg.s*0.08,seg.z+seg.s*0.62); body.add(plate);
    if(i<3){ const frill=new THREE.Mesh(new THREE.ConeGeometry(seg.s*0.22,seg.s*0.4,3), scaleMat2); frill.position.set(0,seg.y+seg.s*0.42,seg.z); frill.rotation.x=-1.6; body.add(frill); }
  });
  // reared-up neck and head, higher and more upright than before, for a striking-cobra posture
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.4,0.3), scaleMat); neck.position.set(0,0.5,0.24); neck.rotation.x=-0.25; body.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.28,0.38), scaleMat); head.position.set(0,0.68,0.5); body.add(head);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.17,0.22), scaleMat2); snout.position.set(0,0.62,0.72); body.add(snout);
  [-1,1].forEach(side=>{ const fang=new THREE.Mesh(new THREE.ConeGeometry(0.025,0.09,4), fangMat); fang.position.set(side*0.06,0.55,0.78); fang.rotation.x=Math.PI; body.add(fang); });
  // gold serpent-king crest, taller now that the head is reared up
  for(let i=0;i<4;i++){ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.18-i*0.02,4), goldMat); spike.position.set(0,0.84+i*0.02,0.62-i*0.13); spike.rotation.x=-0.3; body.add(spike); }
  // a wide flared cobra hood behind the head — the single biggest new silhouette piece, giving the
  // basilisk real presence instead of just being a thin coiled tail with a small head
  [-1,1].forEach(side=>{
    const hood=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.34,0.4), scaleMat2); hood.position.set(side*0.24,0.66,0.38); hood.rotation.y=side*0.55; body.add(hood);
    const hoodEdge=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.06,0.4), goldMat); hoodEdge.position.set(side*0.32,0.8,0.38); hoodEdge.rotation.y=side*0.55; body.add(hoodEdge);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.04), eyeMat); eye.position.set(side*0.11,0.72,0.64); body.add(eye);
  });
  // 4 small clawed legs (front + back pair) instead of the old single pair, so it reads as a real
  // creature dragging its coils along rather than a snake with two stray legs
  [[-0.16,0.14],[0.16,0.14],[-0.16,-0.5],[0.16,-0.5]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.2,0.1), scaleMat2); leg.position.set(lx,0.12,lz); body.add(leg);
    const claw=new THREE.Mesh(new THREE.ConeGeometry(0.045,0.11,4), goldMat); claw.position.set(lx,0.03,lz+0.08); claw.rotation.x=1.4; body.add(claw);
  });
  const tongue=new THREE.Mesh(new THREE.BoxGeometry(0.015,0.015,0.12), new THREE.MeshBasicMaterial({color:0x8a1a1a,fog:false})); tongue.position.set(0,0.6,0.85); body.add(tongue);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.05, 0); marker.scale.set(0.9,0.9,0.9); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ---- Islamic era creatures (waves 10-12): Ifrit (ranged fire djinn) / Ghoul (fast melee) / Roc pack
// (themed dive-bomber encounter, reusing the griffin's dive-then-claw AI) — no SKINS entry needed, same as
// every other era's non-humanoid monsters ----

// ifrit: a floating fire djinn — no legs, a torso that tapers into a licking flame-cone "tail" instead of
// feet, glowing ember skin, small backswept horns. The Islamic era's ranged monster (weaponType 'pistol',
// same pure-ranged AI as jackal/soldier — it holds distance rather than closing to melee like the griffin/
// basilisk hybrid). Built facing +Z directly, same convention as every other creature (mesh.lookAt in the AI loop).
function makeIfrit(){
  const g = new THREE.Group();
  const emberMat = voxMat(0xd8481c,{noise:14});
  const emberMat2 = voxMat(0xa8280e,{noise:12});
  const flameMat = new THREE.MeshBasicMaterial({color:0xff8a2a,fog:false});
  const flameMat2 = new THREE.MeshBasicMaterial({color:0xffd23a,fog:false});
  const darkMat = voxMat(0x2a140a,{noise:10});

  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.56,0.5,0.32), emberMat); chest.position.set(0,1.3,0); g.add(chest);
  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.36,0.26), emberMat2); belly.position.set(0,0.98,0); g.add(belly);
  [{y:0.62,r:0.26,h:0.5},{y:0.32,r:0.17,h:0.42},{y:0.1,r:0.09,h:0.34}].forEach((c,i)=>{
    const cone=new THREE.Mesh(new THREE.ConeGeometry(c.r,c.h,7), i%2? flameMat:flameMat2); cone.position.set(0,c.y,0); g.add(cone);
  });
  const tailLight = new THREE.PointLight(0xff8a2a,0.9,3.2); tailLight.position.set(0,0.4,0); g.add(tailLight);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.36,0.32), emberMat); head.position.set(0,1.72,0); g.add(head);
  [-1,1].forEach(side=>{
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.07,0.04), flameMat2); eye.position.set(side*0.09,1.74,0.17); g.add(eye);
    const horn=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.26,4), darkMat); horn.position.set(side*0.14,1.94,-0.04); horn.rotation.x=-0.5; horn.rotation.z=side*0.3; g.add(horn);
  });
  const jaw=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.08,0.06), darkMat); jaw.position.set(0,1.56,0.17); g.add(jaw);
  [-1,1].forEach(side=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.42,0.13), emberMat2); arm.position.set(side*0.38,1.18,0.08); arm.rotation.z=side*-0.5; g.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.09,6,5), flameMat); hand.position.set(side*0.5,0.98,0.22); g.add(hand);
  });
  const wispMat = voxMat(0x4a4038,{noise:10}); // hoisted out of the loop below — one shared material for all 5 wisps, not a fresh texture per wisp
  for(let i=0;i<5;i++){ const a=(i/5)*Math.PI*2;
    const wisp=new THREE.Mesh(new THREE.SphereGeometry(0.06+Math.random()*0.05,5,4), wispMat);
    wisp.position.set(Math.cos(a)*0.3, 1.45+Math.sin(a)*0.1, Math.sin(a)*0.3-0.1); g.add(wisp);
  }

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.15, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// roc pack: 3 giant rocs sharing one hitbox/HP/AI, same pack mechanic as the warhound/scarab packs — the
// Islamic era's themed pack encounter, reusing the griffin's dive-then-claw AI (weaponType 'javelin') under
// this new skin/model.
function makeRocPack(){
  const g = new THREE.Group();
  const formation = [ {x:-0.6, z:0.15, ry:-0.25, s:1.0}, {x:0.55, z:0.0, ry:0.3, s:0.92}, {x:0.0, z:-0.45, ry:0.05, s:1.08} ];
  formation.forEach(f=>{
    const unit = makeRocUnit();
    unit.position.set(f.x,0,f.z); unit.rotation.y=f.ry; unit.scale.setScalar(f.s);
    g.add(unit);
  });
  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.7, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ifrit king: a towering fire djinn lord — Boss IV, the Islamic era's boss and (per the current roadmap)
// the campaign's final boss. Built like a scaled-up, more ornamented ifrit: a wider ember-glass chest
// plate, a crown of curved horns, a raging multi-cone flame column instead of the regular ifrit's slim
// flame tail, and twin burning braziers floating at its shoulders.
function makeIfritKing(){
  const g = new THREE.Group();
  const emberMat = voxMat(0xc93a14,{noise:14});
  const emberMat2 = voxMat(0x8a2008,{noise:12});
  const goldMat = metalMatP(0xe0a830,85,0xfff2c8);
  const flameMat = new THREE.MeshBasicMaterial({color:0xff8a2a,fog:false});

  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.55,0.05), goldMat); plate.position.set(0,2.15,0.29); g.add(plate);
  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.55,0.42), emberMat2); belly.position.set(0,1.55,0); g.add(belly);
  [{y:1.0,r:0.44,h:0.85},{y:0.5,r:0.3,h:0.7},{y:0.14,r:0.18,h:0.55},{y:-0.1,r:0.08,h:0.4}].forEach((c,i)=>{
    const cone=new THREE.Mesh(new THREE.ConeGeometry(c.r,c.h,8), i%2? flameMat:flameMat2); cone.position.set(0,c.y,0); g.add(cone);
  });
  const flameLight = new THREE.PointLight(0xff8a2a,1.6,7); flameLight.position.set(0,0.6,0); g.add(flameLight);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.52,0.46), emberMat); head.position.set(0,2.75,0); g.add(head);
  [-1,1].forEach(side=>{
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.1,0.05), flameMat2); eye.position.set(side*0.13,2.78,0.25); g.add(eye);
    for(let i=0;i<2;i++){ const horn=new THREE.Mesh(new THREE.ConeGeometry(0.07-i*0.02,0.4-i*0.12,4), darkMat);
      horn.position.set(side*(0.2+i*0.1),3.05+i*0.1,-0.05-i*0.08); horn.rotation.x=-0.6; horn.rotation.z=side*(0.35+i*0.15); g.add(horn); }
  });
  const jaw=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,0.08), darkMat); jaw.position.set(0,2.5,0.25); g.add(jaw);
  const crownBand=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.3,0.1,8), goldMat); crownBand.position.set(0,3.0,0); g.add(crownBand);
  [-1,1].forEach(side=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.7,0.24), emberMat2); arm.position.set(side*0.62,2.0,0.12); arm.rotation.z=side*-0.4; g.add(arm);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.16,7,6), flameMat); hand.position.set(side*0.85,1.55,0.36); g.add(hand);
    const brazier=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.2,0.16,8), darkMat); brazier.position.set(side*1.0,2.6,-0.1); g.add(brazier);
    const brazierFlame=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.3,6), flameMat2); brazierFlame.position.set(side*1.0,2.78,-0.1); g.add(brazierFlame);
    const brazierLight = new THREE.PointLight(0xffb84a,0.8,3); brazierLight.position.set(side*1.0,2.7,-0.1); g.add(brazierLight);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 3.5, 0); marker.scale.set(1.4,1.4,1.4); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ===== BOSS II — HYDRA: a low serpent body with a central hump and FIVE rising necks, each a chain-built
// serpentine tower ending in a fanged head with glowing eyes. Built facing +Z (turned via mesh.lookAt() in
// the shared AI loop). Boss-scaled up at spawn, so keep local proportions modest. =====
// Redesigned so the silhouette actually reads as "multi-headed serpent" at a glance, not a lizard with
// lumps on its back: a long tapering serpent trunk (no separate torso/hump blocks), 5 heads fanned out
// WIDE (not clustered forward) on thin sinuous necks, and heads shaped like an actual snake head — flat
// wedge skull, a flared cobra-style hood, an open jaw with visible fangs top+bottom, and a forked tongue —
// instead of the old generic boxy head+snout.
function makeHydra(){
  const g = new THREE.Group();
  const scaleMat = voxMat(0x3a5c3e,{noise:14});
  const scaleMat2 = voxMat(0x2a4630,{noise:12});
  const bellyMat = voxMat(0x7a8a5a,{noise:10});
  const headMat = voxMat(0x35502e,{noise:12});
  const hoodMat = voxMat(0x86a03a,{noise:12});   // sickly yellow-green cobra hood — reads clearly against the dark green scales
  const fangMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xff3a2a,fog:false});
  const crestMat = voxMat(0x1c2a18,{noise:10});
  const tongueMat = new THREE.MeshBasicMaterial({color:0xc4283a,fog:false});

  // serpent trunk: one continuous tapering run of stacked segments (no rotation math, just shrinking width
  // + a gentle rise/fall in Y per segment) from the tail tip up to where the necks sprout — reads as one
  // big snake body instead of a lizard torso with a hump bolted on.
  const trunkSegs = [
    {z: 0.55, w:1.55, h:0.85, y:0.62}, {z:-0.05, w:1.35, h:0.72, y:0.55},
    {z:-0.65, w:1.05, h:0.6,  y:0.46}, {z:-1.2,  w:0.75, h:0.48, y:0.38},
    {z:-1.7,  w:0.5,  h:0.36, y:0.3},
  ];
  trunkSegs.forEach((s,i)=>{
    const mat = i%2 ? scaleMat2 : scaleMat;
    const seg=new THREE.Mesh(new THREE.BoxGeometry(s.w,s.h,0.62), mat); seg.position.set(0,s.y,s.z); g.add(seg);
    const belly=new THREE.Mesh(new THREE.BoxGeometry(s.w*0.62,s.h*0.28,0.6), bellyMat); belly.position.set(0,s.y-s.h*0.42,s.z); g.add(belly);
  });
  // coiled tail tip trailing behind the trunk's last (thinnest) segment
  { let ty=0.3, tz=-2.0, theta=-1.4; const overlap=0.02;
    [{s:0.34,len:0.42},{s:0.26,len:0.36},{s:0.18,len:0.3},{s:0.11,len:0.24}].forEach(seg=>{
      const dy=Math.cos(theta), dz=Math.sin(theta);
      const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s,seg.len), scaleMat); m.position.set(0,ty+(seg.len/2)*dy, tz+(seg.len/2)*dz); m.rotation.x=theta; g.add(m);
      tz = tz + seg.len*dz - overlap*dz; ty = ty + seg.len*dy - overlap*dy; theta += 0.4;
    });
  }
  // one serpentine neck+head, chain-built rising up and fanning forward/outward. baseX/lean spread the 5
  // heads WIDE so all 5 are visually distinct instead of clustering into one mass — this is the single
  // biggest fix versus the old design.
  function neck(baseX, lean, height){
    let y=1.0, z=0.35, x=baseX, theta=-1.05; // theta from near-vertical, arcing forward
    const seg=height, dt=0.3;
    for(let i=0;i<seg;i++){
      const dz=Math.sin(theta), dy=Math.cos(theta);
      const len=0.4, cy=y+(len/2)*dy, cz=z+(len/2)*dz, cx=x+lean*(i/seg);
      // taper the neck — thick where it meets the body, noticeably thinner near the head, so it reads as a
      // sinuous snake neck rather than a stack of same-size cubes
      const w = 0.34 - (i/seg)*0.14;
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,len,w), i%2?scaleMat2:scaleMat); m.position.set(cx,cy,cz); m.rotation.x=theta; g.add(m);
      // a small dorsal crest fin on each neck segment
      const fin=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.2,0.12), crestMat); fin.position.set(cx,cy+0.14,cz-0.05); fin.rotation.x=theta; g.add(fin);
      y=y+len*dy; z=z+len*dz; theta+=dt;
    }
    // head at the neck tip — a flat wedge skull (wider than tall, tapering to a snout) instead of a
    // generic box, an open jaw (separate upper/lower pieces) baring fangs, a forked tongue, and a flared
    // hood behind the head — the combination is what actually reads as "snake head" from a distance.
    const hx=x+lean, hy=y+0.02, hz=z+0.18;
    const skull=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.22,0.3), headMat); skull.position.set(hx,hy+0.1,hz); g.add(skull);
    const upperJaw=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.12,0.42), scaleMat2); upperJaw.position.set(hx,hy+0.06,hz+0.28); g.add(upperJaw);
    const lowerJaw=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.09,0.36), bellyMat); lowerJaw.position.set(hx,hy-0.1,hz+0.26); lowerJaw.rotation.x=-0.35; g.add(lowerJaw);
    // flared hood: two angled plates behind the skull, cobra-style — the single most identifying "snake"
    // silhouette cue, and it also helps visually separate each of the 5 heads from its neighbours
    [-1,1].forEach(s=>{
      const hood=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.28,0.18), hoodMat); hood.position.set(hx+s*0.18,hy+0.08,hz-0.08); hood.rotation.z=s*0.55; hood.rotation.y=s*0.3; g.add(hood);
    });
    [-1,1].forEach(s=>{
      const eye=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.04), eyeMat); eye.position.set(hx+s*0.11,hy+0.14,hz+0.13); g.add(eye);
      // two visible fangs per side — one from the upper jaw pointing down, echoing a real snake bite
      const fangA=new THREE.Mesh(new THREE.ConeGeometry(0.025,0.14,4), fangMat); fangA.position.set(hx+s*0.08,hy-0.02,hz+0.44); fangA.rotation.x=Math.PI; g.add(fangA);
      const fangB=new THREE.Mesh(new THREE.ConeGeometry(0.02,0.1,4), fangMat); fangB.position.set(hx+s*0.13,hy+0.0,hz+0.4); fangB.rotation.x=Math.PI; g.add(fangB);
    });
    // forked tongue flicking out past the jaw
    const tongueRoot=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,0.22), tongueMat); tongueRoot.position.set(hx,hy-0.05,hz+0.56); g.add(tongueRoot);
    [-1,1].forEach(s=>{ const fork=new THREE.Mesh(new THREE.BoxGeometry(0.025,0.025,0.1), tongueMat); fork.position.set(hx+s*0.035,hy-0.05,hz+0.68); fork.rotation.y=s*0.5; g.add(fork); });
  }
  neck( 0,    0.0,  7);   // centre head, tallest, straight up the middle
  neck(-1.0, -1.6,  6);   // wide left pair
  neck( 1.0,  1.6,  6);   // wide right pair
  neck(-1.9, -2.6,  5);   // outermost left — splayed well clear of its neighbour
  neck( 1.9,  2.6,  5);   // outermost right

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 3.2, 0); marker.scale.set(1.4,1.4,1.4); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ===== BOSS III — COLOSSEUM CHAMPION: a towering armored gladiator. A big humanoid rig in iron/bronze
// lorica with a crested galea helmet, a huge gladius in one hand and a scutum shield on the other arm.
// Built facing +Z (turned via mesh.lookAt() in the shared AI loop). Boss-scaled up at spawn. =====
function makeChampion(){
  const g = new THREE.Group();
  const skinMat = voxMat(0xc98a5a,{noise:12});
  const armorMat = voxMat(0x8a9299,{noise:10,pattern:'plate'});   // iron lorica
  const armorDark = voxMat(0x5a6068,{noise:10});
  const bronzeMat = metalMatP(0xad8730,85,0xfff2c8);
  const tunicMat = voxMat(0x8a1f1f,{noise:14});                   // deep red tunic
  const crestMat = new THREE.MeshLambertMaterial({color:0xc4271a});
  const steelMat = new THREE.MeshPhongMaterial({color:0xd8dde3, shininess:110, specular:0xffffff});
  const inkMat = new THREE.MeshBasicMaterial({color:0xff5a2a,fog:false});

  // torso: iron cuirass over a red tunic skirt
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.5), armorMat); chest.position.set(0,1.5,0); g.add(chest);
  const abs = new THREE.Mesh(new THREE.BoxGeometry(0.82,0.4,0.46), armorDark); abs.position.set(0,1.05,0); g.add(abs);
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.44,0.52), tunicMat); skirt.position.set(0,0.72,0); g.add(skirt);
  for(let i=0;i<6;i++){ const strip=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.4,0.06), tunicMat); strip.position.set(-0.36+i*0.145,0.62,0.28); g.add(strip); } // pteruges
  const belt = new THREE.Mesh(new THREE.BoxGeometry(0.92,0.14,0.54), bronzeMat); belt.position.set(0,0.92,0); g.add(belt);
  // short neck + a bronze gorget collar. The old collar shared the chest's exact depth/z (both 0.5 deep,
  // centred at z=0), so their front faces coincided and z-fought. This neck is narrower and the collar is
  // proud of the chest (deeper, lifted above the chest top at y=1.9) so no faces overlap.
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.22,0.34), skinMat); neck.position.set(0,1.96,0.02); g.add(neck);
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.52,0.14,0.56), bronzeMat); collar.position.set(0,1.98,0.02); g.add(collar);

  // head + crested galea helmet
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.44,0.44), skinMat); head.position.set(0,2.2,0.02); g.add(head);
  const helm = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.28,0.5), armorMat); helm.position.set(0,2.4,0.02); g.add(helm);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.1,0.06), armorDark); visor.position.set(0,2.22,0.24); g.add(visor);
  [-1,1].forEach(s=>{ const eye=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.05,0.04), inkMat); eye.position.set(s*0.1,2.2,0.25); g.add(eye); });
  const cheek = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.2,0.06), armorMat); cheek.position.set(0,2.08,0.23); g.add(cheek); // face guard
  // transverse red crest (centurion style) running side-to-side
  const crestRidge = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.1,0.14), crestMat); crestRidge.position.set(0,2.6,0.02); g.add(crestRidge);
  for(let i=0;i<7;i++){ const plume=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,0.05), crestMat); plume.position.set(-0.3+i*0.1,2.68,0.02); g.add(plume); }

  // shoulders
  [-1,1].forEach(s=>{ const pad=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.26,0.5), armorMat); pad.position.set(s*0.56,1.72,0); g.add(pad); });

  // LEFT arm holds a big round scutum shield
  const armL=new THREE.Group(); armL.position.set(-0.62,1.6,0); g.add(armL);
  const upL=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.5,0.24), skinMat); upL.position.y=-0.28; armL.add(upL);
  const foreL=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.42,0.22), skinMat); foreL.position.y=-0.66; armL.add(foreL);
  const shield=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.0,0.9), tunicMat); shield.position.set(-0.12,-0.5,0.26); armL.add(shield);
  const shieldTrim1=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,0.9), bronzeMat); shieldTrim1.position.set(-0.12,-0.02,0.26); armL.add(shieldTrim1);
  const shieldTrim2=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,0.9), bronzeMat); shieldTrim2.position.set(-0.12,-0.98,0.26); armL.add(shieldTrim2);
  const boss=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.08,10), bronzeMat); boss.rotation.z=Math.PI/2; boss.position.set(-0.19,-0.5,0.26); armL.add(boss);

  // RIGHT arm raises a huge gladius
  const armR=new THREE.Group(); armR.position.set(0.62,1.6,0); g.add(armR);
  const upR=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.5,0.24), skinMat); upR.position.y=-0.28; armR.add(upR);
  const foreR=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.42,0.22), skinMat); foreR.position.set(0,-0.6,0.1); foreR.rotation.x=-0.7; armR.add(foreR);
  const grip=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.22,0.1), voxMat(0x3a2a1a,{noise:10})); grip.position.set(0,-0.78,0.28); armR.add(grip);
  const guard=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.06,0.12), bronzeMat); guard.position.set(0,-0.66,0.32); armR.add(guard);
  const blade=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.0,0.05), steelMat); blade.position.set(0,-0.1,0.55); blade.rotation.x=-0.4; armR.add(blade);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.2,4), steelMat); tip.position.set(0,0.42,0.72); tip.rotation.x=-0.4; armR.add(tip);
  g.userData.bossgunAnchor = armR; // AI can wave the sword arm via armR if desired

  // legs with greaves + sandals
  [-1,1].forEach(s=>{
    const thigh=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.5,0.28), skinMat); thigh.position.set(s*0.24,0.32,0); g.add(thigh);
    const greave=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.4,0.26), armorMat); greave.position.set(s*0.24,-0.04,0.02); g.add(greave);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.14,0.4), voxMat(0x5a4020,{noise:10})); foot.position.set(s*0.24,-0.28,0.08); g.add(foot);
  });

  g.userData.legL = null; g.userData.legR = null; g.userData.armR = armR; g.userData.armL = armL;
  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 3.0, 0); marker.scale.set(1.3,1.3,1.3); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ===== TIGER — a fast striped big-cat quadruped. The Colosseum Champion releases two of these when badly
// wounded. Built facing +Z (mesh.lookAt() convention). =====
// tiger: the old version's "stripes" were full-body-width boxes that basically encased the whole animal
// in solid alternating bands, reading as a striped sausage rather than a cat. Rebuilt with a leaner
// segmented body (ribcage/haunch/chest), a real head with brow+muzzle, and THIN stripes mounted proud of
// the surface instead of body-width blocks.
function makeTiger(){
  const g = new THREE.Group();
  const furMat = voxMat(0xdb8228,{noise:10});
  const furMat2 = voxMat(0xb56a1e,{noise:10});
  const bellyMat = voxMat(0xf0e6c8,{noise:6});
  const stripeMat = new THREE.MeshLambertMaterial({color:0x1c1108});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffe23a,fog:false});
  const fangMat = new THREE.MeshLambertMaterial({color:0xf0ece0});

  // lean muscular body: separate ribcage + haunch sections instead of one long box
  const ribs=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.46,0.6), furMat); ribs.position.set(0,0.58,0.05); g.add(ribs);
  const haunch=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), furMat); haunch.position.set(0,0.6,-0.5); g.add(haunch);
  const belly=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.14,0.9), bellyMat); belly.position.set(0,0.36,-0.05); g.add(belly);
  const chest=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.3), furMat); chest.position.set(0,0.56,0.44); g.add(chest);

  // thin stripes sitting proud of the body surface — a saddle stripe over the back plus flank marks
  [{x:0,y:0.78,z:0.15,w:0.3,h:0.05,d:0.5},{x:0,y:0.78,z:-0.35,w:0.32,h:0.05,d:0.4}].forEach(s=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(s.w,s.h,s.d), stripeMat); m.position.set(s.x,s.y,s.z); g.add(m); });
  [-1,1].forEach(side=>{
    [0.1,-0.4].forEach(fz=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.3,0.06), stripeMat); m.position.set(side*0.25,0.58,fz); g.add(m); });
  });

  // head: brow ridge, pale muzzle, dark nose, fangs
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.34,0.32), furMat); head.position.set(0,0.76,0.68); g.add(head);
  const brow=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.06,0.1), furMat2); brow.position.set(0,0.89,0.78); brow.rotation.x=0.2; g.add(brow);
  const muzzle=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.2,0.18), bellyMat); muzzle.position.set(0,0.66,0.88); g.add(muzzle);
  const nose=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.06,0.04), stripeMat); nose.position.set(0,0.73,0.97); g.add(nose);
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.12,0.05), furMat); ear.position.set(s*0.13,0.96,0.62); g.add(ear);
    const earIn=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.03), stripeMat); earIn.position.set(s*0.13,0.95,0.65); g.add(earIn);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.04), eyeMat); eye.position.set(s*0.11,0.79,0.86); g.add(eye);
    const fang=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.13,4), fangMat); fang.position.set(s*0.07,0.58,0.97); fang.rotation.x=Math.PI; g.add(fang);
    const fstripe=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.16,0.04), stripeMat); fstripe.position.set(s*0.11,0.85,0.7); fstripe.rotation.z=s*0.15; g.add(fstripe);

// brushed-metal look: subtle canvas texture + Phong specular highlights (much crisper than flat Lambert)
function metalTexture(baseHex, streaks=true){
  const c = document.createElement('canvas'); c.width=c.height=32;
  const ctx=c.getContext('2d'); const b=new THREE.Color(baseHex);
  for(let y=0;y<32;y+=2)for(let x=0;x<32;x+=2){
    const n=Math.abs(Math.sin(x*3.1+y*7.7)*4375.5%1); const d=(n-0.5)*36/255;
    ctx.fillStyle=`rgb(${Math.min(255,Math.max(0,b.r*255+d))|0},${Math.min(255,Math.max(0,b.g*255+d))|0},${Math.min(255,Math.max(0,b.b*255+d))|0})`;
    ctx.fillRect(x,y,2,2);
  }
  if(streaks){ ctx.strokeStyle='rgba(255,255,255,0.06)'; for(let y=2;y<32;y+=5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(32,y+1);ctx.stroke();} }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; return t;
}
function metalMatP(color,shininess=70,spec=0x777777){
  return new THREE.MeshPhongMaterial({map:metalTexture(color), shininess, specular:spec});
}
function part(group,w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); group.add(m); return m;
}

// BOW — curved wooden limbs (built from angled segments), taut string, nocked arrow
function makeBow(){
  const g=new THREE.Group();
  const wood=metalMatP(0x6b4a2c,18,0x332211), gold=metalMatP(0xad8730,55,0xffdd99);
  const stringMat=new THREE.MeshBasicMaterial({color:0xe8dcc0, fog:false});
  // each segment is walked along the previous one's own rotated direction (verified against a plotted render),
  // so the limb is a properly connected curve instead of segments that only touch at one corner.
  // Kept a single consistent wood color (not alternating per segment) — alternating colors right at the
  // overlap seams was the likely source of the z-fighting flicker. A small gold tip cap replaces the
  // per-segment gold accent instead. The function returns the true tip position so the string can be
  // placed exactly, rather than guessed.
  function limb(dir){
    const grp=new THREE.Group();
    let y=0.05, z=0.03, theta=0;
    const dtheta=0.22, L=0.15, overlap=0.01;
    let tipY=y, tipZ=z;
    for(let i=0;i<5;i++){
      const thetaMid = theta + dtheta/2;
      const dy=Math.cos(thetaMid), dz=Math.sin(thetaMid);
      const cy=y+(L/2)*dy, cz=z+(L/2)*dz;
      const m=new THREE.Mesh(new THREE.BoxGeometry(0.032,0.15,0.032), wood);
      m.position.set(0, cy*dir, cz);
      m.rotation.x = thetaMid*dir;
      grp.add(m);
      tipY = y+L*dy; tipZ = z+L*dz;
      y = tipY-overlap*dy; z = tipZ-overlap*dz;
      theta += dtheta;
    }
    const tipCap=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05), gold);
    tipCap.position.set(0, tipY*dir, tipZ); grp.add(tipCap);
    return {grp, tipY:tipY*dir, tipZ};
  }
  const limbUp=limb(1), limbDown=limb(-1);
  g.add(limbUp.grp); g.add(limbDown.grp);
  part(g,0.06,0.22,0.07,wood,0,0,0.03);              // grip
  const stringLen=Math.hypot(limbUp.tipY-limbDown.tipY, limbUp.tipZ-limbDown.tipZ);
  const string=new THREE.Mesh(new THREE.BoxGeometry(0.012,stringLen,0.012),stringMat);
  string.position.set(0,(limbUp.tipY+limbDown.tipY)/2,(limbUp.tipZ+limbDown.tipZ)/2);
  string.rotation.x = Math.atan2(limbUp.tipZ-limbDown.tipZ, limbUp.tipY-limbDown.tipY);
  g.add(string);
  // nocked arrow, tip pointing forward (-Z) to match muzzleZ
  part(g,0.02,0.02,0.62,metalMatP(0x8a6a42,20),0,0,-0.18);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.09,4),metalMatP(0xaab4be,80,0xffffff)); head.position.set(0,0,-0.52); head.rotation.x=-Math.PI/2; g.add(head);
  const fletch=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.01),new THREE.MeshLambertMaterial({color:0xb5502c})); fletch.position.set(0,0,0.1); fletch.rotation.z=Math.PI/4; g.add(fletch);
  // a small bronze aiming ring mounted just above the grip — a peep sight, not a glass sniper scope, but
  // wired to the same scoped/scopeFov mechanic (right-click/hold-shift zooms in, same as the sniper rifle)
  const sightRing=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.009,6,12), gold); sightRing.position.set(-0.05,0.16,0.03); g.add(sightRing);
  g.scale.setScalar(0.58); // a touch smaller than before
  g.userData={muzzleZ:-0.55,muzzleY:0,pos:new THREE.Vector3(0.22,-0.22,-0.35),recoil:0.1,name:'Bow',
    damage:80, fireRate:0.5, auto:false, spread:0.008, tracer:0xd9b872, scoped:true, scopeFov:45,
    magSize:6, ammo:6, reloadTime:1.3, reloading:false, reloadT:0};
  return g;
}

function eyeOfHorusTex(){
  const P=64, c=document.createElement('canvas'); c.width=c.height=P; const x=c.getContext('2d');

  // pupil (cut a lighter hole so it doesn't read as a solid blob)
  x.fillStyle='#c9a030';
  x.beginPath(); x.arc(27,31,5,0,Math.PI*2); x.fill();
  x.fillStyle='#2a1c10';
  x.beginPath(); x.arc(27,31,2.6,0,Math.PI*2); x.fill();
  // teardrop marking
  x.fillStyle=ink;

  // spiral tail
  x.strokeStyle=ink; x.lineWidth=3; x.beginPath(); x.arc(18,48,5,0.2,Math.PI*1.6); x.stroke();

// ---- Greek/Ptolemaic era weapons (waves 4-6): Sling (fast ranged), Xiphos (melee), Trident (heavy ranged) ----
// SLING — leather pouch + crossed cords, a stone nocked and ready; fast, precise, low recoil
function makeSling(){
  // a real Y-fork slingshot (per reference image), not a classical hand-swung strap: a wooden fork with two
  // splayed prongs, elastic bands running from each prong tip down to a shared pouch/stone.
  const g=new THREE.Group();
  const Z = -0.15; // keeps every piece well clear of the camera's near plane (see the earlier near-plane bug)
  const woodDark = voxMat(0x4a3018,{noise:12});
  const woodLight = voxMat(0xc9a878,{noise:10}); // pale wood-grain band partway up each prong
  const bandMat = new THREE.MeshBasicMaterial({color:0xc9b48a, fog:false});
  const leatherMat = voxMat(0x2a1c12,{noise:10});
  const stoneMat = metalMatP(0x8a8a86,40,0x555555);

  part(g,0.06,0.2,0.07,woodDark,0,-0.1,0.1+Z);   // grip, near the hand
  part(g,0.06,0.12,0.06,woodDark,0,0.04,0.05+Z); // fork base, bridging the grip up to where the prongs split

  // two diverging prongs (dark wood + a lighter grain band + dark tip), and each prong's tip position computed
  // analytically (rotation.z only mixes x/y, so z is unaffected) so the elastic bands below can target it exactly.
  // Shorter than the first pass — the prongs used to reach so far above the pouch that the bands read as
  // "string way up, pouch way down" instead of one compact fork.
  const TIP_Y = 0.16; // local (pre-rotation) height of the tip along the prong — keep in sync with the geometry below
  const tips=[];
  [-1,1].forEach(side=>{
    const grp=new THREE.Group(); grp.position.set(0,0.1,0.02+Z); grp.rotation.z=side*0.5; g.add(grp);
    const pbase=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.13,0.045),woodDark); pbase.position.set(0,0.065,0); grp.add(pbase);
    const band=new THREE.Mesh(new THREE.BoxGeometry(0.052,0.04,0.052),woodLight); band.position.set(0,0.12,0); grp.add(band);
    const tip=new THREE.Mesh(new THREE.BoxGeometry(0.038,0.06,0.038),woodDark); tip.position.set(0,TIP_Y,0); grp.add(tip);
    const th=side*0.5;
    tips.push(new THREE.Vector3(-TIP_Y*Math.sin(th), 0.1+TIP_Y*Math.cos(th), 0.02+Z));
  });

  // pouch + stone, hanging just below the fork — close enough to the prong tips to read as one compact object
  const pouchPos = new THREE.Vector3(0,0.14,0.08+Z);
  const pouch=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.05,0.07),leatherMat); pouch.position.copy(pouchPos); g.add(pouch);
  // sits just inside the pouch's top opening — the stone is bigger than the pouch is deep, so it should bulge
  // out the top a little (realistic, like a stone actually cradled in a shallow pouch), never poke out the bottom
  const stone=new THREE.Mesh(new THREE.SphereGeometry(0.028,8,6), stoneMat); stone.position.copy(pouchPos).add(new THREE.Vector3(0,0.015,0.005)); g.add(stone);
  // each band attaches to its OWN side edge of the pouch (the actual box face, not an inset point floating
  // above the top) at the pouch's vertical center — the height a rope naturally sits at when it cradles a
  // pouch from both sides. tips[0] is on the +x side and tips[1] on the -x side (see the [-1,1] loop above) —
  // match each to the SAME side of the pouch so the two bands run roughly parallel instead of crossing
  const pouchAttach = [ new THREE.Vector3(0.045,0,0), new THREE.Vector3(-0.045,0,0) ];

  // two elastic bands, prong tip -> its own pouch corner: a cylinder along its local +Y axis, rotated onto
  // the tip->target direction via setFromUnitVectors (not lookAt — a cylinder's length axis is Y, not Z, and
  // this sidesteps any lookAt-specific edge case). Built 20% longer than the exact tip-to-pouch distance and
  // centered on the midpoint, so both ends visibly bury themselves into the tip and pouch geometry instead of
  // just barely grazing them — small positioning drift during the fire animation can never open a visible gap.
  const UP = new THREE.Vector3(0,1,0);
  const bandMeshes=[], bandBaseLen=[];
  tips.forEach((tip,i)=>{
    const target = pouchPos.clone().add(pouchAttach[i]);
    const dir = target.clone().sub(tip);
    const len = dir.length();
    const mid = tip.clone().add(target).multiplyScalar(0.5);
    const elastic = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,len*1.2,6), bandMat);
    elastic.position.copy(mid);
    elastic.quaternion.setFromUnitVectors(UP, dir.normalize());
    g.add(elastic);
    bandMeshes.push(elastic); bandBaseLen.push(len);
  });
  // small leather knots where each band actually meets its own corner of the pouch — children of the pouch
  // mesh itself so they track its position automatically during the fire animation. No dedicated sight
  // object — aiming is just through the gap between the two prongs, like the reference image.
  pouchAttach.forEach(a=>{ const knot=new THREE.Mesh(new THREE.SphereGeometry(0.02,8,6), leatherMat); knot.position.copy(a); pouch.add(knot); });
  g.userData={muzzleZ:-0.4+Z,muzzleY:0,pos:new THREE.Vector3(0.2,-0.2,-0.32),recoil:0.05,name:'Sling',
    damage:32, fireRate:0.35, auto:true, spread:0.006, tracer:0xdcd0b0, scoped:true, scopeFov:50,
    magSize:14, ammo:14, reloadTime:1.0, reloading:false, reloadT:0,
    // release-snap animation on fire: the pouch/stone/bands pull back toward the player then snap back to rest
    // (see the "sling release" block in animate()), instead of just the generic whole-gun recoil kick every weapon gets
    slingAnim:true, pullT:0, tips, pouchRest:pouchPos.clone(), pouchAttach,
    pouchMesh:pouch, stoneMesh:stone, bandMeshes, bandBaseLen};
  return g;
}

function makeXiphos(){
  // was upside down: pommel at the top with the blade hanging below (which also pushed the blade off the

  // there — flipped to match that instead of just shifting the inverted version into view.
  const g=new THREE.Group();

// SAIF — a curved Mamluk scimitar: a single sweeping steel blade, a crossguard, and a wrapped grip. A
// deliberately different silhouette (curved, not straight) and palette from the Greek Xiphos and Roman
// Pugio so the three eras' sidearms never read as reskins of each other.
function makeScimitar(){
  const g=new THREE.Group();
  const steel=metalMatP(0xb8bcc0,95,0xffffff), steelDark=metalMatP(0x7a8086,60,0xc8ccd0);
  const gripMat=voxMat(0x1c3a2e,{noise:10}), goldMat=metalMatP(0xad8730,85,0xfff2c8);
  const pommel=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,6), goldMat); pommel.position.y=0; g.add(pommel);
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.024,0.026,0.16,8), gripMat); grip.position.y=0.09; g.add(grip);
  const guard=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.02,0.05), goldMat); guard.position.y=0.17; g.add(guard);
  // curved blade: 4 short chained segments sweeping forward, each rotated a touch more than the last
  let by=0.17, bz=0, bang=0;
  for(let i=0;i<4;i++){
    const segLen=0.13;
    const seg=new THREE.Mesh(new THREE.BoxGeometry(0.03,segLen,0.006), i===3?steelDark:steel);
    seg.position.set(0, by+Math.cos(bang)*segLen/2, bz+Math.sin(bang)*segLen/2);
    seg.rotation.z = bang;
    g.add(seg);
    by += Math.cos(bang)*segLen; bz += Math.sin(bang)*segLen; bang += 0.24;

  g.userData={muzzleZ:0,muzzleY:0,pos:new THREE.Vector3(0.22,-0.24,-0.42),recoil:0.1,name:'Saif',
    melee:true, range:1.7, damage:108, fireRate:0.2};
  return g;
}

const moveVec = {x:0, z:0};          // analog movement from the left joystick (-1..1)
let touchPlaying = false;            // mobile "playing" flag (no pointer lock on touch)
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0) || matchMedia('(pointer: coarse)').matches;
const mobileEl = document.getElementById('mobile');
if(isTouch && mobileEl) mobileEl.classList.add('on');

(function setupTouch(){
  if(!mobileEl) return;
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  const fireBtn = document.getElementById('firebtn'), wbtns = document.querySelectorAll('.wbtn');
  let moveId=null, moveOx=0, moveOy=0;   // joystick touch
  let lookId=null, lookX=0, lookY=0;      // look-drag touch
  let fireId=null;                        // fire-button touch id (tracked so release is never missed)

  // weapon buttons
  wbtns.forEach(b=>{
    b.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(paused) return; const w=+b.dataset.w; selectWeapon(w); syncWeaponButtons(); }, {passive:false});
  });
  const adsBtn = document.getElementById('adsbtn');
  window.syncWeaponButtons = function(){
    wbtns.forEach(b=> b.classList.toggle('sel', +b.dataset.w===currentWeapon));
    if(adsBtn) adsBtn.classList.toggle('show', !!(weapons[currentWeapon] && weapons[currentWeapon].userData.scoped));
  };
  if(adsBtn){
    adsBtn.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(paused) return;
      setScope(!scoped); adsBtn.classList.toggle('active', scoped);
    }, {passive:false});
  }

  // fire button (hold to auto-fire; tap to single-fire) — track the touch id
  function releaseFire(){ firing=false; fireId=null; }
  fireBtn.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(paused) return; fireId=e.changedTouches[0].identifier; firing=true; fire(); }, {passive:false});
  fireBtn.addEventListener('touchend',    e=>{ e.preventDefault(); e.stopPropagation(); releaseFire(); }, {passive:false});
  fireBtn.addEventListener('touchcancel', e=>{ e.preventDefault(); e.stopPropagation(); releaseFire(); }, {passive:false});

  // joystick
  const R=55;
  stick.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(paused) return;
    const t=e.changedTouches[0]; moveId=t.identifier; const r=stick.getBoundingClientRect();
    moveOx=r.left+r.width/2; moveOy=r.top+r.height/2; updateStick(t.clientX,t.clientY);
  }, {passive:false});
  function updateStick(cx,cy){
    let dx=cx-moveOx, dy=cy-moveOy; const d=Math.hypot(dx,dy)||1;
    const cl=Math.min(d,R); dx=dx/d*cl; dy=dy/d*cl;
    knob.style.left=(45+dx)+'px'; knob.style.top=(45+dy)+'px';
    moveVec.x = dx/R; moveVec.z = dy/R;
  }
  function endStick(){ moveId=null; moveVec.x=0; moveVec.z=0; knob.style.left='45px'; knob.style.top='45px'; }

  // global touch routing for look-drag (any touch not on a control, on the right side)
  document.addEventListener('touchstart', e=>{
    if(!touchPlaying || paused) return;
    for(const t of e.changedTouches){
      if(t.target.closest('#stick')||t.target.closest('#firebtn')||t.target.closest('.wbtn')) continue;
      if(lookId===null){ lookId=t.identifier; lookX=t.clientX; lookY=t.clientY; }
    }
  }, {passive:false});
  document.addEventListener('touchmove', e=>{
    if(touchPlaying) e.preventDefault();
    if(paused) return;
    for(const t of e.changedTouches){
      if(t.identifier===moveId) updateStick(t.clientX,t.clientY);
      else if(t.identifier===lookId){
        targetYaw -= (t.clientX-lookX)*0.008; targetPitch -= (t.clientY-lookY)*0.008;
        targetPitch=Math.max(-1.2,Math.min(1.2,targetPitch)); lookX=t.clientX; lookY=t.clientY;
      }
    }
  }, {passive:false});
  function endTouch(e){ for(const t of e.changedTouches){ if(t.identifier===moveId) endStick(); if(t.identifier===lookId) lookId=null; if(t.identifier===fireId) releaseFire(); } }
  document.addEventListener('touchend', endTouch, {passive:false});
  document.addEventListener('touchcancel', endTouch, {passive:false});
  // safety nets: never leave the trigger stuck down
  window.addEventListener('blur', ()=>{ firing=false; fireId=null; });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ firing=false; fireId=null; } });
})();

const player = { hp:100, maxHp:100, score:0, alive:true, respawn:0, lastHit:-99 };
const spawnPoint = new THREE.Vector3(0,1.7,10);
// several verified-clear overworld spots so death doesn't always drop you back in the same place
const PLAYER_SPAWNS = [[0,10],[0,-10],[15,0],[-15,0],[0,20],[20,-15],[8,3]].map(([x,z])=>new THREE.Vector3(x,1.7,z));
let lastSpawnIdx = -1;
function pickSpawnPoint(){
  if(PLAYER_SPAWNS.length<=1) return PLAYER_SPAWNS[0];
  let idx; do{ idx=Math.floor(Math.random()*PLAYER_SPAWNS.length); } while(idx===lastSpawnIdx);
  lastSpawnIdx = idx; return PLAYER_SPAWNS[idx];
}
// nearest of the verified-clear spawns to (x,z) — the guaranteed-safe fallback for unstick recovery
function nearestClearSpawn(x,z){
  let best=PLAYER_SPAWNS[0], bestD=Infinity;
  for(const sp of PLAYER_SPAWNS){ const d=(sp.x-x)**2+(sp.z-z)**2; if(d<bestD){ bestD=d; best=sp; } }
  return best;
}
// Always recover to the nearest verified-clear spawn point rather than a tracked "last safe"
// spot: the height-zone model that tracking relied on can't tell "standing on a roof" apart
// from "wedged underneath it" (both report the same getTerrainHeight at that x,z), so a
// heuristic built on that model can't reliably catch every stuck case. A fixed, pre-verified
// set of spots trades "nearest arbitrary point" for "recovery that actually always works".
function pickRecoverySpot(curX,curZ){
  const sp = nearestClearSpawn(curX,curZ);
  return {x:sp.x,z:sp.z,h:0};
}

const ENEMY_COLORS=[0xc0392b,0x2980b9,0x27ae60,0x8e44ad,0xe67e22,0x16a085,0xd35400,0x2c3e50];
const SPAWN_POINTS=[[-6,-6],[9,4],[-9,9],[-14,-14],[16,-6],[4,16],[-20,4],[18,14],[-2,-20],[12,-16]];
const WAVES=[3,4,5, 6,7,9, 7,8,10, 9,10,12]; // 12 waves; a boss after wave 3, 6, 9, and 12
function waveDiff(n){ return 1 + n*n*0.05 + n*0.16; } // accelerating curve: each wave is meaningfully tougher than the last
let waveIdx=0, betweenTimer=0, pending=null, bossActive=false, bossNum=0, gameWon=false, gameStarted=false;
// era system: dying always respawns at the START of the CURRENT era, never an earlier one (e.g. dying in a
// later Greek/Roman/Islamic era must not roll back into the Egyptian/pyramid era). currentEra indexes into
// ERA_START_WAVE; extend both when a new era arc is added later, incrementing currentEra at that era's
// boss-defeat transition (see the pyramidPhase branch in onAllDead()).
let currentEra=0;
const ERA_START_WAVE=[0,3,6,9]; // waveIdx where each era begins — era 0 (pyramid) starts at wave 1, era 1 (Greek) at wave 4, era 2 (Roman) at wave 7, era 3 (Islamic) at wave 10
function clearBots(){ bots.forEach(b=>scene.remove(b.mesh)); bots.length=0; }
function setEnemyCount(txt){ const e=document.getElementById('enemies'); if(e) e.textContent = txt!==undefined?txt:bots.filter(b=>b.alive).length; }
function spawnWave(n){
  clearBots();
  const count=WAVES[n];
  const pyramid = n<3;        // waves 1-3: desert/pyramid reskin, ahead of the stone-temple boss dungeon
  const roman = n>=6 && n<9;  // waves 7-9: Roman legionaries
  const islamic = n>=9;       // waves 10-12: Islamic/Mamluk Cairo, the final regular waves before Boss IV
  // Greek waves inherit waveDiff(n)'s accelerating curve just by continuing the same wave index, which made
  // them scale up faster than intended — harder than the pyramid era (correct, it's the later era) but not
  // by this much, especially with a still-harder era planned after this one. Softened back ~12%, which still
  // keeps every Greek wave above the pyramid era's toughest wave (compare wave3's diff below). Roman waves
  // get a smaller softening (~20% off the raw curve) since this is meant to be the hardest era so far —
  // full unscaled waveDiff(8) alone would be ~5.5x base HP, too steep for a first pass on brand new content.
  // Islamic waves (the final era) get the deepest softening — full unscaled waveDiff(11) at wave 12 is ~8.8x
  // base HP. Even the first-pass 0.72 multiplier still landed at ~6.34x, past the ~5.5x line the Roman era
  // was capped at above, and diff also scales enemy speed/melee damage, so wave 12 was hitting noticeably
  // harder than intended. Dropped to 0.63 (~5.55x at wave 12) — a conservative first pass pending real
  // playtesting on this brand-new content, matching the Roman era's ceiling rather than exceeding it.
  const diff = pyramid ? waveDiff(n) : roman ? waveDiff(n)*0.8 : islamic ? waveDiff(n)*0.63 : waveDiff(n)*0.88;
  for(let i=0;i<count;i++){
    const sp=SPAWN_POINTS[(i*3 + n*2 + i) % SPAWN_POINTS.length];
    const x=sp[0], z=sp[1];
    let wt, skin;
    if(pyramid){
      wt=(i%3===2)?'knife':'pistol';
      skin = wt==='knife' ? 'mummy' : 'jackal';
    } else if(roman){
      // regular roster alternates two Roman monsters — manticore (winged lion/scorpion melee brute) and
      // basilisk (crested serpent, javelin weaponType giving the same ranged/melee-hybrid AI the Greek
      // griffin uses). A single hound pack (3 hounds sharing one HP/AI) is added once per wave below,
      // instead of looping hounds into this roster.
      skin = (i%2===0) ? 'manticore' : 'basilisk';
      wt = skin==='basilisk' ? 'javelin' : 'knife';
    } else if(islamic){
      // regular roster alternates two Islamic monsters — ifrit (ranged fire djinn, holds distance) and
      // ghoul (fast melee grave-robber). A roc pack (3 rocs sharing one HP/AI) is added once per wave
      // below, same convention as the Roman warhound pack.
      skin = (i%2===0) ? 'ifrit' : 'ghoul';
      wt = skin==='ifrit' ? 'pistol' : 'knife';
    } else {
      // Greek era (waves 4-6): Minotaur (front-immune charging brute) / Griffin (dive-then-claw hybrid) /
      // Medusa (heavy melee tank), in rotation — see the bot AI loop for their combat mechanics
      const cyc = i%3;
      skin = cyc===0 ? 'minotaur' : cyc===1 ? 'griffin' : 'medusa';
      wt = skin==='griffin' ? 'javelin' : 'knife';
    }
    const col=ENEMY_COLORS[(i+n)%ENEMY_COLORS.length];
    // Greek grunts all share the same HP curve now (minotaur no longer weaker); wave 6 (the last regular
    // wave) is capped at a flat value instead of letting the difficulty curve keep scaling it up
    const hp = (!pyramid && !roman && !islamic && n===5) ? 245 : roman ? [290,320,300][n-6] : islamic ? [330,360,340][n-9] : Math.round(BOT_MAX_HP*diff);
    const scale = skin==='basilisk' ? 1.35 : 1;
    // Ghoul is the era's fast-melee type (design spec: "tuned for speed over the era's other regular type") —
    // give it a speed multiplier over the base formula, same precedent as the pyramid era's scarab/scorpion elites.
    const speedMul = skin==='ghoul' ? 1.35 : 1;
    spawnBot(x,z,col,[x-2.5,0,z],[x+2.5,0,z],wt,{skin, hp, diff, speed:(1+(diff-1)*0.5)*speedMul, scale});
  }
  if(pyramid && n===1){ // wave 2: a scarab swarm — one pack entity (5 beetles, one hitbox/HP/AI) that moves and dies together
    const sx=-10, sz=-16;
    spawnBot(sx,sz,0x4f5c37,[sx-2,0,sz],[sx+2,0,sz],'knife',
      {skin:'scarab', hp:Math.round(BOT_MAX_HP*diff*0.85), diff, speed:(1+(diff-1)*0.5)*1.6, scale:0.85});
  }
  if(pyramid && n===2){ // wave 3: a scorpion stalker prowls in as a fast elite, ahead of the colossus boss
    spawnBot(10,16,0xb5502c,[4,0,16],[16,0,16],'knife',
      {skin:'scorpion', hp:Math.round(BOT_MAX_HP*diff*1.4), diff, speed:(1+(diff-1)*0.5)*1.9, scale:1.3});
  }
  if(!pyramid && n===5){ // wave 6: an elite Medusa prowls in ahead of the Ammit Companion
    spawnBot(10,16,0x3a5c3e,[4,0,16],[16,0,16],'knife',
      {skin:'medusa', hp:350, diff, speed:(1+(diff-1)*0.5)*1.1, scale:1.25});
  }
  if(roman){ // one hound pack per Roman wave — a themed encounter, not looped into the regular roster.
    // HP scaled up ~1.4x over a regular grunt to represent 3 hounds sharing a single pool.
    const sp=SPAWN_POINTS[(n*5+2) % SPAWN_POINTS.length];
    const gruntHp=[290,320,300][n-6];
    spawnBot(sp[0],sp[1],0x201d19,[sp[0]-2,0,sp[1]],[sp[0]+2,0,sp[1]],'knife',
      {skin:'warhound', hp:Math.round(gruntHp*1.4), diff, speed:1+(diff-1)*0.5});
  }
  if(islamic){ // one roc pack per Islamic wave, same "themed pack, not regular roster" convention
    const sp=SPAWN_POINTS[(n*5+2) % SPAWN_POINTS.length];
    const gruntHp=[330,360,340][n-9];
    spawnBot(sp[0],sp[1],0x4a3a2e,[sp[0]-2,0,sp[1]],[sp[0]+2,0,sp[1]],'javelin',
      {skin:'roc', hp:Math.round(gruntHp*1.4), diff, speed:1+(diff-1)*0.5});
  }
  document.getElementById('wave').textContent=(n+1)+'/'+WAVES.length;
  setEnemyCount();
}

function startGame(){

  gunGroup.visible = true;
  gameStarted=true; gameWon=false; bossActive=false; pending=null; betweenTimer=0; waveIdx=0; bossNum=0; currentEra=0;
  // drain any leftover fire meteors from a previous run so one can't fire into the fresh game (quakeEffects,
  // the older analogous VFX-effect array, has this same gap on restart — out of scope here, only fixing
  // fireMeteors, this feature's own code)
  for(const m of fireMeteors) scene.remove(m.grp);

  pyramidPhase=true; dungeonWasPyramid=true; inNileArea=false; weapons=pyramidWeapons; selectWeapon(0); // reset to the pyramid map/loadout in case this is a replay
  exitDungeon(); // ensure we start in the overworld (also positions the player)
  targetYaw=0; targetPitch=0; vel.set(0,0,0);
