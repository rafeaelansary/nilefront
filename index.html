<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BLOCKFRONT</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87CEEB;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #hud{position:absolute;top:10px;left:10px;color:#fff;text-shadow:0 1px 2px #000;font-size:14px;z-index:2}
  #crosshair{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border-radius:50%;z-index:2;box-shadow:0 0 3px #000}
  #stats{position:absolute;top:8px;right:14px;color:#fff;text-shadow:0 1px 3px #000;font-size:20px;font-weight:700;z-index:2;letter-spacing:0.5px}
  #ammoBig{position:absolute;bottom:34px;right:28px;color:#fff;text-shadow:0 2px 6px #000;font-size:46px;font-weight:800;z-index:3;text-align:right;letter-spacing:1px}
  #ammoBig .max{font-size:22px;font-weight:700;opacity:0.75}
  #ammoBig.empty{color:#ff5a5a}
  #ammoBig.reloading{color:#ffd453;font-size:28px}
  #hpbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:420px;height:34px;background:rgba(0,0,0,0.55);border:3px solid rgba(255,255,255,0.85);border-radius:6px;z-index:3;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.6)}
  #hpfill{position:absolute;left:0;top:0;height:100%;width:100%;background:linear-gradient(#5be06a,#37b34a);transition:width 0.12s linear}
  #hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;text-shadow:0 1px 3px #000;z-index:1}
  #bossbar{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:620px;z-index:3;opacity:0;transition:opacity 0.3s;text-align:center}
  #bosslabel{color:#ff5566;font-size:22px;font-weight:800;text-shadow:0 1px 4px #000;margin-bottom:3px;letter-spacing:2px}
  #bosstrack{width:100%;height:24px;background:rgba(0,0,0,0.55);border:3px solid #ff5566;border-radius:5px;overflow:hidden}
  #bossfill{height:100%;width:100%;background:linear-gradient(#ff7a4d,#d61f2b);transition:width 0.15s linear}
  #hitmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff5555;font-size:26px;font-weight:bold;z-index:3;opacity:0;transition:opacity 0.05s;text-shadow:0 0 3px #000;pointer-events:none}
  #dmg{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity 0.25s;box-shadow:inset 0 0 220px 40px rgba(200,0,0,0.85)}
  #banner{position:absolute;top:42%;left:0;width:100%;text-align:center;color:#fff;font-size:40px;font-weight:800;z-index:3;opacity:0;transition:opacity 0.2s;text-shadow:0 2px 8px #000;pointer-events:none}
  #lock{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.62);color:#fff;z-index:4}
  #title{font-size:74px;font-weight:900;letter-spacing:4px;color:#eaf2f8;text-shadow:0 4px 0 #1c2a33,0 6px 14px rgba(0,0,0,0.7);line-height:1}
  #title span{color:#ff3b3b}
  #startbtn{margin-top:28px;padding:16px 54px;font-size:26px;font-weight:900;letter-spacing:2px;color:#fff;
    background:linear-gradient(#ff5a4d,#d61f2b);border:3px solid #fff;border-radius:12px;cursor:pointer;
    box-shadow:0 5px 0 #7a0f16,0 8px 18px rgba(0,0,0,0.5);transition:transform 0.08s,box-shadow 0.08s;font-family:sans-serif}
  #startbtn:hover{filter:brightness(1.08)}
  #startbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #7a0f16,0 3px 8px rgba(0,0,0,0.5)}
  /* hide all in-game UI until the game starts (title screen shows only logo + START + background) */
  body:not(.playing) #hud,
  body:not(.playing) #stats,
  body:not(.playing) #hpbar,
  body:not(.playing) #ammoBig,
  body:not(.playing) #crosshair,
  body:not(.playing) #hitmark,
  body:not(.playing) #dmg,
  body:not(.playing) #banner,
  body:not(.playing) #bossbar,
  body:not(.playing) #mobile{ display:none !important; }
  #mobile{display:none;position:absolute;inset:0;z-index:5;pointer-events:none;touch-action:none}
  #mobile.on{display:block}
  #stick{position:absolute;left:26px;bottom:26px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.4);pointer-events:auto}
  #knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.8)}
  #firebtn{position:absolute;right:30px;bottom:40px;width:120px;height:120px;border-radius:50%;background:rgba(220,40,40,0.55);border:3px solid rgba(255,255,255,0.85);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
  #firebtn:active{background:rgba(255,80,80,0.8)}
  #wbtns{position:absolute;right:36px;bottom:180px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
  .wbtn{width:52px;height:52px;border-radius:10px;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.6);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none}
  .wbtn.sel{background:rgba(80,150,255,0.7);border-color:#fff}
  #pausebtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:8px;background:rgba(0,0,0,0.45);border:2px solid rgba(255,255,255,0.7);color:#fff;font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;justify-content:center;z-index:6;cursor:pointer;user-select:none}
  #pausebtn:hover{background:rgba(0,0,0,0.65)}
  body:not(.playing) #pausebtn, body.paused #pausebtn{ display:none !important; }
  #pauseoverlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,12,0.72);color:#fff}
  body.paused #pauseoverlay{ display:flex; }
  #pausetitle{font-size:52px;font-weight:900;letter-spacing:4px;color:#eaf2f8;text-shadow:0 4px 0 #1c2a33,0 6px 14px rgba(0,0,0,0.7)}
  #resumebtn{margin-top:26px;padding:14px 46px;font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;
    background:linear-gradient(#4fb0ff,#1f6fd6);border:3px solid #fff;border-radius:12px;cursor:pointer;
    box-shadow:0 5px 0 #0f3a7a,0 8px 18px rgba(0,0,0,0.5);transition:transform 0.08s,box-shadow 0.08s;font-family:sans-serif}
  #resumebtn:active{transform:translateY(4px);box-shadow:0 1px 0 #0f3a7a,0 3px 8px rgba(0,0,0,0.5)}
  #pausehint{margin-top:14px;font-size:15px;color:#cfe0ea;opacity:0.8}
  #scopeoverlay{position:absolute;inset:0;z-index:7;display:none;pointer-events:none;
    background:radial-gradient(circle at center, transparent 0 27%, #000 30%);}
  body.scoped #scopeoverlay{display:block}
  body.scoped #crosshair{display:none}
  #scopeoverlay::before,#scopeoverlay::after{content:'';position:absolute;top:50%;left:50%;background:rgba(20,20,20,0.85)}
  #scopeoverlay::before{width:2px;height:100%;transform:translate(-50%,-50%)}
  #scopeoverlay::after{width:100%;height:2px;transform:translate(-50%,-50%)}
  #scopering{position:absolute;top:50%;left:50%;width:29vmin;height:29vmin;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(20,20,20,0.85);box-sizing:border-box}
  #adsbtn{position:absolute;right:30px;bottom:172px;width:74px;height:74px;border-radius:50%;background:rgba(40,90,150,0.55);border:3px solid rgba(255,255,255,0.85);color:#fff;font-weight:800;font-size:12px;display:none;align-items:center;justify-content:center;pointer-events:auto;user-select:none;text-align:center}
  #adsbtn.show{display:flex}
  #adsbtn.active{background:rgba(80,160,255,0.85)}
</style>
</head>
<body>
<div id="hud">WASD move · mouse look · click to lock · [1-4 or wheel] switch weapon · [Z] Zahra Gun · [F] reload · right-click or hold [Shift] to scope (sniper) · [R] unstick</div>
<div id="pausebtn" title="Pause">❚❚ PAUSE</div>
<div id="pauseoverlay"><div id="pausetitle">PAUSED</div><button id="resumebtn">RESUME</button><div id="pausehint">Press P or Esc to resume</div></div>
<div id="stats">🔫 <span id="weap">Rifle</span> &nbsp; ⭐ <span id="score">0</span> &nbsp; 🌊 Wave <span id="wave">1</span> &nbsp; 👾 <span id="enemies">0</span></div>
<div id="ammoBig"></div>
<div id="bossbar"><div id="bosslabel">☠ BOSS</div><div id="bosstrack"><div id="bossfill"></div></div></div>
<div id="crosshair"></div>
<div id="hitmark">✕</div>
<div id="dmg"></div>
<div id="banner"></div>
<div id="hpbar"><div id="hpfill"></div><div id="hptext">100</div></div>
<div id="scopeoverlay"><div id="scopering"></div></div>
<div id="lock"><div id="title">BLOCK<span>FRONT</span></div><button id="startbtn">START</button></div>
<div id="mobile">
  <div id="stick"><div id="knob"></div></div>
  <div id="wbtns"><div class="wbtn" data-w="0">1</div><div class="wbtn sel" data-w="1">2</div><div class="wbtn" data-w="2">3</div><div class="wbtn" data-w="3">4</div></div>
  <div id="adsbtn">SCOPE</div>
  <div id="firebtn">FIRE</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd6f2);
scene.fog = new THREE.Fog(0x9fdcf0, 40, 220);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 1.7, 10);

const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5)); // retina displays were rendering 4x the pixels — this was the #1 cause of choppy look/movement
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x55603f, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
sun.position.set(38, 60, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); // lighter shadow map — 2048 was costly for marginal visual gain
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -45;
sun.shadow.bias = -0.0004;
scene.add(sun);
// ---- collision registry (top-down AABB rectangles; buildings/props are full-height blockers) ----
const colliders = [];            // overworld colliders
const dungeonColliders = [];     // dungeon colliders
let addTarget = colliders;       // where addBox pushes during world build
let activeColliders = colliders; // which set physics currently uses
function addBox(cx,cz,w,d,roofY){ addTarget.push({x1:cx-w/2, z1:cz-d/2, x2:cx+w/2, z2:cz+d/2, roofY}); }
// height zones let the player climb onto rooftops via ramps (bots stay ground-level, unaffected)
const heightZones = [];
function getTerrainHeight(x,z){
  let h=0;
  for(const zn of heightZones){
    if(x<zn.x1||x>zn.x2||z<zn.z1||z>zn.z2) continue;
    if(zn.type==='plateau'){ h=Math.max(h,zn.y); }
    else if(zn.axisX){ const t=Math.max(0,Math.min(1,(x-zn.x1)/Math.max(0.001,(zn.x2-zn.x1)))); h=Math.max(h, zn.y1+(zn.y2-zn.y1)*t); }
    else { const t=Math.max(0,Math.min(1,(z-zn.z1)/Math.max(0.001,(zn.z2-zn.z1)))); h=Math.max(h, zn.y1+(zn.y2-zn.y1)*t); }
  }
  return h;
}
function resolveCollision(px,pz,R,curH){
  for(const c of activeColliders){
    const nx=Math.max(c.x1,Math.min(px,c.x2));
    const nz=Math.max(c.z1,Math.min(pz,c.z2));
    // Skip this wall only if the terrain height AT THE WALL ITSELF (the nearest point the player's
    // radius actually touches) already matches its own roof — not a global "am I elevated" check,
    // which could let you phase through an unrelated building while easing down from a different roof
    if(c.roofY!=null && getTerrainHeight(nx,nz) >= c.roofY-0.4) continue;
    const dx=px-nx, dz=pz-nz; const d2=dx*dx+dz*dz;
    if(d2 < R*R){
      if(d2>1e-6){ const d=Math.sqrt(d2); px=nx+dx/d*R; pz=nz+dz/d*R; }
      else { const l=px-c.x1,r=c.x2-px,t=pz-c.z1,b=c.z2-pz,m=Math.min(l,r,t,b);
        if(m===l)px=c.x1-R; else if(m===r)px=c.x2+R; else if(m===t)pz=c.z1-R; else pz=c.z2+R; }
    }
  }
  return [px,pz];
}
// move an actor along (dirx,dirz); returns true if it was blocked by a collider/arena edge
function moveActor(mesh, dirx, dirz, dist, radius){
  const len=Math.hypot(dirx,dirz)||1; dirx/=len; dirz/=len;
  let nx=mesh.position.x+dirx*dist, nz=mesh.position.z+dirz*dist;
  const cx=Math.max(-28,Math.min(28,nx)), cz=Math.max(-28,Math.min(28,nz));
  const [rx,rz]=resolveCollision(cx,cz,radius,0);
  const blocked = Math.abs(rx-nx)>0.0015 || Math.abs(rz-nz)>0.0015;
  mesh.position.x=rx; mesh.position.z=rz;
  return blocked;
}

// soft fill from the opposite side so shadowed faces aren't pure black
const fill = new THREE.DirectionalLight(0xaecbe0, 0.25);
fill.position.set(-30, 25, -20);
scene.add(fill);

// ---- cloud skydome (canvas cloud texture on a big inverted sphere, Pixel-Gun-style bright sky) ----
function cloudSkyTexture(size=512){
  const c = document.createElement('canvas');
  c.width = size; c.height = size/2;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,c.height);
  grad.addColorStop(0, '#4fb3e6');
  grad.addColorStop(0.55, '#8fd6f2');
  grad.addColorStop(1, '#d7f3fa');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i=0;i<70;i++){
    const cx = Math.random()*c.width, cy = Math.random()*c.height*0.65;
    const cw = 30+Math.random()*70, ch = 10+Math.random()*16;
    for (let b=0;b<5;b++){
      ctx.fillRect(cx + Math.random()*cw - cw/2, cy + Math.random()*ch - ch/2, 18+Math.random()*22, 10+Math.random()*10);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 16, 12),
  new THREE.MeshBasicMaterial({map: cloudSkyTexture(), side: THREE.BackSide, fog:false})
);
scene.add(sky);

// ---- distant blocky skyline silhouette beyond the walls, fades into fog for depth ----
function skylineTower(x,z,w,h,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,w), new THREE.MeshLambertMaterial({color, fog:true}));
  m.position.set(x,h/2,z);
  scene.add(m);
}
(function buildSkyline(){
  // far, low, hazy skyline that sits on the horizon (behind the walls) — not an overhead ring
  const ring = 120;
  const colors = [0xafc0cc, 0xbccad4, 0xa4b6c0, 0xc6d2da];
  for (let i=0;i<44;i++){
    const angle = (i/44)*Math.PI*2;
    const dist = ring + Math.random()*45;
    const x = Math.sin(angle)*dist, z = Math.cos(angle)*dist;
    const w = 5+Math.random()*7;
    const h = 8+Math.random()*16;
    skylineTower(x,z,w,h,colors[i%colors.length]);
  }
})();

// ---- textured ground (patchwork of grass/dirt/path voxel tiles) ----
function tileTexture(size=512, cell=8){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grass = [0x6ba368, 0x74ad70, 0x5e9a5c, 0x82b878];
  const dirt = [0x8a7355, 0x93805f, 0x7a6248];
  const stone = [0x9b968c, 0x8f8a80, 0xa7a297];
  const sand = [0xd8c98f, 0xcfc086];
  const flower = [0xd94f70, 0xe0c23e, 0xffffff];
  // patch map: low-freq noise decides big regions (grass/dirt/sand), path is separate
  function bigNoise(x,y){ return Math.abs(Math.sin(x*0.017)*Math.cos(y*0.021)*Math.sin((x+y)*0.009)); }
  for (let y=0;y<size;y+=cell){
    for (let x=0;x<size;x+=cell){
      const n = Math.abs(Math.sin(x*12.9898+y*78.233)*43758.5453 % 1);
      const region = bigNoise(x,y);
      let palette = grass;
      if (region > 0.55) palette = dirt;
      if (region > 0.72) palette = stone;
      if (region < 0.08) palette = sand;
      let base = new THREE.Color(palette[Math.floor(n*97)%palette.length]);
      // sparse flower speckles on grass
      if (palette === grass && n > 0.965) base = new THREE.Color(flower[Math.floor(n*331)%flower.length]);
      const jitter = (n-0.5)*22;
      const r = Math.min(255,Math.max(0, base.r*255+jitter))|0;
      const g = Math.min(255,Math.max(0, base.g*255+jitter))|0;
      const b = Math.min(255,Math.max(0, base.b*255+jitter))|0;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.strokeRect(x+0.5,y+0.5,cell-1,cell-1);
    }
  }
  // stone paths crossing the arena (with individual flagstone seams)
  function paveStrip(px,py,pw,ph){
    ctx.fillStyle = 'rgba(160,155,145,0.92)';
    ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle = 'rgba(90,85,75,0.5)';
    ctx.lineWidth = 2;
    const step = cell*2;
    for (let yy=py; yy<py+ph; yy+=step) ctx.strokeRect(px,yy,pw,step);
    for (let xx=px; xx<px+pw; xx+=step) { ctx.beginPath(); ctx.moveTo(xx,py); ctx.lineTo(xx,py+ph); ctx.stroke(); }
  }
  paveStrip(size*0.42, 0, size*0.16, size);
  paveStrip(0, size*0.42, size, size*0.16);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4,4);
  return tex;
}
// ---- crisp, tileable material textures (Minecraft-like) ----
function _mkCanvas(px){ const c=document.createElement('canvas'); c.width=c.height=px; return c; }
function _finish(c, repeat){ const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.wrapS=t.wrapT=THREE.RepeatWrapping; if(repeat)t.repeat.set(repeat,repeat); return t; }
function grassTopTex(){ const P=16,c=_mkCanvas(P),x=c.getContext('2d');
  const gs=['#5f9e4a','#6fb257','#568f42','#79bd60'];
  for(let j=0;j<P;j++)for(let i=0;i<P;i++){ const n=Math.abs(Math.sin(i*12.9+j*78.2)*43758.5%1); x.fillStyle=gs[(n*4)|0]; x.fillRect(i,j,1,1); if(n>0.9){x.fillStyle='#4a7d38';x.fillRect(i,j,1,1);} }
  // sparse flowers
  [['#e9d24a',3,4],['#e0556f',11,9],['#ffffff',7,12]].forEach(([col,fx,fy])=>{x.fillStyle=col;x.fillRect(fx,fy,1,1);});
  return c; }
function dirtTex(){ const P=16,c=_mkCanvas(P),x=c.getContext('2d');
  const ds=['#7a5a3a','#8a6a45','#6e5033','#836446'];
  for(let j=0;j<P;j++)for(let i=0;i<P;i++){ const n=Math.abs(Math.sin(i*3.1+j*7.7)*4375.5%1); x.fillStyle=ds[(n*4)|0]; x.fillRect(i,j,1,1); if(n>0.86){x.fillStyle='#5a4028';x.fillRect(i,j,1,1);} }
  return c; }
function grassSideTex(){ const c=dirtTex(),x=c.getContext('2d');
  for(let i=0;i<16;i++){ const h=2+((Math.abs(Math.sin(i*9.1)*99)|0)%3); x.fillStyle= (i%2? '#5f9e4a':'#6fb257'); x.fillRect(i,0,1,h); }
  return c; }
function cobbleTex(){ const P=16,c=_mkCanvas(P),x=c.getContext('2d');
  const st=['#8f8d88','#9d9b95','#7c7a75','#a7a49d'];
  x.fillStyle='#6d6b66'; x.fillRect(0,0,P,P);
  for(let by=0;by<P;by+=5)for(let bx=0;bx<P;bx+=5){ const n=Math.abs(Math.sin(bx*4.1+by*9.3)*137%1); x.fillStyle=st[(n*4)|0]; x.fillRect(bx+1,by+1,4,4); }
  return c; }
const GRASS_TOP=grassTopTex(), DIRT=dirtTex(), GSIDE=grassSideTex();
const groundMats=[
  new THREE.MeshLambertMaterial({map:_finish(grassSideTex(),30)}), // +x
  new THREE.MeshLambertMaterial({map:_finish(grassSideTex(),30)}), // -x
  new THREE.MeshLambertMaterial({map:_finish(grassTopTex(),34)}),  // +y (top)
  new THREE.MeshLambertMaterial({map:_finish(dirtTex(),30)}),      // -y
  new THREE.MeshLambertMaterial({map:_finish(grassSideTex(),30)}), // +z

// ---- true voxel brick wall: a grid of small individual cubes instead of one big textured slab ----
function brickWall(w,h,thickness,color,x,y,z,rotY=0,voxelSize=0.45,noise=30){
  const cols = Math.max(1, Math.round(w/voxelSize));
  const rows = Math.max(1, Math.round(h/voxelSize));
  const cw = w/cols, ch = h/rows;
  const geo = new THREE.BoxGeometry(cw*0.94, ch*0.94, thickness);
  const mat = voxMat(color,{noise, size:16, cell:4}); // shared textured material — actual per-instance vertex color isn't reliably supported on this three.js build
  const mesh = new THREE.InstancedMesh(geo, mat, cols*rows);
  const dummy = new THREE.Object3D();
  let i=0;
  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      dummy.position.set(-w/2+cw/2+c*cw, -h/2+ch/2+r*ch, 0);
      dummy.rotation.set(0,0,0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      i++;
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  const group = new THREE.Group();
  group.add(mesh);
  group.position.set(x,y,z);
  group.rotation.y = rotY;
  scene.add(group);
  return group;
}

// ---- shingle roof texture: horizontal overlapping rows of tiles ----
function shingleMat(color){
  const c = document.createElement('canvas'); c.width=c.height=48;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(color);
  for (let row=0; row<8; row++){
    for (let col=0; col<8; col++){
      const n = Math.abs(Math.sin(col*12.9+row*78.2)*43758.5%1);
      const d = (n-0.5)*40/255;
      const r=Math.min(1,Math.max(0,base.r+d)), g=Math.min(1,Math.max(0,base.g+d)), b=Math.min(1,Math.max(0,base.b+d));
      ctx.fillStyle=`rgb(${r*255|0},${g*255|0},${b*255|0})`;
      const off = (row%2)*3;
      ctx.fillRect(col*6+off, row*6, 6, 6);
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.fillRect(col*6+off, row*6, 6, 1);
    }
  }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2);
  return new THREE.MeshLambertMaterial({map:t});
}

// ---- cottage: brick walls, framed windows + glass, a real door, shingle roof, chimney ----
function cottage(x,z,w,d,floors,wallColor,roofColor){
  const h = floors*3;
  addBox(x,z,w,d);
  const frameColor = new THREE.Color(wallColor).multiplyScalar(1.25).getHex();
  brickWall(w,h,0.4,wallColor,x,h/2,z-d/2,0);
  brickWall(d,h,0.4,wallColor,x-w/2,h/2,z,Math.PI/2);
  brickWall(d,h,0.4,wallColor,x+w/2,h/2,z,Math.PI/2);
  brickWall(w*0.32,h,0.4,wallColor,x-w*0.34,h/2,z+d/2,0);
  brickWall(w*0.32,h,0.4,wallColor,x+w*0.34,h/2,z+d/2,0);
  block(w*0.36,0.6,0.5,wallColor,x,h-0.3,z+d/2,{noise:16});
  // real door filling the ground-floor doorway
  door(x, 1.15, z+d/2+0.02, w*0.34, 2.3, 0, 0x5a3d28);
  // framed windows: ground floor on the two side walls + each upper floor all around
  for (let f=0; f<floors; f++){
    const wy = f*3 + 1.5;
    framedWindow(x-w/2-0.02, wy, z-d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x-w/2-0.02, wy, z+d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x+w/2+0.02, wy, z-d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x+w/2+0.02, wy, z+d*0.22, 1.0, 1.1, Math.PI/2, frameColor);
    framedWindow(x, wy, z-d/2-0.02, 1.0, 1.1, 0, frameColor);
    if (f>0){ // front-facing windows on upper floors (ground front is the doorway)
      framedWindow(x-w*0.34, wy, z+d/2+0.02, 0.9, 1.0, 0, frameColor);
      framedWindow(x+w*0.34, wy, z+d/2+0.02, 0.9, 1.0, 0, frameColor);

  }
  for (let f=1; f<floors; f++){
    block(w*0.9,0.3,d*0.9,0x6b5d4d,x,f*3,z,{noise:12});
  }
  // shingle roof: two angled slabs meeting at a ridge
  const smat = shingleMat(roofColor);
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(w*0.78,0.3,d*0.7), smat);
  roofL.position.set(x-w*0.2,h+0.95,z); roofL.rotation.z=0.42; scene.add(roofL);
  const roofR = new THREE.Mesh(new THREE.BoxGeometry(w*0.78,0.3,d*0.7), smat);
  roofR.position.set(x+w*0.2,h+0.95,z); roofR.rotation.z=-0.42; scene.add(roofR);
  block(0.45,0.45,d*0.72,0x3a3128,x,h+1.55,z,{noise:8}); // ridge beam
  // gable end fills (triangular-ish caps)
  block(w*0.5,1.1,0.35,wallColor,x,h+0.6,z-d/2,{noise:16});
  block(w*0.5,1.1,0.35,wallColor,x,h+0.6,z+d/2,{noise:16});
  chimney(x+w*0.28, h+1.0, z-d*0.28);

// ---- sniper towers: climbable rooftops reached by an exterior wooden staircase ----
function sniperTower(x,z,size,height,wallColor,rampDir){
  const half=size/2;
  function wallCollider(cx,cz,w,d){ addBox(cx,cz,w,d,height); }
  brickWall(size,height,0.4,wallColor,x,height/2,z-half,0); wallCollider(x,z-half,size,0.6);
  brickWall(size,height,0.4,wallColor,x,height/2,z+half,0); wallCollider(x,z+half,size,0.6);
  brickWall(size,height,0.4,wallColor,x-half,height/2,z,Math.PI/2); wallCollider(x-half,z,0.6,size);
  brickWall(size,height,0.4,wallColor,x+half,height/2,z,Math.PI/2); wallCollider(x+half,z,0.6,size);
  block(size,0.3,size,wallColor,x,height,z,{noise:16,pattern:'plate'}); // roof cap
  // low cosmetic parapet around the roof edge for cover while sniping
  const pMat={noise:14};
  block(size,0.5,0.25,wallColor,x,height+0.35,z-half,pMat); block(size,0.5,0.25,wallColor,x,height+0.35,z+half,pMat);
  block(0.25,0.5,size,wallColor,x-half,height+0.35,z,pMat); block(0.25,0.5,size,wallColor,x+half,height+0.35,z,pMat);
  heightZones.push({type:'plateau', x1:x-half,z1:z-half,x2:x+half,z2:z+half, y:height});
  // exterior wooden staircase up one side (dir: 'n'|'s'|'e'|'w' — which face it climbs)
  const steps=Math.max(6,Math.round(height/0.45));
  const rampWidth=2.8, rampLen=height*1.7; // wide margin so a fast/diagonal step can't drift off the walkable corridor
  const woodMat={noise:14,pattern:'plate'};
  for(let i=0;i<=steps;i++){
    // i=0 is the step against the tower wall (full height, flush with the roof); i=steps is the far end (ground level)
    const y=(1-i/steps)*height, along=half+(i/steps)*rampLen;
    let sx=x, sz=z, w=rampWidth, d=rampLen/steps+0.08;
    if(rampDir==='s'){ sz=z+along; } else if(rampDir==='n'){ sz=z-along; }
    else if(rampDir==='e'){ sx=x+along; w=rampLen/steps+0.08; d=rampWidth; }
    else { sx=x-along; w=rampLen/steps+0.08; d=rampWidth; }
    block(w,0.45,d,wallColor,sx,y+0.22,sz,woodMat);
  }
  const nearD=half, farD=half+rampLen; // ramp butts right up against the wall — no dead gap between ramp and roof
  if(rampDir==='s') heightZones.push({type:'ramp', x1:x-rampWidth/2,x2:x+rampWidth/2, z1:z+nearD,z2:z+farD, y1:height,y2:0});
  else if(rampDir==='n') heightZones.push({type:'ramp', x1:x-rampWidth/2,x2:x+rampWidth/2, z1:z-farD,z2:z-nearD, y1:0,y2:height});
  else if(rampDir==='e') heightZones.push({type:'ramp', x1:x+nearD,x2:x+farD, z1:z-rampWidth/2,z2:z+rampWidth/2, y1:height,y2:0, axisX:true});
  else heightZones.push({type:'ramp', x1:x-farD,x2:x-nearD, z1:z-rampWidth/2,z2:z+rampWidth/2, y1:0,y2:height, axisX:true});
}

function leavesTex(){ const P=16,c=_mkCanvas(P),x=c.getContext('2d');
  const g=['#3f7d38','#4a8f40','#356e30','#57a049'];
  for(let j=0;j<P;j++)for(let i=0;i<P;i++){ const n=Math.abs(Math.sin(i*6.7+j*3.3)*8123%1); x.fillStyle=g[(n*4)|0]; x.fillRect(i,j,1,1); if(n>0.88){x.fillStyle='#2a5824';x.fillRect(i,j,1,1);} }

function logTex(){ const P=16,c=_mkCanvas(P),x=c.getContext('2d');
  for(let i=0;i<P;i++){ const shade=['#6b4a2c','#7a5636','#5c3f26'][(i%3)]; x.fillStyle=shade; x.fillRect(i,0,1,P); }
  for(let j=0;j<P;j+=1){ if(j%4===0){x.fillStyle='rgba(0,0,0,0.18)';x.fillRect(0,j,P,1);} }
  return c; }

function tree(x,z,scale=1){

// ---- voxel humanoid bot (Minecraft/Pixel-Gun proportions: blocky head+helmet, layered torso armor, segmented limbs) ----
function makeVoxelTexture(baseHex, {noise=22, size=48, pattern=null, cell=6} = {}){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(baseHex);
  const clamp=v=>Math.min(255,Math.max(0,v))|0;
  for (let y=0;y<size;y+=cell){
    for (let x=0;x<size;x+=cell){
      const n = Math.abs((Math.sin(x*12.9898+y*78.233)*43758.5453) % 1);
      const delta = (n-0.5) * noise;
      // base pixel
      ctx.fillStyle = `rgb(${clamp(base.r*255+delta)},${clamp(base.g*255+delta)},${clamp(base.b*255+delta)})`;
      ctx.fillRect(x,y,cell,cell);
      // beveled shading: light top-left edge, dark bottom-right edge → crisp voxel look
      ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(x,y,cell,1); ctx.fillRect(x,y,1,cell);
      ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(x,y+cell-1,cell,1); ctx.fillRect(x+cell-1,y,1,cell);
      // occasional darker speckle for grit
      if(n>0.82){ ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x+2,y+2,2,2); }
    }
  }
  if (pattern === 'plate') {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1,1,size-2,size-2);
    ctx.beginPath(); ctx.moveTo(0,size/2); ctx.lineTo(size,size/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(size/2,0); ctx.lineTo(size/2,size); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

function voxMat(hex, opts){
  return new THREE.MeshLambertMaterial({map: makeVoxelTexture(hex, opts)});
}

  jackal:   { skinC:0x2b2018, face:'jackal', hair:false,   helmet:false, torso:0x33241a, armor:0x4a3420, pants:0x1c1712, boots:0x17130f, hands:0x17130f, glow:0x5fb8d6, metal:true, jackalSnout:true, ears:true, earsColor:0x1c130d, goldTrim:true },
  colossus: { skinC:0xc9a671, face:'colossus', hair:false, helmet:false, torso:0xb99a63, armor:0xd8b988, pants:0xa4854f, boots:0x8f7548, hands:0xb99a63, glow:0xe0b040, cracks:true, bossgun:true, bossgunColor:0xe0b040, bossgunColor2:0xffd873 }
};
function glowCss(hex){ const c=new THREE.Color(hex==null?0x35d0ff:hex); return `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`; }
function makeFace(type, skinHex, glowHex){
  const c=document.createElement('canvas'); c.width=c.height=32; const ctx=c.getContext('2d');
  const s=new THREE.Color(skinHex); ctx.fillStyle=`rgb(${s.r*255|0},${s.g*255|0},${s.b*255|0})`; ctx.fillRect(0,0,32,32);
  const px=(x,y,w,h,col)=>{ctx.fillStyle=col; ctx.fillRect(x,y,w,h);};
  if(type==='human'){ px(7,14,5,5,'#2b2018'); px(20,14,5,5,'#2b2018'); px(8,15,3,3,'#000'); px(21,15,3,3,'#000'); }
  else if(type==='zombie'){ px(4,4,6,5,'#4f6f32'); px(20,19,7,4,'#3f5a28'); px(6,13,6,6,'#12200c'); px(20,13,6,6,'#12200c'); px(8,15,3,3,'#000'); px(22,15,3,3,'#000'); for(let i=0;i<14;i+=3) px(9+i,24,1,4,'#0e1608'); }
  else if(type==='skull'){ px(6,12,8,8,'#0a0a0a'); px(18,12,8,8,'#0a0a0a'); px(14,20,4,4,'#0a0a0a'); for(let i=0;i<24;i+=4) px(6+i,27,2,4,'#141414'); }
  else if(type==='croc'){ px(6,8,5,4,'#0a0a0a'); px(21,8,5,4,'#0a0a0a'); px(8,9,2,2,'#d4e000'); px(22,9,2,2,'#d4e000'); px(3,5,3,3,'#3a5a28'); px(26,5,3,3,'#3a5a28'); for(let i=0;i<28;i+=4) px(3+i,27,2,4,'#f0f0e8'); }
  else if(type==='cyborg'){ px(0,13,32,7,'#0c1418'); px(5,15,9,3,glowCss(glowHex)); px(18,15,9,3,glowCss(glowHex)); for(let x=2;x<32;x+=8){px(x,4,2,2,'#5a636c'); px(x,26,2,2,'#5a636c');} }
  else if(type==='boss'){
    // full metal helmet: no face — angled brow, glowing orange visor slit, lower vent grille
    px(0,0,32,32,'#22262c');                       // dark helmet plate
    px(2,3,28,3,'#31373f'); px(3,6,26,3,'#191c21'); // top bevel + brow shadow
    px(4,13,24,6,'#0e1013');                        // recessed visor housing
    px(6,14,8,4,glowCss(glowHex||0xff7a1a));        // left glowing visor
    px(18,14,8,4,glowCss(glowHex||0xff7a1a));       // right glowing visor
    px(14,15,4,2,'#0e1013');                        // nose bridge between visors
    for(let i=0;i<20;i+=4) px(7+i,23,2,6,'#0c0e11'); // mouth/vent grille
    px(5,22,22,1,'#3a4048'); px(5,29,22,1,'#3a4048'); // grille frame
  }
  else if(type==='mummy'){
    // diagonal bandage striping over the base skin fill, sunken sockets, glowing pinprick eyes
    ctx.strokeStyle='rgba(120,102,68,0.55)'; ctx.lineWidth=3;
    for(let i=-6;i<38;i+=6){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+16,32); ctx.stroke(); }
    px(6,13,7,6,'#150f08'); px(19,13,7,6,'#150f08');
    px(8,15,3,3,glowCss(glowHex||0xe8a23d)); px(21,15,3,3,glowCss(glowHex||0xe8a23d));
  }
  else if(type==='jackal'){
    // deep-set sockets with visible contrast against the fur, glowing eyes, dark muzzle bridge (no teeth — the snout mesh covers the rest)
    px(4,8,8,7,'#120c08'); px(20,8,8,7,'#120c08');
    px(6,10,4,3,glowCss(glowHex||0x5fb8d6)); px(22,10,4,3,glowCss(glowHex||0x5fb8d6));
    px(10,22,12,4,'#0a0705');
  }
  else if(type==='colossus'){
    px(6,13,6,5,'#2a2013'); px(20,13,6,5,'#2a2013');
    px(9,15,2,2,glowCss(glowHex||0xe0b040)); px(23,15,2,2,glowCss(glowHex||0xe0b040));
    ctx.strokeStyle=glowCss(glowHex||0xe0b040); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(3,3); ctx.lineTo(13,17); ctx.lineTo(9,29); ctx.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; return t;
}

function makeVoxelBot(color, weaponType, skinName){
  if(skinName==='scarab') return makeScarab();
  if(skinName==='scorpion') return makeScorpion();
  const cfg = SKINS[skinName] || SKINS.soldier;
  const g = new THREE.Group();
  const skinC = cfg.skinC;

  // glowing eyes for cyborg/boss (Basic material → always bright, unaffected by hit-flash)

    const eR=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.06,0.05),eyeMat); eR.position.set(0.1,1.6,0.235); g.add(eR);

      spike.position.set(-0.16+i*0.08,1.9,-0.06+(i%2)*0.05); spike.rotation.z=(i-2)*0.18; spike.rotation.x=-0.15; g.add(spike); }
    const hb=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.3,0.2),hairMat); hb.position.set(0,1.72,-0.15); g.add(hb);
  }
  // helmet (+ boss crest horns)
  if(cfg.helmet){
    const hm=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.1,0.52),voxMat(helmetCol,{noise:10,pattern:'plate'})); hm.position.y=1.98; g.add(hm);
    if(cfg.face==='boss'){
      const cL=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.2,0.09),voxMat(helmetCol,{noise:8})); cL.position.set(-0.22,2.12,0); cL.rotation.z=0.5; g.add(cL);
      const cR=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.2,0.09),voxMat(helmetCol,{noise:8})); cR.position.set(0.22,2.12,0); cR.rotation.z=-0.5; g.add(cR);
    }
  }
  // croc snout + tail
  if(cfg.snout){
    const sn=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.16,0.3),voxMat(skinC,{noise:12})); sn.position.set(0,1.5,0.3); g.add(sn);
    const teeth=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.05,0.02),new THREE.MeshLambertMaterial({color:0xf2f2ea})); teeth.position.set(0,1.43,0.45); g.add(teeth);

  // jackal: long, narrowing three-part wedge snout — tapers to a sharp dark point instead of a blunt rounded nose, dusty (not warm/cute) fur tone

    const tip=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.07,0.16),voxMat(0x080503,{noise:6})); tip.position.set(0,1.45,0.64); g.add(tip);
  }
  // jackal-style pointed ears, dark to match the fur (a thin gold trim reads better than solid gold horns)
  if(cfg.ears){
    const earMat = voxMat(cfg.earsColor||0x1c130d,{noise:10});
    const earL = new THREE.Mesh(new THREE.ConeGeometry(0.075,0.2,4), earMat); earL.position.set(-0.15,1.94,-0.02); earL.rotation.z=0.3; g.add(earL);
    const earR = new THREE.Mesh(new THREE.ConeGeometry(0.075,0.2,4), earMat); earR.position.set(0.15,1.94,-0.02); earR.rotation.z=-0.3; g.add(earR);
    const tipMat = new THREE.MeshBasicMaterial({color:0xad8730, fog:false});
    const tipL = new THREE.Mesh(new THREE.ConeGeometry(0.035,0.06,4), tipMat); tipL.position.set(-0.15,2.05,-0.02); tipL.rotation.z=0.3; g.add(tipL);
    const tipR = new THREE.Mesh(new THREE.ConeGeometry(0.035,0.06,4), tipMat); tipR.position.set(0.15,2.05,-0.02); tipR.rotation.z=-0.3; g.add(tipR);
  }
  // colossus: glowing rune-crack strips across the chest, so the cracked-stone look reads at a distance
  if(cfg.cracks){
    const crackMat = new THREE.MeshBasicMaterial({color:cfg.glow||0xe0b040, fog:false});
    const c1=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.5,0.035),crackMat); c1.position.set(-0.14,1.18,0.19); c1.rotation.z=0.35; g.add(c1);
    const c2=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.38,0.03),crackMat); c2.position.set(0.17,0.98,0.19); c2.rotation.z=-0.5; g.add(c2);
    const c3=new THREE.Mesh(new THREE.BoxGeometry(0.025,0.32,0.025),crackMat); c3.position.set(0.02,1.5,0.24); c3.rotation.z=0.15; g.add(c3);
  }
  // jackal: a couple of thin gold trim bars on the chest — just a smidge of color against the dark obsidian
  if(cfg.goldTrim){
    const trimMat = new THREE.MeshBasicMaterial({color:0xad8730, fog:false});
    const tr1=new THREE.Mesh(new THREE.BoxGeometry(0.58,0.025,0.02),trimMat); tr1.position.set(0,1.39,0.19); g.add(tr1);
    const tr2=new THREE.Mesh(new THREE.BoxGeometry(0.58,0.025,0.02),trimMat); tr2.position.set(0,1.01,0.19); g.add(tr2);
  }

  // layered torso

  const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.42,0.36), voxMat(armor,{noise:16,pattern:'plate'})); chestPlate.position.y=1.2; g.add(chestPlate);
  const belt = new THREE.Mesh(new THREE.BoxGeometry(0.58,0.12,0.34), voxMat(0x2b2b2b,{noise:8})); belt.position.y=0.82; g.add(belt);
  const padGeo = new THREE.BoxGeometry(0.18,0.18,0.36); const padMat = voxMat(armor,{noise:10,pattern:'plate'});
  const padL = new THREE.Mesh(padGeo, padMat); padL.position.set(-0.38,1.4,0); g.add(padL);
  const padR = new THREE.Mesh(padGeo, padMat); padR.position.set(0.38,1.4,0); g.add(padR);
  if(cfg.metal){ const cl=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.05,0.02),new THREE.MeshBasicMaterial({color:cfg.glow,fog:false})); cl.position.set(0,1.22,0.19); g.add(cl); }

  // arms
  const upperMat = voxMat(armorDark,{noise:12});
  const handMat = voxMat(handsC,{noise:14});
  function makeArm(side){
    const arm = new THREE.Group();
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.34,0.2), upperMat); upper.position.y=-0.17; arm.add(upper);
    const lower = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.32,0.18), upperMat); lower.position.y=-0.5; arm.add(lower);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.14,0.16), handMat); hand.position.y=-0.7; arm.add(hand);
    arm.position.set(side*0.38, 1.32, 0); g.add(arm); return arm;
  }
  const armL = makeArm(-1);
  const armR = makeArm(1);

  // ---- held weapon (barrel/blade points down the arm, -Y local) ----
  const heldGrp = new THREE.Group();
  heldGrp.position.set(0,-0.78,0.02);
  if(weaponType==='knife'){
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.5,0.12), new THREE.MeshPhongMaterial({color:0xd8dde3, shininess:110, specular:0xffffff}));
    blade.position.y=-0.28; heldGrp.add(blade);

  } else if(cfg.bossgun){
    // energy cannon (blue for the default boss; skins can override via bossgunColor/bossgunColor2)
    const dark = voxMat(0x1b2630,{noise:10});
    const barrel=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.5,0.17),dark); barrel.position.y=-0.26; heldGrp.add(barrel);
    const core=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.52,0.08),new THREE.MeshBasicMaterial({color:cfg.bossgunColor||0x35c8ff,fog:false})); core.position.y=-0.26; heldGrp.add(core);

    const slide = new THREE.Mesh(new THREE.BoxGeometry(0.11,0.12,0.28), voxMat(0x2b2f36,{noise:12,pattern:'plate'})); slide.position.set(0,-0.02,-0.02); heldGrp.add(slide);

  }
  const legL = makeLeg(-1);
  const legR = makeLeg(1);

  g.userData.legL = legL; g.userData.legR = legR; g.userData.armR = armR; g.userData.armL = armL;
  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });

  marker.position.set(0, 2.7, 0); marker.scale.set(1.05,1.05,1.05); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}
// shared marker texture: glowing red downward arrow/chevron
let _markerTex=null;
function enemyMarkerTex(){
  if(_markerTex) return _markerTex;
  const c=document.createElement('canvas'); c.width=c.height=128; const ctx=c.getContext('2d');
  // bright, high-contrast downward arrow with a bold white outline + dark halo so it reads through walls
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=14;
  ctx.strokeStyle='#000'; ctx.lineWidth=14; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(26,20); ctx.lineTo(102,20); ctx.lineTo(64,96); ctx.closePath(); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff2a2a'; ctx.strokeStyle='#ffffff'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(26,20); ctx.lineTo(102,20); ctx.lineTo(64,96); ctx.closePath(); ctx.fill(); ctx.stroke();
  _markerTex=new THREE.CanvasTexture(c); _markerTex.magFilter=THREE.NearestFilter; return _markerTex;
}

// ---- scarab: small non-humanoid swarm creature (no arms/legs rig — spawned in packs of 5) ----
// a single beetle — used only as a building block for the swarm group below, never spawned alone
function makeScarabUnit(){
  const g = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.32,10,6), voxMat(0x4f5c37,{noise:18}));
  shell.scale.set(1,0.55,0.75); shell.position.y=0.32; g.add(shell);
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.015,0.03,0.6), new THREE.MeshBasicMaterial({color:0x171d10,fog:false}));
  seam.position.y=0.42; g.add(seam);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.1,0.1), voxMat(0x171d10,{noise:10})); head.position.set(0,0.26,0.3); g.add(head);
  const legMat = voxMat(0x171d10,{noise:8});
  for(let i=0;i<6;i++){
    const side = i<3?-1:1, row=i%3;
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.03,0.03), legMat);
    leg.position.set(side*0.24, 0.14, 0.16-row*0.16);
    leg.rotation.z = side*0.5; leg.rotation.y = (row-1)*0.3;
    g.add(leg);
  }
  const under = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,4),
    new THREE.MeshBasicMaterial({color:0x5fb8d6, transparent:true, opacity:0.5, fog:false}));
  under.scale.set(1,0.2,0.6); under.position.y=0.06; g.add(under);
  return g;
}
// the scarab "swarm": one bot entity made of 5 beetles in a fixed cluster — they share one hitbox/HP
// and one AI, so the pack always moves, fights, and dies together instead of scattering as individuals
function makeScarab(){
  const g = new THREE.Group();
  const formation = [
    {x:-0.3, z:0.12,  ry:-0.5, s:0.85},
    {x:0.24, z:0.2,   ry:0.35, s:1.05},
    {x:0.02, z:-0.16, ry:0.1,  s:0.95},
    {x:0.34, z:-0.12, ry:0.8,  s:0.8},
    {x:-0.2, z:-0.24, ry:-1.0, s:0.75},
  ];
  formation.forEach(f=>{
    const unit = makeScarabUnit();
    unit.position.set(f.x, 0, f.z); unit.rotation.y = f.ry; unit.scale.setScalar(f.s);
    g.add(unit);
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.15, 0); marker.scale.set(0.9,0.9,0.9); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ---- scorpion stalker: low fast flanker, non-humanoid — tail arcs up to a glowing stinger ----
function makeScorpion(){
  const g = new THREE.Group();
  const shellMat = voxMat(0xb5502c,{noise:16});
  const shellMat2 = voxMat(0x9c4423,{noise:16});
  // narrow, elongated segmented body (front-to-back) instead of a wide flat crab shell
  const headSeg = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.19,0.22), shellMat); headSeg.position.set(0,0.27,0.32); g.add(headSeg);

  const pincerMat = voxMat(0x8a3a20,{noise:12});

  }
  // segmented tail arcing up and forward, ending in a glowing stinger — the dominant silhouette feature
  const tailMat = voxMat(0x6a2c1c,{noise:12});
  [{s:0.19,y:0.32,z:-0.32,rx:-0.3},{s:0.15,y:0.5,z:-0.46,rx:-0.9},{s:0.12,y:0.62,z:-0.4,rx:-1.7},{s:0.095,y:0.68,z:-0.24,rx:-2.3}]
    .forEach(seg=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s,seg.s*1.3), tailMat); m.position.set(0,seg.y,seg.z); m.rotation.x=seg.rx; g.add(m); });
  const stinger = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.17,4), new THREE.MeshBasicMaterial({color:0x33c9c9, fog:false}));
  stinger.position.set(0,0.73,-0.1); stinger.rotation.x = -2.6; g.add(stinger);
  const glow = new THREE.PointLight(0x33c9c9, 0.6, 2.5); glow.position.copy(stinger.position); g.add(glow);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.15, 0); marker.scale.set(0.85,0.85,0.85); marker.renderOrder = 9999;
  marker.raycast = function(){};

// brushed-metal look: subtle canvas texture + Phong specular highlights (much crisper than flat Lambert)
function metalTexture(baseHex, streaks=true){
  const c = document.createElement('canvas'); c.width=c.height=32;
  const ctx=c.getContext('2d'); const b=new THREE.Color(baseHex);
  for(let y=0;y<32;y+=2)for(let x=0;x<32;x+=2){
    const n=Math.abs(Math.sin(x*3.1+y*7.7)*4375.5%1); const d=(n-0.5)*36/255;
    ctx.fillStyle=`rgb(${Math.min(255,Math.max(0,b.r*255+d))|0},${Math.min(255,Math.max(0,b.g*255+d))|0},${Math.min(255,Math.max(0,b.b*255+d))|0})`;
    ctx.fillRect(x,y,2,2);
  }
  if(streaks){ ctx.strokeStyle='rgba(255,255,255,0.06)'; for(let y=2;y<32;y+=5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(32,y+1);ctx.stroke();} }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; return t;
}
function metalMatP(color,shininess=70,spec=0x777777){
  return new THREE.MeshPhongMaterial({map:metalTexture(color), shininess, specular:spec});
}
function part(group,w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); group.add(m); return m;
}

let yaw = 0, pitch = 0;              // actual (smoothed) camera angles
let targetYaw = 0, targetPitch = 0;  // where the input wants to look; camera eases toward these
const vel = new THREE.Vector3();     // smoothed movement velocity (world units/sec)
let playerHeight = 0;                // current ground/rooftop height under the player (added to eye height)

  if (document.pointerLockElement !== renderer.domElement) return;

});

// ===================== SNIPER SCOPE (zoom) =====================
function setScope(on){
  if(on && (!weapons[currentWeapon] || !weapons[currentWeapon].userData.scoped)) on = false;
  if(on === scoped) return;
  scoped = on;
  document.body.classList.toggle('scoped', scoped);
  camera.fov = scoped ? weapons[currentWeapon].userData.scopeFov : DEFAULT_FOV;
  camera.updateProjectionMatrix();
  gunGroup.visible = !scoped; // hide the viewmodel while looking through the scope
  const adsBtn = document.getElementById('adsbtn'); if(adsBtn) adsBtn.classList.toggle('active', scoped);
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mousedown', e => {
  if (paused) return;
  if (e.button===2 && document.pointerLockElement===renderer.domElement) setScope(true);
});
document.addEventListener('mouseup', e => { if(e.button===2) setScope(false); });

const keys = {};
document.addEventListener('keydown', e => {
  if (e.code==='KeyP' || e.code==='Escape' || e.code==='Space'){
    if (e.code==='Space') e.preventDefault(); // stop the page from scrolling / re-clicking a focused button
    if (gameStarted && !gameWon){ paused?resumeGame():pauseGame(); }
  }
  if (paused) return;
  keys[e.code]=true;
  if ((e.code==='ShiftLeft' || e.code==='ShiftRight') && document.pointerLockElement===renderer.domElement) setScope(true);
  if (e.code==='Digit1') selectWeapon(0);
  if (e.code==='Digit2') selectWeapon(1);
  if (e.code==='Digit3') selectWeapon(2);
  if (e.code==='Digit4') selectWeapon(3);
  if (e.code==='KeyZ') selectWeapon(weapons.findIndex(w=>w.userData.ultimate));
  if (e.code==='KeyF' && player.alive) reloadWeapon(currentWeapon);
  if (e.code==='KeyR' && player.alive){
    const spot = pickRecoverySpot(camera.position.x, camera.position.z);
    camera.position.x = spot.x; camera.position.z = spot.z; playerHeight = spot.h;
    camera.position.y = playerHeight + 1.7; vel.set(0,0,0); stuckTimer = 0;
    setBanner('↺ repositioned'); setTimeout(()=>{ if(bannerEl && bannerEl.textContent==='↺ repositioned') setBanner(''); }, 900);
  }
});
document.addEventListener('keyup', e => {
  keys[e.code]=false;
  if (e.code==='ShiftLeft' || e.code==='ShiftRight') setScope(false);
});
window.addEventListener('wheel', e => { if(!paused) selectWeapon(currentWeapon + (e.deltaY>0?1:-1)); });

(function setupTouch(){
  if(!mobileEl) return;
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  const fireBtn = document.getElementById('firebtn'), wbtns = document.querySelectorAll('.wbtn');
  let moveId=null, moveOx=0, moveOy=0;   // joystick touch
  let lookId=null, lookX=0, lookY=0;      // look-drag touch

  });
  const adsBtn = document.getElementById('adsbtn');

    wbtns.forEach(b=> b.classList.toggle('sel', +b.dataset.w===currentWeapon));

  function releaseFire(){ firing=false; fireId=null; }
  fireBtn.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(paused) return; fireId=e.changedTouches[0].identifier; firing=true; fire(); }, {passive:false});
  fireBtn.addEventListener('touchend',    e=>{ e.preventDefault(); e.stopPropagation(); releaseFire(); }, {passive:false});
  fireBtn.addEventListener('touchcancel', e=>{ e.preventDefault(); e.stopPropagation(); releaseFire(); }, {passive:false});

  // joystick
  const R=55;
  stick.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); if(paused) return;
    const t=e.changedTouches[0]; moveId=t.identifier; const r=stick.getBoundingClientRect();
    moveOx=r.left+r.width/2; moveOy=r.top+r.height/2; updateStick(t.clientX,t.clientY);
  }, {passive:false});
  function updateStick(cx,cy){
    let dx=cx-moveOx, dy=cy-moveOy; const d=Math.hypot(dx,dy)||1;
    const cl=Math.min(d,R); dx=dx/d*cl; dy=dy/d*cl;
    knob.style.left=(45+dx)+'px'; knob.style.top=(45+dy)+'px';
    moveVec.x = dx/R; moveVec.z = dy/R;
  }
  function endStick(){ moveId=null; moveVec.x=0; moveVec.z=0; knob.style.left='45px'; knob.style.top='45px'; }

  // global touch routing for look-drag (any touch not on a control, on the right side)
  document.addEventListener('touchstart', e=>{
    if(!touchPlaying || paused) return;
    for(const t of e.changedTouches){
      if(t.target.closest('#stick')||t.target.closest('#firebtn')||t.target.closest('.wbtn')) continue;
      if(lookId===null){ lookId=t.identifier; lookX=t.clientX; lookY=t.clientY; }
    }
  }, {passive:false});
  document.addEventListener('touchmove', e=>{
    if(touchPlaying) e.preventDefault();
    if(paused) return;
    for(const t of e.changedTouches){
      if(t.identifier===moveId) updateStick(t.clientX,t.clientY);
      else if(t.identifier===lookId){
        targetYaw -= (t.clientX-lookX)*0.008; targetPitch -= (t.clientY-lookY)*0.008;
        targetPitch=Math.max(-1.2,Math.min(1.2,targetPitch)); lookX=t.clientX; lookY=t.clientY;
      }
    }
  }, {passive:false});
  function endTouch(e){ for(const t of e.changedTouches){ if(t.identifier===moveId) endStick(); if(t.identifier===lookId) lookId=null; if(t.identifier===fireId) releaseFire(); } }
  document.addEventListener('touchend', endTouch, {passive:false});
  document.addEventListener('touchcancel', endTouch, {passive:false});
  // safety nets: never leave the trigger stuck down
  window.addEventListener('blur', ()=>{ firing=false; fireId=null; });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ firing=false; fireId=null; } });
})();

const player = { hp:100, maxHp:100, score:0, alive:true, respawn:0, lastHit:-99 };

// several verified-clear overworld spots so death doesn't always drop you back in the same place
const PLAYER_SPAWNS = [[0,10],[0,-10],[15,0],[-15,0],[0,20],[20,-15],[8,3]].map(([x,z])=>new THREE.Vector3(x,1.7,z));
let lastSpawnIdx = -1;
function pickSpawnPoint(){
  if(PLAYER_SPAWNS.length<=1) return PLAYER_SPAWNS[0];
  let idx; do{ idx=Math.floor(Math.random()*PLAYER_SPAWNS.length); } while(idx===lastSpawnIdx);
  lastSpawnIdx = idx; return PLAYER_SPAWNS[idx];
}
// nearest of the verified-clear spawns to (x,z) — the guaranteed-safe fallback for unstick recovery
function nearestClearSpawn(x,z){
  let best=PLAYER_SPAWNS[0], bestD=Infinity;
  for(const sp of PLAYER_SPAWNS){ const d=(sp.x-x)**2+(sp.z-z)**2; if(d<bestD){ bestD=d; best=sp; } }
  return best;
}
// Always recover to the nearest verified-clear spawn point rather than a tracked "last safe"
// spot: the height-zone model that tracking relied on can't tell "standing on a roof" apart
// from "wedged underneath it" (both report the same getTerrainHeight at that x,z), so a
// heuristic built on that model can't reliably catch every stuck case. A fixed, pre-verified
// set of spots trades "nearest arbitrary point" for "recovery that actually always works".
function pickRecoverySpot(curX,curZ){
  const sp = nearestClearSpawn(curX,curZ);
  return {x:sp.x,z:sp.z,h:0};
}

const ENEMY_COLORS=[0xc0392b,0x2980b9,0x27ae60,0x8e44ad,0xe67e22,0x16a085,0xd35400,0x2c3e50];
const SPAWN_POINTS=[[-6,-6],[9,4],[-9,9],[-14,-14],[16,-6],[4,16],[-20,4],[18,14],[-2,-20],[12,-16]];
const WAVES=[3,4,5, 6,7,9]; // 6 waves; a boss after wave 3 and after wave 6 — noticeably bigger later waves
function waveDiff(n){ return 1 + n*n*0.05 + n*0.16; } // accelerating curve: each wave is meaningfully tougher than the last
let waveIdx=0, betweenTimer=0, pending=null, bossActive=false, bossNum=0, gameWon=false, gameStarted=false;
let checkpointWaveIdx=0; // checkpoints only every 2 waves (idx 0, 2, 4 = wave 1, 3, 5) — dying rolls back to here
function clearBots(){ bots.forEach(b=>scene.remove(b.mesh)); bots.length=0; }
function setEnemyCount(txt){ const e=document.getElementById('enemies'); if(e) e.textContent = txt!==undefined?txt:bots.filter(b=>b.alive).length; }
function spawnWave(n){
  if(n%2===0) checkpointWaveIdx=n; // wave 1, 3, 5 (idx 0,2,4) are checkpoints — every 2 waves
  clearBots();
  const count=WAVES[n], diff=waveDiff(n);
  const pyramid = n<3; // waves 1-3: desert/pyramid reskin, ahead of the stone-temple boss dungeon
  let knifeN=0, pistN=0;
  for(let i=0;i<count;i++){
    const sp=SPAWN_POINTS[(i*3 + n*2 + i) % SPAWN_POINTS.length];
    const x=sp[0], z=sp[1];
    const wt=(i%3===2)?'knife':'pistol';
    const skin = pyramid
      ? (wt==='knife' ? 'mummy' : 'jackal')
      : (wt==='knife' ? (knifeN++ %2 ? 'skeleton' : 'zombie')
                      : (pistN++  %2 ? 'cyborg'   : 'croc'));
    const col=ENEMY_COLORS[(i+n)%ENEMY_COLORS.length];
    spawnBot(x,z,col,[x-2.5,0,z],[x+2.5,0,z],wt,{skin, hp:Math.round(BOT_MAX_HP*diff), diff, speed:1+(diff-1)*0.5});
  }
  if(pyramid && n===1){ // wave 2: a scarab swarm — one pack entity (5 beetles, one hitbox/HP/AI) that moves and dies together
    const sx=-10, sz=-16;
    spawnBot(sx,sz,0x4f5c37,[sx-2,0,sz],[sx+2,0,sz],'knife',
      {skin:'scarab', hp:Math.round(BOT_MAX_HP*diff*0.85), diff, speed:(1+(diff-1)*0.5)*1.6, scale:0.85});
  }
  if(pyramid && n===2){ // wave 3: a scorpion stalker prowls in as a fast elite, ahead of the colossus boss
    spawnBot(10,16,0xb5502c,[4,0,16],[16,0,16],'knife',
      {skin:'scorpion', hp:Math.round(BOT_MAX_HP*diff*1.4), diff, speed:(1+(diff-1)*0.5)*1.9, scale:1.3});
  }
  document.getElementById('wave').textContent=(n+1)+'/6';
  setEnemyCount();
}

function startGame(){
  SFX.init();

  gunGroup.visible = true;
  gameStarted=true; gameWon=false; bossActive=false; pending=null; betweenTimer=0; waveIdx=0; bossNum=0; checkpointWaveIdx=0;
  player.score=0; player.hp=player.maxHp; player.alive=true; player.lastHit=-99;
  exitDungeon(); // ensure we start in the overworld (also positions the player)
  targetYaw=0; targetPitch=0; vel.set(0,0,0);

  setBanner('WAVE 1'); setTimeout(()=>{ if(!gameWon) setBanner(''); },1400);

function onAllDead(){
  if(gameWon || !gameStarted || pending) return;
  if(bossActive){
    // boss defeated
    bossActive=false; showBossBar(false);
    if(bossNum>=2){ gameWon=true; exitDungeon(); setBanner('🏆 YOU WIN!  (click to play again)'); return; }
    exitDungeon(); waveIdx++; pending='wave'; betweenTimer=2.6; setBanner('Boss down! Back to the surface…');
    return;
  }
  // a normal wave was cleared: boss after wave 3 (idx 2) and after wave 6 (idx 5)
  if(waveIdx===2 || waveIdx===5){ pending='boss'; betweenTimer=2.2; setBanner(waveIdx===5?'The final boss stirs…':'A boss awaits below…'); }
  else { waveIdx++; pending='wave'; betweenTimer=2.5; setBanner('WAVE '+(waveIdx+1)+' incoming…'); }
}
function updateWaves(dt){
  if(pending){
    betweenTimer -= dt;
    if(betweenTimer <= 0){
      if(pending==='wave'){ spawnWave(waveIdx); setBanner('WAVE '+(waveIdx+1)); setTimeout(()=>{ if(!gameWon) setBanner(''); },1200); }
      else if(pending==='boss'){ spawnBossFight(); }
      pending=null;
    }
  } else if(gameStarted && !gameWon && bots.length>0 && bots.filter(b=>b.alive).length===0){
    onAllDead();
  }
}

function spawnTracer(from,to,color){
  const tr = tracers[tracerIdx=(tracerIdx+1)%tracers.length];
  const m = tr.mesh; m.material.color.set(color);
  const mid = from.clone().add(to).multiplyScalar(0.5);
