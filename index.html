  const chitinMat = voxMat(0x2e1c14,{noise:14}); // dark, matte chitin for the tail — reads as insect armor, not dragon scale
  const wingMat = voxMat(0x241010,{noise:12});
  const stingerMat = new THREE.MeshBasicMaterial({color:0xff5a1a,fog:false});

  // bigger lion body — a longer, heavier torso with a shoulder/chest hump at the front and a neck that
  // carries the head OUT IN FRONT of the body (before, the mane sat down inside the chest)
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.54,0.58,1.2), furMat); torso.position.set(0,0.74,-0.2); body.add(torso);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.54,0.44), furMat2); chest.position.set(0,0.82,0.3); body.add(chest);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.4,0.34), furMat2); neck.position.set(0,0.98,0.52); body.add(neck);

  // ==== manticore head: clean voxel lion from the reference portrait ====
  // Built around HY/HZ so the whole head sits FORWARD of the body on the neck, not buried in the chest.
  // Coarse and clean: one solid dark mane mass for the round frame + volume, a solid tan head, a long
  // protruding snout, and a small set of BIG feature blocks so the face reads clearly.
  const maneMatLight = voxMat(0x7a4a20,{noise:8});
  const creamMat = new THREE.MeshLambertMaterial({color:0xead9b0});
  const inkMat = new THREE.MeshLambertMaterial({color:0x14100a});
  const HY = 1.24, HZ = 0.62;   // head centre — pushed up and forward, clear of the chest

  // mane as CHUNKY big distinct cubes (the reference reads as ~8 big blocks across, not a fuzzy ball).
  // A solid dark backing mass for volume, then ONE clean ring of large cubes — no noisy double-ring.
  const maneMass = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.98,0.5), maneMat); maneMass.position.set(0,HY-0.05,HZ-0.06); body.add(maneMass);
  const maneMassW = new THREE.Mesh(new THREE.BoxGeometry(0.72,1.12,0.46), maneMat); maneMassW.position.set(0,HY-0.05,HZ-0.06); body.add(maneMassW); // taller narrow → oval
  for(let i=0;i<14;i++){ const a=(i/14)*Math.PI*2;
    const mat = i%3===0 ? maneMatLight : maneMat;
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.28,0.26), mat);   // big chunky cubes
    t.position.set(Math.sin(a)*0.5, HY-0.05+Math.cos(a)*0.58, HZ+0.04); body.add(t); }

  // BIGGER solid tan head in the middle of the mane, with a LONG protruding snout below-center
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.58,0.36), furMat); head.position.set(0,HY+0.02,HZ+0.2); body.add(head);
  // thinner but longer snout — narrower width, deeper reach forward
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.28,0.48), furMat2); snout.position.set(0,HY-0.18,HZ+0.5); body.add(snout);
  const snoutTop = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.1,0.46), furMat); snoutTop.position.set(0,HY-0.04,HZ+0.5); body.add(snoutTop);

  // BIG clear face features on the head/snout front surfaces
  const hf = HZ+0.2+0.18+0.01;   // head front surface
  const sf = HZ+0.5+0.24+0.01;   // snout front surface (thinner/longer snout → further forward)
  // eyes like the reference: bold dark eyes each in a BIG pale cream patch, spaced apart in the upper face
  [-1,1].forEach(side=>{
    const eyeWhite=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.03), creamMat); eyeWhite.position.set(side*0.15,HY+0.08,hf); body.add(eyeWhite);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.12,0.05), inkMat); eye.position.set(side*0.13,HY+0.07,hf+0.01); body.add(eye);
  });
  // clean face markings matching the reference (was a dark "M" blob before): a big pale cream muzzle patch
  // filling the lower snout front, a crisp black INVERTED-TRIANGLE nose on top of it, a thin philtrum, and
  // one subtle straight mouth line — distinct pieces with cream showing between them, not a dark cluster
  const muzzle=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.22,0.02), creamMat); muzzle.position.set(0,HY-0.18,sf); body.add(muzzle);
  const noseTop=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.06,0.04), inkMat); noseTop.position.set(0,HY-0.08,sf+0.015); body.add(noseTop);
  const noseMid=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.04,0.04), inkMat); noseMid.position.set(0,HY-0.12,sf+0.015); body.add(noseMid);
  const noseTip=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.03,0.04), inkMat); noseTip.position.set(0,HY-0.15,sf+0.015); body.add(noseTip);
  const philtrum=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.05,0.04), inkMat); philtrum.position.set(0,HY-0.19,sf+0.015); body.add(philtrum);
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.025,0.04), inkMat); mouth.position.set(0,HY-0.23,sf+0.015); body.add(mouth);
  // ears poking out the top corners of the mane
  [-1,1].forEach(side=>{
    const ear=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.15,0.12), maneMat); ear.position.set(side*0.34,HY+0.36,HZ+0.02); body.add(ear);
    const earIn=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.04), furMat2); earIn.position.set(side*0.34,HY+0.35,HZ+0.09); body.add(earIn);
  });
  // bat wings — more detail: a two-part leathery membrane, four finger-bones fanning across it, and a
  // clawed hook at the leading edge. Angled up more (steeper rotation.z + raised root) so they sweep
  // upward off the shoulders instead of sitting out flat.
  [-1,1].forEach(side=>{
    const wingRoot=new THREE.Group(); wingRoot.position.set(side*0.34,1.08,-0.1); wingRoot.rotation.z=side*0.5; wingRoot.rotation.y=side*0.35; body.add(wingRoot);
    const mem1=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.05,0.46), wingMat); mem1.position.set(side*0.28,0,-0.02); wingRoot.add(mem1);
    const mem2=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.045,0.32), wingMat); mem2.position.set(side*0.66,-0.09,-0.08); wingRoot.add(mem2);
    for(let i=0;i<4;i++){ const bone=new THREE.Mesh(new THREE.BoxGeometry(0.92,0.03,0.03), furMat2); bone.position.set(side*0.42,0.03,-0.18+i*0.11); bone.rotation.y=side*(i-1.5)*0.12; wingRoot.add(bone); }
    const wclaw=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.13,4), inkMat); wclaw.position.set(side*0.88,-0.02,-0.18); wclaw.rotation.z=side*1.2; wingRoot.add(wclaw);
  });
  // round, padded lion paws with visible toes — not clawed dragon feet — spread wider for the bigger body
  [[-0.2,0.4],[0.2,0.4],[-0.2,-0.46],[0.2,-0.46]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.5,0.22),furMat2); leg.position.set(lx,0.42,lz); body.add(leg);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.14,0.28),furMat2); paw.position.set(lx,0.18,lz); body.add(paw);
    const toe=new THREE.Mesh(new THREE.BoxGeometry(0.23,0.05,0.09), furMat); toe.position.set(lx,0.12,lz+0.13); body.add(toe);
  });
  // segmented scorpion tail in dark chitin (not the body's fur color), chain-built like the bow-limb
  // code (heldLimb) — each segment's start is the previous segment's actual end point, with a touch of
  // overlap, instead of 4 independent boxes at hand-picked coordinates that didn't line up edge to edge
  // and read as floating disconnected chunks. Arcs up from the lower back and forward over the back to a
  // glowing stinger poised to strike.
  {
    let ty=0.85, tz=-0.5, theta=-1.9;
    const overlap=0.015;
    [{s:0.16,len:0.26,dt:0.5},{s:0.14,len:0.24,dt:0.6},{s:0.12,len:0.22,dt:0.7},{s:0.1,len:0.19,dt:0.8},{s:0.08,len:0.15,dt:0.7}].forEach(seg=>{
      const thetaMid = theta + seg.dt/2;
      const dy=Math.cos(thetaMid), dz=Math.sin(thetaMid);
      const cy = ty + (seg.len/2)*dy, cz = tz + (seg.len/2)*dz;
      const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.len,seg.s), chitinMat);
      m.position.set(0,cy,cz); m.rotation.x = thetaMid; body.add(m);
      const tipY = ty+seg.len*dy, tipZ = tz+seg.len*dz;
      ty = tipY - overlap*dy; tz = tipZ - overlap*dz;
      theta += seg.dt;
    });
    const stinger = new THREE.Mesh(new THREE.ConeGeometry(0.055,0.16,4), stingerMat); stinger.position.set(0,ty,tz); stinger.rotation.x = theta; body.add(stinger);
    const glow = new THREE.PointLight(0xff5a1a,0.5,2.2); glow.position.copy(stinger.position); body.add(glow);
  }

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.85, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// basilisk: a rearing serpent-king with a flared cobra hood and a golden crest — the Roman era's ranged
// monster, redesigned for more presence (bigger raised head/hood, 4 clawed legs instead of 2, spine
// frills, fangs, a more saturated toxic-yellow-green scale color that no longer reads close to the Greek
// medusa's blue-green). Distinct from medusa (humanoid torso + arms) — no torso or arms at all, just a
// long low coiled body. Built facing +Z directly (lookAt() points a plain Object3D's +Z at the target),
// same as griffin/medusa/manticore/warhound.
function makeBasilisk(){
  const g = new THREE.Group();
  const body = g;
  const scaleMat = voxMat(0x6b7a1e,{noise:16});
  const scaleMat2 = voxMat(0x424e12,{noise:14});
  const bellyMat = voxMat(0x9a9a5a,{noise:10});
  const goldMat = metalMatP(0xad8730,80,0xffe9b0);
  const eyeMat = new THREE.MeshBasicMaterial({color:0x9aff3a,fog:false});
  const fangMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});

  const coilSegs = [{s:0.5,y:0.26,z:-0.1},{s:0.44,y:0.24,z:-0.42},{s:0.34,y:0.28,z:-0.68},{s:0.24,y:0.36,z:-0.86},{s:0.15,y:0.46,z:-0.98}];
  coilSegs.forEach((seg,i)=>{
    const coil=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s*0.7,seg.s*1.3), i%2?scaleMat2:scaleMat); coil.position.set(0,seg.y,seg.z); coil.rotation.y=i*0.3; body.add(coil);
    const plate=new THREE.Mesh(new THREE.BoxGeometry(seg.s*0.4,seg.s*0.45,0.04), bellyMat); plate.position.set(0,seg.y-seg.s*0.08,seg.z+seg.s*0.62); body.add(plate);
    if(i<3){ const frill=new THREE.Mesh(new THREE.ConeGeometry(seg.s*0.22,seg.s*0.4,3), scaleMat2); frill.position.set(0,seg.y+seg.s*0.42,seg.z); frill.rotation.x=-1.6; body.add(frill); }
  });
  // reared-up neck and head, higher and more upright than before, for a striking-cobra posture
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.4,0.3), scaleMat); neck.position.set(0,0.5,0.24); neck.rotation.x=-0.25; body.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.28,0.38), scaleMat); head.position.set(0,0.68,0.5); body.add(head);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.17,0.22), scaleMat2); snout.position.set(0,0.62,0.72); body.add(snout);
  [-1,1].forEach(side=>{ const fang=new THREE.Mesh(new THREE.ConeGeometry(0.025,0.09,4), fangMat); fang.position.set(side*0.06,0.55,0.78); fang.rotation.x=Math.PI; body.add(fang); });
  // gold serpent-king crest, taller now that the head is reared up
  for(let i=0;i<4;i++){ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.18-i*0.02,4), goldMat); spike.position.set(0,0.84+i*0.02,0.62-i*0.13); spike.rotation.x=-0.3; body.add(spike); }
  // a wide flared cobra hood behind the head — the single biggest new silhouette piece, giving the
  // basilisk real presence instead of just being a thin coiled tail with a small head
  [-1,1].forEach(side=>{
    const hood=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.34,0.4), scaleMat2); hood.position.set(side*0.24,0.66,0.38); hood.rotation.y=side*0.55; body.add(hood);
    const hoodEdge=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.06,0.4), goldMat); hoodEdge.position.set(side*0.32,0.8,0.38); hoodEdge.rotation.y=side*0.55; body.add(hoodEdge);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.04), eyeMat); eye.position.set(side*0.11,0.72,0.64); body.add(eye);
  });
  // 4 small clawed legs (front + back pair) instead of the old single pair, so it reads as a real
  // creature dragging its coils along rather than a snake with two stray legs
  [[-0.16,0.14],[0.16,0.14],[-0.16,-0.5],[0.16,-0.5]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.2,0.1), scaleMat2); leg.position.set(lx,0.12,lz); body.add(leg);
    const claw=new THREE.Mesh(new THREE.ConeGeometry(0.045,0.11,4), goldMat); claw.position.set(lx,0.03,lz+0.08); claw.rotation.x=1.4; body.add(claw);
  });
  const tongue=new THREE.Mesh(new THREE.BoxGeometry(0.015,0.015,0.12), new THREE.MeshBasicMaterial({color:0x8a1a1a,fog:false})); tongue.position.set(0,0.6,0.85); body.add(tongue);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.05, 0); marker.scale.set(0.9,0.9,0.9); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ---- Islamic era creatures (waves 10-12): Ifrit (ranged fire djinn) / Ghoul (fast melee) / Roc pack
// (themed dive-bomber encounter, reusing the griffin's dive-then-claw AI) — no SKINS entry needed, same as
// every other era's non-humanoid monsters ----

// ifrit: a floating fire djinn — no legs, a torso that tapers into a licking flame-cone "tail" instead of
// feet, glowing ember skin, small backswept horns. The Islamic era's ranged monster (weaponType 'pistol',
// same pure-ranged AI as jackal/soldier — it holds distance rather than closing to melee like the griffin/
// basilisk hybrid). Built facing +Z directly, same convention as every other creature (mesh.lookAt in the AI loop).
// Reworked. Problems the offline render exposed in the previous version: the flame "tail" was three big
// opaque cones with the PALEST one on top, so it read as a yellow skirt rather than fire (real flame is
// brightest at its base); the five smoke wisps were detached cubes hovering in a ring around the torso like
// stray geometry; and the hands floated free of the arms. Now: a broad-shouldered tapering torso, arms that
// actually connect through to clawed fists, and a flame column that runs deep-red at the waist down to
// white-hot at the tip, with embers attached along it instead of orbiting the chest.
function makeIfrit(){
  const g = new THREE.Group();
  const emberMat = voxMat(0xd8481c,{noise:14});
  const emberMat2 = voxMat(0xa8280e,{noise:12});
  const charMat = voxMat(0x5a1e0a,{noise:12});
  const flameOuter = new THREE.MeshBasicMaterial({color:0xe8461a,fog:false});
  const flameMid   = new THREE.MeshBasicMaterial({color:0xff8a2a,fog:false});
  const flameHot   = new THREE.MeshBasicMaterial({color:0xffd23a,fog:false});
  const flameCore  = new THREE.MeshBasicMaterial({color:0xfff2c0,fog:false});
  const darkMat = voxMat(0x2a140a,{noise:10});

  // ---- torso: wide shoulders tapering to a narrow waist, so it reads as a looming upper body ----
  const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.78,0.26,0.36), emberMat); shoulders.position.set(0,1.5,0); g.add(shoulders);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.44,0.34), emberMat); chest.position.set(0,1.24,0); g.add(chest);
  const ribs = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.3,0.3), emberMat2); ribs.position.set(0,0.94,0); g.add(ribs);
  const waist = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.22,0.24), charMat); waist.position.set(0,0.72,0); g.add(waist);
  // glowing molten cracks down the chest
  const crackV = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.42,0.03), flameHot); crackV.position.set(0,1.24,0.18); g.add(crackV);
  [-1,1].forEach(s=>{ const cr=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.04,0.03), flameHot); cr.position.set(s*0.13,1.34,0.18); cr.rotation.z=s*0.5; g.add(cr); });

  // ---- flame column: widest and darkest where it meets the waist, narrowing to a white-hot tip ----
  [{y:0.56,r:0.3,h:0.42,m:flameOuter},{y:0.3,r:0.23,h:0.36,m:flameMid},
   {y:0.11,r:0.15,h:0.3,m:flameHot},{y:-0.03,r:0.08,h:0.22,m:flameCore}].forEach(c=>{
    const cone=new THREE.Mesh(new THREE.ConeGeometry(c.r,c.h,7), c.m); cone.position.set(0,c.y,0); g.add(cone);
  });
  // embers riding the column, attached along it rather than orbiting the chest as loose cubes
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2, r=0.16+((i%3)*0.05);
    const em=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05), i%2?flameHot:flameMid);
    em.position.set(Math.cos(a)*r, 0.2+ (i*0.09), Math.sin(a)*r); g.add(em);
  }
  const tailLight = new THREE.PointLight(0xff8a2a,1.1,3.6); tailLight.position.set(0,0.35,0); g.add(tailLight);

  // ---- head: brow ridge, sunken glowing eyes, open jaw, backswept horns ----
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.34,0.34), emberMat); head.position.set(0,1.82,0.02); g.add(head);
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.08,0.1), charMat); brow.position.set(0,1.94,0.16); g.add(brow);
  [-1,1].forEach(side=>{
    const socket=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.09,0.05), darkMat); socket.position.set(side*0.1,1.84,0.18); g.add(socket);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.06,0.04), flameCore); eye.position.set(side*0.1,1.84,0.2); g.add(eye);
    // horns sweeping up and back
    const horn=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.34,4), darkMat); horn.position.set(side*0.17,2.08,-0.06); horn.rotation.x=-0.6; horn.rotation.z=side*0.4; g.add(horn);
  });
  const jawUpper=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.07,0.12), charMat); jawUpper.position.set(0,1.72,0.16); g.add(jawUpper);
  const jawLower=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.08,0.12), charMat); jawLower.position.set(0,1.62,0.15); jawLower.rotation.x=-0.25; g.add(jawLower);
  const maw=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.05,0.04), flameHot); maw.position.set(0,1.67,0.19); g.add(maw); // fire glowing in the throat

  // ---- arms: shoulder -> upper -> forearm -> fist, each piece meeting the next (the old version's hands
  // floated a clear gap away from the arm) ----
  [-1,1].forEach(side=>{
    const pad=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.28), emberMat2); pad.position.set(side*0.42,1.5,0); g.add(pad);
    const upper=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.4,0.15), emberMat2); upper.position.set(side*0.5,1.28,0.04); upper.rotation.z=side*-0.28; g.add(upper);
    const fore=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.38,0.14), emberMat2); fore.position.set(side*0.6,0.96,0.12); fore.rotation.z=side*-0.16; fore.rotation.x=-0.3; g.add(fore);
    const fist=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.18,0.19), charMat); fist.position.set(side*0.64,0.78,0.2); g.add(fist);
    // fire wreathing the fist
    const wreath=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.24,6), flameMid); wreath.position.set(side*0.64,0.92,0.2); g.add(wreath);
    for(let c=0;c<3;c++){ const claw=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.13,4), darkMat);
      claw.position.set(side*0.64+(c-1)*0.06,0.68,0.26); claw.rotation.x=2.6; g.add(claw); }
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.4, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ghoul: a gaunt, hunched grave-robber creature — the Islamic era's fast melee monster (weaponType 'knife',
// same chase AI as mummy/manticore). Built low and lean on all fours rather than upright, reading as fast
// and animalistic rather than a shambling zombie reskin.
// Rebuilt around the FRONT view specifically. The previous two versions hid everything that mattered: the
// torso was a broad slab tilted up into a wall, and because the hunch pitched the head UP and BACK behind
// that slab, a player being charged saw a featureless green box with ears — no face, no claws, no menace.
// Now the skull LEADS the silhouette (lowest, furthest forward point), the arms bracket it wide and reach
// forward, and the ribcage is narrow so the limbs read instead of being swallowed by the body.
function makeGhoul(){
  const g = new THREE.Group();
  const skinMat = voxMat(0x93a08c,{noise:16});   // corpse-pale grey-green
  const skinDark = voxMat(0x5a6654,{noise:14});
  const wrapMat = voxMat(0x2e2a20,{noise:12});
  const ribMat = voxMat(0xb8c0ac,{noise:8});     // bone-pale ribs, light against the body so they actually show
  const boneMat = voxMat(0xd2d6bc,{noise:8});    // pale skull — deliberately much lighter than the body
  const clawMat = new THREE.MeshLambertMaterial({color:0xe0dcc8});
  const toothMat = new THREE.MeshLambertMaterial({color:0xf0ecd8});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xc8f02a,fog:false});

  // ---- narrow ribcage torso, sloping down and back from the shoulders ----
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.32,0.66), skinMat); torso.position.set(0,0.62,-0.14); torso.rotation.x=0.3; g.add(torso);
  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.28,0.3), skinDark); hips.position.set(0,0.5,-0.5); g.add(hips);
  // ribs wrapping the SIDES (not buried on the front face) so they read from any angle
  [-1,1].forEach(side=>{
    for(let i=0;i<4;i++){ const rib=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.19), ribMat);
      rib.position.set(side*0.17,0.7-i*0.075,-0.02-i*0.09); rib.rotation.x=0.3; g.add(rib); }
  });
  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.1,0.62), ribMat); spine.position.set(0,0.79,-0.16); spine.rotation.x=0.3; g.add(spine);
  // ---- hunched shoulders ride HIGH and wide, with the head slung low and forward between them: the
  // classic knuckle-walker read, and it stops the head and torso from stacking into one blob head-on ----
  [-1,1].forEach(side=>{ const sh=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.22,0.22), skinMat); sh.position.set(side*0.24,0.88,0.12); g.add(sh); });
  const hump = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.18,0.26), skinDark); hump.position.set(0,0.9,0.02); g.add(hump);
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.16,0.32), skinDark); neck.position.set(0,0.72,0.34); neck.rotation.x=-0.6; g.add(neck);
  // ---- skull: big, PALE bone against the darker body, and the lowest/most forward element. The body was
  // previously the same tone and nearly the same width as the head directly behind it, so head-on the two
  // merged into a single featureless lump — the contrast is doing the real work here. ----
  const skull = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.3,0.36), boneMat); skull.position.set(0,0.5,0.62); g.add(skull);
  const browRidge = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.09,0.16), boneMat); browRidge.position.set(0,0.63,0.72); g.add(browRidge);
  const crest = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.3), boneMat); crest.position.set(0,0.66,0.56); g.add(crest);
  // deep sunken sockets with glowing eyes set INTO them, facing straight down +Z at the player
  [-1,1].forEach(side=>{
    const socket=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.12,0.07), new THREE.MeshLambertMaterial({color:0x14180f}));
    socket.position.set(side*0.1,0.52,0.79); g.add(socket);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.07,0.04), eyeMat); eye.position.set(side*0.1,0.52,0.82); g.add(eye);
  });
  // gaping jaw with a full row of teeth top and bottom — reads as a snarl head-on
  const upperJaw = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,0.22), boneMat); upperJaw.position.set(0,0.4,0.74); g.add(upperJaw);
  const lowerJaw = new THREE.Mesh(new THREE.BoxGeometry(0.27,0.09,0.2), skinDark); lowerJaw.position.set(0,0.26,0.74); lowerJaw.rotation.x=-0.35; g.add(lowerJaw);
  for(let i=0;i<6;i++){
    const tx=-0.115+i*0.046;
    const tU=new THREE.Mesh(new THREE.ConeGeometry(0.022,0.075,4), toothMat); tU.position.set(tx,0.34,0.82); tU.rotation.x=Math.PI; g.add(tU);
    const tL=new THREE.Mesh(new THREE.ConeGeometry(0.02,0.06,4), toothMat); tL.position.set(tx,0.29,0.81); g.add(tL);
  }
  [-1,1].forEach(side=>{ const ear=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.2,0.08),skinDark); ear.position.set(side*0.2,0.66,0.54); ear.rotation.z=side*0.35; g.add(ear); });
  // ---- long forelimbs sweeping OUT and FORWARD, bracketing the head so the front silhouette is
  // claw / snarling-skull / claw rather than one solid block ----
  [-1,1].forEach(side=>{
    const upper=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.4,0.13), skinMat); upper.position.set(side*0.3,0.6,0.2); upper.rotation.x=-0.45; upper.rotation.z=side*0.35; g.add(upper);
    const fore=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.42,0.11), skinDark); fore.position.set(side*0.42,0.3,0.46); fore.rotation.x=-0.9; fore.rotation.z=side*0.2; g.add(fore);
    const hand=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.1,0.14), skinDark); hand.position.set(side*0.46,0.12,0.66); g.add(hand);
    for(let c=0;c<3;c++){
      const claw=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.19,4), clawMat);
      claw.position.set(side*0.46+(c-1)*0.05,0.06,0.79); claw.rotation.x=2.35; g.add(claw);
    }
  });
  // ---- crouched hind legs, coiled to spring ----
  [-1,1].forEach(side=>{
    const thigh=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.34,0.16), skinMat); thigh.position.set(side*0.18,0.44,-0.56); thigh.rotation.x=0.5; g.add(thigh);
    const shin=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.34,0.12), skinDark); shin.position.set(side*0.18,0.2,-0.4); shin.rotation.x=-0.5; g.add(shin);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.08,0.24), skinDark); foot.position.set(side*0.18,0.04,-0.28); g.add(foot);
  });
  // ---- tattered grave wrappings trailing off the hips ----
  const wrap = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.2,0.22), wrapMat); wrap.position.set(0,0.5,-0.44); g.add(wrap);
  for(let i=0;i<3;i++){ const strip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.26,0.03), wrapMat); strip.position.set(-0.11+i*0.11,0.34,-0.62); strip.rotation.x=0.3+i*0.1; g.add(strip); }

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.15, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ROC — ONE enormous bird, not a 3-unit pack. Two earlier passes tried to make a formation of three small
// rocs work and both read in-game as a tangle of spider legs: three overlapping bodies × two wings × three
// chained wing segments put ~18 disjoint bars on screen at once, and no individual bird was ever legible.
// A roc is a single colossal bird in the myth anyway, so this is one large creature with a clearly readable
// body/head between two continuous V-swept wings. The offline render is the check that matters here: the
// FRONT view is what the player sees as it closes in.
function makeRoc(){
  const g = new THREE.Group();
  const featherMat = voxMat(0x4a3a2e,{noise:16});     // dark brown mantle
  const featherDark = voxMat(0x2a1e16,{noise:14});    // near-black primaries/tail
  const featherLight = voxMat(0x9a7c58,{noise:14});   // pale underside — the contrast the old all-brown bird lacked
  const beakMat = new THREE.MeshLambertMaterial({color:0xe8b038});
  const talonMat = new THREE.MeshLambertMaterial({color:0x1c1810});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffd23a,fog:false});

  // ---- body: big enough to actually anchor the silhouette between the wings ----
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.6,1.25), featherMat); torso.position.set(0,1.15,-0.05); g.add(torso);
  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.26,1.0), featherLight); belly.position.set(0,0.86,-0.02); g.add(belly);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.54,0.5,0.4), featherLight); chest.position.set(0,1.16,0.62); g.add(chest);
  // ---- neck + raptor head, carried forward and high so it leads the shape ----
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.42,0.3), featherMat); neck.position.set(0,1.5,0.72); neck.rotation.x=-0.35; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.38,0.34,0.4), featherDark); head.position.set(0,1.82,0.92); g.add(head);
  const crown = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.12,0.3), featherMat); crown.position.set(0,2.0,0.88); g.add(crown);
  // heavy hooked beak: a straight upper mandible plus a down-curved hook — the strongest "big raptor" cue
  const beakUpper = new THREE.Mesh(new THREE.BoxGeometry(0.17,0.14,0.34), beakMat); beakUpper.position.set(0,1.82,1.24); g.add(beakUpper);
  const beakHook = new THREE.Mesh(new THREE.ConeGeometry(0.085,0.24,4), beakMat); beakHook.position.set(0,1.68,1.36); beakHook.rotation.x=Math.PI; g.add(beakHook);
  const beakLower = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.08,0.24), new THREE.MeshLambertMaterial({color:0xb8862a})); beakLower.position.set(0,1.71,1.2); g.add(beakLower);
  [-1,1].forEach(side=>{
    const brow=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.07,0.16), featherLight); brow.position.set(side*0.15,1.94,1.05); g.add(brow);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.05), eyeMat); eye.position.set(side*0.14,1.85,1.12); g.add(eye);
  });
  // ---- wings: each is a chain of BROAD overlapping panels sweeping up and out in a strong dihedral V.
  // Panels are wide in span and deep in chord and overlap their neighbour, so the wing is one continuous
  // surface rather than the separated bars the previous version produced. ----
  [-1,1].forEach(side=>{
    let wx=side*0.32, wy=1.42, ang=0.55;                 // ang = dihedral, grows toward the tip
    [{span:0.95,chord:1.1,th:0.17,mat:featherMat},
     {span:0.9,chord:0.92,th:0.14,mat:featherMat},
     {span:0.85,chord:0.72,th:0.12,mat:featherLight},
     {span:0.75,chord:0.52,th:0.1,mat:featherDark}].forEach((p,i)=>{
      const dx=Math.cos(ang), dy=Math.sin(ang);
      const cx=wx+side*dx*p.span/2, cy=wy+dy*p.span/2;
      const panel=new THREE.Mesh(new THREE.BoxGeometry(p.span,p.th,p.chord), p.mat);
      panel.position.set(cx,cy,-0.08-i*0.05);
      panel.rotation.z = side>0 ? ang : -ang;
      g.add(panel);
      wx += side*dx*p.span*0.92; wy += dy*p.span*0.92;   // 0.92 = overlap, so panels never separate
      ang += 0.16;
    });
    // splayed primary feathers off the wing tip — adds real width and a ragged, unmistakably avian edge.
    // Their z fan is kept inside the final panel's chord (which spans about -0.49..0.03); the previous
    // -0.28+f*0.16 walked the outermost feather out to z=0.20, past the wing's trailing edge, leaving it
    // floating free of the bird.
    for(let f=0;f<4;f++){
      const fang = ang + (f-1.5)*0.2;
      const feat=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.07,0.14), featherDark);
      feat.position.set(wx+side*Math.cos(fang)*0.3, wy+Math.sin(fang)*0.3, -0.42+f*0.14);
      feat.rotation.z = side>0 ? fang : -fang;
      g.add(feat);
    }
  });
  // ---- tail fan: several splayed rectrices, not one slab ----
  for(let i=0;i<5;i++){
    const a=(i-2)*0.16;
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.07,0.75), i%2?featherDark:featherMat);
    t.position.set(Math.sin(a)*0.34,1.06,-0.95); t.rotation.y=a; t.rotation.x=0.22; g.add(t);
  }
  // ---- legs tucked up under the body with big talons forward, like a raptor about to strike ----
  [-1,1].forEach(side=>{
    const thigh=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.26,0.24), featherLight); thigh.position.set(side*0.22,0.82,0.3); g.add(thigh);
    const shank=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.2,0.16), talonMat); shank.position.set(side*0.22,0.64,0.42); g.add(shank);
    for(let c=0;c<3;c++){
      const claw=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.22,4), talonMat);
      claw.position.set(side*0.22+(c-1)*0.09,0.5,0.56); claw.rotation.x=2.5; g.add(claw);
    }
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.5, 0); marker.scale.set(1.2,1.2,1.2); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// IFRIT KING — Boss IV, the campaign's final boss. The previous version was described as "a scaled-up,
// more ornamented ifrit" and that is exactly how it rendered: near-identical silhouette and palette to the
// regular grunt with two black boxes floating at the shoulders, which is fatal for a final boss. It is now
// a deliberately DIFFERENT creature: a cooled black-basalt body shot through with molten cracks (instead of
// the grunt's bright ember red), enormous slab pauldrons, a burning mantle, a real multi-spire crown, and a
// flame base wide enough to look like it is standing in a bonfire rather than wearing a skirt.
function makeIfritKing(){
  const g = new THREE.Group();
  const basalt = voxMat(0x2e2422,{noise:14});      // cooled black rock — the key separation from the red grunt
  const basaltDark = voxMat(0x191312,{noise:12});
  const moltenMat = new THREE.MeshBasicMaterial({color:0xff5a12,fog:false});   // glowing cracks
  const goldMat = metalMatP(0xe0a830,85,0xfff2c8);
  const flameOuter = new THREE.MeshBasicMaterial({color:0xe8461a,fog:false});
  const flameMid   = new THREE.MeshBasicMaterial({color:0xff8a2a,fog:false});
  const flameHot   = new THREE.MeshBasicMaterial({color:0xffd23a,fog:false});
  const flameCore  = new THREE.MeshBasicMaterial({color:0xfff2c0,fog:false});

  // ---- massive torso ----
  const chest = new THREE.Mesh(new THREE.BoxGeometry(1.12,0.9,0.62), basalt); chest.position.set(0,2.15,0); g.add(chest);
  const belly = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.6,0.5), basaltDark); belly.position.set(0,1.55,0); g.add(belly);
  const waist = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.3,0.36), basaltDark); waist.position.set(0,1.18,0); g.add(waist);
  // molten core burning through the chest, plus cracks radiating from it
  const core = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.06), flameCore); core.position.set(0,2.2,0.32); g.add(core);
  const coreGlow = new THREE.PointLight(0xff7a1a,1.5,6); coreGlow.position.set(0,2.2,0.5); g.add(coreGlow);
  [[0,0.55,0.06,0],[0,-0.5,0.06,0],[0.42,0.2,0.05,-0.7],[-0.42,0.2,0.05,0.7],[0.4,-0.25,0.05,0.8],[-0.4,-0.25,0.05,-0.8]].forEach(([dx,dy,w,rz])=>{
    const cr=new THREE.Mesh(new THREE.BoxGeometry(w,0.42,0.04), moltenMat); cr.position.set(dx,2.2+dy,0.32); cr.rotation.z=rz; g.add(cr);
  });
  // ---- huge slab pauldrons: the boss's widest, most imposing feature ----
  [-1,1].forEach(side=>{
    const pad=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.34,0.66), basalt); pad.position.set(side*0.74,2.42,0); pad.rotation.z=side*-0.22; g.add(pad);
    const trim=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.07,0.68), goldMat); trim.position.set(side*0.75,2.6,0); trim.rotation.z=side*-0.22; g.add(trim);
    for(let i=0;i<3;i++){ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.28,4), basaltDark);
      spike.position.set(side*0.76,2.7,-0.22+i*0.22); spike.rotation.z=side*-0.3; g.add(spike); }
  });
  // ---- burning mantle hanging off the shoulders. At z=-0.36 it sat 0.01 clear of the chest's back face
  // (which reaches z=-0.31) and hung in the air behind him; -0.33 tucks it into the chest. ----
  for(let i=0;i<5;i++){
    const mx=-0.5+i*0.25;
    const cape=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.7-Math.abs(i-2)*0.1,0.08), i%2?flameOuter:flameMid);
    cape.position.set(mx,1.95,-0.33); g.add(cape);
  }
  // ---- wide raging flame base (standing IN fire, not wearing a cone skirt) ----
  [{y:0.9,r:0.66,h:0.9,m:flameOuter},{y:0.5,r:0.48,h:0.75,m:flameMid},
   {y:0.2,r:0.3,h:0.6,m:flameHot},{y:-0.02,r:0.15,h:0.4,m:flameCore}].forEach(c=>{
    const cone=new THREE.Mesh(new THREE.ConeGeometry(c.r,c.h,8), c.m); cone.position.set(0,c.y,0); g.add(cone);
  });
  // licking side flames, so the base is ragged rather than a clean cone stack
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2, r=0.42;
    const lick=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.44+((i%3)*0.16),5), i%2?flameMid:flameHot);
    lick.position.set(Math.cos(a)*r,0.5+((i%3)*0.1),Math.sin(a)*r); lick.rotation.z=Math.cos(a)*0.3; lick.rotation.x=-Math.sin(a)*0.3; g.add(lick);
  }
  const flameLight = new THREE.PointLight(0xff8a2a,2.0,9); flameLight.position.set(0,0.7,0); g.add(flameLight);

  // ---- head: heavy brow, burning eyes and maw ----
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.58,0.56,0.52), basalt); head.position.set(0,2.92,0.02); g.add(head);
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.12,0.16), basaltDark); brow.position.set(0,3.1,0.24); g.add(brow);
  [-1,1].forEach(side=>{
    const socket=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.13,0.06), basaltDark); socket.position.set(side*0.15,2.94,0.27); g.add(socket);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.09,0.05), flameCore); eye.position.set(side*0.15,2.94,0.3); g.add(eye);
  });
  const jawU=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.09,0.16), basaltDark); jawU.position.set(0,2.76,0.24); g.add(jawU);
  const jawL=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.1,0.16), basaltDark); jawL.position.set(0,2.62,0.22); jawL.rotation.x=-0.3; g.add(jawL);
  const maw=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.08,0.05), flameHot); maw.position.set(0,2.69,0.28); g.add(maw);
  // ---- crown: a gold band carrying five rising spires, so it reads as a CROWN, not just horns ----
  const crownBand=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.35,0.13,8), goldMat); crownBand.position.set(0,3.24,0.02); g.add(crownBand);
  // spire bases seated INTO the band (the band's top face is at y=3.305; starting them at 3.32 left every
  // spire, and the flame on top of it, hanging 0.015 clear of the crown)
  [-2,-1,0,1,2].forEach(i=>{
    const h=0.5-Math.abs(i)*0.11;
    const spire=new THREE.Mesh(new THREE.ConeGeometry(0.065,h,4), goldMat);
    spire.position.set(i*0.15,3.26+h/2,0.02-Math.abs(i)*0.03); spire.rotation.z=i*0.16; g.add(spire);
    const tipFlame=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.16,5), flameHot);
    tipFlame.position.set(i*0.15,3.26+h*0.9,0.02-Math.abs(i)*0.03); g.add(tipFlame);
  });
  // ---- arms: shoulder -> upper -> forearm -> fist, connected, with fire-wreathed fists ----
  [-1,1].forEach(side=>{
    const upper=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.6,0.26), basalt); upper.position.set(side*0.86,2.06,0.06); upper.rotation.z=side*-0.24; g.add(upper);
    const elbow=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.2,0.28), basaltDark); elbow.position.set(side*0.96,1.74,0.1); g.add(elbow);
    const fore=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.56,0.24), basalt); fore.position.set(side*1.0,1.42,0.2); fore.rotation.x=-0.28; g.add(fore);
    const crack=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.4,0.03), moltenMat); crack.position.set(side*1.0,1.42,0.33); crack.rotation.x=-0.28; g.add(crack);
    const fist=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.3,0.32), basaltDark); fist.position.set(side*1.02,1.12,0.3); g.add(fist);
    const wreath=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.4,6), flameMid); wreath.position.set(side*1.02,1.34,0.3); g.add(wreath);
    const fistLight=new THREE.PointLight(0xffb84a,0.7,3); fistLight.position.set(side*1.02,1.12,0.3); g.add(fistLight);
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 3.5, 0); marker.scale.set(1.4,1.4,1.4); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ===== BOSS II — HYDRA: a low serpent body with a central hump and FIVE rising necks, each a chain-built
// serpentine tower ending in a fanged head with glowing eyes. Built facing +Z (turned via mesh.lookAt() in
// the shared AI loop). Boss-scaled up at spawn, so keep local proportions modest. =====
// Redesigned so the silhouette actually reads as "multi-headed serpent" at a glance, not a lizard with
// lumps on its back: a long tapering serpent trunk (no separate torso/hump blocks), 5 heads fanned out
// WIDE (not clustered forward) on thin sinuous necks, and heads shaped like an actual snake head — flat
// wedge skull, a flared cobra-style hood, an open jaw with visible fangs top+bottom, and a forked tongue —
// instead of the old generic boxy head+snout.
function makeHydra(){
  const g = new THREE.Group();
  const scaleMat = voxMat(0x3a5c3e,{noise:14});
  const scaleMat2 = voxMat(0x2a4630,{noise:12});
  const bellyMat = voxMat(0x7a8a5a,{noise:10});
  const headMat = voxMat(0x35502e,{noise:12});
  const hoodMat = voxMat(0x86a03a,{noise:12});   // sickly yellow-green cobra hood — reads clearly against the dark green scales
  const fangMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xff3a2a,fog:false});
  const crestMat = voxMat(0x1c2a18,{noise:10});
  const tongueMat = new THREE.MeshBasicMaterial({color:0xc4283a,fog:false});

  // Serpent trunk: a continuous run of stacked segments from a bulky shoulder mass (where the necks
  // sprout) tapering back to the tail. The previous proportions made every segment far WIDER than it was
  // deep (1.55 across, 0.62 front-to-back), so at boss scale the body rendered as one huge flat green wall
  // filling the screen. Segments are now roughly as deep and tall as they are wide, and the run is longer,
  // so it reads as a thick coiled serpent body instead of a slab.
  const trunkSegs = [
    {z: 0.85, w:1.18, h:1.02, y:0.62}, {z: 0.25, w:1.3,  h:1.14, y:0.66},
    {z:-0.35, w:1.2,  h:1.04, y:0.62}, {z:-0.95, w:1.0,  h:0.9,  y:0.54},
    {z:-1.5,  w:0.8,  h:0.72, y:0.44}, {z:-2.0,  w:0.6,  h:0.55, y:0.35},
    {z:-2.45, w:0.42, h:0.4,  y:0.26},
  ];
  trunkSegs.forEach((s,i)=>{
    const mat = i%2 ? scaleMat2 : scaleMat;
    const seg=new THREE.Mesh(new THREE.BoxGeometry(s.w,s.h,0.66), mat); seg.position.set(0,s.y,s.z); g.add(seg);
    // pale belly plates along the underside
    const belly=new THREE.Mesh(new THREE.BoxGeometry(s.w*0.6,s.h*0.26,0.62), bellyMat); belly.position.set(0,s.y-s.h*0.42,s.z); g.add(belly);
    // dorsal scute ridge along the spine, so the top edge isn't a flat run
    const scute=new THREE.Mesh(new THREE.BoxGeometry(s.w*0.3,s.h*0.22,0.34), crestMat); scute.position.set(0,s.y+s.h*0.5,s.z); g.add(scute);
  });
  // Shoulder mound the necks physically grow out of. Without this the necks simply began at their baseX
  // in open air above/beside the trunk; this is the mass that ties all five roots into the body.
  const shoulder=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.95,1.15), scaleMat); shoulder.position.set(0,0.95,0.5); g.add(shoulder);
  const shoulderTop=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.4,0.9), scaleMat2); shoulderTop.position.set(0,1.42,0.45); g.add(shoulderTop);
  // coiled tail tip trailing behind the trunk's last (thinnest) segment. NOTE the axis pairing: these boxes
  // carry their LENGTH on local Z, and a box rotated by rotation.x=t points its local +Z along
  // (0,-sin t, cos t) — so the walk must step along that, not along (0, cos t, sin t). Pairing an X
  // rotation with the wrong sin/cos order is what left the old tail as a row of floating blocks.
  { let ty=0.3, tz=-2.0, theta=-1.4; const overlap=0.02;
    [{s:0.34,len:0.42},{s:0.26,len:0.36},{s:0.18,len:0.3},{s:0.11,len:0.24}].forEach(seg=>{
      const dy=-Math.sin(theta), dz=Math.cos(theta);
      const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s,seg.len), scaleMat);
      m.position.set(0, ty+(seg.len/2)*dy, tz+(seg.len/2)*dz); m.rotation.x=theta; g.add(m);
      ty += seg.len*dy - overlap*dy; tz += seg.len*dz - overlap*dz; theta += 0.4;
    });
  }
  // One serpentine neck + head, chain-built rising up while fanning forward AND outward, so the 5 heads
  // spread wide instead of clustering into a single mass.
  //
  // The outward fan is the subtle part. The previous version slid each segment sideways with a bare
  // `cx = x + lean*(i/seg)` while only ever rotating about X — so segments marched laterally with no
  // rotation accounting for that drift and separated into a dotted line of floating cubes (the outermost
  // necks stepped 0.52 sideways per 0.34-wide segment, so the gaps were bigger than the parts). Here the
  // lateral spread is a real rotation instead: with three.js' XYZ Euler order a box's local +Y ends up
  // along (-sin phi, cos theta*cos phi, sin theta*cos phi), so the walk steps along exactly that vector
  // and consecutive segments always meet.
  function neck(baseX, spread, height){
    let x=baseX, y=1.05, z=0.4;
    // theta = forward arc, phi = outward fan. theta used to start at -1.05, which meant each neck first
    // leaned BACKWARD before curving over, so the heads finished low and drooping. Starting much closer to
    // vertical makes the necks rear up and then strike forward.
    let theta=-0.4, phi=0;
    // negated so a NEGATIVE `spread` argument fans the neck to the player's left (-X), matching how the
    // call sites below read: with rotation.z=phi a box's top tilts toward -X for positive phi.
    const len=0.4, dt=0.25, dphi=-spread/height;
    // direction of the LAST DRAWN segment. The loop increments theta/phi on its way out, so reading them
    // after it ends gives the angles of a segment that was never built — placing the head along that
    // over-stepped direction is part of why the heads sat off the ends of the necks.
    let lastDx=0, lastDy=1, lastDz=0;
    for(let i=0;i<height;i++){
      const dx=-Math.sin(phi), dy=Math.cos(theta)*Math.cos(phi), dz=Math.sin(theta)*Math.cos(phi);
      lastDx=dx; lastDy=dy; lastDz=dz;
      // taper the neck — thick where it meets the body, thinner near the head
      const w = 0.34 - (i/height)*0.14;
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,len,w), i%2?scaleMat2:scaleMat);
      m.position.set(x+dx*len/2, y+dy*len/2, z+dz*len/2);
      m.rotation.x=theta; m.rotation.z=phi; g.add(m);
      // dorsal crest fin, parented to the segment so it inherits both rotations and can't drift off
      const fin=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.2,0.12), crestMat);
      fin.position.set(0,0,-0.09); m.add(fin);
      x+=dx*len; y+=dy*len; z+=dz*len; theta+=dt; phi+=dphi;
    }
    // Head, seated ON the neck tip. x/y/z hold the neck's accumulated end point, but the old code offset
    // the skull a flat +0.12 in Y and +0.18 in Z from there — a fixed world-space nudge that only lines up
    // if the neck happens to end pointing straight up and forward. The outer necks end angled well out to
    // the side, so their heads floated off the end of the neck with a visible gap. The offset now runs
    // along the neck's OWN final direction, so every head meets its neck regardless of how far it fanned.
    const edx=lastDx, edy=lastDy, edz=lastDz;
    const hx=x+edx*0.12, hy=y+edy*0.12, hz=z+edz*0.12;
    // a chunky collar straddling the joint (half behind the tip, half ahead of it) so neck and skull
    // physically overlap no matter which way the neck ended up pointing
    const collar=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), scaleMat2); collar.position.set(x,y,z); g.add(collar);
    const skull=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.28,0.36), headMat); skull.position.set(hx,hy,hz); g.add(skull);
    const upperJaw=new THREE.Mesh(new THREE.BoxGeometry(0.31,0.14,0.46), scaleMat2); upperJaw.position.set(hx,hy-0.04,hz+0.3); g.add(upperJaw);
    const lowerJaw=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.1,0.38), bellyMat); lowerJaw.position.set(hx,hy-0.19,hz+0.28); lowerJaw.rotation.x=-0.35; g.add(lowerJaw);
    // flared hood: two angled plates behind the skull, cobra-style — the single most identifying "snake"
    // silhouette cue, and it also helps visually separate each of the 5 heads from its neighbours
    [-1,1].forEach(s=>{
      const hood=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.32,0.2), hoodMat); hood.position.set(hx+s*0.22,hy+0.02,hz-0.1); hood.rotation.z=s*0.55; hood.rotation.y=s*0.3; g.add(hood);
    });
    const browRidge=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.08,0.16), crestMat); browRidge.position.set(hx,hy+0.15,hz+0.1); g.add(browRidge);
    [-1,1].forEach(s=>{
      const eye=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.08,0.05), eyeMat); eye.position.set(hx+s*0.13,hy+0.05,hz+0.17); g.add(eye);
      // two visible fangs per side — from the upper jaw pointing down, echoing a real snake bite
      const fangA=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.16,4), fangMat); fangA.position.set(hx+s*0.09,hy-0.12,hz+0.46); fangA.rotation.x=Math.PI; g.add(fangA);
      const fangB=new THREE.Mesh(new THREE.ConeGeometry(0.022,0.11,4), fangMat); fangB.position.set(hx+s*0.15,hy-0.1,hz+0.42); fangB.rotation.x=Math.PI; g.add(fangB);
    });
    // forked tongue flicking out past the jaw
    const tongueRoot=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.035,0.24), tongueMat); tongueRoot.position.set(hx,hy-0.15,hz+0.58); g.add(tongueRoot);
    [-1,1].forEach(s=>{ const fork=new THREE.Mesh(new THREE.BoxGeometry(0.028,0.028,0.11), tongueMat); fork.position.set(hx+s*0.04,hy-0.15,hz+0.71); fork.rotation.y=s*0.5; g.add(fork); });
  }
  // `spread` is a TOTAL FAN ANGLE IN RADIANS, not a lateral distance. It previously carried the old
  // lean-offset values (1.6 and 2.6) straight over when the fan became a rotation — and 2.6 rad is 149
  // degrees, so the outer necks rotated well past horizontal and corkscrewed over.
  //
  // baseX must stay INSIDE the shoulder mound (half-width 0.85). The previous values (+/-1.0, +/-1.9) put
  // four of the five necks well outside the body, so they rose out of thin air beside it with a visible
  // gap. All five now root in the mound and the FAN does the spreading as they rise, which is also how a
  // hydra's necks actually converge.
  neck( 0,    0.00, 7);   // centre head, tallest, straight up the middle
  neck(-0.32,-0.75, 6);   // inner left / right pair
  neck( 0.32, 0.75, 6);
  neck(-0.56,-1.15, 5);   // outermost pair, splayed clear of their neighbours
  neck( 0.56, 1.15, 5);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 3.2, 0); marker.scale.set(1.4,1.4,1.4); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ===== TIGER — a fast striped big-cat quadruped. The Colosseum Champion releases two of these when badly
// wounded. Built facing +Z (mesh.lookAt() convention). =====
// tiger: the old version's "stripes" were full-body-width boxes that basically encased the whole animal
// in solid alternating bands, reading as a striped sausage rather than a cat. Rebuilt with a leaner
// segmented body (ribcage/haunch/chest), a real head with brow+muzzle, and THIN stripes mounted proud of
// the surface instead of body-width blocks.
function makeTiger(){
  const g = new THREE.Group();
  const furMat = voxMat(0xdb8228,{noise:10});
  const furMat2 = voxMat(0xb56a1e,{noise:10});
  const bellyMat = voxMat(0xf0e6c8,{noise:6});
  const stripeMat = new THREE.MeshLambertMaterial({color:0x1c1108});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffe23a,fog:false});
  const fangMat = new THREE.MeshLambertMaterial({color:0xf0ece0});

  // lean muscular body: separate ribcage + haunch sections instead of one long box
  const ribs=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.46,0.6), furMat); ribs.position.set(0,0.58,0.05); g.add(ribs);
  const haunch=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), furMat); haunch.position.set(0,0.6,-0.5); g.add(haunch);
  const belly=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.14,0.9), bellyMat); belly.position.set(0,0.36,-0.05); g.add(belly);
  const chest=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.3), furMat); chest.position.set(0,0.56,0.44); g.add(chest);

  // thin stripes sitting proud of the body surface — a saddle stripe over the back plus flank marks
  [{x:0,y:0.78,z:0.15,w:0.3,h:0.05,d:0.5},{x:0,y:0.78,z:-0.35,w:0.32,h:0.05,d:0.4}].forEach(s=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(s.w,s.h,s.d), stripeMat); m.position.set(s.x,s.y,s.z); g.add(m); });
  [-1,1].forEach(side=>{
    [0.1,-0.4].forEach(fz=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.3,0.06), stripeMat); m.position.set(side*0.25,0.58,fz); g.add(m); });
  });

  // head: brow ridge, pale muzzle, dark nose, fangs
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.34,0.32), furMat); head.position.set(0,0.76,0.68); g.add(head);
  const brow=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.06,0.1), furMat2); brow.position.set(0,0.89,0.78); brow.rotation.x=0.2; g.add(brow);
  const muzzle=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.2,0.18), bellyMat); muzzle.position.set(0,0.66,0.88); g.add(muzzle);
  const nose=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.06,0.04), stripeMat); nose.position.set(0,0.73,0.97); g.add(nose);
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.12,0.05), furMat); ear.position.set(s*0.13,0.96,0.62); g.add(ear);
    const earIn=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.03), stripeMat); earIn.position.set(s*0.13,0.95,0.65); g.add(earIn);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.04), eyeMat); eye.position.set(s*0.11,0.79,0.86); g.add(eye);
    const fang=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.13,4), fangMat); fang.position.set(s*0.07,0.58,0.97); fang.rotation.x=Math.PI; g.add(fang);
    const fstripe=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.16,0.04), stripeMat); fstripe.position.set(s*0.11,0.85,0.7); fstripe.rotation.z=s*0.15; g.add(fstripe);
    const cheekstripe=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.1,0.14), stripeMat); cheekstripe.position.set(s*0.17,0.7,0.78); g.add(cheekstripe);
  });

  // legs with upper/lower segments for a bit of visible bend, plus a leg stripe and clear paws
  [[-0.17,0.32],[0.17,0.32],[-0.19,-0.5],[0.19,-0.5]].forEach(([lx,lz])=>{
    const upper=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.26,0.16),furMat); upper.position.set(lx,0.42,lz); g.add(upper);
    const lower=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.24,0.13),furMat); lower.position.set(lx,0.19,lz); g.add(lower);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.09,0.19), bellyMat); paw.position.set(lx,0.07,lz+0.02); g.add(paw);
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.05,0.04), stripeMat); stripe.position.set(lx,0.34,lz+0.08); g.add(stripe);
  });

  // longer, chain-built tail (each segment starts where the last ended, so it flows instead of floating)
  { let ty=0.62, tz=-0.75, theta=-1.1;
    [{s:0.09,len:0.22},{s:0.075,len:0.2},{s:0.06,len:0.18},{s:0.05,len:0.16},{s:0.045,len:0.14}].forEach((seg,i)=>{
      const dy=Math.cos(theta), dz=Math.sin(theta);
      const cy=ty+(seg.len/2)*dy, cz=tz+(seg.len/2)*dz;
      const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s,seg.len), i%2?stripeMat:furMat);
      m.position.set(0,cy,cz); m.rotation.x=theta; g.add(m);
      ty=ty+seg.len*dy-0.01*dy; tz=tz+seg.len*dz-0.01*dz; theta+=0.3;
    });
  }

  g.userData.bodyMeshes=[]; g.traverse(o=>{if(o.isMesh)g.userData.bodyMeshes.push(o);});
  const marker=new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(),depthTest:false,depthWrite:false,transparent:true,fog:false}));
  marker.position.set(0,1.35,0); marker.scale.set(0.9,0.9,0.9); marker.renderOrder=9999; marker.raycast=function(){};
  g.add(marker); g.userData.marker=marker;
  return g;
}

const bots = [];
const BOT_MAX_HP = 100;
function spawnBot(x,z,color,pA,pB,weaponType,opts){
  opts = opts||{};
  const bot = makeVoxelBot(color, weaponType, opts.skin);
  if(opts.scale) bot.scale.setScalar(opts.scale);
  bot.position.set(x,0,z);
  bot.userData.isBot = true;
  scene.add(bot);
  const hp = opts.hp || BOT_MAX_HP;
  const data = {mesh:bot, color, weaponType, skin:opts.skin, pA:new THREE.Vector3(...pA), pB:new THREE.Vector3(...pB),
    t:Math.random()*6, hp, maxHp:hp, alive:true, flash:0, diff:opts.diff||1,
    fireCd:1+Math.random()*2, aim:0, swing:0, boss:!!opts.boss, speed:opts.speed||1, scale:opts.scale||1,
    heading:Math.random()*Math.PI*2, wanderT:0, moving:0, facing:0};
  bot.userData.data = data;
  bots.push(data);
  return bot;
}

// ---- weapon system: 3 detailed voxel weapons the player can switch between ----
// brushed-metal look: subtle canvas texture + Phong specular highlights (much crisper than flat Lambert)
function metalTexture(baseHex, streaks=true){
  const c = document.createElement('canvas'); c.width=c.height=32;
  const ctx=c.getContext('2d'); const b=new THREE.Color(baseHex);
  for(let y=0;y<32;y+=2)for(let x=0;x<32;x+=2){
    const n=Math.abs(Math.sin(x*3.1+y*7.7)*4375.5%1); const d=(n-0.5)*36/255;
    ctx.fillStyle=`rgb(${Math.min(255,Math.max(0,b.r*255+d))|0},${Math.min(255,Math.max(0,b.g*255+d))|0},${Math.min(255,Math.max(0,b.b*255+d))|0})`;
    ctx.fillRect(x,y,2,2);
  }
  if(streaks){ ctx.strokeStyle='rgba(255,255,255,0.06)'; for(let y=2;y<32;y+=5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(32,y+1);ctx.stroke();} }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.anisotropy=maxAniso; return t;
}
function metalMatP(color,shininess=70,spec=0x777777){
  return new THREE.MeshPhongMaterial({map:metalTexture(color), shininess, specular:spec});
}
function part(group,w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); group.add(m); return m;
}

muzzle.visible=false;

// PISTOL — compact: slide, frame, grip w/ magazine, small sight
// SNIPER RIFLE — long barrel, bolt handle, bipod, and a scope tube (right-click / hold to ADS)
function makeSniper(){
  const g=new THREE.Group();
  const body=metalMatP(0x33383f,75,0x9aa2ac), dark=metalMatP(0x16181c,45), wood=metalMatP(0x5a3d28,30,0x333333);
  part(g,0.1,0.11,0.9,body,0,0,-0.15);             // long receiver+barrel
  part(g,0.06,0.06,0.35,dark,0,0,-0.72);           // slim muzzle end
  part(g,0.16,0.16,0.3,wood,0,-0.05,0.28);         // wooden stock body
  part(g,0.08,0.22,0.1,wood,0,-0.2,0.32).rotation.x=0.15; // stock grip
  part(g,0.09,0.2,0.09,dark,0,-0.2,-0.02).rotation.x=0.14; // front grip
  const mag=part(g,0.07,0.2,0.09,dark,0,-0.24,-0.12); mag.rotation.x=-0.1; // mag
  part(g,0.04,0.1,0.04,body,0.09,0.02,0.02).rotation.z=0.5; // bolt handle
  // scope: tube + two lens rings + mount
  part(g,0.02,0.09,0.4,dark,0,0.16,-0.1);          // mount rail
  const scopeTube=part(g,0.075,0.075,0.5,dark,0,0.22,-0.12);
  const lensMat=new THREE.MeshBasicMaterial({color:0x2a5a8a, fog:false});
  part(g,0.078,0.078,0.03,lensMat,0,0.22,-0.37);   // front lens (glints blue)
  part(g,0.078,0.078,0.03,lensMat,0,0.22,0.13);    // rear lens
  // bipod legs (folded, decorative)
  part(g,0.03,0.18,0.03,dark,-0.06,-0.15,-0.55).rotation.z=0.25;
  part(g,0.03,0.18,0.03,dark,0.06,-0.15,-0.55).rotation.z=-0.25;
  g.userData={muzzleZ:-0.9,muzzleY:0,pos:new THREE.Vector3(0.24,-0.26,-0.55),recoil:0.14,name:'Sniper',

// BOW — curved wooden limbs (built from angled segments), taut string, nocked arrow
function makeBow(){
  const g=new THREE.Group();
  const wood=metalMatP(0x6b4a2c,18,0x332211), gold=metalMatP(0xad8730,55,0xffdd99);
  const stringMat=new THREE.MeshBasicMaterial({color:0xe8dcc0, fog:false});
  // each segment is walked along the previous one's own rotated direction (verified against a plotted render),
  // so the limb is a properly connected curve instead of segments that only touch at one corner.
  // Kept a single consistent wood color (not alternating per segment) — alternating colors right at the
  // overlap seams was the likely source of the z-fighting flicker. A small gold tip cap replaces the
  // per-segment gold accent instead. The function returns the true tip position so the string can be
  // placed exactly, rather than guessed.
  function limb(dir){
    const grp=new THREE.Group();
    let y=0.05, z=0.03, theta=0;
    const dtheta=0.22, L=0.15, overlap=0.01;
    let tipY=y, tipZ=z;
    for(let i=0;i<5;i++){
      const thetaMid = theta + dtheta/2;
      const dy=Math.cos(thetaMid), dz=Math.sin(thetaMid);
      const cy=y+(L/2)*dy, cz=z+(L/2)*dz;
      const m=new THREE.Mesh(new THREE.BoxGeometry(0.032,0.15,0.032), wood);
      m.position.set(0, cy*dir, cz);
      m.rotation.x = thetaMid*dir;
      grp.add(m);
      tipY = y+L*dy; tipZ = z+L*dz;
      y = tipY-overlap*dy; z = tipZ-overlap*dz;
      theta += dtheta;
    }
    const tipCap=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05), gold);
    tipCap.position.set(0, tipY*dir, tipZ); grp.add(tipCap);
    return {grp, tipY:tipY*dir, tipZ};
  }
  const limbUp=limb(1), limbDown=limb(-1);
  g.add(limbUp.grp); g.add(limbDown.grp);
  part(g,0.06,0.22,0.07,wood,0,0,0.03);              // grip
  const stringLen=Math.hypot(limbUp.tipY-limbDown.tipY, limbUp.tipZ-limbDown.tipZ);
  const string=new THREE.Mesh(new THREE.BoxGeometry(0.012,stringLen,0.012),stringMat);
  string.position.set(0,(limbUp.tipY+limbDown.tipY)/2,(limbUp.tipZ+limbDown.tipZ)/2);
  string.rotation.x = Math.atan2(limbUp.tipZ-limbDown.tipZ, limbUp.tipY-limbDown.tipY);
  g.add(string);
  // nocked arrow, tip pointing forward (-Z) to match muzzleZ
  part(g,0.02,0.02,0.62,metalMatP(0x8a6a42,20),0,0,-0.18);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.09,4),metalMatP(0xaab4be,80,0xffffff)); head.position.set(0,0,-0.52); head.rotation.x=-Math.PI/2; g.add(head);
  const fletch=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.01),new THREE.MeshLambertMaterial({color:0xb5502c})); fletch.position.set(0,0,0.1); fletch.rotation.z=Math.PI/4; g.add(fletch);
  // a small bronze aiming ring mounted just above the grip — a peep sight, not a glass sniper scope, but
  // wired to the same scoped/scopeFov mechanic (right-click/hold-shift zooms in, same as the sniper rifle)
  const sightRing=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.009,6,12), gold); sightRing.position.set(-0.05,0.16,0.03); g.add(sightRing);
  g.scale.setScalar(0.58); // a touch smaller than before
  g.userData={muzzleZ:-0.55,muzzleY:0,pos:new THREE.Vector3(0.22,-0.22,-0.35),recoil:0.1,name:'Bow',
    damage:80, fireRate:0.5, auto:false, spread:0.008, tracer:0xd9b872, scoped:true, scopeFov:45,
    magSize:6, ammo:6, reloadTime:1.3, reloading:false, reloadT:0};
  return g;
}

// small engraved Eye of Horus decal for the khopesh pommel
function eyeOfHorusTex(){
  const P=64, c=document.createElement('canvas'); c.width=c.height=P; const x=c.getContext('2d');
  x.clearRect(0,0,P,P);
  const ink='#5a4018';
  x.fillStyle=ink;
  // eyebrow
  x.beginPath(); x.moveTo(9,17); x.lineTo(48,17); x.lineTo(54,13); x.lineTo(48,21); x.lineTo(9,23); x.closePath(); x.fill();
  // almond eye
  x.beginPath();
  x.moveTo(8,32); x.quadraticCurveTo(26,20,48,30); x.quadraticCurveTo(30,40,8,32); x.closePath(); x.fill();
  // pupil (cut a lighter hole so it doesn't read as a solid blob)
  x.fillStyle='#c9a030';
  x.beginPath(); x.arc(27,31,5,0,Math.PI*2); x.fill();
  x.fillStyle='#2a1c10';
  x.beginPath(); x.arc(27,31,2.6,0,Math.PI*2); x.fill();
  // teardrop marking
  x.fillStyle=ink;
  x.beginPath(); x.moveTo(46,32); x.quadraticCurveTo(51,42,44,50); x.lineTo(40,48); x.quadraticCurveTo(44,40,42,33); x.closePath(); x.fill();
  // spiral tail
  x.strokeStyle=ink; x.lineWidth=3; x.beginPath(); x.arc(18,48,5,0.2,Math.PI*1.6); x.stroke();
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.anisotropy=maxAniso; return t;
}

// ---- Greek/Ptolemaic era weapons (waves 4-6): Sling (fast ranged), Xiphos (melee), Trident (heavy ranged) ----
// SLING — leather pouch + crossed cords, a stone nocked and ready; fast, precise, low recoil
function makeSling(){
  // a real Y-fork slingshot (per reference image), not a classical hand-swung strap: a wooden fork with two
  // splayed prongs, elastic bands running from each prong tip down to a shared pouch/stone.
  const g=new THREE.Group();
  const Z = -0.15; // keeps every piece well clear of the camera's near plane (see the earlier near-plane bug)
  const woodDark = voxMat(0x4a3018,{noise:12});
  const woodLight = voxMat(0xc9a878,{noise:10}); // pale wood-grain band partway up each prong
  const bandMat = new THREE.MeshBasicMaterial({color:0xc9b48a, fog:false});
  const leatherMat = voxMat(0x2a1c12,{noise:10});
  const stoneMat = metalMatP(0x8a8a86,40,0x555555);

  part(g,0.06,0.2,0.07,woodDark,0,-0.1,0.1+Z);   // grip, near the hand
  part(g,0.06,0.12,0.06,woodDark,0,0.04,0.05+Z); // fork base, bridging the grip up to where the prongs split

  // two diverging prongs (dark wood + a lighter grain band + dark tip), and each prong's tip position computed
  // analytically (rotation.z only mixes x/y, so z is unaffected) so the elastic bands below can target it exactly.
  // Shorter than the first pass — the prongs used to reach so far above the pouch that the bands read as
  // "string way up, pouch way down" instead of one compact fork.
  const TIP_Y = 0.16; // local (pre-rotation) height of the tip along the prong — keep in sync with the geometry below
  const tips=[];
  [-1,1].forEach(side=>{
    const grp=new THREE.Group(); grp.position.set(0,0.1,0.02+Z); grp.rotation.z=side*0.5; g.add(grp);
    const pbase=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.13,0.045),woodDark); pbase.position.set(0,0.065,0); grp.add(pbase);
    const band=new THREE.Mesh(new THREE.BoxGeometry(0.052,0.04,0.052),woodLight); band.position.set(0,0.12,0); grp.add(band);
    const tip=new THREE.Mesh(new THREE.BoxGeometry(0.038,0.06,0.038),woodDark); tip.position.set(0,TIP_Y,0); grp.add(tip);
    const th=side*0.5;
    tips.push(new THREE.Vector3(-TIP_Y*Math.sin(th), 0.1+TIP_Y*Math.cos(th), 0.02+Z));
  });

  // pouch + stone, hanging just below the fork — close enough to the prong tips to read as one compact object
  const pouchPos = new THREE.Vector3(0,0.14,0.08+Z);
  const pouch=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.05,0.07),leatherMat); pouch.position.copy(pouchPos); g.add(pouch);
  // sits just inside the pouch's top opening — the stone is bigger than the pouch is deep, so it should bulge
  // out the top a little (realistic, like a stone actually cradled in a shallow pouch), never poke out the bottom
  const stone=new THREE.Mesh(new THREE.SphereGeometry(0.028,8,6), stoneMat); stone.position.copy(pouchPos).add(new THREE.Vector3(0,0.015,0.005)); g.add(stone);
  // each band attaches to its OWN side edge of the pouch (the actual box face, not an inset point floating
  // above the top) at the pouch's vertical center — the height a rope naturally sits at when it cradles a
  // pouch from both sides. tips[0] is on the +x side and tips[1] on the -x side (see the [-1,1] loop above) —
  // match each to the SAME side of the pouch so the two bands run roughly parallel instead of crossing
  const pouchAttach = [ new THREE.Vector3(0.045,0,0), new THREE.Vector3(-0.045,0,0) ];

  // two elastic bands, prong tip -> its own pouch corner: a cylinder along its local +Y axis, rotated onto
  // the tip->target direction via setFromUnitVectors (not lookAt — a cylinder's length axis is Y, not Z, and
  // this sidesteps any lookAt-specific edge case). Built 20% longer than the exact tip-to-pouch distance and
  // centered on the midpoint, so both ends visibly bury themselves into the tip and pouch geometry instead of
  // just barely grazing them — small positioning drift during the fire animation can never open a visible gap.
  const UP = new THREE.Vector3(0,1,0);
  const bandMeshes=[], bandBaseLen=[];
  tips.forEach((tip,i)=>{
    const target = pouchPos.clone().add(pouchAttach[i]);
    const dir = target.clone().sub(tip);
    const len = dir.length();
    const mid = tip.clone().add(target).multiplyScalar(0.5);
    const elastic = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,len*1.2,6), bandMat);
    elastic.position.copy(mid);
    elastic.quaternion.setFromUnitVectors(UP, dir.normalize());
    g.add(elastic);
    bandMeshes.push(elastic); bandBaseLen.push(len);
  });
  // small leather knots where each band actually meets its own corner of the pouch — children of the pouch
  // mesh itself so they track its position automatically during the fire animation. No dedicated sight
  // object — aiming is just through the gap between the two prongs, like the reference image.
  pouchAttach.forEach(a=>{ const knot=new THREE.Mesh(new THREE.SphereGeometry(0.02,8,6), leatherMat); knot.position.copy(a); pouch.add(knot); });
  g.userData={muzzleZ:-0.4+Z,muzzleY:0,pos:new THREE.Vector3(0.2,-0.2,-0.32),recoil:0.05,name:'Sling',
    damage:32, fireRate:0.35, auto:true, spread:0.006, tracer:0xdcd0b0, scoped:true, scopeFov:50,
    magSize:14, ammo:14, reloadTime:1.0, reloading:false, reloadT:0,
    // release-snap animation on fire: the pouch/stone/bands pull back toward the player then snap back to rest
    // (see the "sling release" block in animate()), instead of just the generic whole-gun recoil kick every weapon gets
    slingAnim:true, pullT:0, tips, pouchRest:pouchPos.clone(), pouchAttach,
    pouchMesh:pouch, stoneMesh:stone, bandMeshes, bandBaseLen};
  return g;
}
// XIPHOS — the Greek hoplite's short sword. The old model was five primitives (sphere pommel, cylinder
// grip, box guard, one straight 4-sided cone for the blade) — less detail than the Roman Pugio that was
// explicitly written to contrast with it, and it missed the weapon's single identifying cue: a xiphos is
// LEAF-SHAPED. It widens as it leaves the guard, reaches its broadest around two-thirds out, then sweeps
// in to a sharp point. A straight taper reads as any dagger; the leaf reads as Greek.
// Built as a chain of segments whose width swells then contracts, so the profile is a real curve rather
// than a stack of steps. Hand near y=0 with the blade rising from it, matching the khopesh's convention.
function makeXiphos(){
  const g=new THREE.Group();
  const bronze     = metalMatP(0x9a7838,85,0xe8d9a8);   // blade
  const bronzeDark = metalMatP(0x6d5426,60,0xbfa878);   // fuller/midrib shadow, the dark half of the break
  const gold       = metalMatP(0xc9a13a,90,0xfff2c8);   // pommel and guard furniture
  const leather    = voxMat(0x3a2a1a,{noise:12});
  const bone       = metalMatP(0xe2d9bd,45,0xfff8e8);   // ivory grip inlay — the light half

  // ---- hilt: flared pommel, ribbed grip with ivory inlay, then the guard ----
  const pommelCap =new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.032,0.035,8), gold);   pommelCap.position.y=0.018; g.add(pommelCap);
  const pommelNeck=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.042,0.030,8), gold);   pommelNeck.position.y=0.048; g.add(pommelNeck);
  const grip      =new THREE.Mesh(new THREE.CylinderGeometry(0.030,0.028,0.135,8), leather); grip.position.y=0.128; g.add(grip);
  for(let i=0;i<3;i++){ const rib=new THREE.Mesh(new THREE.CylinderGeometry(0.033,0.033,0.016,8), bone); rib.position.y=0.082+i*0.042; g.add(rib); }
  const ferrule   =new THREE.Mesh(new THREE.CylinderGeometry(0.036,0.032,0.022,8), gold);   ferrule.position.y=0.206; g.add(ferrule);
  // guard: a straight bar with the shallow downturned wings a xiphos actually carried
  const guard     =new THREE.Mesh(new THREE.BoxGeometry(0.185,0.030,0.075), gold); guard.position.y=0.230; g.add(guard);
  [-1,1].forEach(s=>{ const wing=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.024,0.062), gold);
    wing.position.set(s*0.088,0.218,0); wing.rotation.z=s*0.42; g.add(wing); });

  // ---- leaf blade. Widths swell from the guard to a belly around 60% of the length, then draw in to the
  // point. Each segment starts where the last ended, so the edges form one continuous profile. ----
  const widths=[0.070,0.092,0.108,0.118,0.120,0.112,0.094,0.068,0.040];
  const segLen=0.046;
  let by=0.245;
  widths.forEach((w,i)=>{
    const seg=new THREE.Mesh(new THREE.BoxGeometry(w,segLen,0.020), i%2?bronze:bronzeDark);
    seg.position.set(0, by+segLen/2, 0); g.add(seg);
    // ground edge bevels down each side, catching the light along the cutting edges
    [-1,1].forEach(sd=>{
      const edge=new THREE.Mesh(new THREE.BoxGeometry(0.012,segLen,0.010), bronze);
      edge.position.set(sd*w/2, by+segLen/2, 0); g.add(edge);
    });
    by += segLen*0.92;   // 0.92 = segments overlap so the blade is one solid run
  });
  // the point, carrying on from where the last segment ended
  const point=new THREE.Mesh(new THREE.ConeGeometry(0.026,0.070,4), bronze);
  point.rotation.y=Math.PI/4; point.position.set(0, by+0.028, 0); g.add(point);
  // raised midrib running most of the blade's length — the structural spine of a real leaf blade
  const midrib=new THREE.Mesh(new THREE.BoxGeometry(0.020,0.330,0.032), bronzeDark); midrib.position.set(0,0.415,0); g.add(midrib);
  const ricasso=new THREE.Mesh(new THREE.BoxGeometry(0.062,0.045,0.030), bronzeDark); ricasso.position.set(0,0.258,0); g.add(ricasso);

  g.userData={muzzleZ:0,muzzleY:0,pos:new THREE.Vector3(0.22,-0.24,-0.42),recoil:0.12,name:'Xiphos',
    melee:true, range:2.2, damage:120, fireRate:0.3};
  return g;
}
// TRIDENT — the Mediterranean heavy weapon. The old model was seven plain cylinders and cones in one flat
// bronze tone: no barbs, no socket, no binding, nothing to catch the eye at first-person scale. Barbs are
// the identifying cue on any real fishing trident — without them three prongs on a stick read as a garden
// fork. Rebuilt with barbed prongs, a socketed ferrule where the head meets the shaft, cord whipping over
// the joint, a butt-spike, and a two-tone bronze so it is not a single flat colour.
function makeTrident(){
  const g=new THREE.Group();
  const wood      = metalMatP(0x5a3d22,25,0x332211);
  const woodDark  = metalMatP(0x3d2916,20,0x241a0e);
  const bronze    = metalMatP(0x3f8f8a,75,0xbfe8e4);    // verdigris bronze, as before
  const bronzeLit = metalMatP(0x63b8b0,95,0xdffaf6);    // polished highlight — the light half of the break
  const cordMat   = voxMat(0xbfae86,{noise:10});

  // ---- shaft: three sections so the length isn't one uniform stick ----
  part(g,0.042,0.042,0.44,wood,0,0,0.14);                 // rear section
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.056,0.20,8),woodDark); grip.rotation.x=Math.PI/2; grip.position.set(0,0,0.30); g.add(grip);
  for(let i=0;i<4;i++){ const whip=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.018,8), cordMat);
    whip.rotation.x=Math.PI/2; whip.position.set(0,0,0.38-i*0.055); g.add(whip); }   // cord whipping on the grip
  part(g,0.038,0.038,0.42,wood,0,0,-0.26);                // fore section

  // ---- butt-spike, for planting the weapon or striking with the rear end ----
  const buttFerrule=new THREE.Mesh(new THREE.CylinderGeometry(0.048,0.042,0.06,8),bronze); buttFerrule.rotation.x=Math.PI/2; buttFerrule.position.set(0,0,0.38); g.add(buttFerrule);
  const buttSpike=new THREE.Mesh(new THREE.ConeGeometry(0.034,0.11,6),bronze); buttSpike.rotation.x=-Math.PI/2; buttSpike.position.set(0,0,0.46); g.add(buttSpike);

  // ---- socket: the flared collar the head is actually mounted into, with cord lashing over the joint ----
  // The whole head sits where the original's did, so the prong tips stop around z=-0.88 and userData's
  // muzzleZ of -0.75 still falls just behind them. Built further forward first and the tips reached
  // -1.01, which put the tracer spawn point visibly inside the weapon.
  const socket=new THREE.Mesh(new THREE.CylinderGeometry(0.062,0.046,0.13,8),bronze); socket.rotation.x=Math.PI/2; socket.position.set(0,0,-0.37); g.add(socket);
  for(let i=0;i<3;i++){ const lash=new THREE.Mesh(new THREE.CylinderGeometry(0.050,0.050,0.020,8), cordMat);
    lash.rotation.x=Math.PI/2; lash.position.set(0,0,-0.29+i*0.030); g.add(lash); }
  const crossbar=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.034,0.036),bronzeLit); crossbar.position.set(0,0,-0.445); g.add(crossbar);

  // ---- three barbed prongs. The outer pair splay outward; every prong carries a rearward-facing barb
  // just behind its tip, which is what makes it read as a fishing trident rather than a pitchfork. ----
  function prong(x, splay){
    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.019,0.024,0.30,6),bronze);
    shaft.rotation.x=Math.PI/2; shaft.rotation.z=splay;
    shaft.position.set(x+splay*0.07,0,-0.59); g.add(shaft);
    const tipX = x+splay*0.16;
    const tip=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.17,4),bronzeLit);
    tip.rotation.x=-Math.PI/2; tip.rotation.z=splay; tip.position.set(tipX,0,-0.795); g.add(tip);
    // the barb: a short spur angled back toward the shaft, mirrored either side of the prong
    [-1,1].forEach(s=>{
      const barb=new THREE.Mesh(new THREE.ConeGeometry(0.017,0.075,4),bronze);
      barb.position.set(tipX+s*0.026,0,-0.725);
      barb.rotation.x=-2.55; barb.rotation.z=s*0.85;
      g.add(barb);
    });
  }
  prong(0, 0); prong(-0.105, -0.28); prong(0.105, 0.28);

  g.userData={muzzleZ:-0.75,muzzleY:0,pos:new THREE.Vector3(0.24,-0.22,-0.4),recoil:0.22,name:'Trident',
    damage:135, fireRate:0.85, auto:false, spread:0, tracer:0x6fd6c9,
    magSize:4, ammo:4, reloadTime:1.7, reloading:false, reloadT:0};
  return g;
}
