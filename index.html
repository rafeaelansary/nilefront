  // wall stops at the water's edge), so this reads correctly from the beach without needing to be reachable
  papyrusCluster(-20,25); papyrusCluster(-2,25.5); papyrusCluster(13,25.5); papyrusCluster(20,25.8);

  // ================= DENSITY PASS =================
  // This map had ~45 objects on 70x54 and NO vernacular architecture whatsoever — no houses, no market, no
  // civic buildings. Monuments standing on gravel. Cairo's townhouses and Khan bazaar are what make that map
  // read as a city rather than a set of landmarks, and Giza's own note records the same lesson ("~20 objects
  // on a 60x60 plain, read mostly as empty sand"). Everything below is the ordinary city the monuments stand in.

  // ---- Stoa: a long colonnaded market hall, the defining Greek civic building and the single biggest type
  // this map was missing. Deep colonnade along the open face, solid back wall — which also makes it the best
  // piece of hard cover on the map, since you can fight from between the columns. ----
  function stoa(x,z,len,rot){
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot||0; scene.add(g);
    const d=5.5;
    const podium=new THREE.Mesh(new THREE.BoxGeometry(len+1.0,0.5,d+1.0), marbleTrim); podium.position.set(0,0.25,0); podium.receiveShadow=true; g.add(podium);
    const back=new THREE.Mesh(new THREE.BoxGeometry(len,5.2,0.7), marbleMat); back.position.set(0,3.1,-d/2); back.castShadow=true; g.add(back);
    // shop doorways punched along the back wall, so it isn't one blank slab
    const nDoors=Math.max(2,Math.floor(len/4));
    for(let i=0;i<nDoors;i++){
      const dx=-len/2+len*(i+0.5)/nDoors;
      const door=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.2,0.16), voxMat(0x2a241c,{noise:8})); door.position.set(dx,1.6,-d/2+0.42); g.add(door);
    }
    // two rows of columns: outer (tall, on the open face) and inner
    const nCols=Math.max(3,Math.floor(len/2.6));
    for(let i=0;i<nCols;i++){
      const cx=-len/2+0.9+(i/(nCols-1))*(len-1.8);
      [[d/2-0.5,5.0],[0,4.6]].forEach(([cz,ch])=>{
        const col=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,ch,10), marbleTrim);
        col.position.set(cx,0.5+ch/2,cz); col.castShadow=true; g.add(col);
        const cap=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.26,0.62), marbleTrim); cap.position.set(cx,0.5+ch+0.13,cz); g.add(cap);
      });
    }
    // painted entablature and a tiled shed roof over the whole run
    const entab=new THREE.Mesh(new THREE.BoxGeometry(len+0.5,0.62,d+0.4), stuccoMat); entab.position.set(0,6.0,0); g.add(entab);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(len+1.4,0.34,d+1.2), roofTileMat); roof.position.set(0,6.45,0.1); roof.rotation.x=-0.13; g.add(roof);
    // Colliders in world space. addBox takes WORLD extents, so a rotated piece has to have its own
    // width/depth rotated too — passing the local pair straight through registered this stoa's back
    // wall 90 degrees out of true, which is how a wave spawn point ended up inside it.
    const c=Math.cos(rot||0), s=Math.sin(rot||0);
    const add=(lx,lz,w,dd)=>{
      addBox(x+lx*c-lz*s, z+lx*s+lz*c, Math.abs(w*c)+Math.abs(dd*s), Math.abs(w*s)+Math.abs(dd*c));
    };
    add(0,-d/2,len,0.7);
    for(let i=0;i<nCols;i++){ const cx=-len/2+0.9+(i/(nCols-1))*(len-1.8); add(cx,d/2-0.5,0.8,0.8); }
  }
  // One stoa, on the west side of the main street facing it. A second one was tried on the east side and
  // there is nowhere to put it: that quarter is boxed in by the library, the watchtower at (24,-4), the
  // obelisk pair and three shared SPAWN_POINTS. Townhouses carry the density there instead.
  stoa(-17.5,-5,15,Math.PI/2);

  // ---- Agora: the paved public square the stoa fronts onto, with market stalls, crates and a speaker's
  // bema. Flagstone rather than gravel so it reads as a deliberate civic space and not just a clearing. ----
  // Stops at x=-4.5, the main street's own west edge. Run any wider and it lies directly on the street
  // slab — two ground meshes at the same height fighting for the same pixels, the exact z-fight the
  // shoreline and the Cairo crossroads each had to be fixed for.
  const agoraPave=new THREE.Mesh(new THREE.BoxGeometry(14,0.16,15), flagstoneMat);
  agoraPave.position.set(-11.5,0.08,-6); agoraPave.receiveShadow=true;
  agoraPave.material=flagstoneMat.clone();
  agoraPave.material.polygonOffset=true; agoraPave.material.polygonOffsetFactor=-3; agoraPave.material.polygonOffsetUnits=-3;
  scene.add(agoraPave);

  function greekStall(x,z,awnCol,rot){
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot||0; scene.add(g);
    const counter=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.0,1.0), marbleTrim); counter.position.set(0,0.5,0); counter.castShadow=true; g.add(counter);
    [-1,1].forEach(s=>{ const post=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.09,2.4,6), voxMat(0x6b4a28,{noise:14})); post.position.set(s*1.2,1.2,-0.7); g.add(post); });
    const awn=new THREE.Mesh(new THREE.BoxGeometry(3.0,0.12,1.9), new THREE.MeshLambertMaterial({color:awnCol}));
    awn.position.set(0,2.32,-0.15); awn.rotation.x=0.26; g.add(awn);
    // goods on the counter — amphorae and stacked cloth bolts
    for(let i=0;i<3;i++){
      const jar=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.18,0.42,8), voxMat(0xc9703c,{noise:16}));
      jar.position.set(-0.85+i*0.85,1.21,0.05); g.add(jar);
    }
    const c=Math.cos(rot||0), s=Math.sin(rot||0);
    addBox(x, z, Math.abs(2.6*c)+Math.abs(1.0*s), Math.abs(2.6*s)+Math.abs(1.0*c));
  }
  // Two rows facing each other across the square. Kept between x=-14 and x=-7: further west runs into
  // the stoa's back wall, further east into the pylon gate's own tower at (-6.2,-2).
  greekStall(-12.5,-5.0,0x8f2f26,0);
  greekStall(-8.5,-5.0,0x2f5f8a,0);   // z=-5: at -4 the east stall clipped the amphora at (-9,-3.4)
  greekStall(-12.5,-11.0,0xc8892c,Math.PI);
  greekStall(-8.5,-11.0,0x8f2f26,Math.PI);
  // bema: the speaker's platform every agora had — also chest-high cover in the middle of the square
  (function bema(x,z){
    const b1=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.9,3.2), marbleTrim); b1.position.set(x,0.45,z); b1.castShadow=true; scene.add(b1);
    const b2=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.4,2.4), marbleMat); b2.position.set(x,1.1,z); scene.add(b2);
    addBox(x,z,3.2,3.2);
  })(-11.0,-7.5);

  // ---- Townhouse block: flat-roofed courtyard houses, the ordinary building of a Greek city. Clustered
  // rather than evenly spaced — the same lesson Cairo's townhouses and its palm groves both record. These
  // carry most of the density; the monuments are accents standing among them. ----
  function townhouse(x,z,w,d,h,rot){
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot||0; scene.add(g);
    const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), marbleMat); body.position.set(0,h/2,0); body.castShadow=true; body.receiveShadow=true; g.add(body);
    // parapet rather than a pitched roof — flat roofs with a low wall are the Mediterranean vernacular
    const para=new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.34,d+0.3), marbleTrim); para.position.set(0,h+0.17,0); g.add(para);
    // painted lintel over a recessed doorway
    const door=new THREE.Mesh(new THREE.BoxGeometry(0.95,1.9,0.16), voxMat(0x2a241c,{noise:8})); door.position.set(0,0.95,d/2+0.02); g.add(door);
    const lintel=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.24,0.22), stuccoMat); lintel.position.set(0,2.02,d/2+0.03); g.add(lintel);
    // small high windows, the way a courtyard house faces inward
    [-1,1].forEach(s=>{
      const win=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.14), voxMat(0x2a3038,{noise:8}));
      win.position.set(s*w*0.28, h-0.85, d/2+0.02); g.add(win);
    });
    const c=Math.cos(rot||0), s=Math.sin(rot||0);
    addBox(x, z, Math.abs(w*c)+Math.abs(d*s), Math.abs(w*s)+Math.abs(d*c));
  }
  // west quarter, packed tight behind the stoa
  townhouse(-25.5,-14,5.0,4.4,3.2,0);
  townhouse(-25.0,-19.0,4.6,4.2,2.7,0.12);   // threaded between its neighbour at z=-14 and the palm at (-26,-22)
  townhouse(-20.0,-16.5,4.2,4.6,3.6,-0.08);
  townhouse(-15.0,-21.5,4.4,4.0,2.9,0.05);   // was (-25.8,-8.5): sat on the broken statue at (-24,-10)
  // east quarter, along the far side of the crossroads
  townhouse(24.0,-9.0,5.2,4.6,3.4,0);
  townhouse(25.5,2.5,4.4,4.2,2.8,0.1);      // was (23.5,-3): overlapped the watchtower's legs at (24,-4)
  // no house between z=-11 and z=-20 on this side: the rock outcrop at (29,-11) and the cypress at
  // (27,-18) already occupy it, and anything that fits between them is too small to read as a building.
  townhouse(28.0,-21.0,4.2,4.0,2.7,0.08);   // extra pair, standing in for the east stoa that would not fit
  townhouse(21.5,-29.5,4.6,4.2,3.2,-0.06);   // clear of the pre-existing fallen column at (24,-24)
  // south quarter, either side of the road as it runs out of the map
  townhouse(-11.5,-28.5,4.8,4.4,3.0,0.06);   // threaded past the watchtower legs at (-8,-22) and the outcrop at (-16,-27)
  townhouse(-21.0,-25.5,4.2,4.0,2.6,-0.1);  // was (-17.5,-25.5): sat on the rock outcrop at (-16,-27)
  townhouse(11.5,-24.5,5.0,4.4,3.3,-0.05);
  townhouse(17.0,-22.5,4.4,4.2,2.9,0.15);

  // ---- Combat cover. The playable area had 7 usable pieces (2 broken statues, 2 fallen columns, 3 rock
  // outcrops), most of them out at the edges where nobody fights. These are chest-height or taller, all
  // collidered, spread across the middle of the map where the wave fighting actually happens. ----
  function cistern(x,z){
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,1.25,12), marbleTrim); rim.position.set(x,0.62,z); rim.castShadow=true; scene.add(rim);
    const water=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,0.06,12), new THREE.MeshPhongMaterial({color:0x3a8fc0, shininess:110, specular:0xbfefff}));
    water.position.set(x,1.22,z); scene.add(water);
    addBox(x,z,2.3,2.3);
  }
  function amphoraStack(x,z){
    // three big storage jars leaning together — waist-to-chest cover, and unmistakably a marketplace prop
    const jarMat=voxMat(0xc9703c,{noise:16,pattern:'plate'});
    [[0,0,1.5],[0.62,0.18,1.3],[0.24,0.68,1.15]].forEach(([ox,oz,h],i)=>{
      const jar=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.46,h,10), jarMat);
      jar.position.set(x+ox,h/2,z+oz); jar.rotation.z=(i-1)*0.07; jar.castShadow=true; scene.add(jar);
      const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.22,0.26,8), jarMat); neck.position.set(x+ox,h+0.13,z+oz); scene.add(neck);
    });
    addBox(x+0.3,z+0.3,1.9,1.9);
  }
  function lowWall(x,z,len,rot){
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot||0; scene.add(g);
    const w=new THREE.Mesh(new THREE.BoxGeometry(len,1.45,0.55), marbleMat); w.position.set(0,0.725,0); w.castShadow=true; g.add(w);
    // coping course, sized off the wall's own top so it sits flush rather than sinking into it
    const cap=new THREE.Mesh(new THREE.BoxGeometry(len+0.2,0.22,0.75), marbleTrim); cap.position.set(0,1.45+0.11+0.02,0); g.add(cap);
    // rotated world extents, not the local pair — see the note on the stoa's collider helper
    const c=Math.abs(Math.cos(rot||0)), s=Math.abs(Math.sin(rot||0));
    addBox(x, z, len*c+0.55*s, len*s+0.55*c);
  }
  function votivePillar(x,z,h){
    const base=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.35,0.9), marbleTrim); base.position.set(x,0.175,z); scene.add(base);
    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.34,h,10), marbleMat); shaft.position.set(x,0.35+h/2,z); shaft.castShadow=true; scene.add(shaft);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(0.72,0.3,0.72), stuccoMat); cap.position.set(x,0.35+h+0.15,z); scene.add(cap);
    addBox(x,z,1.0,1.0);
  }
  // spread across the fighting ground: the crossroads, the approach to the Pharos, the agora edges
  lowWall(8.5,-4.5,5.5,0);    lowWall(-6.0,-17.0,4.5,0);   // clear of the wave spawn at (-2,-20)
  lowWall(14.0,4.5,5.0,0.35); lowWall(-24.0,1.0,4.8,Math.PI/2);  // x=14: at 12 it sat on the obelisk
  lowWall(-7.0,-13.0,5.0,0);  // flanking the Pharos approach, so that walk up isn't open ground
  cistern(9.0,-1.0);   cistern(-4.5,6.5);   cistern(19.0,-6.0);
  amphoraStack(-7.5,8.0);  amphoraStack(16.5,-13.5);   // clear of the shared wave spawn at (12,-16)  amphoraStack(-6.0,-9.5);  amphoraStack(21.5,9.0);
  votivePillar(7.5,10.0,2.4); votivePillar(-8.5,11.5,2.0); votivePillar(-22.0,-9.5,2.6);
  votivePillar(13.5,-11.0,2.2);
  fallenColumn(3.0,-19.5,0.9); fallenColumn(-15.0,17.0,0.2); fallenColumn(18.5,1.0,1.35);
  brokenStatue(-9.0,-19.0,0.5); brokenStatue(14.0,-29.0,-0.25);

  // ================= DISTANT SCENERY =================
  // Out past the play area, on the backing-ground plane. Deliberately none of the building types the map
  // itself uses — no marble colonnades, no watchtowers, no second lighthouse — because repeating those out
  // here just reads as the same street copied badly at a distance. This is the *surroundings* of Alexandria.
  //
  // Everything sits at z < 12. That matters: the beach starts at z=19 and the sea runs from z=24 out to
  // z=520 across a 900-wide band, so anything past that is standing on the water. An earlier version put
  // the hamlet at z~104 and a rocky island at z~118, and both were floating on the sea surface.
  // All unreachable (the player is clamped to +/-29), so none of it takes a collider.
  //
  // The palette is deliberately darker than anything in the play area: fog blends these toward a pale blue,
  // so mid-tone stone out here washes straight out. Starting dark is what keeps the horizon readable.
  const farStone = voxMat(0x7f7768,{noise:12});
  const farStoneDark = voxMat(0x635c4e,{noise:12});
  const farMud = voxMat(0x6f5b42,{noise:14});
  const farGreen = voxMat(0x3f5130,{noise:14});
  function far(w,h,d,mat,x,y,z){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); scene.add(m); return m;
  }
  // coastal ridge wrapping the whole landward side, so the horizon has a profile in every inland direction
  // Sits at ~95, i.e. BEHIND the 82-unit haze band and right at the edge of the 96-unit fog, so it reads as
  // soft hills dissolving into atmosphere. Pulled in to 74 first and that was a mistake: close, unfogged and
  // near-continuous, it stopped being a ridge and became a grey wall boxing the map in. Heights vary widely
  // and a quarter of the segments are skipped, so the skyline undulates and sky shows through the gaps.
  for(let i=0;i<38;i++){
    const a=Math.PI*(1.02+(i/37)*0.96), r=95+Math.sin(i*1.7)*16;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(z>10) continue;
    if(Math.sin(i*4.7)>0.5) continue;                  // gaps in the skyline
    const h=3.5+Math.abs(Math.sin(i*1.7))*3+Math.abs(Math.sin(i*0.6))*4;
    far(14+Math.sin(i*1.1)*5, h, 13+Math.sin(i*2.3)*5, i%3?farStone:farStoneDark, x, h/2-1.2, z);
  }
  // aqueduct marching along the ridge line: repeating arches, a silhouette nothing in the map has
  (function aqueduct(z){
    for(let i=0;i<9;i++){
      const x=-58+i*8.4;
      far(2.1,9,2.1, farStone, x, 4.5, z);             // pier
      far(8.4,1.8,2.4, farStone, x+4.2, 9.4, z);       // span above the arch opening
      far(1.3,2.4,2.3, farStoneDark, x+4.2, 7.3, z);   // arch haunch, breaking the gap into an arch shape
    }
    far(77,1.0,2.8, farStone, -24.4, 10.7, z);         // the channel running the whole length
  })(-78);
  // rocky bluffs on the open plain, west and east — these fill the flanks that read as bare ground
  function bluff(x,z,s){
    far(30*s,5*s,22*s, farStoneDark, x, 1.4*s, z);
    far(20*s,4*s,14*s, farStoneDark, x-2*s, 4.4*s, z-1*s);
    far(11*s,4.5*s,8*s, farStone, x+3*s, 7.4*s, z+1*s);
  }
  bluff(-64,-10,0.62); bluff(-88,-40,0.5); bluff(70,-16,0.6); bluff(92,-44,0.47);
  // a hilltop shrine on the western bluff: a squat cella and a stub roof, not a colonnade
  far(3.2,2.6,2.9, farStone, -62,7.1,-9);
  far(4.1,0.6,3.7, farStoneDark, -62,8.5,-9);
  far(0.7,1.6,0.7, voxMat(0xad8730,{noise:10}), -62,9.6,-9); // bronze finial
  // inland villages: small mudbrick boxes with flat roofs, nothing monumental
  function village(cx,cz,n,seed){
    for(let i=0;i<n;i++){
      const x=cx+i*5.2+Math.sin((i+seed)*2.1)*3.4, z=cz+Math.sin((i+seed)*1.3)*8;
      const h=3.4+Math.sin((i+seed)*3.3)*1.2;
      // width capped under the 5.2 spacing below — at 4.2+1.1 a house could reach 5.3 and overlap its
      // neighbour, and with heights only 2.4 apart their roofs sometimes landed on the same plane
      far(3.5+Math.sin(i+seed)*0.7, h*0.8, 3.4, farMud, x, h*0.4, z);
      far(4.3, 0.5, 4.1, farStoneDark, x, h*0.8+0.22, z);
    }
  }
  // NOTE the run length: this lays houses at cx + i*5.2, so a 9-house row spans roughly cx..cx+45. At
  // village(-62,...) the east end landed at x=-17 — inside the map, with the boundary wall cutting through
  // the row. Both are placed by their far end now, not their near one.
  village(-88,-52,9,0); village(52,-56,8,3.7);
  // rock-cut tomb facades in a low cliff east of the city — Alexandria's necropolis was exactly this
  (function necropolis(x,z){
    far(46,7.5,11, farStoneDark, x, 3.1, z);
    for(let i=0;i<9;i++){
      const fx=x-18.5+i*4.6;
      far(2.6,3.4,0.9, farStone, fx, 1.7, z+5.6);
      far(1.2,2.1,0.5, voxMat(0x20201c,{noise:6}), fx, 1.05, z+6.1); // dark doorway
    }
  })(66,10);   // clear of the ridge ring; at (64,0) the cliff top sat 0.03 from a ridge segment's
  // quarry terraces and spoil heaps, where all that stone came from
  (function quarry(x,z){
    for(let s=0;s<4;s++) far(24-s*4.5, 1.6, 16-s*3, s%2?farStone:farStoneDark, x, 0.8+s*1.5, z);
    for(let i=0;i<5;i++) far(2.6+i*0.4,1.5,2.6, farStone, x-16+i*3.5, 0.75, z+11);
  })(-20,-68);
  // cypress rows along the ridge: vertical accents, and the only strong green out here
  // Clumped, not evenly spaced around the ring: an even ring of them at the aqueduct's own radius read as
  // a continuous hedge closing the map in, which is the opposite of what these are for.
  for(let i=0;i<16;i++){
    if(Math.sin(i*3.3)>0.35) continue;
    const a=Math.PI*(1.10+(i/15)*0.80), r=71+Math.sin(i*1.9)*9;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(z>6) continue;
    for(let k=0;k<3;k++){
      far(1.5, 5+Math.sin((i+k)*2.7)*1.8, 1.5, farGreen, x+k*2.2-2.2, 2.7, z+Math.sin(i+k)*2);
    }
  }
  // ---- boundary barrier. animate() hard-clamps the player to +/-29, and nothing marked that line, so you
  // simply stopped in open ground. This makes the limit an object you can see: a clear blue translucent wall
  // standing on the clamp itself. No grid and no top rail — the grid read as a row of windows and the rail as
  // a ledge sitting on top of the wall; it's a plain pane of blue, just soft enough at the top edge that it
  // doesn't end on a hard line. depthWrite off so it never occludes anything behind it, DoubleSide so it
  // reads from both faces. Only three sides: the +Z (harbour) side is already closed by the sea and its
  // shoreline collider at z=24.5, and a wall there would stand between the beach and the ships. ----
  (function boundaryBarrier(){
    // Height 90, not the 7.5 it started at. At 7.5 the wall's top edge crossed anything taller than itself —
    // the ridge, the aqueduct, the watchtowers — and those objects got a hard horizontal line straight across
    // them, tinted blue below it and untinted above. It reads as the building being cut in half. The wall now
    // runs far above every piece of geometry on the map (the tallest is the Pharos at ~17) and the gradient
    // dissolves it well before its own top edge, so it fades into the sky instead of ending anywhere visible.
    const P=128, c=_mkCanvas(P), x2=c.getContext('2d');
    const g=x2.createLinearGradient(0,P,0,0);
    g.addColorStop(0.00,'rgba(255,255,255,0.95)');
    g.addColorStop(0.25,'rgba(255,255,255,0.85)');
    g.addColorStop(0.45,'rgba(255,255,255,0.50)');
    g.addColorStop(0.70,'rgba(255,255,255,0.18)');
    g.addColorStop(1.00,'rgba(255,255,255,0.00)');
    x2.fillStyle=g; x2.fillRect(0,0,P,P);
    const tex=new THREE.CanvasTexture(c);
    tex.anisotropy=maxAniso;
    const H=90, B=33, ZN=-33, ZS=24;   // ZS = the shoreline stop; no wall is needed past it
    const mat=new THREE.MeshBasicMaterial({map:tex, color:0x45b8ef, transparent:true, opacity:0.42,
                                           depthWrite:false, side:THREE.DoubleSide, fog:true});
    function panel(w,px,pz,rotY){
      const m=new THREE.Mesh(new THREE.PlaneGeometry(w,H), mat);
      m.position.set(px,H/2,pz); m.rotation.y=rotY||0; m.renderOrder=2; scene.add(m);
    }
    const depth = ZS - ZN;
    panel(B*2, 0, ZN, 0);                      // inland
    panel(depth, -B, ZN + depth/2, Math.PI/2); // west
    panel(depth,  B, ZN + depth/2, Math.PI/2); // east
  })();

  // ---- edge berm. animate() hard-clamps the player to +/-29 whatever the colliders say, so on this map —
  // the one with no perimeter wall — you walked into an invisible stop with open, obviously walkable ground
  // stretching away beyond it. This is a broken, gappy line of spoil, boulders and scrub just outside the
  // clamp: waist-to-chest height, nothing monumental, no colliders (the clamp already does the stopping).
  // Its job is purely to give the stop a visible reason, the way the sea does on the harbour side.
  (function edgeBerm(){
    // plain noise, never pattern:'plate' — the plate pattern draws panel seams and turned these into a
    // wall of stacked crates. Kept low (under ~1.2) and sparse: you should be able to see straight over it.
    const rubble = voxMat(0x9a958a,{noise:20});
    const scrub  = voxMat(0x5c6b41,{noise:16});
    const soil   = voxMat(0x8c7f66,{noise:20});
    function lump(x,z,seed){
      if(Math.sin(seed*12.9)>-0.1) return;                       // roughly 45% kept, so it reads ragged
      const h=0.45+Math.abs(Math.sin(seed*5.3))*0.7;
      far(1.3+Math.sin(seed*3.1)*0.5, h, 1.2+Math.cos(seed*2.7)*0.45, soil, x, h/2-0.12, z);
      if(Math.sin(seed*7.7)>0.3){
        const r=0.3+Math.abs(Math.cos(seed*4.1))*0.28;
        far(r*2, r*1.6, r*2, rubble, x+Math.sin(seed)*0.8, h*0.85, z+Math.cos(seed)*0.8);
      }
      if(Math.cos(seed*9.1)>0.55){
        far(0.7, 0.6, 0.7, scrub, x-Math.cos(seed)*0.9, h*0.7, z+Math.sin(seed*2)*0.9);
      }
    }
    for(let z=-34;z<=17;z+=3.4){ lump(-34.4,z,z*1.7); lump(34.4,z,z*2.3+11); }  // west and east edges
    for(let x=-34;x<=34;x+=3.4){ lump(x,-34.4,x*1.9+5); }                        // inland edge
  })();

  // ---- the only things still out on the water, because boats belong there. These were a plain box hull
  // with a flat slab of sail stuck through it, which at distance read as a crate with a signpost. A ship is
  // recognised almost entirely by silhouette, so what matters here is the taper of the hull, the raised
  // stern, and a yard-hung sail that is wider than it is tall — not surface detail nobody can resolve. ----
  const farHull  = voxMat(0x4a3a2e,{noise:12});
  const farMast  = voxMat(0x6b4f33,{noise:10});
  const farSail  = new THREE.MeshLambertMaterial({color:0xe8e0cc});
  const farSailD = new THREE.MeshLambertMaterial({color:0xcfc4a8}); // shaded half, so the sail isn't one flat tone
  const farWake  = new THREE.MeshLambertMaterial({color:0xbfe4ee, transparent:true, opacity:0.5});
  function farShip(x,z,s,rot,furled){
    const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
    const add=(w,h,d,mat,px,py,pz)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(px,py,pz); g.add(m); return m; };
    // hull: midship, then a narrower bow and a stem post forward, and a taller stern aft
    add(1.9*s,1.05*s,5.2*s, farHull, 0, 0.34*s, 0);
    add(1.25*s,0.9*s,1.7*s, farHull, 0, 0.30*s, 3.1*s);
    add(0.62*s,0.75*s,0.9*s, farHull, 0, 0.26*s, 4.0*s); // dropped: at 0.34*s its top sat 0.03 from the bow block's
    add(1.6*s,1.25*s,1.3*s, farHull, 0, 0.5*s, -2.9*s);   // raised stern
    add(0.5*s,1.0*s,0.5*s, farHull, 0, 1.1*s, -3.3*s);    // sternpost curling up
    // mast and yard
    add(0.17*s,6.4*s,0.17*s, farMast, 0, 3.2*s, 0.2*s);
    add(4.8*s,0.15*s,0.15*s, farMast, 0, 5.5*s, 0.2*s);
    if(furled){
      add(4.2*s,0.42*s,0.42*s, farSailD, 0, 5.28*s, 0.2*s); // sail bundled along the yard
    } else {
      // square sail, wider than tall — the giveaway shape of an ancient merchantman — split into a lit
      // and a shaded half so it doesn't read as one flat card
      add(2.3*s,3.3*s,0.1*s, farSail,  -1.15*s, 3.75*s, 0.26*s);
      add(2.3*s,3.3*s,0.1*s, farSailD,  1.15*s, 3.75*s, 0.26*s);
      add(4.7*s,0.2*s,0.16*s, farMast, 0, 2.05*s, 0.26*s);  // foot spar
    }
    // wake trailing astern, at the waterline
    const w=new THREE.Mesh(new THREE.BoxGeometry(1.5*s, 0.06, 9*s), farWake);

// ---- voxel humanoid bot (Minecraft/Pixel-Gun proportions: blocky head+helmet, layered torso armor, segmented limbs) ----
function makeVoxelTexture(baseHex, {noise=22, size=64, pattern=null, cell=6} = {}){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(baseHex);
  const clamp=v=>Math.min(255,Math.max(0,v))|0;
  for (let y=0;y<size;y+=cell){
    for (let x=0;x<size;x+=cell){
      const n = Math.abs((Math.sin(x*12.9898+y*78.233)*43758.5453) % 1);
      const delta = (n-0.5) * noise;
      // base pixel
      ctx.fillStyle = `rgb(${clamp(base.r*255+delta)},${clamp(base.g*255+delta)},${clamp(base.b*255+delta)})`;
      ctx.fillRect(x,y,cell,cell);
      // beveled shading: light top-left edge, dark bottom-right edge → crisp voxel look
      ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(x,y,cell,1); ctx.fillRect(x,y,1,cell);
      ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(x,y+cell-1,cell,1); ctx.fillRect(x+cell-1,y,1,cell);
      // occasional darker speckle for grit
      if(n>0.82){ ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(x+2,y+2,2,2); }
    }
  }
  if (pattern === 'plate') {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1,1,size-2,size-2);
    ctx.beginPath(); ctx.moveTo(0,size/2); ctx.lineTo(size,size/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(size/2,0); ctx.lineTo(size/2,size); ctx.stroke();
  }
  if (pattern === 'reed') {
    // bundled papyrus-stalk look: tight vertical stalk seams with a subtle horizontal lashing band partway up
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
    for(let cx=3; cx<size; cx+=4){ ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,size); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(60,40,15,0.5)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0,size*0.3); ctx.lineTo(size,size*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,size*0.72); ctx.lineTo(size,size*0.72); ctx.stroke();
  }
  if (pattern === 'hieroglyph') {
    // carved vertical registers of small glyph-like marks — reads as Egyptian relief at voxel scale
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
    for(let cx=4; cx<size; cx+=size/3){ ctx.beginPath(); ctx.moveTo(cx,2); ctx.lineTo(cx,size-2); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    for(let cx=size/6; cx<size; cx+=size/3){
      for(let gy=4; gy<size-4; gy+=7){
        const gn = Math.abs((Math.sin(cx*3.1+gy*7.7)*12345.6) % 1);
        if(gn>0.55) ctx.fillRect(cx-2,gy,4,2);
        else if(gn>0.3) { ctx.beginPath(); ctx.arc(cx,gy+1,1.6,0,Math.PI*2); ctx.fill(); }
        else ctx.fillRect(cx-1,gy-2,2,5);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter; // crisp/blocky up close — unchanged, this is the intended voxel look
  // minFilter used to be NearestFilter too, with no mipmaps and a 48px (non-power-of-two) canvas — meaning
  // mipmapping couldn't even be enabled if we'd tried. Any face minified below its native resolution (viewed
  // from a distance, or edge-on at a grazing angle — a roof or a wall seen up close after bumping into it)
  // was point-sampling the pattern with zero filtering, which is exactly what produces a shimmering moiré
  // grid instead of a stable texture. size is now 64 (power-of-two) specifically so mipmapping is legal in a
  // WebGL1 context, and NearestMipmapLinear keeps each individual mip level hard-edged (still reads as
  // pixel-art up close) while blending smoothly between levels as a surface recedes.
  tex.minFilter = THREE.NearestMipmapLinearFilter;
  tex.generateMipmaps = true;
  // Same grazing-angle case as _finish() above (see its note): mipmapping alone still leaves a wall panel
  // seen edge-on, or from very close after bumping into it, sampling one over-blurred mip level. Anisotropic
  // filtering is what actually holds detail at that angle instead of flattening it into a soft banded blur.
  tex.anisotropy = maxAniso;
  return tex;
}

function voxMat(hex, opts){
  return new THREE.MeshLambertMaterial({map: makeVoxelTexture(hex, opts)});
}

function glowCss(hex){ const c=new THREE.Color(hex==null?0x35d0ff:hex); return `rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`; }
function makeFace(type, skinHex, glowHex){
  const c=document.createElement('canvas'); c.width=c.height=32; const ctx=c.getContext('2d');
  const s=new THREE.Color(skinHex); ctx.fillStyle=`rgb(${s.r*255|0},${s.g*255|0},${s.b*255|0})`; ctx.fillRect(0,0,32,32);
  const px=(x,y,w,h,col)=>{ctx.fillStyle=col; ctx.fillRect(x,y,w,h);};
  if(type==='human'){
    // full contoured face: temple/jaw shadow + forehead highlight for a 3D read, angled brows,
    // sclera+iris+pupil eyes (not flat squares), a shaded nose bridge, a stern mouth with a jaw
    // shadow beneath, and light stubble flecks
    const shadowCol = `rgb(${(s.r*0.5*255)|0},${(s.g*0.5*255)|0},${(s.b*0.5*255)|0})`;
    const hiCol = `rgb(${Math.min(255,s.r*255*1.2)|0},${Math.min(255,s.g*255*1.2)|0},${Math.min(255,s.b*255*1.2)|0})`;
    px(0,9,4,23,shadowCol); px(28,9,4,23,shadowCol);
    px(11,2,10,6,hiCol);
    ctx.fillStyle='#1c140d';
    ctx.beginPath(); ctx.moveTo(5,12); ctx.lineTo(13,9); ctx.lineTo(13,11.5); ctx.lineTo(6,14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(27,12); ctx.lineTo(19,9); ctx.lineTo(19,11.5); ctx.lineTo(26,14); ctx.closePath(); ctx.fill();
    px(7,14,6,4,'#2a1c12'); px(19,14,6,4,'#2a1c12');
    px(8,15,4,2,'#e8ded0'); px(20,15,4,2,'#e8ded0');
    px(9,15,2,2,'#3a2a1a'); px(21,15,2,2,'#3a2a1a');
    px(9,15,1,1,'#050505'); px(21,15,1,1,'#050505');
    px(15,16,2,7,shadowCol); px(14,22,4,1,shadowCol);
    px(10,25,12,2,'#241a12');
    px(9,27,14,2,shadowCol);
    ctx.fillStyle='rgba(20,14,10,0.3)';
    for(let i=0;i<12;i++){ const x=8+((i*7)%16), y=27+((i*3)%3); ctx.fillRect(x,y,1,1); }
  }
  else if(type==='zombie'){ px(4,4,6,5,'#4f6f32'); px(20,19,7,4,'#3f5a28'); px(6,13,6,6,'#12200c'); px(20,13,6,6,'#12200c'); px(8,15,3,3,'#000'); px(22,15,3,3,'#000'); for(let i=0;i<14;i+=3) px(9+i,24,1,4,'#0e1608'); }
  else if(type==='skull'){ px(6,12,8,8,'#0a0a0a'); px(18,12,8,8,'#0a0a0a'); px(14,20,4,4,'#0a0a0a'); for(let i=0;i<24;i+=4) px(6+i,27,2,4,'#141414'); }
  else if(type==='croc'){ px(6,8,5,4,'#0a0a0a'); px(21,8,5,4,'#0a0a0a'); px(8,9,2,2,'#d4e000'); px(22,9,2,2,'#d4e000'); px(3,5,3,3,'#3a5a28'); px(26,5,3,3,'#3a5a28'); for(let i=0;i<28;i+=4) px(3+i,27,2,4,'#f0f0e8'); }
  else if(type==='cyborg'){ px(0,13,32,7,'#0c1418'); px(5,15,9,3,glowCss(glowHex)); px(18,15,9,3,glowCss(glowHex)); for(let x=2;x<32;x+=8){px(x,4,2,2,'#5a636c'); px(x,26,2,2,'#5a636c');} }
  else if(type==='boss'){
    // full metal helmet: no face — angled brow, glowing orange visor slit, lower vent grille
    px(0,0,32,32,'#22262c');                       // dark helmet plate
    px(2,3,28,3,'#31373f'); px(3,6,26,3,'#191c21'); // top bevel + brow shadow
    px(4,13,24,6,'#0e1013');                        // recessed visor housing
    px(6,14,8,4,glowCss(glowHex||0xff7a1a));        // left glowing visor
    px(18,14,8,4,glowCss(glowHex||0xff7a1a));       // right glowing visor
    px(14,15,4,2,'#0e1013');                        // nose bridge between visors
    for(let i=0;i<20;i+=4) px(7+i,23,2,6,'#0c0e11'); // mouth/vent grille
    px(5,22,22,1,'#3a4048'); px(5,29,22,1,'#3a4048'); // grille frame
  }
  else if(type==='mummy'){
    // diagonal bandage striping over the base skin fill, sunken sockets, glowing pinprick eyes
    ctx.strokeStyle='rgba(120,102,68,0.55)'; ctx.lineWidth=3;
    for(let i=-6;i<38;i+=6){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+16,32); ctx.stroke(); }
    px(6,13,7,6,'#150f08'); px(19,13,7,6,'#150f08');
    px(8,15,3,3,glowCss(glowHex||0xe8a23d)); px(21,15,3,3,glowCss(glowHex||0xe8a23d));
  }
  else if(type==='jackal'){
    // deep-set sockets with visible contrast against the fur, glowing eyes, dark muzzle bridge (no teeth — the snout mesh covers the rest)
    px(4,8,8,7,'#120c08'); px(20,8,8,7,'#120c08');
    px(6,10,4,3,glowCss(glowHex||0x5fb8d6)); px(22,10,4,3,glowCss(glowHex||0x5fb8d6));
    px(10,22,12,4,'#0a0705');
  }
  else if(type==='colossus'){
    px(6,13,6,5,'#2a2013'); px(20,13,6,5,'#2a2013');
    px(9,15,2,2,glowCss(glowHex||0xe0b040)); px(23,15,2,2,glowCss(glowHex||0xe0b040));
    ctx.strokeStyle=glowCss(glowHex||0xe0b040); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(3,3); ctx.lineTo(13,17); ctx.lineTo(9,29); ctx.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.anisotropy=maxAniso; return t;
}

function makeVoxelBot(color, weaponType, skinName){

  if(skinName==='shabti') return makeShabti();
  if(skinName==='hippo') return makeHippo();

  if(skinName==='griffin') return makeGriffin();

  if(skinName==='manticore') return makeManticore();
  if(skinName==='basilisk') return makeBasilisk();
  if(skinName==='hydra') return makeHydra();
  if(skinName==='champion') return makeChampion();
  if(skinName==='tiger') return makeTiger();

  const pants = cfg.pants, boots = cfg.boots, handsC = cfg.hands;

  head.position.y = 1.58; g.add(head);

  if(cfg.glow && (cfg.face==='cyborg'||cfg.face==='boss'||cfg.face==='mummy'||cfg.face==='jackal'||cfg.face==='colossus'||cfg.face==='croc')){

    if(cfg.face==='boss'){ const gl=new THREE.PointLight(cfg.glow,0.7,4); gl.position.set(0,1.6,0.5); g.add(gl); }
  }
  // hair (only skins that have it)
  if(cfg.hair){
    const hairMat = voxMat(cfg.hair,{noise:16});
    for (let i=0;i<5;i++){ const spike=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.22,0.09),hairMat);
      spike.position.set(-0.16+i*0.08,1.9,-0.06+(i%2)*0.05); spike.rotation.z=(i-2)*0.18; spike.rotation.x=-0.15; g.add(spike); }
    const hb=new THREE.Mesh(new THREE.BoxGeometry(0.48,0.3,0.2),hairMat); hb.position.set(0,1.72,-0.15); g.add(hb);

    if(cfg.face==='boss'){

      const cR=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.2,0.09),voxMat(helmetCol,{noise:8})); cR.position.set(0.22,2.12,0); cR.rotation.z=-0.5; g.add(cR);

  if(cfg.goldTrim){

  function makeArm(side){

    arm.position.set(side*0.38, 1.32, 0); g.add(arm); return arm;
  }
  const armL = makeArm(-1);
  const armR = makeArm(1);
  // legionary's scutum — the big curved rectangular shield strapped to the off-hand arm, the other
  // unmistakable Roman legionary silhouette piece (approximated as a flat curved-looking panel with a

  if(cfg.shield){

  }

  // ---- held weapon (barrel/blade points down the arm, -Y local) ----
  const heldGrp = new THREE.Group();
  heldGrp.position.set(0,-0.78,0.02);
  if(cfg.heldWeapon==='khopesh'){
    // mummy's held weapon: a small khopesh hanging from the hand, blade down with a compact hook near the tip
    const bronze=metalMatP(0xad8730,80,0xffe9b0), dark=voxMat(0x2a1c12,{noise:14});
    const handle=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.16,0.07),dark); handle.position.y=0.05; heldGrp.add(handle);
    const guard=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.03,0.09),dark); guard.position.y=-0.04; heldGrp.add(guard);
    const blade=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.2,0.05),bronze); blade.position.y=-0.15; heldGrp.add(blade);
    const hook1=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.08,0.05),bronze); hook1.position.set(0.017,-0.266,0); hook1.rotation.z=0.45; heldGrp.add(hook1);
    const hook2=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.07,0.05),bronze); hook2.position.set(0.06,-0.313,0); hook2.rotation.z=0.9; heldGrp.add(hook2);
  } else if(cfg.heldWeapon==='bow'){
    // jackal's held weapon: a small bow, limbs chain-walked the same verified way as the player's bow.
    // Built in its own sub-group scaled down and pulled forward — full size, it reached up into the arm mesh.
    const wood=voxMat(0x6b4a2c,{noise:14}), gold=voxMat(0xad8730,{noise:10});
    function heldLimb(dir){
      const grp=new THREE.Group();
      let y=0.03, z=0, theta=0;
      const dtheta=0.28, L=0.09, overlap=0.01;
      let tipY=y, tipZ=z;
      for(let i=0;i<3;i++){
        const thetaMid=theta+dtheta/2;
        const dy=Math.cos(thetaMid), dz=Math.sin(thetaMid);
        const cy=y+(L/2)*dy, cz=z+(L/2)*dz;
        const m=new THREE.Mesh(new THREE.BoxGeometry(0.026,0.09,0.026), wood); // single color — alternating per-segment color was flickering at the overlap seams
        m.position.set(0, cy*dir, cz);
        m.rotation.x = thetaMid*dir;
        grp.add(m);
        tipY=y+L*dy; tipZ=z+L*dz;
        y=tipY-overlap*dy; z=tipZ-overlap*dz;
        theta+=dtheta;
      }
      const tipCap=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.04,0.04), gold);
      tipCap.position.set(0, tipY*dir, tipZ); grp.add(tipCap);
      return {grp, tipY:tipY*dir, tipZ};
    }
    const bowGrp=new THREE.Group();
    const hUp=heldLimb(1), hDown=heldLimb(-1);
    bowGrp.add(hUp.grp); bowGrp.add(hDown.grp);
    const grip=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.16,0.06),wood); bowGrp.add(grip);
    const strLen=Math.hypot(hUp.tipY-hDown.tipY, hUp.tipZ-hDown.tipZ);
    const string=new THREE.Mesh(new THREE.BoxGeometry(0.01,strLen,0.01),new THREE.MeshBasicMaterial({color:0xe8dcc0,fog:false}));
    string.position.set(0,(hUp.tipY+hDown.tipY)/2,(hUp.tipZ+hDown.tipZ)/2);
    string.rotation.x = Math.atan2(hUp.tipZ-hDown.tipZ, hUp.tipY-hDown.tipY);
    bowGrp.add(string);
    bowGrp.scale.setScalar(0.42); // small enough to sit in the hand without reaching up into the arm mesh
    bowGrp.position.z += 0.1;     // pulled slightly forward, clear of the arm
    heldGrp.add(bowGrp);
  } else if(weaponType==='knife'){
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.5,0.12), new THREE.MeshPhongMaterial({color:0xd8dde3, shininess:110, specular:0xffffff}));
    blade.position.y=-0.28; heldGrp.add(blade);
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.05,0.16), voxMat(0x3a2e22,{noise:8})); heldGrp.add(guard);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.18,0.08), voxMat(0x5a3d28,{noise:10})); handle.position.y=0.11; heldGrp.add(handle);
  } else if(weaponType==='javelin'){
    // legionary's pilum — a plain wooden shaft with a small iron point. This was previously falling through
    // to the generic pistol visual below (no branch matched weaponType==='javelin'), so every javelin-throwing
    // legionary was holding a pistol instead of a spear.
    const wood = voxMat(0x5a3d22,{noise:14}), iron = voxMat(0x6a6a6a,{noise:10});
    const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.045,0.55,0.045), wood); shaft.position.y=-0.14; heldGrp.add(shaft);
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.16,0.04), iron); tip.position.y=-0.47; heldGrp.add(tip);
  } else if(cfg.bossgun){
    // energy cannon (blue for the default boss; skins can override via bossgunColor/bossgunColor2)
    const dark = voxMat(0x1b2630,{noise:10});
    const barrel=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.5,0.17),dark); barrel.position.y=-0.26; heldGrp.add(barrel);
    const core=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.52,0.08),new THREE.MeshBasicMaterial({color:cfg.bossgunColor||0x35c8ff,fog:false})); core.position.y=-0.26; heldGrp.add(core);
    const ring=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.07,0.22),new THREE.MeshBasicMaterial({color:cfg.bossgunColor2||0x8fe6ff,fog:false})); ring.position.y=-0.52; heldGrp.add(ring);
    const grip=new THREE.Mesh(new THREE.BoxGeometry(0.11,0.18,0.11),dark); grip.position.y=0.06; heldGrp.add(grip);
  } else {
    const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.34,0.1), voxMat(0x1b1d22,{noise:10})); barrel.position.y=-0.16; heldGrp.add(barrel);
    const slide = new THREE.Mesh(new THREE.BoxGeometry(0.11,0.12,0.28), voxMat(0x2b2f36,{noise:12,pattern:'plate'})); slide.position.set(0,-0.02,-0.02); heldGrp.add(slide);
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.2,0.1), voxMat(0x23252b,{noise:8})); grip.position.set(0,0.12,0.04); heldGrp.add(grip);
  }
  armR.add(heldGrp);
  const botMuzzle = new THREE.Mesh(new THREE.PlaneGeometry(0.35,0.35),
    new THREE.MeshBasicMaterial({color: cfg.bossgun?(cfg.bossgunColor||0x5ad6ff):0xffe08a, transparent:true, opacity:0, fog:false, side:THREE.DoubleSide}));
  botMuzzle.position.set(0,-1.0,0.02); botMuzzle.visible=false; armR.add(botMuzzle);
  g.userData.botMuzzle = botMuzzle;
  g.userData.weaponType = weaponType;

  // legs
  const thighMat = voxMat(pants,{noise:12});

  function makeLeg(side){

  }
  const legL = makeLeg(-1);
  const legR = makeLeg(1);

  g.userData.legL = legL; g.userData.legR = legR; g.userData.armR = armR; g.userData.armL = armL;
  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.7, 0); marker.scale.set(1.05,1.05,1.05); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}
// shared marker texture: glowing red downward arrow/chevron
let _markerTex=null;
function enemyMarkerTex(){
  if(_markerTex) return _markerTex;
  const c=document.createElement('canvas'); c.width=c.height=128; const ctx=c.getContext('2d');
  // bright, high-contrast downward arrow with a bold white outline + dark halo so it reads through walls
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=14;
  ctx.strokeStyle='#000'; ctx.lineWidth=14; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(26,20); ctx.lineTo(102,20); ctx.lineTo(64,96); ctx.closePath(); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff2a2a'; ctx.strokeStyle='#ffffff'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(26,20); ctx.lineTo(102,20); ctx.lineTo(64,96); ctx.closePath(); ctx.fill(); ctx.stroke();
  _markerTex=new THREE.CanvasTexture(c); _markerTex.magFilter=THREE.NearestFilter; _markerTex.anisotropy=maxAniso; return _markerTex;
}

// ---- scarab: small non-humanoid swarm creature (no arms/legs rig — spawned in packs of 5) ----
// a single beetle — used only as a building block for the swarm group below, never spawned alone
function makeScarabUnit(){
  const g = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.32,10,6), voxMat(0x4f5c37,{noise:18}));
  shell.scale.set(1,0.55,0.75); shell.position.y=0.32; g.add(shell);
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.015,0.03,0.6), new THREE.MeshBasicMaterial({color:0x171d10,fog:false}));
  seam.position.y=0.42; g.add(seam);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.1,0.1), voxMat(0x171d10,{noise:10})); head.position.set(0,0.26,0.3); g.add(head);
  const legMat = voxMat(0x171d10,{noise:8});
  for(let i=0;i<6;i++){
    const side = i<3?-1:1, row=i%3;
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.03,0.03), legMat);
    leg.position.set(side*0.24, 0.14, 0.16-row*0.16);

}
// the scarab "swarm": one bot entity made of 5 beetles in a fixed cluster — they share one hitbox/HP
// and one AI, so the pack always moves, fights, and dies together instead of scattering as individuals
function makeScarab(){
  const g = new THREE.Group();
  const formation = [
    {x:-0.3, z:0.12,  ry:-0.5, s:0.85},
    {x:0.24, z:0.2,   ry:0.35, s:1.05},
    {x:0.02, z:-0.16, ry:0.1,  s:0.95},
    {x:0.34, z:-0.12, ry:0.8,  s:0.8},
    {x:-0.2, z:-0.24, ry:-1.0, s:0.75},
  ];
  const spacing = 1.6; // spreads the formation out — still one shared hitbox/HP/AI, just less tightly clustered
  formation.forEach(f=>{
    const unit = makeScarabUnit();
    unit.position.set(f.x*spacing, 0, f.z*spacing); unit.rotation.y = f.ry; unit.scale.setScalar(f.s);
    g.add(unit);
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.15, 0); marker.scale.set(0.9,0.9,0.9); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.22,0.6), skinMat); snout.position.set(0,0.32,0.95); g.add(snout);
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.32,0.1,0.55), bellyMat); jaw.position.set(0,0.2,0.95); g.add(jaw);
  const teeth = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.04,0.02), new THREE.MeshLambertMaterial({color:0xf0f0e0})); teeth.position.set(0,0.26,1.2); g.add(teeth);
  [-1,1].forEach(side=>{
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.08), voxMat(0x1c2410,{noise:6})); eye.position.set(side*0.14,0.46,0.68); g.add(eye);
  });
  const legMat = voxMat(0x35501f,{noise:14});
  [[-0.28,-0.4],[0.28,-0.4],[-0.28,0.4],[0.28,0.4]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.24,0.22),legMat); leg.position.set(lx,0.13,lz); g.add(leg);
  });
  // tapering tail
  [{s:0.4,z:-0.8},{s:0.3,z:-1.1},{s:0.2,z:-1.35}].forEach(seg=>{
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.32*seg.s/0.4,0.22*seg.s/0.4,0.35), skinMat); t.position.set(0,0.3,seg.z); g.add(t);
  });

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 0.9, 0); marker.scale.set(0.9,0.9,0.9); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// ---- Greek era creatures (waves 4-6): none of these are humanoid reskins — real monster shapes ----
// MINOTAUR — a bull-first brute. The old model was a person with a cow's head: an upright human torso,
// arms at its sides, the bull confined to the skull. A minotaur has to read as bull FIRST, so this is built
// around a forward-slung mass — huge shoulders carried high and wide, a chest deeper than it is broad, the
// head slung LOW and forward between the shoulders rather than perched on top, and the horns as the widest
// thing in the silhouette. Same "shoulders high, head low and forward" approach the Ghoul rebuild used.
// Presents its horned head like a shield when engaging (pairs with the facing-based front-block mechanic in
// the AI loop/damageBot, keyed off skin==='minotaur').
function makeMinotaur(){
  const g = new THREE.Group();
  // the AI loop sets this bot's rotation.y directly rather than calling mesh.lookAt() (see the capped
  // turn-rate branch), pointing the group's local -Z at its target; build facing +Z as usual, then flip
  // once here so the horns and snout end up on the correct side instead of facing away
  const body = new THREE.Group(); body.rotation.y = Math.PI; g.add(body);
  const hideMat  = voxMat(0x7a4c2e,{noise:16});   // main hide — mid brown, the body's base tone
  const hideDark = voxMat(0x4a2c18,{noise:16});   // dark shaggy fur — mane, forearms, shins, tail
  const hidePale = voxMat(0xb08a5c,{noise:12});   // pale underside/muzzle, the light half of the break
  const hornMat  = metalMatP(0xe8e0c8,55,0xffffff);
  const hornTip  = voxMat(0x241d16,{noise:8});
  const hoofMat  = voxMat(0x1c1712,{noise:10});
  const teethMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});
  const eyeMat   = new THREE.MeshBasicMaterial({color:0xff3a1a,fog:false});
  const noseMat  = new THREE.MeshBasicMaterial({color:0x1c1210,fog:false});

  // ---- hindquarters: narrow, set BACK and low, so the mass reads as front-loaded like a real bull ----
  const rump  = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.52,0.46), hideMat);  rump.position.set(0,0.92,-0.30); body.add(rump);
  const loins = new THREE.Mesh(new THREE.BoxGeometry(0.56,0.46,0.34), hideMat);  loins.position.set(0,1.06,-0.08); body.add(loins);

  // ---- barrel chest: deeper front-to-back than it is wide, and it climbs FORWARD and up into the
  // shoulders. This wedge is the whole silhouette; everything else hangs off it. ----
  const chest     = new THREE.Mesh(new THREE.BoxGeometry(0.72,0.72,0.62), hideMat);  chest.position.set(0,1.36,0.18); body.add(chest);
  const brisket   = new THREE.Mesh(new THREE.BoxGeometry(0.58,0.40,0.50), hidePale); brisket.position.set(0,1.04,0.26); body.add(brisket);
  const chestFur  = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.34,0.16), hideDark); chestFur.position.set(0,1.30,0.50); body.add(chestFur);

  // ---- the hump: a bull's withers, the highest point of the back, sitting between the shoulders ----
  const hump    = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.34,0.50), hideMat);  hump.position.set(0,1.80,0.06); body.add(hump);
  const humpFur = new THREE.Mesh(new THREE.BoxGeometry(0.50,0.20,0.40), hideDark); humpFur.position.set(0,2.00,0.04); body.add(humpFur);

  // ---- shoulders: carried HIGH and pushed WIDE, bracketing the head. These plus the horns are what make
  // the front-on silhouette read; the old model's shoulders were narrower than its own chest. ----
  [-1,1].forEach(side=>{
    const deltoid = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.46,0.52), hideMat);  deltoid.position.set(side*0.47,1.60,0.16); body.add(deltoid);
    const cap     = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.24,0.42), hideDark); cap.position.set(side*0.50,1.84,0.12); body.add(cap);
  });

  // ---- neck: short, THICK and angled DOWN and forward, so the head sits below the shoulder line ----
  const neck     = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.42,0.52), hideDark); neck.position.set(0,1.62,0.52); neck.rotation.x=0.42; body.add(neck);
  // mane ruff where the neck meets the shoulders, hiding the joint and widening the front
  for(let i=0;i<5;i++){
    const a=(i/4-0.5)*1.5;
    const tuft=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.26,0.14), hideDark);
    tuft.position.set(Math.sin(a)*0.34, 1.78+Math.cos(a)*0.06, 0.32+Math.cos(a)*0.06); tuft.rotation.z=a*0.5; body.add(tuft);
  }

  // ---- head: slung LOW and well forward, the lowest-and-frontmost element of the upper body. A real bull
  // skull is long and narrow, not a cube — cranium, then a tapering muzzle out in front of it. ----
  const cranium = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.38,0.40), hideDark); cranium.position.set(0,1.40,0.80); body.add(cranium);
  const brow    = new THREE.Mesh(new THREE.BoxGeometry(0.48,0.14,0.22), hideDark); brow.position.set(0,1.56,0.90); brow.rotation.x=0.30; body.add(brow);
  const muzzle  = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.28,0.38), hidePale); muzzle.position.set(0,1.28,1.06); body.add(muzzle);
  const nosePad = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.16,0.08), hideDark); nosePad.position.set(0,1.26,1.26); body.add(nosePad);
  const jaw     = new THREE.Mesh(new THREE.BoxGeometry(0.26,0.12,0.32), hidePale); jaw.position.set(0,1.13,1.02); body.add(jaw);
  const teeth   = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.05,0.04), teethMat); teeth.position.set(0,1.17,1.20); body.add(teeth);
  [-1,1].forEach(side=>{
    const tusk=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.11,0.05), teethMat); tusk.position.set(side*0.09,1.11,1.17); tusk.rotation.x=0.35; body.add(tusk);
    const nostril=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.04), noseMat); nostril.position.set(side*0.07,1.26,1.29); body.add(nostril);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.05,0.06), eyeMat); eye.position.set(side*0.19,1.47,0.92); eye.rotation.z=side*0.28; body.add(eye);
    const ear=new THREE.Mesh(new THREE.BoxGeometry(0.20,0.09,0.12), hideDark); ear.position.set(side*0.28,1.44,0.68); ear.rotation.z=side*0.5; body.add(ear);
  });

  // ---- horns: the widest thing on the model, sweeping OUT then forward. Built as a three-link chain per
  // side, each link stepping along its own rotated direction so the sections actually meet — a bare lateral
  // offset with a separate rotation is what leaves curved runs as floating shards (see the Hydra necks). ----
  [-1,1].forEach(side=>{
    let hx=side*0.22, hy=1.62, hz=0.74, ang=side*1.15;   // ang = tilt out from vertical, in the XY plane
    [{len:0.26,r:0.095},{len:0.24,r:0.072},{len:0.22,r:0.05}].forEach((seg,i)=>{
      const dx=Math.sin(ang), dy=Math.cos(ang);
      const m=new THREE.Mesh(new THREE.CylinderGeometry(seg.r*0.78,seg.r,seg.len,6), i===2?hornTip:hornMat);
      m.position.set(hx+dx*seg.len/2, hy+dy*seg.len/2, hz);
      m.rotation.z=-ang;
      body.add(m);
      hx+=dx*seg.len*0.9; hy+=dy*seg.len*0.9; hz+=0.06;   // 0.9 = deliberate overlap between links
      ang -= side*0.62;                                    // curl from out-and-up round to forward
    });
  });

  // ---- forelimbs: heavy, planted FORWARD under the chest, taking the creature's weight like a bull's ----
  [-1,1].forEach(side=>{
    const upper=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.48,0.30), hideMat);  upper.position.set(side*0.46,1.24,0.24); upper.rotation.z=side*-0.10; body.add(upper);
    const fore =new THREE.Mesh(new THREE.BoxGeometry(0.24,0.46,0.26), hideDark); fore.position.set(side*0.52,0.80,0.32);  fore.rotation.z=side*-0.06; body.add(fore);
    const fist =new THREE.Mesh(new THREE.BoxGeometry(0.26,0.24,0.28), hideDark); fist.position.set(side*0.55,0.52,0.36); body.add(fist);
    const knuckle=new THREE.Mesh(new THREE.BoxGeometry(0.27,0.10,0.12), hoofMat); knuckle.position.set(side*0.55,0.44,0.44); body.add(knuckle);
  });

  // ---- hind legs: digitigrade, folded back, ending in cloven hooves ----
  [-1,1].forEach(side=>{
    const thigh=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.50,0.36), hideMat);  thigh.position.set(side*0.20,0.76,-0.24); body.add(thigh);
    const shin =new THREE.Mesh(new THREE.BoxGeometry(0.22,0.44,0.24), hideDark); shin.position.set(side*0.20,0.36,-0.14); shin.rotation.x=-0.20; body.add(shin);
    const hoof =new THREE.Mesh(new THREE.BoxGeometry(0.26,0.18,0.32), hoofMat);  hoof.position.set(side*0.20,0.09,-0.04); body.add(hoof);
    const cleft=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.16,0.30), hidePale); cleft.position.set(side*0.20,0.09,-0.02); body.add(cleft);
  });
  // tufted tail, hanging off the rump
  const tailA=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.34,0.10), hideMat);  tailA.position.set(0,0.82,-0.50); tailA.rotation.x=-0.35; body.add(tailA);
  const tailB=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.20,0.12), hideDark); tailB.position.set(0,0.58,-0.60); body.add(tailB);

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.7, 0); marker.scale.set(1.1,1.1,1.1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}


// GRIFFIN — eagle fore-quarters, lion hind-quarters, and wings that actually read from the front.
// The old wings were three near-horizontal flat slabs per side, so head-on the creature had almost no
// silhouette at all — it disappeared into its own outline the moment it faced you. These are broad
// overlapping panels raked up into a strong dihedral V, the same fix the Roc rebuild used, and the
// eagle/lion split now reads in SHAPE (feathered chest and taloned forelegs in front, heavy haunches and
// a tufted tail behind) rather than only in colour.
// Dives in with a screech at range, then closes to claw/beak melee (weaponType==='javelin' hybrid mechanic).
function makeGriffin(){
  const g = new THREE.Group();
  // NOTE: this bot is turned via mesh.lookAt() in the shared AI loop (not a direct rotation.y assignment
  // like the minotaur), and three.js' lookAt() already points a plain Object3D's local +Z at the target —
  // so the model is built facing +Z directly on `g`, with no flip wrapper needed.
  const furMat   = voxMat(0xb5904a,{noise:16});  // tawny lion hind-quarters
  const furDark  = voxMat(0x8a6a34,{noise:14});  // darker tawny — haunches, wing underside, paws
  const featherW = voxMat(0xf4f2ea,{noise:5});   // white eagle plumage — head, neck, chest, wing coverts
  const featherG = voxMat(0xd8d5c8,{noise:6});   // grey-white shading feather, the light/dark break
  const beakMat  = new THREE.MeshLambertMaterial({color:0xe0a828});
  const talonMat = new THREE.MeshLambertMaterial({color:0x241c14});
  const eyeMat   = new THREE.MeshBasicMaterial({color:0xffd23a,fog:false});

  // ---- lion hind-quarters: heavy haunches set low and back ----
  const rump   = new THREE.Mesh(new THREE.BoxGeometry(0.60,0.52,0.62), furMat);  rump.position.set(0,0.62,-0.62); g.add(rump);
  const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.64,0.56,0.66), furMat);  barrel.position.set(0,0.68,-0.08); g.add(barrel);
  // ---- eagle chest: rises forward out of the lion barrel, feathered, deeper than the hindquarters ----
  const chest  = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.62,0.52), featherW); chest.position.set(0,0.84,0.40); g.add(chest);
  const keel   = new THREE.Mesh(new THREE.BoxGeometry(0.40,0.44,0.22), featherG); keel.position.set(0,0.70,0.64); g.add(keel);
  // scapular feathers over the shoulder, covering the seam where plumage meets fur
  for(let i=0;i<4;i++){
    const scap=new THREE.Mesh(new THREE.BoxGeometry(0.50,0.09,0.26), i%2?featherW:featherG);
    scap.position.set(0,1.06+i*0.05,0.30-i*0.20); scap.rotation.x=-0.18; g.add(scap);
  }

  // ---- neck and raptor head, carried high and forward so the beak leads the shape ----
  const neck = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.46,0.36), featherW); neck.position.set(0,1.24,0.56); neck.rotation.x=-0.28; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.34,0.38), featherW); head.position.set(0,1.58,0.76); g.add(head);
  const crown= new THREE.Mesh(new THREE.BoxGeometry(0.32,0.10,0.30), featherG); crown.position.set(0,1.77,0.74); g.add(crown);
  const cere = new THREE.Mesh(new THREE.BoxGeometry(0.20,0.16,0.14), featherG); cere.position.set(0,1.55,0.94); g.add(cere);
  // hooked beak: upper hook plus a lower mandible, not one straight cone
  const beakTop = new THREE.Mesh(new THREE.BoxGeometry(0.17,0.14,0.24), beakMat); beakTop.position.set(0,1.55,1.06); g.add(beakTop);
  const beakHook= new THREE.Mesh(new THREE.ConeGeometry(0.085,0.20,4), beakMat);  beakHook.position.set(0,1.44,1.14); beakHook.rotation.x=Math.PI; g.add(beakHook);
  const beakLow = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.07,0.18), beakMat); beakLow.position.set(0,1.45,1.02); g.add(beakLow);
  [-1,1].forEach(side=>{
    const brow=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.07,0.16), featherG); brow.position.set(side*0.14,1.68,0.88); g.add(brow);
    const eye =new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.05), eyeMat);   eye.position.set(side*0.15,1.60,0.93); g.add(eye);
    const tuft=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.17,4), featherG);   tuft.position.set(side*0.13,1.83,0.68); tuft.rotation.x=-0.35; g.add(tuft);
  });

  // ---- wings. Each is a chain of BROAD panels walking up and out in a strong dihedral, every panel
  // positioned along the previous one's own rotated direction so consecutive panels always overlap. The
  // rake is what gives the head-on silhouette its span — the old flat slabs had none. ----
  [-1,1].forEach(side=>{
    // shoulder mass the wing roots into, so the joint never floats off the body
    const shoulder=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.34,0.44), featherG); shoulder.position.set(side*0.36,1.02,0.16); g.add(shoulder);
    let wx=side*0.42, wy=1.10, wz=0.10, rake=0.62;      // rake = angle above horizontal
    const panels=[{len:0.52,h:0.34,d:0.62},{len:0.50,h:0.26,d:0.54},{len:0.46,h:0.20,d:0.44},{len:0.40,h:0.14,d:0.32}];
    panels.forEach((pn,i)=>{
      const dx=Math.cos(rake), dy=Math.sin(rake);
      const m=new THREE.Mesh(new THREE.BoxGeometry(pn.len,pn.h,pn.d), i%2?furMat:furDark);
      m.position.set(wx+side*dx*pn.len/2, wy+dy*pn.len/2, wz-i*0.05);
      m.rotation.z = side>0 ? -rake : rake;             // panel's long axis lies along the step direction
      g.add(m);
      // primary flight feathers hanging off the trailing edge of the outer panels
      if(i>=2){
        for(let f=0;f<3;f++){
          const q=new THREE.Mesh(new THREE.BoxGeometry(pn.len*0.85,0.06,0.13), featherG);
          q.position.set(wx+side*dx*pn.len/2, wy+dy*pn.len/2-0.04, wz-i*0.05-pn.d/2-f*0.11);
          q.rotation.z = side>0 ? -rake : rake; q.rotation.x = -0.16*(f+1);
          g.add(q);
        }
      }
      wx+=side*dx*pn.len*0.88; wy+=dy*pn.len*0.88;      // 0.88 = deliberate overlap between panels
      rake -= 0.16;                                      // flattens toward the tip, so the wing curves
    });
  });

  // ---- eagle forelegs: taloned, planted forward under the chest ----
  [-1,1].forEach(side=>{
    const thigh=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.30,0.24), featherW); thigh.position.set(side*0.24,0.62,0.34); g.add(thigh);
    const shank=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.34,0.16), beakMat);  shank.position.set(side*0.24,0.32,0.40); g.add(shank);
    const foot =new THREE.Mesh(new THREE.BoxGeometry(0.22,0.11,0.26), beakMat);  foot.position.set(side*0.24,0.10,0.48); g.add(foot);
    // three forward talons plus a hallux behind, all touching the ground
    [-1,0,1].forEach(t=>{
      const claw=new THREE.Mesh(new THREE.ConeGeometry(0.045,0.16,4), talonMat);
      claw.position.set(side*0.24+t*0.075,0.05,0.62); claw.rotation.x=-1.35; g.add(claw);
    });
    const hallux=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.13,4), talonMat); hallux.position.set(side*0.24,0.05,0.36); hallux.rotation.x=1.35; g.add(hallux);
  });
  // ---- lion hind legs: bunched haunch, hock, and a broad padded paw ----
  [-1,1].forEach(side=>{
    const haunch=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.42,0.44), furMat);  haunch.position.set(side*0.26,0.52,-0.58); g.add(haunch);
    const hock  =new THREE.Mesh(new THREE.BoxGeometry(0.20,0.34,0.22), furDark); hock.position.set(side*0.26,0.26,-0.46); hock.rotation.x=0.28; g.add(hock);
    const paw   =new THREE.Mesh(new THREE.BoxGeometry(0.24,0.13,0.30), furDark); paw.position.set(side*0.26,0.065,-0.36); g.add(paw);
    [-1,0,1].forEach(t=>{
      const claw=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.10,4), talonMat);
      claw.position.set(side*0.26+t*0.07,0.05,-0.24); claw.rotation.x=-1.4; g.add(claw);
    });
  });

  // ---- leonine tail with its tuft, sweeping back and down ----
  { let tx=0, ty=0.72, tz=-0.90, th=0.45;
    [{len:0.30,s:0.13},{len:0.28,s:0.11},{len:0.26,s:0.09}].forEach(seg=>{
      const dy=-Math.sin(th), dz=-Math.cos(th);
      const m=new THREE.Mesh(new THREE.BoxGeometry(seg.s,seg.s,seg.len), furMat);
      m.position.set(tx, ty+dy*seg.len/2, tz+dz*seg.len/2); m.rotation.x=-th; g.add(m);
      ty+=dy*seg.len*0.85; tz+=dz*seg.len*0.85; th+=0.22;
    });
    const tuft=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.20,0.17), furDark); tuft.position.set(tx,ty,tz); g.add(tuft);
  }

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.1, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}


// MEDUSA — a gorgon: human above the waist, serpent below, with a real head of snakes.
// The old model's hair was twelve short uniform tendrils of the same length pointing the same way, which
// read as a spiky helmet rather than as snakes. These are chain-built, each one longer, individually
// curled, and stepping along its own rotated direction vector — never a bare linear offset paired with a
// separate rotation, which is the bug that has left curved runs as disconnected shards on the Hydra's
// necks, the Hydra's tail, the Saif's blade and the crossbow's lath. The lower body coils with real
// overlap between segments instead of stacking boxes with gaps between them.
// Heavy tank role (highest grunt HP, harder melee — keyed off skin==='medusa' in the AI loop).
function makeMedusa(){
  const g = new THREE.Group();
  // NOTE: same as makeGriffin — turned via mesh.lookAt() in the shared AI loop, which already points a
  // plain Object3D's local +Z at the target, so this is built facing +Z with no flip wrapper.
  const scaleMat  = voxMat(0x3a5c3e,{noise:16});   // dark green dorsal scales
  const scaleMat2 = voxMat(0x2a4630,{noise:14});   // darker banding scale
  const bellyMat  = voxMat(0x9aa86a,{noise:10});   // pale ventral scutes — the light half of the break
  const skinMat   = voxMat(0x6a8a5e,{noise:12});   // paler scaled "skin" of the face and torso
  const goldMat   = metalMatP(0xc9a13a,85,0xffe9b0); // cursed-beauty jewellery, for material contrast
  const snakeMat  = voxMat(0x4a6a3a,{noise:14});
  const snakeMat2 = voxMat(0x35522c,{noise:12});
  const fangMat   = new THREE.MeshLambertMaterial({color:0xf0f0e0});
  const eyeMat    = new THREE.MeshBasicMaterial({color:0x5aff6a,fog:false});
  const darkMat   = new THREE.MeshBasicMaterial({color:0x0d1a10,fog:false});
  const tongueMat = new THREE.MeshBasicMaterial({color:0xc4283a,fog:false});

  // ---- serpent lower body. A coil that sweeps out, curves around and rises back to the waist, each
  // segment stepping along the previous one's own direction so the run is continuous. The first segment
  // sits ON the ground; the old version's lowest coil floated 0.12 above it. ----
  { let cx=0, cz=0.10, cy=0.262, ang=0.0;   // 0.262 seats the lowest ventral plate exactly on y=0
    const segs=[{w:0.66,len:0.44},{w:0.64,len:0.42},{w:0.60,len:0.40},{w:0.56,len:0.38},
                {w:0.50,len:0.36},{w:0.44,len:0.34},{w:0.38,len:0.32},{w:0.30,len:0.30},{w:0.22,len:0.26}];
    segs.forEach((sg,i)=>{
      const dx=Math.sin(ang), dz=-Math.cos(ang);
      const h=sg.w*0.72;
      const m=new THREE.Mesh(new THREE.BoxGeometry(sg.w,h,sg.len), i%2?scaleMat2:scaleMat);
      m.position.set(cx+dx*sg.len/2, cy, cz+dz*sg.len/2); m.rotation.y=ang; g.add(m);
      // ventral scute plate along the underside of the coil
      const plate=new THREE.Mesh(new THREE.BoxGeometry(sg.w*0.5,h*0.30,sg.len*0.9), bellyMat);
      plate.position.set(cx+dx*sg.len/2, cy-h*0.40, cz+dz*sg.len/2); plate.rotation.y=ang; g.add(plate);
      cx+=dx*sg.len*0.88; cz+=dz*sg.len*0.88;    // 0.88 = segments overlap, never gap
      cy = 0.262 + i*0.055;                       // the coil climbs as it wraps
      ang += 0.62;                                // and curls round
    });
    // tail tip, finishing the coil
    const tip=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.14,0.22), scaleMat2); tip.position.set(cx,cy,cz); g.add(tip);
  }
  // waist mass bridging the coil up into the torso, so the two halves are physically joined
  const waist=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.42,0.46), scaleMat); waist.position.set(0,0.86,0.06); g.add(waist);
  const belt =new THREE.Mesh(new THREE.BoxGeometry(0.58,0.11,0.52), goldMat);  belt.position.set(0,1.06,0.06); g.add(belt);

  // ---- torso ----
  const torso  = new THREE.Mesh(new THREE.BoxGeometry(0.54,0.66,0.42), skinMat);  torso.position.set(0,1.44,0.08); g.add(torso);
  const bellyF = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.50,0.10), bellyMat); bellyF.position.set(0,1.40,0.30); g.add(bellyF);
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.10,0.40), goldMat);  collar.position.set(0,1.76,0.08); g.add(collar);
  // arms, held low and slightly out — she is a tank that closes, not a caster
  [-1,1].forEach(side=>{
    const shoulder=new THREE.Mesh(new THREE.BoxGeometry(0.20,0.22,0.26), skinMat); shoulder.position.set(side*0.34,1.62,0.08); g.add(shoulder);
    const upper=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.36,0.18), skinMat); upper.position.set(side*0.38,1.38,0.10); upper.rotation.z=side*-0.14; g.add(upper);
    const fore =new THREE.Mesh(new THREE.BoxGeometry(0.14,0.34,0.16), skinMat); fore.position.set(side*0.44,1.06,0.16); fore.rotation.z=side*-0.10; g.add(fore);
    const hand =new THREE.Mesh(new THREE.BoxGeometry(0.14,0.16,0.15), skinMat); hand.position.set(side*0.47,0.88,0.20); g.add(hand);
    [-1,0,1].forEach(t=>{ const claw=new THREE.Mesh(new THREE.ConeGeometry(0.028,0.11,4), fangMat);
      claw.position.set(side*0.47+t*0.045,0.78,0.24); claw.rotation.x=0.35; g.add(claw); });
    const bangle=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.06,0.19), goldMat); bangle.position.set(side*0.45,1.20,0.15); g.add(bangle);
  });

  // ---- head: a tapered skull, not a cube — wider cranium over a narrower jaw ----
  const neck    = new THREE.Mesh(new THREE.BoxGeometry(0.24,0.18,0.26), skinMat); neck.position.set(0,1.86,0.10); g.add(neck);
  const cranium = new THREE.Mesh(new THREE.BoxGeometry(0.40,0.30,0.38), skinMat); cranium.position.set(0,2.10,0.12); g.add(cranium);
  const jawBone = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.20,0.34), skinMat); jawBone.position.set(0,1.90,0.16); g.add(jawBone);
  const browRidge=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.07,0.13), scaleMat2); browRidge.position.set(0,2.20,0.28); browRidge.rotation.x=0.3; g.add(browRidge);
  const nose    = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.15,0.10), skinMat); nose.position.set(0,2.06,0.32); g.add(nose);
  [-1,1].forEach(side=>{
    const cheek=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.14,0.14), skinMat); cheek.position.set(side*0.19,2.02,0.24); g.add(cheek);
    const socket=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.11,0.03), darkMat); socket.position.set(side*0.10,2.12,0.30); g.add(socket);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.08,0.05), eyeMat); eye.position.set(side*0.10,2.12,0.33); g.add(eye);
    const pupil=new THREE.Mesh(new THREE.BoxGeometry(0.025,0.08,0.05), darkMat); pupil.position.set(side*0.10,2.12,0.36); g.add(pupil);
  });
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.05,0.06), darkMat); mouth.position.set(0,1.93,0.32); g.add(mouth);
  [-1,1].forEach(side=>{ const fang=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.15,0.03), fangMat); fang.position.set(side*0.08,1.86,0.33); g.add(fang); });
  // cobra hood flaring behind the head — a strong silhouette cue that also frames the snakes
  [-1,1].forEach(side=>{
    const hood=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.40,0.32), scaleMat2); hood.position.set(side*0.26,2.06,0.02); hood.rotation.y=side*0.5; g.add(hood);
    const rib =new THREE.Mesh(new THREE.BoxGeometry(0.05,0.30,0.06), scaleMat);  rib.position.set(side*0.29,2.06,0.10); rib.rotation.y=side*0.5; g.add(rib);
  });

  // ---- the snakes. Nine tendrils, each a 4-link chain rising off the scalp and curling in its own
  // direction, with a head on the end. Every link steps along the direction its own rotation produces
  // (see the note at the top of this function for why that matters), so no link can float free. ----
  for(let i=0;i<9;i++){
    const a = (i/9)*Math.PI*2;
    // Each snake lives in its own group turned by `a`, so INSIDE that group the tendril only ever tilts
    // about X. That keeps the orientation exact: composing a yaw with an x/z tilt as three XYZ Euler
    // terms is only an approximation, and it drifted far enough by the fourth link that the tip stopped
    // touching the link before it — which the connectivity check duly flagged.
    const sg = new THREE.Group(); sg.rotation.y = a; g.add(sg);
    const rootR = 0.15;
    let sy = 2.24, sz = rootR;      // local: the snake rises from the scalp at radius rootR, along +Z
    let lean = 0.34 + ((i*0.17) % 0.30);          // its own starting rake
    const curl = 0.26 + ((i*0.11) % 0.24);        // and its own curl rate, so they aren't a uniform rosette
    const links=[{len:0.21,w:0.095},{len:0.19,w:0.082},{len:0.17,w:0.070},{len:0.15,w:0.060}];
    links.forEach((lk,k)=>{
      const dy=Math.cos(lean), dz=Math.sin(lean);
      const m=new THREE.Mesh(new THREE.BoxGeometry(lk.w,lk.len,lk.w), k%2?snakeMat2:snakeMat);
      m.position.set(0, sy+dy*lk.len/2, sz+dz*lk.len/2);
      m.rotation.x = -lean;         // a box whose length is +Y, tilted toward +Z, is rotation.x = -lean
      sg.add(m);
      sy+=dy*lk.len*0.82; sz+=dz*lk.len*0.82;     // 0.82 = links overlap generously, never gap
      lean += curl;                                // and the tendril curls over as it rises
    });
    // snake head on the tip, with eyes; every third one flicks a forked tongue
    const hd=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.11,0.18), snakeMat); hd.position.set(0,sy,sz+0.03); sg.add(hd);
    const snout=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.075,0.10), snakeMat2); snout.position.set(0,sy-0.01,sz+0.15); sg.add(snout);
    [-1,1].forEach(side=>{
      const se=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.035,0.03), eyeMat);
      se.position.set(side*0.05, sy+0.035, sz+0.10); sg.add(se);
    });
    if(i%3===0){
      const tongue=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.11), tongueMat);
      tongue.position.set(0, sy-0.02, sz+0.23); sg.add(tongue);
      [-1,1].forEach(side=>{ const fork=new THREE.Mesh(new THREE.BoxGeometry(0.018,0.018,0.05), tongueMat);
        fork.position.set(side*0.018, sy-0.02, sz+0.30); fork.rotation.y=side*0.45; sg.add(fork); });
    }
  }

  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 2.9, 0); marker.scale.set(1.1,1.1,1.1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}


// war hound (single unit): a monstrous armored guard-dog, not a person in armor — low, muscular
// quadruped body, bared fangs, glowing eyes, studded bronze war-gear (collar + spine plates) instead
// of held weapons. The shared AI loop turns bots with mesh.lookAt(), which — for a plain Object3D (not
// a camera) — points local +Z at the target, so this is built facing +Z directly with no flip, same as
// griffin/medusa (minotaur is the one exception: it bypasses lookAt() and sets rotation.y directly,
// which needs the opposite convention, hence its own flip). Only ever used as a building block for the
// pack below — never spawned alone.
function makeWarHoundUnit(){
  const g = new THREE.Group();
  const body = g;
  const furMat = voxMat(0x201d19,{noise:16});
  const furMat2 = voxMat(0x4a453d,{noise:14});
  const bronzeMat = metalMatP(0xad8730,85,0xfff2c8);
  const fangMat = new THREE.MeshLambertMaterial({color:0xe8e4d4});
  const eyeMat = new THREE.MeshBasicMaterial({color:0xff3a1a,fog:false});

  const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.85), furMat); bodyBox.position.set(0,0.58,0); body.add(bodyBox);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.3,0.3), furMat2); chest.position.set(0,0.55,0.42); body.add(chest);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.28,0.32), furMat); head.position.set(0,0.78,0.62); body.add(head);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.24), furMat2); snout.position.set(0,0.68,0.85); body.add(snout);
  [-1,1].forEach(side=>{
    const fang=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.1,4), fangMat); fang.position.set(side*0.08,0.6,0.94); fang.rotation.x=Math.PI; body.add(fang);
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.2,4), furMat); ear.position.set(side*0.13,0.98,0.55); ear.rotation.z=side*0.25; body.add(ear);
    const eye=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.05,0.04), eyeMat); eye.position.set(side*0.1,0.82,0.78); body.add(eye);
  });
  // spiked bronze war-collar + armored spine plates — the studded military gear that reads as "Roman" at a glance
  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.12,0.34), bronzeMat); collar.position.set(0,0.68,0.42); body.add(collar);
  for(let i=0;i<3;i++){ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.1,4), bronzeMat); spike.position.set(-0.12+i*0.12,0.76,0.42); body.add(spike); }
  for(let i=0;i<3;i++){ const plate=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.08,0.14), bronzeMat); plate.position.set(0,0.82,0.1-i*0.24); body.add(plate); }
  [[-0.16,0.28],[0.16,0.28],[-0.16,-0.3],[0.16,-0.3]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.4,0.14),furMat); leg.position.set(lx,0.24,lz); body.add(leg);
    const paw=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.1,0.18), furMat2); paw.position.set(lx,0.06,lz); body.add(paw);
  });
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.4),furMat); tail.position.set(0,0.62,-0.55); tail.rotation.x=0.5; body.add(tail);
  return g;
}
// war hound pack: 3 hound units in one formation, sharing a single hitbox/HP/AI — same "one pack entity"
// mechanic as the pyramid era's scarab swarm. Spawned once per Roman wave instead of looped into the
// regular roster (see spawnWave), so hounds read as a themed pack encounter, not filler grunts.
function makeWarHoundPack(){
  const g = new THREE.Group();
  const formation = [ {x:-0.55, z:0.18, ry:-0.3, s:1.0}, {x:0.5, z:0.05, ry:0.35, s:0.95}, {x:0.0, z:-0.4, ry:0.05, s:1.05} ];
  formation.forEach(f=>{
    const unit = makeWarHoundUnit();
    unit.position.set(f.x,0,f.z); unit.rotation.y=f.ry; unit.scale.setScalar(f.s);
    g.add(unit);
  });
  g.userData.bodyMeshes = [];
  g.traverse(o=>{ if(o.isMesh) g.userData.bodyMeshes.push(o); });
  const marker = new THREE.Sprite(new THREE.SpriteMaterial({map:enemyMarkerTex(), depthTest:false, depthWrite:false, transparent:true, fog:false}));
  marker.position.set(0, 1.35, 0); marker.scale.set(1,1,1); marker.renderOrder = 9999;
  marker.raycast = function(){};
  g.add(marker); g.userData.marker = marker;
  return g;
}

// manticore: lion body + bat wings + a scorpion tail — the Roman era's melee monster. Distinct from the
// Greek griffin (feathered eagle head/wings) and the pyramid scorpion (ground stalker) it borrows
// silhouette ideas from — leathery bat wings instead of feathers, a lion face instead of a beak.
function makeManticore(){
  const g = new THREE.Group();
  // lookAt() points a plain Object3D's local +Z at the target, so this is built facing +Z directly,
  // same as griffin/medusa/warhound (see the note on makeWarHoundUnit for why minotaur alone differs)
  const body = g;
  const furMat = voxMat(0xc9863a,{noise:10});    // warm golden-tawny lion fur, not reptile-red
  const furMat2 = voxMat(0x9a622a,{noise:9});
  const maneMat = voxMat(0x5a3216,{noise:8});    // deep russet mane — lower noise so the cubes read clean/chunky, not fuzzy
