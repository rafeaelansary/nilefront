function onAllDead(){
  if(gameWon || !gameStarted || pending) return;
  if(bossActive){
    // boss defeated
    bossActive=false; showBossBar(false);
    // used to set gameWon=true + exitDungeon() here and just show "YOU WIN" — but gameWon disables firing
    // entirely and turns the next pointer-lock click into a full restart, so there was nowhere to actually
    // go afterward. Each mid-campaign boss falling leads into the next era's map instead (playable, not
    // "game over"); only the actual final boss (currently the Ifrit King) ends the run.
    if(bossNum===2){
      // Hydra down → cross into the Roman frontier (wave 7)
      enterRomanWorld('🏆 The Hydra falls! The Roman frontier awaits…');
      currentEra=2; waveIdx=ERA_START_WAVE[2]; pending='wave'; betweenTimer=2.4;
      return;
    }
    if(bossNum===3){
      // Colosseum Champion down → cross into Mamluk Cairo (wave 10) — this used to just set gameWon and
      // strand the player in the empty Colosseum arena with nowhere to go; that was the reported bug.
      enterIslamicWorld('🏆 The Champion falls! The gates of Cairo open…');
      currentEra=3; waveIdx=ERA_START_WAVE[3]; pending='wave'; betweenTimer=2.4;
      return;
    }
    if(bossNum>=4){
      // Ifrit King down → the campaign's final boss; victory. gameWon disables firing and turns the next
      // pointer-lock click into a fresh run (the intended "you beat it" end state).
      gameWon=true;
      // drain any fire meteor still mid-telegraph so a killing blow landed just before impact can't fire
      // damagePlayer() into the win screen (the !gameWon guard above covers it too, but this also stops the
      // stray visual/audio and any respawnPlayer() fallout from a hit that lands after gameWon flips)
      for(const m of fireMeteors) scene.remove(m.grp);
      fireMeteors.length = 0;
      setBanner('🏆 THE IFRIT KING FALLS — you have conquered Cairo! 🕌');
      return;
    }
    exitDungeon();
    const enteringGreekEra = pyramidPhase; // about to flip below — capture it now for the banner text
    if(pyramidPhase){ pyramidPhase=false; switchToGreekWorld(); switchToGreekLoadout(); currentEra=1; }
    waveIdx++; pending='wave'; betweenTimer=2.6;
    setBanner(enteringGreekEra ? 'Boss down! Now entering the Greek period…' : 'Boss down! Back to the surface…');
    return;
  }
  if(inNileArea){
    // Nile Wave cleared — return to the pyramid map/loadout and continue straight on to wave 3
    exitNileWave();
    waveIdx++; pending='wave'; betweenTimer=2.5; setBanner('WAVE '+(waveIdx+1)+' incoming…');
    return;
  }
  // a normal wave was cleared: a boss follows wave 3 (idx 2), wave 6 (idx 5), wave 9 (idx 8 — the last
  // Roman wave) and wave 12 (idx 11 — the last Islamic wave, triggering the Ifrit King); the Nile Wave
  // follows wave 2 (idx 1)
  if(waveIdx===2 || waveIdx===5 || waveIdx===8 || waveIdx===11){ pending='boss'; betweenTimer=2.2;
    setBanner(waveIdx===5?'The Lernaean Hydra rises from the marsh…':waveIdx===8?'The Champion of the arena strides forth…':waveIdx===11?'The Ifrit King rises from the flame…':'A boss awaits below…'); }
  else if(waveIdx===1 && pyramidPhase){ pending='nile'; betweenTimer=2.2; setBanner('The Nile stirs…'); }
  else { waveIdx++; pending='wave'; betweenTimer=2.5; setBanner('WAVE '+(waveIdx+1)+' incoming…'); }
}
function updateWaves(dt){
  if(pending){
    betweenTimer -= dt;
    if(betweenTimer <= 0){
      if(pending==='wave'){ spawnWave(waveIdx); setBanner('WAVE '+(waveIdx+1)); setTimeout(()=>{ if(!gameWon) setBanner(''); },1200); }
      else if(pending==='boss'){ spawnBossFight(); }
      else if(pending==='nile'){ enterNileWave(); }
      pending=null;
    }
  } else if(gameStarted && !gameWon && bots.length>0 && bots.filter(b=>b.alive).length===0){
    onAllDead();
  }
}

// tracer pool (thin glowing beams from muzzle to impact)
const tracers = [];
for(let i=0;i<24;i++){
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,1),
    new THREE.MeshBasicMaterial({color:0xffe08a, transparent:true, opacity:0, fog:false}));
  m.visible=false; m.userData.isTracer=true; scene.add(m);
  tracers.push({mesh:m, life:0});
}
let tracerIdx=0;
function spawnTracer(from,to,color){
  const tr = tracers[tracerIdx=(tracerIdx+1)%tracers.length];
  const m = tr.mesh; m.material.color.set(color);
  const mid = from.clone().add(to).multiplyScalar(0.5);
  const len = from.distanceTo(to);
  m.position.copy(mid);
  m.scale.set(1,1,Math.max(0.1,len));
  m.lookAt(to);
  m.visible=true; m.material.opacity=0.9; tr.life=0.08;
}

// raycast helper: first solid/bot hit, ignoring gun, sky, tracers, muzzle, and dead bots
const _ray = new THREE.Raycaster();
function firstHit(origin, dir, maxDist, ignoreGroup){
  _ray.set(origin, dir); _ray.far = maxDist||300;
  const hits = _ray.intersectObjects(scene.children, true);
  for(const h of hits){
    let o=h.object;
    if(o===sky || o===muzzle || o.userData.isTracer || o.isSprite) continue;
    if(o===grenadeArcLine || o===grenadeFill || o===grenadeRing) continue;
    // ignore gun viewmodel (descendant of camera) + the shooter's own group
    let p=o, underCam=false, botGroup=null, ignored=false;
    while(p){ if(p===camera) underCam=true; if(p===ignoreGroup) ignored=true; if(p.userData && p.userData.isBot) botGroup=p; p=p.parent; }
    if(underCam || ignored) continue;
    if(botGroup){ if(!botGroup.userData.data.alive) continue; return {point:h.point, dist:h.distance, bot:botGroup.userData.data}; }
    return {point:h.point, dist:h.distance, bot:null};
  }
  return null;
}
function setBotEmissive(bd, hex){
  const c = new THREE.Color(hex);
  bd.mesh.userData.bodyMeshes.forEach(m=>{
    const mats = Array.isArray(m.material)?m.material:[m.material];
    mats.forEach(mat=>{ if(mat && mat.emissive) mat.emissive.copy(c); });
  });
}

// ===================== SOUND (Web Audio, synthesized — no files) =====================
const SFX = (function(){
  const AC = window.AudioContext || window.webkitAudioContext;
  let actx=null, master=null, noiseBuf=null, delayBus=null;
  function makeDistCurve(amount){
    const n=1024, curve=new Float32Array(n), deg=Math.PI/180;
    for(let i=0;i<n;i++){ const x=i*2/n-1; curve[i]=(3+amount)*x*20*deg/(Math.PI+amount*Math.abs(x)); }
    return curve;
  }
  function init(){
    if(actx) { if(actx.state==='suspended') actx.resume(); return; }
    try{ actx=new AC(); }catch(e){ return; }
    master=actx.createGain(); master.gain.value=0.55; master.connect(actx.destination);
    const len=Math.floor(actx.sampleRate*0.5); noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    // shared short slap-delay bus so a few sounds (ray gun, boss, death) get a bit of space/weight
    const dly=actx.createDelay(); dly.delayTime.value=0.14;
    const fb=actx.createGain(); fb.gain.value=0.28;
    const dfilt=actx.createBiquadFilter(); dfilt.type='lowpass'; dfilt.frequency.value=2200;
    dly.connect(fb).connect(dfilt).connect(dly);
    const wet=actx.createGain(); wet.gain.value=0.55;
    dly.connect(wet).connect(master);
    delayBus = dly;
  }
  function env(g,t0,peak,dur,attack){ g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(peak,t0+(attack||0.003)); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); }
  // noise burst with an optional filter-frequency sweep for realistic crack/hiss motion
  function noise(t0,dur,type,freq,peak,q,freqEnd,send){
    const s=actx.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=1;
    const f=actx.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t0); if(q)f.Q.value=q;
    if(freqEnd!=null) f.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd),t0+dur);
    const g=actx.createGain(); env(g,t0,peak,dur);
    s.connect(f).connect(g).connect(master);
    if(send && delayBus) g.connect(delayBus);
    s.start(t0); s.stop(t0+dur+0.02);
  }
  // tone with optional soft-clip drive and a second slightly-detuned unison voice for body/thickness
  function tone(t0,dur,type,f0,f1,peak,{drive=0,detune=0,send=false,attack}={}){
    const o=actx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t0);
    if(f1!=null) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    const g=actx.createGain(); env(g,t0,peak,dur,attack);
    let out=o;
    if(drive>0){ const ws=actx.createWaveShaper(); ws.curve=makeDistCurve(drive); ws.oversample='2x'; o.connect(ws); out=ws; }
    out.connect(g).connect(master);
    if(send && delayBus) g.connect(delayBus);
    o.start(t0); o.stop(t0+dur+0.02);
    if(detune){
      const o2=actx.createOscillator(); o2.type=type; o2.detune.value=detune; o2.frequency.setValueAtTime(f0,t0);
      if(f1!=null) o2.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
      const g2=actx.createGain(); env(g2,t0,peak*0.6,dur,attack);
      o2.connect(g2).connect(master); o2.start(t0); o2.stop(t0+dur+0.02);
    }
    return o;
  }
  // quick sub-bass thump for weight under gunshots
  function thump(t0,dur,f0,f1,peak){
    const o=actx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    const g=actx.createGain(); env(g,t0,peak,dur,0.001);
    o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.02);
  }
  // FM "zap" — a modulator oscillator drives the carrier's frequency for a sci-fi timbre
  function fmZap(t0,dur,fCarrier0,fCarrier1,fMod,modDepth,peak,send){
    const car=actx.createOscillator(); car.type='sine'; car.frequency.setValueAtTime(fCarrier0,t0); car.frequency.exponentialRampToValueAtTime(Math.max(1,fCarrier1),t0+dur);
    const mod=actx.createOscillator(); mod.type='sine'; mod.frequency.value=fMod;
    const modGain=actx.createGain(); modGain.gain.setValueAtTime(modDepth,t0); modGain.gain.exponentialRampToValueAtTime(1,t0+dur);
    mod.connect(modGain).connect(car.frequency);
    const g=actx.createGain(); env(g,t0,peak,dur,0.002);
    car.connect(g).connect(master); if(send && delayBus) g.connect(delayBus);
    car.start(t0); mod.start(t0); car.stop(t0+dur+0.02); mod.stop(t0+dur+0.02);
  }
  return {
    init,
    // ---- PLAYER weapons: layered body+crack+sub-thump, bright and punchy up front ----
    playerSniper(){ if(!actx)return; const t=actx.currentTime;
      tone(t,0.22,'sawtooth',180,55,0.4,{drive:18});
      noise(t,0.08,'highpass',2600,0.34,0.8,7000);
      thump(t,0.22,110,30,0.32);
    },
    playerGrenade(){ if(!actx)return; const t=actx.currentTime;
      tone(t,0.14,'square',180,90,0.28,{drive:6});
      noise(t,0.12,'lowpass',900,0.3,0.7);
      thump(t,0.16,110,35,0.26);
    },
    explosion(){ if(!actx)return; const t=actx.currentTime;
      noise(t,0.5,'lowpass',1400,0.5,0.6,120,true);
      tone(t,0.35,'sawtooth',140,35,0.32,{drive:12,send:true});
      thump(t,0.4,90,25,0.34);
    },
    playerRifle(){ if(!actx)return; const t=actx.currentTime;
      tone(t,0.07,'sawtooth',320,110,0.26,{drive:14,detune:7});
      noise(t,0.05,'bandpass',2400,0.32,1.4,900);
      thump(t,0.06,130,40,0.16);
    },
    playerRay(){ if(!actx)return; const t=actx.currentTime;
      fmZap(t,0.32,1500,220,340,420,0.34,true);
      tone(t,0.3,'sine',1900,320,0.12,{send:true});
      noise(t,0.1,'highpass',3200,0.12,0.8);
    },
    playerZahra(){ if(!actx)return; const t=actx.currentTime;
      fmZap(t,0.4,2200,180,520,480,0.45,true);
      tone(t,0.5,'sawtooth',260,60,0.4,{drive:16,send:true});
      noise(t,0.18,'lowpass',1600,0.4,0.7,140);
      thump(t,0.3,120,32,0.36);
    },
    dryFire(){ if(!actx)return; const t=actx.currentTime;
      tone(t,0.04,'square',900,700,0.12,{});
    },
    reload(){ if(!actx)return; const t=actx.currentTime;
      tone(t,0.05,'square',500,380,0.16,{});
      tone(t+0.12,0.05,'square',420,300,0.16,{});
    },
    // ---- ENEMY guns: duller, quieter, distance-attenuated so they never sound like yours ----
    enemyShot(dist){ if(!actx)return; const t=actx.currentTime; const v=Math.max(0.05, 0.6*(1-Math.min(dist,34)/34));
      tone(t,0.11,'triangle',210,65,0.2*v,{});
      noise(t,0.1,'lowpass',480,0.42*v,0.6,220);
    },
    knife(dist){ if(!actx)return; const t=actx.currentTime; const v=Math.max(0.1,1-Math.min(dist,6)/6);
      noise(t,0.1,'bandpass',3400,0.22*v,2.2,1200);
      noise(t+0.05,0.08,'highpass',5200,0.14*v,3);
    },
    // ---- feedback ----
    hitmark(){ if(!actx)return; const t=actx.currentTime; tone(t,0.045,'square',1700,1150,0.16,{attack:0.001}); tone(t+0.045,0.05,'square',1500,1000,0.13,{attack:0.001}); },
    hurt(){    if(!actx)return; const t=actx.currentTime; tone(t,0.22,'sawtooth',260,90,0.22,{drive:6}); noise(t,0.12,'lowpass',650,0.18,0.7); },
    death(){   if(!actx)return; const t=actx.currentTime; tone(t,0.35,'sawtooth',280,55,0.2,{detune:12,send:true}); noise(t,0.2,'lowpass',900,0.12,0.5,150); },
    boss(){    if(!actx)return; const t=actx.currentTime;
      tone(t,0.9,'sawtooth',110,36,0.3,{drive:10,detune:14,send:true});
      tone(t,0.9,'square',58,26,0.18,{send:true});
      noise(t,0.5,'lowpass',300,0.16,0.6,90);
    }
  };
})();

// muzzle flash + recoil + hitscan
let muzzleTimer = 0;
let lastShot = -99;
const _fwd = new THREE.Vector3();
function fire(){
  if(!player.alive) return;
  const w = weapons[currentWeapon].userData;
  const now = performance.now()*0.001;
  if(now - lastShot < w.fireRate) return;
  if(w.melee){
    // khopesh: a short-range swing — same raycast every hitscan weapon uses, just a very short max distance and no ammo/reload
    lastShot = now;
    SFX.knife(1.5);
    gunGroup.position.z = gunBaseZ + w.recoil;
    gunGroup.rotation.x -= 0.16; // swing kick — every weapon gets a visible kick now, not just the position punch
    camera.getWorldDirection(_fwd);
    const hit = firstHit(camera.position, _fwd, w.range||2.4);
    if(hit && hit.bot){ damageBot(hit.bot, w.damage, hit.point); showHitmarker(); SFX.hitmark(); }
    return;
  }
  if(w.reloading) return;
  if(w.ammo<=0){ lastShot = now; SFX.dryFire(); return; }
  lastShot = now;
  w.ammo--; setAmmoHUD();
  if(w.slingAnim){ w.pullT = 1; w.animT = 0; } // (re)triggers the draw/release cycle in animate()
  // distinct player weapon sound
  if(w.name==='Sniper') SFX.playerSniper();
  else if(w.name==='Rifle') SFX.playerRifle();
  else if(w.name==='Ray Gun') SFX.playerRay();
  else if(w.name==='Zahra Gun') SFX.playerZahra();
  else if(w.name==='Was Scepter') SFX.playerRay();
  else if(w.name==='Bow') SFX.playerRifle();
  else if(w.name==='Harpoon') SFX.playerSniper();
  else if(w.name==='Sling') SFX.playerRifle();
  else if(w.name==='Trident') SFX.playerSniper();
  else SFX.playerGrenade();
  // recoil + flash
  gunGroup.position.z = gunBaseZ + w.recoil;
  gunGroup.rotation.x -= 0.05 + w.recoil*0.3; // muzzle-rise kick — scales with each weapon's own recoil strength
  muzzle.visible = true; muzzle.material.opacity = 0.95;
  muzzle.material.color.set(w.glow ? 0x5ad6ff : (w.grenade?0xffb347:0xffe08a));
  muzzle.scale.setScalar(w.glow ? 1.3 : 1.0);
  muzzle.rotation.z = (performance.now()%2>1)?0.6:0;
  muzzleTimer = 0.05;
  // shot direction from camera center + small spread
  camera.getWorldDirection(_fwd);
  if(w.spread){ _fwd.x += (Math.sin(now*97.1)%1)*w.spread; _fwd.y += (Math.sin(now*57.7)%1)*w.spread; _fwd.normalize(); }
  const origin = camera.position.clone();
  const hit = firstHit(origin, _fwd, 300);
  const mw = new THREE.Vector3(); muzzle.getWorldPosition(mw);
  const end = hit ? hit.point : origin.clone().addScaledVector(_fwd, 120);
  if(w.grenade){
    launchGrenade(mw, end);
    return;
  }
  spawnTracer(mw, end, w.tracer);
  if(hit && hit.bot){
    damageBot(hit.bot, w.damage, hit.point);
    showHitmarker(); SFX.hitmark();
  }
}

// ---- grenade landing preview: dashed arc from muzzle to aim point + a ring on the ground showing splash radius ----
const GRENADE_ARC_SEGMENTS = 24;
const grenadeArcGeom = new THREE.BufferGeometry().setAttribute('position',
  new THREE.BufferAttribute(new Float32Array((GRENADE_ARC_SEGMENTS+1)*3), 3));
const grenadeArcLine = new THREE.Line(grenadeArcGeom,
  new THREE.LineDashedMaterial({color:0xffb347, dashSize:0.25, gapSize:0.18, transparent:true, opacity:0.85}));
grenadeArcLine.visible = false; grenadeArcLine.frustumCulled = false;
scene.add(grenadeArcLine);
const grenadeFill = new THREE.Mesh(new THREE.CircleGeometry(1, 48),
  new THREE.MeshBasicMaterial({color:0xff2222, transparent:true, opacity:0.6, depthWrite:false}));
grenadeFill.rotation.x = -Math.PI/2; grenadeFill.visible = false; grenadeFill.renderOrder = 10;
scene.add(grenadeFill);
const grenadeRing = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 48),
  new THREE.MeshBasicMaterial({color:0xff2222, transparent:true, opacity:0.95, side:THREE.DoubleSide, depthWrite:false}));
grenadeRing.rotation.x = -Math.PI/2; grenadeRing.visible = false; grenadeRing.renderOrder = 11;
scene.add(grenadeRing);
const GRENADE_RING_SCALE = 0.55; // draw smaller than the actual splash radius so it reads as a tight target reticle
function updateGrenadePreview(){
  const w = weapons[currentWeapon].userData;
  // must be a real boolean, not just a truthy/falsy value: weapons without a `grenade` key at all leave
  // w.grenade as undefined, and Three.js's internal visibility check is a strict `object.visible === false`
  // — undefined fails that check, so the red landing reticle never actually got hidden after switching to
  // any non-grenade weapon (only ever exercised in real play once a grenade weapon became reachable in the
  // Greek loadout)
  const show = !!(player.alive && w.grenade && !w.reloading && document.pointerLockElement===renderer.domElement);
  grenadeArcLine.visible = grenadeFill.visible = grenadeRing.visible = show;
  if(!show) return;
  camera.getWorldDirection(_fwd);
  const origin = camera.position.clone();
  const hit = firstHit(origin, _fwd, 300);
  const end = hit ? hit.point : origin.clone().addScaledVector(_fwd, 120);
  const from = new THREE.Vector3(); muzzle.getWorldPosition(from);
  const dist = from.distanceTo(end);
  const pos = grenadeArcGeom.attributes.position.array;
  for(let i=0;i<=GRENADE_ARC_SEGMENTS;i++){
    const s = i/GRENADE_ARC_SEGMENTS;
    pos[i*3]   = from.x + (end.x-from.x)*s;
    pos[i*3+1] = from.y + (end.y-from.y)*s + Math.sin(s*Math.PI)*dist*0.14;
    pos[i*3+2] = from.z + (end.z-from.z)*s;
  }
  grenadeArcGeom.attributes.position.needsUpdate = true;
  grenadeArcGeom.computeBoundingSphere();
  grenadeArcLine.computeLineDistances();
  grenadeFill.position.set(end.x, end.y+0.03, end.z);
  grenadeRing.position.set(end.x, end.y+0.04, end.z);
  grenadeFill.scale.setScalar(w.splashRadius * GRENADE_RING_SCALE);
  grenadeRing.scale.setScalar(w.splashRadius * GRENADE_RING_SCALE);
}

const grenades = [];
function launchGrenade(from, to){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.14,0.14),
    new THREE.MeshLambertMaterial({color:0x3a4a2a, emissive:0x1a2a10}));
  mesh.position.copy(from); scene.add(mesh);
  grenades.push({mesh, from:from.clone(), to:to.clone(), t:0, dur:0.35});
}
const explosions = [];
function explodeAt(point){
  SFX.explosion();
  const w = weapons.find(wp=>wp.userData.grenade).userData;
  bots.forEach(b=>{
    if(!b.alive) return;
    const d = b.mesh.position.distanceTo(point);
    if(d <= w.splashRadius){ damageBot(b, w.splashDamage * (1 - d/w.splashRadius*0.6), point); }
  });
  // visual fireball: expanding orange sphere + brief light + smoke puff, all faded via a shared pool
  const fMat = new THREE.MeshBasicMaterial({color:0xffa020, transparent:true, opacity:0.95, fog:false});
  const fireball = new THREE.Mesh(new THREE.SphereGeometry(0.4,8,6), fMat);
  fireball.position.copy(point); scene.add(fireball);
  const light = new THREE.PointLight(0xff8a2a, 3.2, 12); light.position.copy(point); scene.add(light);
  explosions.push({mesh:fireball, light, t:0, dur:0.4});
}
// colossus quake: the ground actually splits and breaks apart, not just a dust puff — thin cracks snap
// outward from the epicenter (grown via a pivot group anchored at the center, so each crack stays rooted
// there while extending, rather than scaling symmetrically from its own middle) and loose rubble chunks pop
// up and tumble back down under simple gravity
const quakeEffects = [];
function spawnQuakeEffect(x,z){
  const grp = new THREE.Group(); grp.position.set(x,0.06,z); scene.add(grp);
  const crackMat = new THREE.MeshBasicMaterial({color:0x2a1c10, transparent:true, opacity:1, fog:false});
  const cracks = [];
  const crackCount = 7;
  for(let i=0;i<crackCount;i++){
    const a = (i/crackCount)*Math.PI*2 + Math.random()*0.4;
    const len = 2.4 + Math.random()*2.2;
    const pivot = new THREE.Group(); pivot.rotation.y = -a; grp.add(pivot);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.1+Math.random()*0.08, 0.05, len), crackMat);
    mesh.position.z = len/2; pivot.add(mesh);
    cracks.push(pivot);
  }
  const debris = [];
  const debrisMat = new THREE.MeshLambertMaterial({map:makeVoxelTexture(0xb99a63,{noise:20})});
  for(let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*2.2, s = 0.14+Math.random()*0.18;
    const chunk = new THREE.Mesh(new THREE.BoxGeometry(s,s,s), debrisMat);
    chunk.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    grp.add(chunk);
    debris.push({mesh:chunk, vy:2.5+Math.random()*2.5, vx:Math.cos(a)*(0.6+Math.random()*0.8), vz:Math.sin(a)*(0.6+Math.random()*0.8),
      rx:(Math.random()-0.5)*8, rz:(Math.random()-0.5)*8});
  }
  const dustMat = new THREE.MeshBasicMaterial({color:0xcbb27a, transparent:true, opacity:0.7, fog:false});
  const dust = new THREE.Mesh(new THREE.RingGeometry(0.3,0.6,16), dustMat);
  dust.rotation.x = -Math.PI/2; dust.position.y = 0.08; grp.add(dust);
  const light = new THREE.PointLight(0xd8b982, 2.4, 14); light.position.y = 1; grp.add(light);
  quakeEffects.push({grp, cracks, debris, dustMat, dust, light, t:0, dur:1.1});
}
// Ifrit King fire meteor: a telegraph ring grows/pulses at the target point for `impactAt` seconds (the
// player's real dodge window), then a burst deals AOE damage if they're still standing in it. Modeled on
// spawnQuakeEffect()'s timed-array-of-effects pattern.
const fireMeteors = [];
function spawnFireMeteor(x,z){
  const grp = new THREE.Group(); grp.position.set(x,0.05,z); scene.add(grp);
  const ringMat = new THREE.MeshBasicMaterial({color:0xff4a1a, transparent:true, opacity:0.85, fog:false, side:THREE.DoubleSide});
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.6,2.0,20), ringMat); ring.rotation.x=-Math.PI/2; grp.add(ring);
  const fillMat = new THREE.MeshBasicMaterial({color:0xff8a2a, transparent:true, opacity:0.3, fog:false, side:THREE.DoubleSide});
  const fill = new THREE.Mesh(new THREE.CircleGeometry(2.0,20), fillMat); fill.rotation.x=-Math.PI/2; fill.position.y=0.01; grp.add(fill);
  fireMeteors.push({grp, ring, ringMat, fillMat, x, z, t:0, impactAt:0.9, dur:1.5, impacted:false});
}
function damageBot(bd, dmg, point){
  if(!bd.alive) return;
  if(bd.skin==='minotaur'){
    // the lowered horned head: damage from within its facing arc is reduced (not nearly blocked) —
    // flanking or hitting it from behind while its slow turn rate hasn't caught up still hits full damage,
    // but frontal hits aren't supposed to feel like shooting a brick wall
    const dx=camera.position.x-bd.mesh.position.x, dz=camera.position.z-bd.mesh.position.z;
    let da = Math.atan2(-dx,-dz) - bd.facing;
    da = ((da+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2) - Math.PI;
    if(Math.abs(da) < 1.15) dmg *= 0.5;
  }
  bd.hp -= dmg; bd.flash = 0.12;
  if(bd.boss) setBossBar(bd);
  if(bd.hp <= 0){
    bd.alive = false; bd.mesh.visible = false;
    player.score += bd.boss ? 10 : 1;
    setHUD(); setEnemyCount(bossActive?'☠':undefined); SFX.death();
  }
}
function damagePlayer(dmg){
  if(!player.alive) return;
  player.hp -= dmg; player.lastHit = performance.now()*0.001; showDamage(); setHUD(); SFX.hurt();
  if(player.hp <= 0){
    player.alive = false; player.respawn = 2.5;
    setBanner('YOU DIED — respawning…'); setScope(false);
  }
}
function respawnPlayer(){
  player.hp = player.maxHp; player.alive = true; player.lastHit=-99;
  // dying always rolls progress back to the START OF THE CURRENT ERA, with that wave's enemies freshly
  // respawned — never back into an earlier era (e.g. dying in a later era must not send you back to the
  // Egyptian/pyramid one). No continuing a wave (or a boss fight) from where you died, either.
  pending = null; bossActive = false; showBossBar(false);
  if(inNileArea){ // clean up a mid-Nile-Wave death: same restore steps as exitNileWave()
    inNileArea=false; scene.remove(nileWorld);
    weapons.forEach(w=>w.visible=false); weapons=weaponsBeforeNile||weapons; selectWeapon(currentWeaponBeforeNile||0);
  }
  bossNum = currentEra; // keep credit for any boss(es) already defeated in earlier eras
  // exitDungeon() only knows the pyramid/greek pairing (dungeonWasPyramid) — there's no Roman/Islamic
  // dungeon, so eras 2 and 3 each get their own reset here instead of routing through that
  if(currentEra >= 3) enterIslamicWorld('💀 back to Wave 10');
  else if(currentEra >= 2) enterRomanWorld('💀 back to Wave 7');
  else exitDungeon();
  waveIdx = ERA_START_WAVE[currentEra];
  clearBots(); spawnWave(waveIdx);
  if(currentEra < 2){ setBanner('💀 back to Wave '+(waveIdx+1)); setTimeout(()=>{ if(!gameWon) setBanner(''); },1500); }
  const sp = pickSpawnPoint();
  camera.position.copy(sp); playerHeight=0; stuckTimer=0;
  yaw=0; pitch=0; targetYaw=0; targetPitch=0; vel.set(0,0,0);
  weapons.forEach(wp=>{ wp.userData.ammo=wp.userData.magSize; wp.userData.reloading=false; wp.userData.reloadT=0; });
  setAmmoHUD();
  setHUD();
}

// input: press to fire; hold for auto weapons
let firing = false;
document.addEventListener('mousedown', e => { if(paused || e.button!==0) return; if(document.pointerLockElement===renderer.domElement){ firing=true; fire(); } });
document.addEventListener('mouseup', () => { firing=false; });
setHUD();

// ---- enable shadow casting/receiving on all solid geometry (skip sky + distant skyline + transparent puffs) ----
scene.traverse(obj => {
  if (!obj.isMesh) return;
  if (obj === sky) return;
  const mat = obj.material;
  const transparent = mat && !Array.isArray(mat) && mat.transparent;
  obj.castShadow = !transparent && !obj.userData.noShadow; // tiny lawn detail (flowers/tufts) skip shadow casting — cheap perf win
  obj.receiveShadow = true;
});
ground.receiveShadow = true;
ground.castShadow = false;

// ---- guarantee every sniper-tower ramp corridor stays walkable, even if a decorative prop's
// collider (bush/fence/plaza/etc, added independently) happens to land on top of it ----
(function clearRampCorridors(){
  const PAD=0.7; // covers the player's collision radius (0.45) reaching past a corridor's nominal edge
  const zones = [
    {x1:26-(2.25+6*1.7)-PAD,   x2:26-2.25+PAD, z1:-2-1.0-PAD,  z2:-2+1.0+PAD},          // tower1 (26,-2,w,h6)
    {x1:20-(2.25+7*1.7)-PAD,   x2:20-2.25+PAD, z1:20-1.0-PAD,  z2:20+1.0+PAD},          // tower2 (20,20,w,h7)
    {x1:-6-1.0-PAD, x2:-6+1.0+PAD, z1:-19+2-PAD,               z2:-19+2+5.5*1.7+PAD}    // tower3 (-6,-19,s,h5.5)
  ];
  function overlaps(c,z){ return !(c.x2<z.x1||c.x1>z.x2||c.z2<z.z1||c.z1>z.z2); }
  for(let i=colliders.length-1;i>=0;i--){
    const c=colliders[i];
    if(c.roofY!=null) continue; // never remove a tower's own walls
    if(zones.some(z=>overlaps(c,z))) colliders.splice(i,1);
  }
})();

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now()*0.001;

  if (paused){ renderer.render(scene, camera); return; } // freeze the whole world — just keep showing the last frame

  // drifting chimney smoke
  smokePuffs.forEach(p => {
    const rise = ((t*0.4 + p.phase) % 2.8);
    p.mesh.position.y = p.base + rise;
    p.mesh.position.x = p.x + Math.sin(t*0.6 + p.phase)*0.3*rise*0.4;
    const scale = 0.6 + rise*0.5;
    p.mesh.scale.setScalar(scale);
    p.mesh.material.opacity = Math.max(0, 0.5 * (1 - rise/2.8));
  });
  // shimmering water
  waterSurfaces.forEach((w,i) => {
    w.position.y = 0.22 + Math.sin(t*1.5 + i)*0.03;
    w.material.emissiveIntensity = 0.6 + Math.sin(t*2+i)*0.2;
  });

  // ----- smooth look: ease actual angles toward the input targets -----
  const lookEase = Math.min(1, dt*25);   // smooths jitter while staying responsive
  yaw   += (targetYaw   - yaw)   * lookEase;
  pitch += (targetPitch - pitch) * lookEase;
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  // ----- player movement (disabled while dead), velocity-smoothed -----
  if(player.alive){
    const MAXSPEED = 6;
    const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).negate();
    const right = new THREE.Vector3(-forward.z, 0, forward.x); // true camera-right (+X at yaw 0)
    // desired direction from keys + joystick
    let dx=0, dz=0;
    if (keys['KeyW']) dz+=1; if (keys['KeyS']) dz-=1;
    if (keys['KeyD']) dx+=1; if (keys['KeyA']) dx-=1;
    dx += moveVec.x; dz += -moveVec.z;
    const want = new THREE.Vector3();
    want.addScaledVector(forward, dz).addScaledVector(right, dx);
    if (want.lengthSq()>1) want.normalize();
    want.multiplyScalar(MAXSPEED);
    // accelerate/decelerate toward desired velocity (smooth start & stop)
    const accel = Math.min(1, dt*12);
    vel.x += (want.x - vel.x) * accel;
    vel.z += (want.z - vel.z) * accel;
    camera.position.x += vel.x * dt;
    camera.position.z += vel.z * dt;
    camera.position.x = Math.max(-29, Math.min(29, camera.position.x));
    camera.position.z = Math.max(-29, Math.min(29, camera.position.z));
    // solid buildings/props: push the player out of any collider (unless standing on its roof already)
    const [rx,rz] = resolveCollision(camera.position.x, camera.position.z, 0.45, playerHeight);
    if(rx!==camera.position.x) vel.x=0;   // kill velocity into a wall so you don't stutter against it
    if(rz!==camera.position.z) vel.z=0;
    camera.position.x = rx; camera.position.z = rz;
    // climb ramps up to rooftops: ease toward the terrain height under the player (smooth stairs, no snapping).
    // getTerrainHeight() is passed the player's current height so it can ignore a ramp zone entirely when
    // walking under/beside it at ground level (see the continuity check inside it) — you no longer float up
    // just from passing underneath a ramp — plus a rate cap as a second layer against any remaining edge case.
    const targetGroundY = getTerrainHeight(camera.position.x, camera.position.z, playerHeight);
    const maxHeightStep = 5*dt;
    playerHeight += Math.max(-maxHeightStep, Math.min(maxHeightStep, (targetGroundY - playerHeight) * Math.min(1, dt*10)));
    camera.position.y = playerHeight + 1.7;
    // camera shake (the colossus's quake stomp triggers this) — decays each frame, applied as a pure visual
    // offset on top of the real position so it never affects movement/collision state
    if(shakeAmt > 0){
      camera.position.x += Math.sin(t*53.1)*shakeAmt;
      camera.position.y += Math.sin(t*71.7)*shakeAmt*0.6;
      shakeAmt = Math.max(0, shakeAmt - dt*2.2);
    }

    // Nile Wave: the water is crocodile-infested — stepping off the boat (past the railings, e.g. off the
    // bow/stern tips which extend past them) is fatal, not just a scenery boundary
    if(inNileArea){
      const onDeck = camera.position.x > -2.7 && camera.position.x < 2.7 && camera.position.z > -4.6 && camera.position.z < 5.5;
      if(!onDeck) damagePlayer(9999);
    }

    // ---- stuck watchdog: if you're wedged (visual height mismatched with actual terrain, e.g. you
    // slipped off a narrow rooftop ramp mid-climb and got boxed in by a wall), auto-recover instead of
    // leaving you permanently stuck. Only triggers when genuinely wedged for a sustained moment. ----
    const heightMismatch = Math.abs(playerHeight - targetGroundY) > 1.0;
    const tryingToMove = (keys['KeyW']||keys['KeyA']||keys['KeyS']||keys['KeyD']||Math.abs(moveVec.x)>0.1||Math.abs(moveVec.z)>0.1);
    if(heightMismatch && tryingToMove){
      stuckTimer += dt;
      if(stuckTimer > 1.2){
        const spot = pickRecoverySpot(camera.position.x, camera.position.z);
        camera.position.x = spot.x; camera.position.z = spot.z; playerHeight = spot.h;
        camera.position.y = playerHeight + 1.7; vel.set(0,0,0);
        stuckTimer = 0; setBanner('↺ repositioned'); setTimeout(()=>{ if(bannerEl && bannerEl.textContent==='↺ repositioned') setBanner(''); }, 900);
      }
    } else {
      stuckTimer = 0;
    }
    // auto-fire for automatic weapons while holding the mouse
    if (firing && weapons[currentWeapon].userData.auto) fire();
    // health regen: start ~2.5s after last hit, refill steadily
    if (t - player.lastHit > 2.5 && player.hp < player.maxHp){
      player.hp = Math.min(player.maxHp, player.hp + 22*dt); setHUD();
    }
  } else {
    player.respawn -= dt;
    if(player.respawn <= 0) respawnPlayer();
  }

  updateWaves(dt);

  // ----- HUD timers -----
  if(hitmarkTimer>0){ hitmarkTimer-=dt; if(hitmarkTimer<=0 && hitmark) hitmark.style.opacity='0'; }
  if(dmgTimer>0){ dmgTimer-=dt; if(dmgTimer<=0 && dmgVignette) dmgVignette.style.opacity='0'; }
  tracers.forEach(tr=>{ if(tr.life>0){ tr.life-=dt; tr.mesh.material.opacity=Math.max(0,tr.life/0.08*0.9); if(tr.life<=0) tr.mesh.visible=false; } });

  updateGrenadePreview();

  // ----- grenades: lob from muzzle to the aim point (with an arc), explode on arrival -----
  for(let i=grenades.length-1;i>=0;i--){
    const gr=grenades[i]; gr.t+=dt;
    const s=Math.min(1,gr.t/gr.dur);
    gr.mesh.position.lerpVectors(gr.from, gr.to, s);
    gr.mesh.position.y += Math.sin(s*Math.PI) * gr.from.distanceTo(gr.to) * 0.14; // gentle lob arc
    gr.mesh.rotation.x += dt*14; gr.mesh.rotation.z += dt*10;
    if(s>=1){ scene.remove(gr.mesh); explodeAt(gr.to); grenades.splice(i,1); }
  }
  // ----- explosions: fireball expands and fades, light flash decays -----
  for(let i=explosions.length-1;i>=0;i--){
    const ex=explosions[i]; ex.t+=dt; const s=Math.min(1,ex.t/ex.dur);
    ex.mesh.scale.setScalar(1 + s*9);
    ex.mesh.material.opacity = 0.95*(1-s);
    ex.light.intensity = 3.2*(1-s);
    if(s>=1){ scene.remove(ex.mesh); scene.remove(ex.light); explosions.splice(i,1); }
  }

  // ----- quake effects: cracks snap open from the epicenter, debris pops up and tumbles under gravity -----
  for(let i=quakeEffects.length-1;i>=0;i--){
    const q=quakeEffects[i]; q.t+=dt; const s=Math.min(1,q.t/q.dur);
    const growT = Math.min(1, q.t/0.22); // cracks snap open fast, well before the rest fades
    q.cracks.forEach(c=>{ c.scale.z = growT; });
    q.dustMat.opacity = 0.7*(1-s);
    q.dust.scale.setScalar(1+s*7);
    q.light.intensity = 2.4*(1-s);
    // crack material is shared per-effect (all its cracks fade together), stays solid then fades in the back half
    if(s>0.5) q.cracks.forEach(c=>{ c.children[0].material.opacity = Math.max(0, 1-(s-0.5)/0.5); });
    q.debris.forEach(d=>{
      d.vy -= dt*9; // gravity
      d.mesh.position.y += d.vy*dt;
      d.mesh.position.x += d.vx*dt;
      d.mesh.position.z += d.vz*dt;
      if(d.mesh.position.y < 0){ d.mesh.position.y = 0; d.vy = 0; d.vx *= 0.8; d.vz *= 0.8; }
      d.mesh.rotation.x += d.rx*dt; d.mesh.rotation.z += d.rz*dt;
    });
    if(s>=1){ scene.remove(q.grp); quakeEffects.splice(i,1); }
  }

  // ----- fire meteors (Ifrit King): telegraph ring grows/pulses, then a burst deals AOE damage if the
  // player is still standing in it — the dodge window IS the telegraph duration -----
  for(let i=fireMeteors.length-1;i>=0;i--){
    const m=fireMeteors[i]; m.t+=dt;
    if(!m.impacted){
      const growT = Math.min(1, m.t/m.impactAt);
      m.ring.scale.setScalar(0.3+growT*0.7);
      m.ringMat.opacity = 0.5 + Math.sin(m.t*18)*0.35; // fast pulse reads as urgent, not just growing
      if(m.t >= m.impactAt){
        m.impacted = true;
        const distToImpact = Math.hypot(camera.position.x-m.x, camera.position.z-m.z);
        if(distToImpact < 2.0 && player.alive && !gameWon) damagePlayer(Math.round(24*(1-distToImpact/2.0*0.3)));
        shakeAmt = Math.max(shakeAmt, 0.25);
        SFX.explosion();
        m.fillMat.opacity = 0.9; m.fillMat.color.set(0xffd23a);
      }
    } else {
      const fadeT = Math.min(1, (m.t-m.impactAt)/(m.dur-m.impactAt));
      m.ringMat.opacity = 0.6*(1-fadeT);
      m.fillMat.opacity = 0.9*(1-fadeT);
      m.grp.scale.setScalar(1+fadeT*1.5);
    }
    if(m.t >= m.dur){ scene.remove(m.grp); fireMeteors.splice(i,1); }
  }

  // recoil recovery toward the active weapon's base position + idle sway
  gunGroup.position.z += (gunBaseZ - gunGroup.position.z) * Math.min(1, dt*10);
  gunGroup.rotation.x += (0 - gunGroup.rotation.x) * Math.min(1, dt*9); // eases the muzzle-rise/swing kick back level
  gunGroup.position.y = weapons[currentWeapon].userData.pos.y + Math.sin(t*3)*0.008;
  if (muzzleTimer > 0){ muzzleTimer -= dt; muzzle.material.opacity = Math.max(0, muzzleTimer/0.05); if (muzzleTimer<=0) muzzle.visible=false; }
  // tick any weapon currently reloading (not just the active one, so switching away mid-reload doesn't pause it)
  weapons.forEach((wp,idx)=>{
    const wd = wp.userData;
    if(!wd.reloading) return;
    wd.reloadT += dt;
    if(wd.reloadT >= wd.reloadTime){ wd.reloading=false; wd.ammo=wd.magSize; if(idx===currentWeapon) setAmmoHUD(); }
  });
  const rg = weapons[2];
  if (rg && rg.visible){ rg.traverse(o=>{ if(o.material && o.material.emissiveIntensity!==undefined) o.material.emissiveIntensity = 0.8 + Math.sin(t*8)*0.35; }); }
  // sling release-snap: sits loose at rest; on fire it draws back, snaps forward past rest (the release),
  // then eases back to the same loose resting position — a real 3-phase cycle instead of just pull-and-return
  weapons.forEach(wp=>{
    const wd = wp.userData;
    if(!wd.slingAnim || wd.pullT<=0) return;
    wd.animT = (wd.animT||0) + dt;
    // draw back / snap-release / ease back to loose — the whole cycle has to fit inside the sling's own fire
    // rate (0.35s) or a held/rapid trigger interrupts it mid-flight every shot, snapping the pouch/bands to a
    // discontinuous position instead of ever settling (that's what read as "coming apart" during sustained fire).
    // Slower/smoother than the first pass at this — that one had to be so fast to fit inside a 0.2s fire rate
    // that the whole cycle read as an abrupt snap rather than an actual draw-and-release motion.
    const T1=0.08, T2=0.16, T3=0.32;
    const PULL=0.09, RELEASE=-0.05;        // draw-back offset, then overshoot past rest toward the target on release
    let z;
    if(wd.animT<T1){ z = (wd.animT/T1)*PULL; }
    else if(wd.animT<T2){ const f=(wd.animT-T1)/(T2-T1); z = PULL + (RELEASE-PULL)*f; }
    else if(wd.animT<T3){ const f=(wd.animT-T2)/(T3-T2); z = RELEASE + (0-RELEASE)*f; }
    else { z = 0; wd.pullT = 0; wd.animT = 0; }
    wd.pouchMesh.position.z = wd.pouchRest.z + z;
    wd.stoneMesh.position.z = wd.pouchRest.z + z + 0.005; // must match the stone's construction-time offset in makeSling()
    wd.bandMeshes.forEach((band,i)=>{
      const tip = wd.tips[i], target = wd.pouchMesh.position.clone().add(wd.pouchAttach[i]);
      const dir = target.clone().sub(tip);
      const mid = tip.clone().add(target).multiplyScalar(0.5);
      band.position.copy(mid);
      band.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
      band.scale.y = dir.length() / wd.bandBaseLen[i];
    });
  });

  // ----- bot AI + animation -----
  const _dir = new THREE.Vector3(); const _chest = new THREE.Vector3();
  let nileEngageCount = 0; // caps how many crocs/hippos can be actively biting the player at once (see below)
  // Nile: designate the (up to 2) NEAREST attackers as the ones allowed to press in and bite this frame.
  // The rest hold a standoff ring out in the water instead of piling into and clipping through the boat's
  // sides — that pile-up (5 crocs + 2 hippos all chasing to the hull) was the "glitch into the sides".
  let nileBiters = null;
  if(inNileArea){
    nileBiters = bots.filter(o=>o.alive && (o.skin==='crocodile'||o.skin==='hippo'))
      .sort((p,q)=> (Math.hypot(p.mesh.position.x-camera.position.x, p.mesh.position.z-camera.position.z))
                  - (Math.hypot(q.mesh.position.x-camera.position.x, q.mesh.position.z-camera.position.z)))
      .slice(0,2);
  }
  bots.forEach(b => {
    const ud = b.mesh.userData;
    if(ud.botMuzzle && ud.botMuzzle.visible){ ud.botMuzzle.material.opacity -= dt*18; if(ud.botMuzzle.material.opacity<=0) ud.botMuzzle.visible=false; }
    if(!b.alive) return; // dead bots stay down (wave manager handles new spawns)
    if(b.flash>0){ b.flash-=dt; setBotEmissive(b, 0x661111); if(b.flash<=0) setBotEmissive(b, 0x000000); }

    // Nile Wave: a croc/hippo that lingers touching the boat's hull unchecked chews a chunk out of it —
    // tracked separately from the normal player-melee-range combat below, since these bots attack the boat
    // itself, not just the player standing on it
    if(inNileArea && (b.skin==='crocodile' || b.skin==='hippo') && !b.hasChewed){
      const hx = Math.max(-2.7, Math.min(2.7, b.mesh.position.x));
      const hz = Math.max(-4.6, Math.min(5.5, b.mesh.position.z));
      const distToHull = Math.hypot(b.mesh.position.x-hx, b.mesh.position.z-hz);
      if(distToHull < 1.2){
        b.boatTouchT = (b.boatTouchT||0) + dt;
        if(b.boatTouchT >= 7.0){
          b.boatTouchT = 0;
          b.hasChewed = true; // each animal only gets to take one chunk out, ever — not the same one repeatedly
          spawnBoatHole(hx, hz); // a visible chomped-out chunk, not just an HP number — damages the boat only
          boatHoles = Math.min(4, boatHoles + 1);
          setBanner(boatHoles<4 ? `⚠ a chunk was chewed out of the boat! (${boatHoles}/4 holes)` : '⚠ THE BOAT IS SINKING!');
          setTimeout(()=>{ if(bannerEl && (bannerEl.textContent.includes('boat')||bannerEl.textContent.includes('BOAT'))) setBanner(''); },1200);
          if(boatHoles>=4 && player.alive) damagePlayer(9999); // 4 holes and it goes under — into the water either way
        }
      } else {
        b.boatTouchT = 0;
      }
    }

    // ---- perception (before moving) ----
    _chest.set(b.mesh.position.x, b.boss?2.9:1.2, b.mesh.position.z);
    _dir.subVectors(camera.position, _chest);
    const distToPlayer = _dir.length(); _dir.normalize();
    const hh = firstHit(_chest, _dir, distToPlayer+1, b.mesh);
    const rawLos = !hh || hh.dist >= distToPlayer - 1.2;
    // los is a real raycast against actual scene geometry, so a bot near an articulated obstacle with
    // real gaps (e.g. the pyramid's stacked staircase steps) can have its sightline graze a step edge and
    // flicker true/false frame to frame as it or the player shifts by a hair. Since los flipping swaps the
    // bot between the chase branch and the wander branch below — completely different movement logic —
    // that flicker alone reads as jittering even with steady positions. A short grace window keeps los
    // "sticky" through a single bad frame instead of reacting to every momentary graze.
    if(rawLos) b.losGraceT = 0.2; else b.losGraceT = (b.losGraceT||0) - dt;
    const los = rawLos || b.losGraceT > 0;
    const isKnife = b.weaponType==='knife';
    // griffin: dive-screeches at range, closes to talon/beak melee once the player is close — meleeNow flips the
    // combat mode below without needing a second bot type; the engage distance flips with it (3.4 melee / 30 ranged)
    const isJavelin = b.weaponType==='javelin';
    const meleeNow = isKnife || (isJavelin && distToPlayer < 3.4);
    let canEngage = player.alive && los && (meleeNow ? distToPlayer < 3.4 : distToPlayer < 30);
    // Nile Wave: only let 2 crocs/hippos actively bite at once instead of the whole pack piling on simultaneously
    // (the boat is small enough that all of them could otherwise reach melee range together) — the rest keep
    // closing in and lingering near the hull instead, which is also what lets the boat-chew timer above matter
    if(inNileArea && (b.skin==='crocodile' || b.skin==='hippo')){
      if(canEngage){ if(nileEngageCount>=2) canEngage=false; else nileEngageCount++; }
    }

    // ---- movement & facing (walk toward where you go; only face the player when engaging) ----
    // scale into the collision radius too — a 1.3x-scaled hippo (or any other up-scaled non-boss enemy) was
    // using the same tiny radius as a normal-sized bot, so a third of its visible bulk could clip straight
    // through rails/walls/other bots instead of actually being blocked by them (boss radius stays flat/tuned)
    const R = b.boss?1.2:0.55*(b.scale||1);
    const toPX = camera.position.x-b.mesh.position.x, toPZ = camera.position.z-b.mesh.position.z;
    let facePlayer = true;
    if(b.boss){
      if(distToPlayer>4){ b.moving=1; moveActor(b.mesh, toPX, toPZ, b.speed*dt, R); } else b.moving=0;
    } else if(canEngage){
      b.moving=0;                          // pistol: stop & shoot / knife: in melee range
    } else if(inNileArea && (b.skin==='crocodile'||b.skin==='hippo') && nileBiters && nileBiters.indexOf(b)<0){
      // a Nile attacker that isn't one of the 2 designated biters holds a standoff ring around the boat
      // (centre = origin) rather than pressing into its sides. Drift out if too close, in if too far, else
      // strafe around the ring.
      b.moving=1;
      const cx=b.mesh.position.x, cz=b.mesh.position.z, distC=Math.hypot(cx,cz)||0.001, standoff=6.5;
      if(distC < standoff-0.6) moveActor(b.mesh, cx, cz, 2.0*dt, R);
      else if(distC > standoff+1.6) moveActor(b.mesh, -cx, -cz, 2.0*dt, R);
      else moveActor(b.mesh, -cz, cx, 1.6*dt, R);
    } else if(isKnife && los && player.alive && distToPlayer<16){
      b.moving=1;
      // knife: chase the player. moveActor's `blocked` return was never checked here — a bot with
      // scenery directly between it and the player (a wall, the pyramid stairs, etc.) has no
      // pathfinding, so it kept re-issuing the same doomed straight-line move every frame, clamped to
      // the same spot each time while its legs kept animating (moving stayed 1) — read as jittering in
      // place. Slide it sideways along the obstacle instead, same idea as the wander branch below.
      const chaseBlocked = moveActor(b.mesh, toPX, toPZ, 3.2*dt, R);
      if(chaseBlocked){
        if(!b.slideDir) b.slideDir = Math.random()<0.5 ? 1 : -1;
        moveActor(b.mesh, -toPZ*b.slideDir, toPX*b.slideDir, 2.4*dt, R);
      } else {
        b.slideDir = 0;
      }
    } else {
      // wander: walk along heading, turn away when blocked, face travel direction
      b.wanderT -= dt;
      const blocked = moveActor(b.mesh, Math.cos(b.heading), Math.sin(b.heading), 2.3*dt, R);
      if(blocked || b.wanderT<=0){ b.heading += blocked ? (2.0+Math.random()*1.6) : (Math.random()*1.6-0.8); b.wanderT = 1.2+Math.random()*1.8; }
      b.moving=1; facePlayer=false;
    }
    // minotaur: "slow to turn" — a capped turn rate instead of instantly snapping to face the player, so a
    // player circling fast enough ends up hitting its flank/back before its horned head can re-orient (see damageBot)
    const wantFacing = facePlayer ? Math.atan2(-toPX,-toPZ) : Math.atan2(-Math.cos(b.heading),-Math.sin(b.heading));
    if(b.skin==='minotaur'){
      let df = wantFacing - b.facing; df = ((df+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2) - Math.PI;
      const maxTurn = 1.1*dt;
      b.facing += Math.max(-maxTurn, Math.min(maxTurn, df));
      b.mesh.rotation.y = b.facing;
    } else {
      b.facing = wantFacing;
      if(facePlayer) b.mesh.lookAt(camera.position.x, 0, camera.position.z);
      else b.mesh.lookAt(b.mesh.position.x+Math.cos(b.heading), 0, b.mesh.position.z+Math.sin(b.heading));
    }

    // colossus (Boss I): a periodic ground-slam quake — an AOE shockwave that doesn't need line-of-sight (it
    // travels through the ground, not the air), so it can't just be dodged by breaking LOS the way its pistol
    // fire can, giving it a real second tool and a reason to keep moving instead of camping one spot
    if(b.boss && b.skin==='colossus' && player.alive){
      b.quakeCd = b.quakeCd===undefined ? 3.5 : b.quakeCd - dt;
      if(b.quakeCd <= 0 && distToPlayer < 13){
        b.quakeCd = 6.5 + Math.random()*1.5;
        const quakeR = 7.5;
        if(distToPlayer <= quakeR) damagePlayer(Math.round(22 * (1 - distToPlayer/quakeR*0.4)));
        shakeAmt = Math.max(shakeAmt, 0.35);
        SFX.explosion();
        spawnQuakeEffect(b.mesh.position.x, b.mesh.position.z);
        setBanner('⚠ QUAKE!'); setTimeout(()=>{ if(bannerEl && bannerEl.textContent==='⚠ QUAKE!') setBanner(''); },700);
      }
    }

    // ammit (Boss II — Rome follows it now, so not the final boss anymore): periodically calls in a couple of shabti whelps instead of being
    // fought solo — small, weak, fast little funerary-figure minions (their own new design, not a recolor
    // of the minotaur/griffin/medusa grunts), capped so it can't spiral into a crowd
    if(b.boss && b.skin==='ammit' && player.alive){
      b.minionCd = b.minionCd===undefined ? 6 : b.minionCd - dt;
      if(b.minionCd <= 0 && bots.filter(o=>!o.boss && o.alive).length < 3){
        b.minionCd = 13 + Math.random()*4;
        // clamped well inside the room's open floor — the boss wanders around during the fight, and an
        // unclamped radius from its current position could reach almost to the back wall/relief backdrop
        // (a minion spawned that close had nowhere to be pushed and ended up stuck behind the wall)
        const ang = Math.random()*Math.PI*2, r = 9+Math.random()*5;
        const sx = Math.max(-16, Math.min(16, b.mesh.position.x + Math.cos(ang)*r));
        const sz = Math.max(-14, Math.min(10, b.mesh.position.z + Math.sin(ang)*r));
        spawnBot(sx, sz, ENEMY_COLORS[(Math.random()*ENEMY_COLORS.length)|0], [sx-2,0,sz],[sx+2,0,sz],
          'knife', {skin:'shabti', hp:60, diff:1.0, speed:1.4, scale:0.55});
        setBanner('⚠ Ammit calls its followers!'); setTimeout(()=>{ if(bossActive) setBanner(''); },1500);
      }
    }

    // Colosseum Champion (Boss III): when badly wounded (≤25% HP), looses TWO tigers — once only
    if(b.boss && b.skin==='champion' && player.alive && !b.tigersReleased && b.hp <= b.maxHp*0.25){
      b.tigersReleased = true;
      [-1,1].forEach(s=>{
        const sx = Math.max(-18, Math.min(18, b.mesh.position.x + s*4));
        const sz = Math.max(-18, Math.min(14, b.mesh.position.z + 2));
        spawnBot(sx, sz, 0xd9832a, [sx-2,0,sz],[sx+2,0,sz], 'knife', {skin:'tiger', hp:200, diff:1.0, speed:1.95, scale:1.15});
      });
      SFX.boss();
      setBanner('⚠ The Champion looses two tigers!'); setTimeout(()=>{ if(bossActive) setBanner(''); },1800);
    }

    // Ifrit King (Boss IV): periodically calls down a telegraphed fire meteor at the player's CURRENT
    // position — a ranged, dodge-driven hazard, distinct from the Colossus's proximity quake (no telegraph,
    // can't be dodged by movement alone) and the Champion's one-time add-summon above.
    if(b.boss && b.skin==='ifritking' && player.alive){
      b.meteorCd = b.meteorCd===undefined ? 4 : b.meteorCd - dt;
      if(b.meteorCd <= 0 && distToPlayer < 26){
        b.meteorCd = 7 + Math.random()*2;
        spawnFireMeteor(camera.position.x, camera.position.z);
      }
    }

    // ---- animation: legs/arms swing only while actually moving (skipped by non-humanoid rigs, e.g. scarabs) ----
    const walk = Math.sin(t*7 + b.t*3) * (b.moving?1:0);
    if(ud.legL){ ud.legL.rotation.x = walk*0.5; ud.legR.rotation.x = -walk*0.5; }
    // aim blend: 0 = arm down swinging, 1 = arm raised toward player
    const targetAim = canEngage ? 1 : 0;
    b.aim += (targetAim - b.aim) * Math.min(1, dt*8);
    b.swing = Math.max(0, b.swing - dt*5);
    if(ud.armR){
      // right arm: raise to -90° when aiming; add stab/recoil via swing
      ud.armR.rotation.x = (-1.5*b.aim) + walk*0.4*(1-b.aim) - b.swing*1.2;
      ud.armL.rotation.x = -walk*0.4*(1-b.aim) - 0.2*b.aim;
    }

    // ---- combat ----
    b.fireCd -= dt;
    if(b.fireCd <= 0 && canEngage){
      if(meleeNow){
        // melee stab — scales a little with wave difficulty; the medusa's bite/claws hit noticeably harder
        b.swing = 1.0; SFX.knife(distToPlayer);
        damagePlayer(Math.round((b.skin==='medusa'?14:7)*b.diff));
        b.fireCd = Math.max(1.0, 1.5/b.diff);
      } else {
        // pistol shot, or a griffin's dive-screech at range — accuracy/damage/rate ramp with wave difficulty
        spawnTracer(_chest.clone(), camera.position.clone(), isJavelin?0xd7c49a:0xff8a3a);
        SFX.enemyShot(distToPlayer);
        if(ud.botMuzzle){ ud.botMuzzle.visible=true; ud.botMuzzle.material.opacity=0.9; }
        b.swing = 0.5; // recoil kick
        const hitChance = Math.max(0.2, Math.min(0.82, (b.boss?0.8:(0.5+(b.diff-1)*0.2)) - distToPlayer*0.015));
        if((Math.sin(t*131.7+b.t*13.3)*0.5+0.5) < hitChance) damagePlayer(b.boss ? 11 : Math.round((isJavelin?5:3)*b.diff));
        b.fireCd = ((b.boss?0.28:Math.max(0.55,1.1/b.diff)) + (Math.sin(t*53.1+b.t)*0.5+0.5)*(b.boss?0.4:1.0)) * (isJavelin?1.6:1);
      }
    } else if(b.fireCd <= 0){ b.fireCd = 0.4; }
  });

  // Nile Wave: crocs/hippos have no bot-vs-bot separation anywhere else in the AI (nothing does), so a pack
  // converging on the same clamped point along the hull — or just on the player — would walk straight through
  // each other and visibly overlap/stack. Cheap since there are only a handful of them: push any overlapping
  // pair apart, then re-clamp through resolveCollision so they can't get shoved through a rail in the process.
  if(inNileArea){
    const aquatic = bots.filter(b=>b.alive && (b.skin==='crocodile'||b.skin==='hippo'));
    for(let i=0;i<aquatic.length;i++){
      for(let j=i+1;j<aquatic.length;j++){
        const a=aquatic[i], c=aquatic[j];
        const dx=c.mesh.position.x-a.mesh.position.x, dz=c.mesh.position.z-a.mesh.position.z;
        const dist=Math.hypot(dx,dz);
        const minDist=(0.55*(a.scale||1)+0.55*(c.scale||1))*0.9;
        if(dist>0 && dist<minDist){
          const push=(minDist-dist)*0.5, ux=dx/dist, uz=dz/dist;
          const [ax,az]=resolveCollision(a.mesh.position.x-ux*push, a.mesh.position.z-uz*push, 0.55*(a.scale||1), 0);
          const [cx,cz]=resolveCollision(c.mesh.position.x+ux*push, c.mesh.position.z+uz*push, 0.55*(c.scale||1), 0);
          a.mesh.position.x=ax; a.mesh.position.z=az; c.mesh.position.x=cx; c.mesh.position.z=cz;
        }
      }
    }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
